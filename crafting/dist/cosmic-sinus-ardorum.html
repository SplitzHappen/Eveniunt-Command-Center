kind":"craft","items":[{"name":"Standard Rings","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":96,"name":"Mass-produced Necessities","job":2,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"The Cosmic Exploration Initiative employs a wide range of machinery, but supplying individually tailored parts for the maintenance of each device on-site would lead to astronomical operation costs. To alleviate this expense, we've imposed a “cosmic standard” on all basic components used in our equipment. Recent reports cite an alarming shortage of the joints and shafts needed to keep the facilities running, and we are welcoming all contributions forged to the aforementioned specifications.","recipes":[36296],"objectives":[{"kind":"craft","items":[{"name":"Standard Rivets","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":97,"name":"Standardized Heavy Plating","job":2,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Sinus Ardorum is in dire need of materials to support the construction and development of the Moongate Hub, an intrastellar transportation system, on-site domiciles, and infrastructure necessary for travel to other stars. Of these materials, metal plating is some of the highest in demand, specifically that which meets the strict regulations of cosmic exploration. We seek talented crafters capable of fulfilling our metallurgical needs.","recipes":[36297],"objectives":[{"kind":"craft","items":[{"name":"Standard Metal Plating","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":98,"name":"Starship Shafts","job":2,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"The new starship we have under construction is the lynchpin of our plans to explore the cosmos. We require artisans to manufacture the hard alloy that will serve as the primary element of its exterior cladding, as well as creating a surplus for repair purposes. As a vessel destined to navigate stellar currents, it must be sturdy enough to withstand the most turbulent aether fluctuations, and the resilient alloy you provide will be further processed into hull plating and other parts as dictated by the starship's unique specifications.","recipes":[36298],"objectives":[{"kind":"craft","items":[{"name":"Starship Shaft","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":99,"name":"Worker's Culinary Tools I","job":2,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1300,"gold":3000,"text":"As the initiative grows in scale, more mission members are reporting that they lack the necessary tools to carry out their work, or that they must work with tools in poor repair. If this is allowed to continue, it will have a serious impact on efficiency and morale. To ensure that our mission stays on course, we request contributions of equipment, with a focus on those that have been prone to shortage.","recipes":[36299],"objectives":[{"kind":"craft","items":[{"name":"Survey Frypan","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":100,"name":"Standardized Chainmail Sheets","job":2,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":700,"gold":1500,"text":"The Cosmic Exploration Initiative employs a wide range of machinery, but supplying individually tailored parts for the maintenance of each device on-site would lead to astronomical operation costs. To alleviate this expense, we've imposed a “cosmic standard” on all basic components used in our equipment. Recent reports cite an alarming shortage of the joints and shafts needed to keep the facilities running, and we are welcoming all contributions forged to the aforementioned specifications.","recipes":[36300,36301],"objectives":[{"kind":"craft","items":[{"name":"Standard Chainmail Sheet","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":101,"name":"Dust-filtering Equipment","job":2,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1100,"gold":2500,"text":"As the initiative grows in scale, more mission members are reporting that they lack the necessary tools to carry out their work, or that they must work with tools in poor repair. If this is allowed to continue, it will have a serious impact on efficiency and morale. To ensure that our mission stays on course, we request contributions of equipment, with a focus on those that have been prone to shortage.","recipes":[36302,36303],"objectives":[{"kind":"craft","items":[{"name":"Survey Mask","quantity":2}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":102,"name":"Custom Parts (Intermediate)","job":2,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2250,"text":"Whether it be on the moon or another star we've yet to explore, our future ground-based expeditions are certain to encounter impassable terrain. Drones have proven useful for transporting supplies, but we are also looking to modify them to perform detailed aerial surveys in regions which challenge our surface vehicles. We encourage artisans to submit a range of parts that we might customize our drones and expand their practical functionality.","recipes":[36304,36305],"objectives":[{"kind":"craft","items":[{"name":"Drone Wire","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":103,"name":"Insulated Equipment","job":2,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":700,"gold":1500,"text":"Several of our new Etheirys colleagues have lodged complaints concerning Sinus Ardorum's “cold,” “dark,” and “impractical” working conditions. While we are unable to address every source of dissatisfaction, requests for improvement are taken very seriously as we strive to provide the most comfortable environment possible. Qualified artisans are encouraged to participate in this endeavor through the manufacture of optimized tools and equipment.","recipes":[36306,36307],"objectives":[{"kind":"craft","items":[{"name":"Enrichment Fuel Carrier","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":104,"name":"Rover Parts","job":2,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1600,"gold":2400,"text":"The Cosmic Exploration Initiative employs a wide range of machinery, but supplying individually tailored parts for the maintenance of each device on-site would lead to astronomical operation costs. To alleviate this expense, we've imposed a “cosmic standard” on all basic components used in our equipment. Recent reports cite an alarming shortage of the joints and shafts needed to keep the facilities running, and we are welcoming all contributions forged to the aforementioned specifications.","recipes":[36308],"objectives":[{"kind":"craft","items":[{"name":"Rover Rings","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":105,"name":"Standardized Light Plating","job":2,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1600,"gold":2400,"text":"Sinus Ardorum is in dire need of materials to support the construction and development of the Moongate Hub, an intrastellar transportation system, on-site domiciles, and infrastructure necessary for travel to other stars. Of these materials, metal plating is some of the highest in demand, specifically that which meets the strict regulations of cosmic exploration. We seek talented crafters capable of fulfilling our metallurgical needs.","recipes":[36309],"objectives":[{"kind":"craft","items":[{"name":"Standard Metal Plating","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":106,"name":"Worker's Culinary Tools II","job":2,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1700,"gold":2000,"text":"As the initiative grows in scale, more mission members are reporting that they lack the necessary tools to carry out their work, or that they must work with tools in poor repair. If this is allowed to continue, it will have a serious impact on efficiency and morale. To ensure that our mission stays on course, we request contributions of equipment, with a focus on those that have been prone to shortage.","recipes":[36310],"objectives":[{"kind":"craft","items":[{"name":"Survey Frypan","quantity":2}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":107,"name":"Beverage Stations","job":2,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":2700,"gold":3000,"text":"As appears to be characteristic of Sharlayan itself, the initiative has been welcoming new members from all corners of Etheirys. Thus, when it comes to devising a comforting “home away from home” environment for this eclectic cohort, simply borrowing elements from any singular culture will not suffice. We request all veteran artisans to submit recreations of Etheirys furnishings that we might build a broad selection of regional styles.","recipes":[36311],"objectives":[{"kind":"craft","items":[{"name":"Habitat Coffeemaker","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":108,"name":"Campfire Fixtures","job":2,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1600,"gold":2400,"text":"Several of our new Etheirys colleagues have lodged complaints concerning Sinus Ardorum's “cold,” “dark,” and “impractical” working conditions. While we are unable to address every source of dissatisfaction, requests for improvement are taken very seriously as we strive to provide the most comfortable environment possible. Qualified artisans are encouraged to participate in this endeavor through the manufacture of optimized tools and equipment.","recipes":[36312],"objectives":[{"kind":"craft","items":[{"name":"Enrichment Campfire","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":109,"name":"Habitation Storage","job":2,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":2700,"gold":3000,"text":"As the initiative progresses, the scale of inventory management, not to mention the number of people taking up residence on base, continues to expand at a rapid pace. We find ourselves in need of larger storage solutions, as well as general amenities such as benches and lighting equipment. In the case of bulky or complex items, we request that artisans report to us at each stage of the production process.","recipes":[36313],"objectives":[{"kind":"craft","items":[{"name":"Habitat Locker","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":110,"name":"Lunar Material Tool Processing","job":2,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1300,"text":"As the initiative grows in scale, more mission members are reporting that they lack the necessary tools to carry out their work, or that they must work with tools in poor repair. If this is allowed to continue, it will have a serious impact on efficiency and morale. To ensure that our mission stays on course, we request contributions of equipment, with a focus on those that have been prone to shortage.","recipes":[36314,36315],"objectives":[{"kind":"craft","items":[{"name":"Survey Alembic","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":111,"name":"Lunar Material Part Processing","job":2,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1300,"text":"For our next round of testing, we'd like to ascertain the degree of precision crafting that can be attained using the moon's native materials. Replicating Etheirys's engineered goods will provide us an initial reference point, but we are hopeful that the lessons learned during this process will be applicable to future initiative projects. Ideally, these parts will be used to improve Moongate Hub facilities, so contributing artisans should concentrate on demonstrating fine detail while also preserving the necessary function. ","recipes":[36316,36317],"objectives":[{"kind":"craft","items":[{"name":"Standard Mortar","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":112,"name":"Key Facility Plating","job":2,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1800,"gold":2400,"text":"Sinus Ardorum is in dire need of materials to support the construction and development of the Moongate Hub, an intrastellar transportation system, on-site domiciles, and infrastructure necessary for travel to other stars. Of these materials, metal plating is some of the highest in demand, specifically that which meets the strict regulations of cosmic exploration. We seek talented crafters capable of fulfilling our metallurgical needs.","recipes":[36318],"objectives":[{"kind":"craft","items":[{"name":"Standard Metal Plating","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":113,"name":"Rare Material Processing","job":2,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2300,"gold":3000,"text":"Lunar adamantite is a mineral unique to the moon, but it seems that the samples collected within Sinus Ardorum exhibit even greater durability than what we've encountered thus far─a property that could prove extremely useful in the construction of starships and various other moon-based facilities. We call upon skilled metalworkers to forge a steady supply of ingots from our stockpiled ore that we might explore and develop new applications for use in our cosmic initiative.","recipes":[36319],"objectives":[{"kind":"craft","items":[{"name":"Indurate Lunar Adamantite Ingot","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":114,"name":"Construction Necessities","job":2,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":700,"gold":1000,"text":"The Cosmic Exploration Initiative employs a wide range of machinery, but supplying individually tailored parts for the maintenance of each device on-site would lead to astronomical operation costs. To alleviate this expense, we've imposed a “cosmic standard” on all basic components used in our equipment. Recent reports cite an alarming shortage of the joints and shafts needed to keep the facilities running, and we are welcoming all contributions forged to the aforementioned specifications.","recipes":[36320],"objectives":[{"kind":"craft","items":[{"name":"Indurate Rivets","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":115,"name":"High-conductivity Culinary Tools","job":2,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":700,"gold":1000,"text":"As the initiative grows in scale, more mission members are reporting that they lack the necessary tools to carry out their work, or that they must work with tools in poor repair. If this is allowed to continue, it will have a serious impact on efficiency and morale. To ensure that our mission stays on course, we request contributions of equipment, with a focus on those that have been prone to shortage.","recipes":[36321],"objectives":[{"kind":"craft","items":[{"name":"Survey Skillet","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":116,"name":"Meteoric Material Test Processing","job":2,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2600,"gold":3000,"text":"Our researchers have discovered meteorites in the Fallen Tears that yield a range of useful minerals. However, an analysis has revealed that there are volatile elements in their composition, and an experienced hand is required in their processing. We seek skilled artisans to test refine the raw materials to determine whether they can be a viable resource for the initiative.","recipes":[36322,36323,36324],"objectives":[{"kind":"craft","items":[{"name":"Cosmotized Lunar Adamantite Ingot","quantity":1},{"name":"Cosmotized Chondrite Ingot","quantity":1},{"name":"Cosmotized Ilmenite Plate","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":117,"name":"EX: Replica Incensories","job":2,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2500,"gold":3000,"text":"As appears to be characteristic of Sharlayan itself, the initiative has been welcoming new members from all corners of Etheirys. Thus, when it comes to devising a comforting “home away from home” environment for this eclectic cohort, simply borrowing elements from any singular culture will not suffice. We request all veteran artisans to submit recreations of Etheirys furnishings that we might build a broad selection of regional styles.","recipes":[36325],"objectives":[{"kind":"craft","items":[{"name":"Habitat Incensory","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":118,"name":"EX: Fine-grade Material Processing","job":2,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":840,"gold":1000,"text":"For our next round of testing, we'd like to ascertain the degree of precision crafting that can be attained using the moon's native materials. Replicating Etheirys's engineered goods will provide us an initial reference point, but we are hopeful that the lessons learned during this process will be applicable to future initiative projects. Ideally, these parts will be used to improve Moongate Hub facilities, so contributing artisans should concentrate on demonstrating fine detail while also preserving the necessary function. ","recipes":[36326],"objectives":[{"kind":"craft","items":[{"name":"Habitat Wall-mounted Clock","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":119,"name":"EX: Moongate Hub Equipment","job":2,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":840,"gold":1000,"text":"Although the moon is bathed in the same sunlight and starlight as Etheirys, the lack of atmosphere to scatter this light makes for dark skies and darker shadows. In order to maintain a properly lit working environment throughout our facilities, we request that all available artisans turn their hands to the manufacture of specified illumination devices.","recipes":[36327],"objectives":[{"kind":"craft","items":[{"name":"Outdoor Hub Light","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":120,"name":"EX: Workspace Lighting","job":2,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2800,"gold":3000,"text":"Several of our new Etheirys colleagues have lodged complaints concerning Sinus Ardorum's “cold,” “dark,” and “impractical” working conditions. While we are unable to address every source of dissatisfaction, requests for improvement are taken very seriously as we strive to provide the most comfortable environment possible. Qualified artisans are encouraged to participate in this endeavor through the manufacture of optimized tools and equipment.","recipes":[36328,36329,36330],"objectives":[{"kind":"craft","items":[{"name":"Enrichment Wall Lamp","quantity":1},{"name":"Enrichment Lamp","quantity":1},{"name":"Enrichment Lampstand","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":121,"name":"EX+: High-durability Material Processing","job":2,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":420,"silver":560,"gold":880,"text":"Expeditions into the lunar nadir have detected promising sources of liquid and gaseous fuels which, when properly researched and developed, will prove highly valuable in future initiative applications. To that end, we request the construction of the tanks and containers necessary for safely storing and transporting these resources to the Moongate Hub.","recipes":[36331,36332],"objectives":[{"kind":"craft","items":[{"name":"High-durability Fuel Carrier","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":122,"name":"EX+: Impact-resistant Material Processing","job":2,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":330,"silver":560,"gold":880,"text":"Interior construction in the Moongate Hub employs the basic materials recommended by our current guidelines. It is problematic, however, to assume that this same standard of structural integrity will suffice once the initiative progresses to unknown─and potentially less hospitable─reaches of the cosmos. We hope to preemptively solve this issue by refitting facilities with materials of greater durability, and request skilled artisans to manufacture replacement partitions and other interior components from sturdy metals.","recipes":[36333,36334],"objectives":[{"kind":"craft","items":[{"name":"Impact-resistant Metal Flooring","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":123,"name":"Hub Furnishings and Fixtures I","job":2,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2300,"gold":3000,"text":"As the initiative progresses, the scale of inventory management, not to mention the number of people taking up residence on base, continues to expand at a rapid pace. We find ourselves in need of larger storage solutions, as well as general amenities such as benches and lighting equipment. In the case of bulky or complex items, we request that artisans report to us at each stage of the production process.","recipes":[36335],"objectives":[{"kind":"craft","items":[{"name":"Hub Bench Materials","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":124,"name":"EX: Hub Furnishings and Fixtures II","job":2,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2500,"gold":3000,"text":"As the initiative progresses, the scale of inventory management, not to mention the number of people taking up residence on base, continues to expand at a rapid pace. We find ourselves in need of larger storage solutions, as well as general amenities such as benches and lighting equipment. In the case of bulky or complex items, we request that artisans report to us at each stage of the production process.","recipes":[36336],"objectives":[{"kind":"craft","items":[{"name":"Hub Bench","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":125,"name":"Specialized Materials I","job":2,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1000,"gold":1600,"text":"As we expand the research facilities and living quarters in the Moongate Hub, we are looking for artisans to undertake the larger manufacturing tasks such as water tanks, vaults, and vending machines, as well as crafting spare parts for repairs. Owing to the size of said projects, we will transport the finished product to its intended location using heavy machinery─your only concern should be ensuring the smooth operation of its precision mechanisms.","recipes":[36337],"objectives":[{"kind":"craft","items":[{"name":"Hyper-resilient Outer Cladding Material","quantity":2}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":126,"name":"EX: Specialized Materials II","job":2,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1000,"gold":1600,"text":"As we expand the research facilities and living quarters in the Moongate Hub, we are looking for artisans to undertake the larger manufacturing tasks such as water tanks, vaults, and vending machines, as well as crafting spare parts for repairs. Owing to the size of said projects, we will transport the finished product to its intended location using heavy machinery─your only concern should be ensuring the smooth operation of its precision mechanisms.","recipes":[36338],"objectives":[{"kind":"craft","items":[{"name":"Heat-resistant Inner Cladding Material","quantity":2}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":127,"name":"EX+: Priority Sample Storage","job":2,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":300,"silver":1000,"gold":1600,"text":"As we expand the research facilities and living quarters in the Moongate Hub, we are looking for artisans to undertake the larger manufacturing tasks such as water tanks, vaults, and vending machines, as well as crafting spare parts for repairs. Owing to the size of said projects, we will transport the finished product to its intended location using heavy machinery─your only concern should be ensuring the smooth operation of its precision mechanisms.","recipes":[36339],"objectives":[{"kind":"craft","items":[{"name":"Hub Safe","quantity":2}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":128,"name":"EX: Starship Building Materials","job":2,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":850,"gold":1000,"text":"The new starship we have under construction is the lynchpin of our plans to explore the cosmos. We require artisans to manufacture the hard alloy that will serve as the primary element of its exterior cladding, as well as creating a surplus for repair purposes. As a vessel destined to navigate Score":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":151,"name":"Worker's Weaving Tools","job":3,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1700,"gold":2000,"text":"As the initiative grows in scale, more mission members are reporting that they lack the necessary tools to carry out their work, or that they must work with tools in poor repair. If this is allowed to continue, it will have a serious impact on efficiency and morale. To ensure that our mission stays on course, we request contributions of equipment, with a focus on those that have been prone to shortage.","recipes":[36373],"objectives":[{"kind":"craft","items":[{"name":"Survey Needle","quantity":2}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":152,"name":"Observation Devices","job":3,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":2700,"gold":3000,"text":"As appears to be characteristic of Sharlayan itself, the initiative has been welcoming new members from all corners of Etheirys. Thus, when it comes to devising a comforting “home away from home” environment for this eclectic cohort, simply borrowing elements from any singular culture will not suffice. We request all veteran artisans to submit recreations of Etheirys furnishings that we might build a broad selection of regional styles.","recipes":[36374],"objectives":[{"kind":"craft","items":[{"name":"Habitat Telescope","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":153,"name":"Fireplace Fixtures","job":3,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1600,"gold":2400,"text":"Several of our new Etheirys colleagues have lodged complaints concerning Sinus Ardorum's “cold,” “dark,” and “impractical” working conditions. While we are unable to address every source of dissatisfaction, requests for improvement are taken very seriously as we strive to provide the most comfortable environment possible. Qualified artisans are encouraged to participate in this endeavor through the manufacture of optimized tools and equipment.","recipes":[36375],"objectives":[{"kind":"craft","items":[{"name":"Enrichment Fireplace","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":154,"name":"Habitation Vanities","job":3,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":2700,"gold":3000,"text":"As the initiative progresses, the scale of inventory management, not to mention the number of people taking up residence on base, continues to expand at a rapid pace. We find ourselves in need of larger storage solutions, as well as general amenities such as benches and lighting equipment. In the case of bulky or complex items, we request that artisans report to us at each stage of the production process.","recipes":[36376],"objectives":[{"kind":"craft","items":[{"name":"Habitat Vanity Mirror","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":155,"name":"Lunar Material Tool Processing","job":3,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1300,"text":"As the initiative grows in scale, more mission members are reporting that they lack the necessary tools to carry out their work, or that they must work with tools in poor repair. If this is allowed to continue, it will have a serious impact on efficiency and morale. To ensure that our mission stays on course, we request contributions of equipment, with a focus on those that have been prone to shortage.","recipes":[36377,36378],"objectives":[{"kind":"craft","items":[{"name":"Survey Needle","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":156,"name":"Lunar Material Part Processing","job":3,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1300,"text":"For our next round of testing, we'd like to ascertain the degree of precision crafting that can be attained using the moon's native materials. Replicating Etheirys's engineered goods will provide us an initial reference point, but we are hopeful that the lessons learned during this process will be applicable to future initiative projects. Ideally, these parts will be used to improve Moongate Hub facilities, so contributing artisans should concentrate on demonstrating fine detail while also preserving the necessary function. ","recipes":[36379,36380],"objectives":[{"kind":"craft","items":[{"name":"Standard Crank","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":157,"name":"Key Facility Plating","job":3,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1800,"gold":2400,"text":"Sinus Ardorum is in dire need of materials to support the construction and development of the Moongate Hub, an intrastellar transportation system, on-site domiciles, and infrastructure necessary for travel to other stars. Of these materials, metal plating is some of the highest in demand, specifically that which meets the strict regulations of cosmic exploration. We seek talented crafters capable of fulfilling our metallurgical needs.","recipes":[36381],"objectives":[{"kind":"craft","items":[{"name":"Standard Metal Plating","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":158,"name":"Rare Material Processing","job":3,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2300,"gold":3000,"text":"Lunar adamantite is a mineral unique to the moon, but it seems that the samples collected within Sinus Ardorum exhibit even greater durability than what we've encountered thus far─a property that could prove extremely useful in the construction of starships and various other moon-based facilities. We call upon skilled metalwo tical":false,"timeLimitSec":1200,"silver":2600,"gold":3000,"text":"Our researchers have discovered meteorites in the Fallen Tears that yield a range of useful minerals. However, an analysis has revealed that there are volatile elements in their composition, and an experienced hand is required in their processing. We seek skilled artisans to test refine the raw materials to determine whether they can be a viable resource for the initiative.","recipes":[36385,36386,36387],"objectives":[{"kind":"craft","items":[{"name":"Cosmotized Lunar Adamantite Ingot","quantity":1},{"name":"Cosmotized Chondrite Ingot","quantity":1},{"name":"Cosmotized Ilmenite Plate","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":162,"name":"EX: Replica Bathing Fixtures","job":3,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2500,"gold":3000,"text":"As appears to be characteristic of Sharlayan itself, the initiative has been welcoming new members from all corners of Etheirys. Thus, when it comes to devising a comforting “home away from home” environment for this eclectic cohort, simply borrowing elements from any singular culture will not suffice. We request all veteran artisans to submit recreations of Etheirys furnishings that we might build a broad selection of regional styles.","recipes":[36388],"objectives":[{"kind":"craft","items":[{"name":"Habitat Bathtub","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":163,"name":"EX: Fine-grade Material Processing","job":3,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":840,"gold":1000,"text":"For our next round of testing, we'd like to ascertain the degree of precision crafting that can be attained using the moon's native materials. Replicating Etheirys's engineered goods will provide us an initial reference point, but we are hopeful that the lessons learned during this process will be applicable to future initiative projects. Ideally, these parts will be used to improve Moongate Hub facilities, so contributing artisans should concentrate on demonstrating fine detail while also preserving the necessary function. ","recipes":[36389],"objectives":[{"kind":"craft","items":[{"name":"Habitat Mechanical Arm","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":164,"name":"EX: Moongate Hub Equipment","job":3,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":840,"gold":1000,"text":"Although the moon is bathed in the same sunlight and starlight as Etheirys, the lack of atmosphere to scatter this light makes for dark skies and darker shadows. In order to maintain a properly lit working environment throughout our facilities, we request that all available artisans turn their hands to the manufacture of specified illumination devices.","recipes":[36390],"objectives":[{"kind":"craft","items":[{"name":"Interior Hub Light","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":165,"name":"EX: Work Support Mechanical Arms","job":3,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2800,"gold":3000,"text":"Several of our new Etheirys colleagues have lodged complaints concerning Sinus Ardorum's “cold,” “dark,” and “impractical” working conditions. While we are unable to address every source of dissatisfaction, requests for improvement are taken very seriously as we strive to provide the most comfortable environment possible. Qualified artisans are encouraged to participate in this endeavor through the manufacture of optimized tools and equipment.","recipes":[36391,36392,36393],"objectives":[{"kind":"craft","items":[{"name":"Enrichment Shaft","quantity":1},{"name":"Enrichment Spring","quantity":1},{"name":"Enrichment Mechanical Arm","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":166,"name":"EX+: High-durability Material Processing","job":3,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":420,"silver":560,"gold":880,"text":"Expeditions into the lunar nadir have detected promising sources of liquid and gaseous fuels which, when properly researched and developed, will prove highly valuable in future initiative applications. To that end, we request the construction of the tanks and containers necessary for safely storing and transporting these resources to the Moongate Hub.","recipes":[36394,36395],"objectives":[{"kind":"craft","items":[{"name":"High-durability Tank Frame","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":167,"name":"EX+: Impact-resistant Material Processing","job":3,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":330,"silver":560,"gold":880,"text":"Interior construction in the Moongate Hub employs the basic materials recommended by our current guidelines. It is problematic, however, to assume that this same standard of structural integrity will suffice once the initiative progresses to unknown─and potentially less hospitable─reaches of the cosmos. We hope to preemptively solve this issue by refitting facilities with materials of greater durability, and request skilled artisans to manufacture replacement partitions and other interior components from sturdy metals.","recipes":[36396,36397],"objectives":[{"kind":"craft","items":[{"name":"Impact-resistant Interior Wall","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":168,"name":"Hub Furnishings and Fixtures I","job":3,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2300,"gold":3000,"text":"As the initiative progresses, the scale of inventory management, not to mention the number of people taking up residence on base, continues to expand at a rapid pace. We find ourselves in need of larger storage solutions, as well as general amenities such as benches and lighting equipment. In the case of bulky or complex items, we request that artisans report to us at each stage of the production process.","recipes":[36398],"objectives":[{"kind":"craft","items":[{"name":"Interior Hub Light Components","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":169,"name":"EX: Hub Furnishings and Fixtures II","job":3,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2500,"gold":3000,"text":"As the initiative progresses, the scale of inventory management, not to mention the number of people taking up residence on base, continues to expand at a rapid pace. We find ourselves in need of larger storage solutions, as well as general amenities such as benches and lighting equipment. In the case of bulky or complex items, we request that artisans report to us at each stage of the production process.","recipes":[36399],"objectives":[{"kind":"craft","items":[{"name":"Standing Hub Light","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":170,"name":"Specialized Materials I","job":3,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1000,"gold":1600,"text":"As we expand the research facilities and living quarters in the Moongate Hub, we are looking for artisans to undertake the larger manufacturing tasks such as water tanks, vaults, and vending machines, as well as crafting spare parts for repairs. Owing to the size of said projects, we will transport the finished product to its intended location using heavy machinery─your only concern should be ensuring the smooth operation of its precision mechanisms.","recipes":[36400],"objectives":[{"kind":"craft","items":[{"name":"Insulating Metal Ingot","quantity":2}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":171,"name":"EX: Specialized Materials II","job":3,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1000,"gold":1600,"text":"As we expand the research facilities and living quarters in the Moongate Hub, we are looking for artisans to undertake the larger manufacturing tasks such as water tanks, vaults, and vending machines, as well as crafting spare parts for repairs. Owing to the size of said projects, we will transport the finished product to its intended location using heavy machinery─your only concern should be ensuring the smooth operation of its precision mechanisms.","recipes":[36401],"objectives":[{"kind":"craft","items":[{"name":"Heavy-duty Gear","quantity":2}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":172,"name":"EX+: Vending Machines","job":3,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":300,"silver":1000,"gold":1600,"text":"As we expand the research facilities and living quarters in the Moongate Hub, we are looking for artisans to undertake the larger manufacturing tasks such as water tanks, vaults, and vending machines, as well as crafting spare parts for repairs. Owing to the size of said projects, we will transport the finished product to its intended location using heavy machinery─your only concern should be ensuring the smooth operation of its precision mechanisms.","recipes":[36402],"objectives":[{"kind":"craft","items":[{"name":"Hub Vending Machine","quantity":2}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":173,"name":"EX: Starship Building Materials","job":3,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":850,"gold":1000,"text":"The new starship we have under construction is the lynchpin of our plans to explore the cosmos. We require artisans to manufacture the hard alloy that will serve as the primary element of its exterior cladding, as well as creating a surplus for repair purposes. As a vessel destined to navigate stellar currents, it must be sturdy enough to withstand the most turbulent aether fluctuations, and the resilient alloy you provide will be further processed into hull plating and other parts as dictated by the starship's unique specifications.","recipes":[36403],"objectives":[{"kind":"craft","items":[{"name":"Indurate Alloy Ingot","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":174,"name":"EX+: Starship Building Material Processing","job":3,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":240,"silver":900,"gold":1000,"text":"The new starship we have under construction is the lynchpin of our plans to explore the cosmos. We require artisans to manufacture the hard alloy that will serve as the primary element of its exterior cladding, as well as creating a surplus for repair purposes. As a vessel destined to navigate stellar currents, it must be sturdy enough to withstand the most turbulent aether fluctuations, and the resilient alloy you provide will be further processed into hull plating and other parts as dictated by the starship's unique specifications.","recipes":[36404],"objectives":[{"kind":"craft","items":[{"name":"Indurate Starship Plating","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":175,"name":"High-performance Drone Materials I","job":3,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2300,"gold":3000,"text":"Whether it be on the moon or another star we've yet to explore, our future ground-based expeditions are certain to encounter impassable terrain. Drones have proven useful for transporting supplies, but we are also looking to modify them to perform detailed aerial surveys in regions which challenge our surface vehicles. We encourage artisans to submit a range of parts that we might customize our drones and expand their practical functionality.","recipes":[36405],"objectives":[{"kind":"craft","items":[{"name":"Miniature Drone Gear","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":176,"name":"EX: High-performance Drone Materials II","job":3,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2500,"gold":3000,"text":"Whether it be on the moon or another star we've yet to explore, our future ground-based expeditions are certain to encounter impassable terrain. Drones have proven useful for transporting supplies, but we are also looking to modify them to perform detailed aerial surveys in regions which challenge our surface vehicles. We encourage artisans to submit a range of parts that we might customize our drones and expand their practical functionality.","recipes":[36406],"objectives":[{"kind":"craft","items":[{"name":"Compact Drone Camera Lens","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":177,"name":"EX+: High-performance Drones","job":3,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":270,"silver":2700,"gold":3000,"text":"Whether it be on the moon or another star we've yet to explore, our future ground-based expeditions are certain to encounter impassable terrain. Drones have proven useful for transporting supplies, but we are also looking to modify them to perform detailed aerial surveys in regions which challenge our surface vehicles. We encourage artisans to submit a range of parts that we might customize our drones and expand their practical functionality.","recipes":[36407],"objectives":[{"kind":"craft","items":[{"name":"Survey Drone","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":178,"name":"EX+: Cosmotized Equipment Materials I","job":3,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":600,"silver":980,"gold":1080,"text":"On Etheirys and in Mare Lamentorum, there are apparently rare resources whose locations are passed down through folklore. We have discovered that materials of comparable rarity exist in Sinus Ardorum, and wish to use them to advance our initiative. As they are highly difficult to process, great preparation and care must be taken. We will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[36408,36409],"objectives":[{"kind":"craft","items":[{"name":"Cosmotized Rhodium Shaft","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":179,"name":"EX+: Cosmotized Equipment Materials II","job":3,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":600,"silver":980,"gold":1080,"text":"On Etheirys and in Mare Lamentorum, there are apparently rare resources whose locations are passed down through folklore. We have discovered that materials of comparable rarity exist in Sinus Ardorum, and wish to use them to advance our initiative. As they are highly difficult to process, great preparation and care must be taken. We will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[36411,36412],"objectives":[{"kind":"craft","items":[{"name":"Cosmotized Chondrite Gear","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":180,"name":"EX+: Cosmotized Equipment Materials III","job":3,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":420,"silver":1000,"gold":1080,"text":"On Etheirys and in Mare Lamentorum, there are apparently rare resources whose locations are passed down through folklore. We have discovered that materials of comparable rarity exist in Sinus Ardorum, and wish to use them to advance our initiative. As they are highly difficult to process, great preparation and care must be taken. We will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[36414,36416],"objectives":[{"kind":"craft","items":[{"name":"Survey Welder","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":181,"name":"Multi-purpose Leather Straps","job":4,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"While metals are indispensable in our quest to explore the cosmos, other materials common to Etheirys are no less vital; leather, cloth, and wood all find use in various essential items such as uniforms and furnishings. To ensure the quality of finished products, we have established exacting specifications for base components we require in quantity, and ask that they be prepared to that standard.","recipes":[36417],"objectives":[{"kind":"craft","items":[{"name":"Standard Leather Strap","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":182,"name":"First-aid Leather","job":4,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Reports are on the rise of supplies being in shortage at remote work sites. While such occurrences are not critical while our operations are limited to Sinus Ardorum, it could be a matter of life and death when we eventually venture to distant stars. To that end, we are redoubling our efforts to maintain our stockpiles, and kindly ask for contributions of essential items such as medical equipment and heating fuel.","recipes":[36418],"objectives":[{"kind":"craft","items":[{"name":"First-aid Lunatender Leather","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":183,"name":"Gatherer's Gloves","job":4,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"As the final step in determining the viability of materials sourced here in Sinus Ardorum, we must put them to the proof in actual products. These materials have already been confirmed safe, and we now ask our artisans to use them to produce prototypes of items such as tools and clothing. Should these meet our stringent standards, we will move to employ the materials widely in the initiative.","recipes":[36419],"objectives":[{"kind":"craft","items":[{"name":"Survey Gloves","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":184,"name":"Essential Research Materials","job":4,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Our researchers have been experiencing a shortage of equipment and materials─the result of oversight on our part. As an impediment to research means an impediment to the initiative as a whole, this must be addressed with all haste. We ask that you fulfill the researchers' requests, which range from small items that are readily prepared to large items that require multiple stages of processing.","recipes":[36420],"objectives":[{"kind":"craft","items":[{"name":"Researcher's Leather","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":185,"name":"Work Pouches","job":4,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Reports are on the rise of supplies being in shortage at remote work sites. While such occurrences are not critical while our operations are limited to Sinus Ardorum, it could be a matter of life and death when we eventually venture to distant stars. To that end, we are redoubling our efforts to maintain our stockpiles, and kindly ask for contributions of essential items such as medical equipment and heating fuel.","recipes":[36421],"objectives":[{"kind":"craft","items":[{"name":"Fieldwork Pouch","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":186,"name":"Leather Room Shoes","job":4,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"We seek various outfitting materials for the interior of habitation modules and other structures. Although we have been outfitting the living spaces in our recommended fashion, it has come to our attention that the children of man have diverse tastes. With the initiative being a long-term undertaking, we wish to provide a wider selection of materials as part of our commitment to creating a comfortable environment for mission members.","recipes":[36422],"objectives":[{"kind":"craft","items":[{"name":"Habitat Leather Shoes","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":187,"name":"Heat-resistant Leather String","job":4,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"While metals are indispensable in our quest to explore the cosmos, other materials common to Etheirys are no less vital; leather, cloth, and wood all find use in various essential items such as uniforms and furnishings. To ensure the quality of finished products, we have established exacting specifications for base components we require in quantity, and ask that they be prepared to that standard.","recipes":[36423],"objectives":[{"kind":"craft","items":[{"name":"Standard Leather Strap","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":188,"name":"Worker's Bags","job":4,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Reports are on the rise of supplies being in shortage at remote work sites. While such occurrences are not critical while our operations are limited to Sinus Ardorum, it could be a matter of life and death when we eventually venture to distant stars. To that end, we are redoubling our efforts to maintain our stockpiles, and kindly ask for contributions of essential items such as medical equipment and heating fuel.","recipes":[36424],"objectives":[{"kind":"craft","items":[{"name":"Survey Leather Bag","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":189,"name":"Worker's Belts","job":4,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1300,"gold":3000,"text":"As the initiative grows in scale, more mission members are reporting that they lack the necessary tools to carry out their work, or that they must work with tools in poor repair. If this is allowed to continue, it will have a serious impact on efficiency and morale. To ensure that our mission stays on course, we request contributions of equipment, with a focus on those that have been prone to shortage.","recipes":[36425],"objectives":[{"kind":"craft","items":[{"name":"Survey Belt","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":190,"name":"High-grade Paper","job":4,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":700,"gold":1500,"text":"The initiative seeks capable artisans to refine paper and fiber from materials harvested from local flora as well as fauna brought in from northern Ilsabard. Although we primarily store our research data in terminals, we must also prepare physical reports to send to the Studium for archival purposes. That being the case, we require exceptionally durable products that will stand the test of time.","recipes":[36426,36427],"objectives":[{"kind":"craft","items":[{"name":"Heavy-duty Vellum","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":191,"name":"Sheep Rugs","job":4,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1100,"gold":2500,"text":"We seek various outfitting materials for the interior of habitation modules and other structures. Although we have been outfitting the living spaces in our recommended fashion, it has come to our attention that the children of man have diverse tastes. With the initiative being a long-term undertaking, we wish to provide a wider selection of materials as part of our commitment to creating a comfortable environment for mission members.","recipes":[36428,36429],"objectives":[{"kind":"craft","items":[{"name":"Enrichment Sheep Rug","quantity":2}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":192,"name":"Cosmoliner Materials","job":4,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2250,"text":"We seek components needed for the facilities due to be built around the Moongate Hub, as well as the Cosmoliner network. As the Cosmoliner will be deployed on other stars following satisfactory testing in Sinus Ardorum, we are looking to stockpile a large amount of components in preparation. In the case of bulky or complex items, we request that artisans report to us at each stage of the production process.","recipes":[36430,36431],"objectives":[{"kind":"craft","items":[{"name":"Cosmoliner Leather Strap","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":193,"name":"New Material Jackets","job":4,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":700,"gold":1500,"text":"As the final step in determining the viability of materials sourced here in Sinus Ardorum, we must put them to the proof in actual products. These materials have already been confirmed safe, and we now ask our artisans to use them to produce prototypes of items such as tools and clothing. Should these meet our stringent standards, we will move to employ the materials widely in the initiative.","recipes":[36432,36433],"objectives":[{"kind":"craft","items":[{"name":"Standard Leather Jacket","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":194,"name":"Leather First-aid Bags","job":4,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1600,"gold":2400,"text":"Reports are on the rise of supplies being in shortage at remote work sites. While such occurrences are not critical while our operations are limited to Sinus Ardorum, it could be a matter of life and death when we eventually venture to distant stars. To that end, we are redoubling our efforts to maintain our stockpiles, and kindly ask for contributions of essential items such as medical equipment and heating fuel.","recipes":[36434],"objectives":[{"kind":"craft","items":[{"name":"First-aid Leather Sack","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":195,"name":"Sterile Leather String","job":4,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1600,"gold":2400,"text":"While metals are indispensable in our quest to explore the cosmos, other materials common to Etheirys are no less vital; leather, cloth, and wood all find use in various essential items such as uniforms and furnishings. To ensure the quality of finished products, we have established exacting specifications for base components we require in quantity, and ask that they be prepared to that standard.","recipes":[36435],"objectives":[{"kind":"craft","items":[{"name":"Standard Leather Strap","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":196,"name":"High-grade Rugs","job":4,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1700,"gold":2000,"text":"We seek various outfitting materials for the interior of habitation modules and other structures. Although we have been outfitting the living spaces in our recommended fashion, it has come to our attention that the children of man have diverse tastes. With the initiative being a long-term undertaking, we wish to provide a wider selection of materials as part of our commitment to creating a comfortable environment for mission members.","recipes":[36436],"objectives":[{"kind":"craft","items":[{"name":"Habitat Bearskin Rug","quantity":2}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":197,"name":"Transport Leather","job":4,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":2700,"gold":3000,"text":"In Sinus Ardorum, the transportation of materials is primarily handled by rover, but the rough terrain means that we must package everything carefully to prevent damage. To that end, there is always a need for packaging and related items, which we now ask our artisans to provide. The requirements vary depending on the object to be transported, so please prepare them according to specifications.","recipes":[36437],"objectives":[{"kind":"craft","items":[{"name":"Transport Daphnia Leather","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":198,"name":"Long-term Storage Paper","job":4,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1600,"gold":2400,"text":"The initiative seeks capable artisans to refine paper and fiber from materials harvested from local flora as well as fauna brought in from northern Ilsabard. Although we primarily store our research data in terminals, we must also prepare physical reports to send to the Studium for archival purposes. That being the case, we require exceptionally durable products that will stand the test of time.","recipes":[36438],"objectives":[{"kind":"craft","items":[{"name":"Stable Vellum","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":199,"name":"High-grade Rest Chairs","job":4,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":2700,"gold":3000,"text":"In the nations whence our researchers hail, there are apparently places of relaxation called “cafés.” Having conducted research into these establishments, we now seek to improve the rest and relaxation facilities at the Moongate Hub. According to our findings, in addition to certain beverages, furnishings such as bookshelves promote mental well-being, and we ask our artisans to contribute items that have this effect.","recipes":[36439],"objectives":[{"kind":"craft","items":[{"name":"Habitat Leather Chair","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":200,"name":"Test Material Gloves","job":4,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1300,"text":"As the final step in determining the viability of materials sourced here in Sinus Ardorum, we must put them to the proof in actual products. These materials have already been confirmed safe, and we now ask our artisans to use them to produce prototypes of items such as tools and clothing. Should these meet our stringent standards, we will move to employ the materials widely in the initiative.","recipes":[36440,36441],"objectives":[{"kind":"craft","items":[{"name":"Survey Work Gloves","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":201,"name":"High-grade Rest Lounges","job":4,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1300,"text":"The sky of Etheirys is notable for changing its hue during the course of the day. This phenomenon appears to have a calming effect on people, and in its absence, we fear that initiative members may become prone to illness. In order to ensure everyone's well-being, we wish to improve our rest and relaxation facilities, and ask our artisans to provide comfortable furnishings such as chairs, cushions, and beds.","recipes":[36442,36443],"objectives":[{"kind":"craft","items":[{"name":"Habitat Lounge","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":202,"name":"High-durability Leather String","job":4,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1800,"gold":2400,"text":"While metals are indispensable in our quest to explore the cosmos, other materials common to Etheirys are no less vital; leather, cloth, and wood all find use in various essential items such as uniforms and furnishings. To ensure the quality of finished products, we have established exacting specifications for base components we require in quantity, and ask that they be prepared to that standard.","recipes":[36444],"objectives":[{"kind":"craft","items":[{"name":"Standard Leather Strap","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":203,"name":"Premium-grade Paper","job":4,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2300,"gold":3000,"text":"The initiative seeks capable artisans to refine paper and fiber from materials harvested from local flora as well as fauna brought in from northern Ilsabard. Although we primarily store our research data in terminals, we must also prepare physical reports to send to the Studium for archival purposes. That being the case, we require exceptionally durable products that will stand the test of time.","recipes":[36445],"objectives":[{"kind":"craft","items":[{"name":"Stellar Vellum","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":204,"name":"Research Plant Rug","job":4,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":700,"gold":1000,"text":"We seek various outfitting materials for the interior of habitation modules and other structures. Although we have been outfitting the living spaces in our recommended fashion, it has come to our attention that the children of man have diverse tastes. With the initiative being a long-term undertaking, we wish to provide a wider selection of materials as part of our commitment to creating a comfortable environment for mission members.","recipes":[36446],"objectives":[{"kind":"craft","items":[{"name":"Enrichment Arbor Flooring","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":205,"name":"Thermal Leather","job":4,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":700,"gold":1000,"text":"Reports are on the rise of supplies being in shortage at remote work sites. While such occurrences are not critical while our operations are limited to Sinus Ardorum, it could be a matter of life and death when we eventually venture to distant stars. To that end, we are redoubling our efforts to maintain our stockpiles, and kindly ask for contributions of essential items such as medical equipment and heating fuel.","recipes":[36447],"objectives":[{"kind":"craft","items":[{"name":"Fieldwork Leather","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":206,"name":"Lunar Flora Test Processing","job":4,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2600,"gold":3000,"text":"Our researchers have identified new vegetation in Weddingway's Bower that yields useful materials such as fiber and resin. However, an analysis has revealed that there are volatile elements in their composition, and an experienced hand is required in their processing. We seek skilled artisans to test refine the raw materials to determine whether they can be a viable resource for the initiative.","recipes":[36448,36449,36450],"objectives":[{"kind":"craft","items":[{"name":"Experimental Leather Strap","quantity":1},{"name":"Experimental Leather","quantity":1},{"name":"Experimental Cosmotized Leather","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":207,"name":"EX: Test Material Final Processing","job":4,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2500,"gold":3000,"text":"As the final step in determining the viability of materials sourced here in Sinus Ardorum, we must put them to the proof in actual products. These materials have already been confirmed safe, and we now ask our artisans to use them to produce prototypes of items such as tools and clothing. Should these meet our stringent standards, we will move to employ the materials widely in the initiative.","recipes":[36451],"objectives":[{"kind":"craft","items":[{"name":"Experimental Belt","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":208,"name":"EX: Work Pouches","job":4,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":840,"gold":1000,"text":"Every day, more people arrive from Etheirys to join the initiative, and this has accelerated the depletion of supplies throughout the Moongate Hub. While most are non-mission-critical items such as cafeteria trays and containers, it would not instill confidence in newcomers if we cannot provide the basics. As such, we ask our artisans to help replenish our stores of daily necessities.","recipes":[36452],"objectives":[{"kind":"craft","items":[{"name":"Habitat Pouch","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":209,"name":"EX: High-grade Sofas","job":4,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":840,"gold":1000,"text":"The sky of Etheirys is notable for changing its hue during the course of the day. This phenomenon appears to have a calming effect on people, and in its absence, we fear that initiative members may become prone to illness. In order to ensure everyone's well-being, we wish to improve our rest and relaxation facilities, and ask our artisans to provide comfortable furnishings such as chairs, cushions, and beds.","recipes":[36453],"objectives":[{"kind":"craft","items":[{"name":"Habitat Sofa","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":210,"name":"EX: Familiar Furnishings","job":4,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2800,"gold":3000,"text":"While the initiative has attracted many artisans from Etheirys, some are struggling more than others to adapt to an unfamiliar work environment. Left to their own devices, they cannot be expected to produce their best, and this will have implications on our productivity. To help our artisans to feel at ease, we seek contributions of furnishings and equipment that will enhance their experience.","recipes":[36454,36455,36456],"objectives":[{"kind":"craft","items":[{"name":"Enrichment Fringed Rug","quantity":1},{"name":"Enrichment Oval Rug","quantity":1},{"name":"Enrichment Blossom Rug","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":211,"name":"EX+: Safety Shoes","job":4,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":420,"silver":560,"gold":880,"text":"As the initiative grows in scale, more mission members are reporting that they lack the necessary tools to carry out their work, or that they must work with tools in poor repair. If this is allowed to continue, it will have a serious impact on efficiency and morale. To ensure that our mission stays on course, we request contributions of equipment, with a focus on those that have been prone to shortage.","recipes":[36457,36458],"objectives":[{"kind":"craft","items":[{"name":"Survey Safety Boots","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":212,"name":"EX+: Gatherer's Overalls","job":4,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":330,"silver":560,"gold":880,"text":"As the initiative progresses, certain unanticipated needs have begun to arise. These mainly consist of equipment used in the construction of new facilities along with the related safety gear, and we now turn to our artisans to supply these items to our specifications. As they find use in a wide range of demanding situations, from dizzying heights to deep tunnels, they must be durable as well as versatile in function.","recipes":[36459,36460],"objectives":[{"kind":"craft","items":[{"name":"Survey Gatherer's Overalls","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":213,"name":"Base Supplies I","job":4,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2300,"gold":3000,"text":"We seek components needed for the facilities due to be built around the Moongate Hub, as well as the Cosmoliner network. As the Cosmoliner will be deployed on other stars following satisfactory testing in Sinus Ardorum, we are looking to stockpile a large amount of components in preparation. In the case of bulky or complex items, we request that artisans report to us at each stage of the production process.","recipes":[36461],"objectives":[{"kind":"craft","items":[{"name":"Base Tent Component","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":214,"name":"EX: Base Supplies II","job":4,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2500,"gold":3000,"text":"We seek components needed for the facilities due to be built around the Moongate Hub, as well as the Cosmoliner network. As the Cosmoliner will be deployed on other stars following satisfactory testing in Sinus Ardorum, we are looking to stockpile a large amount of components in preparation. In the case of bulky or complex items, we request that artisans report to us at each stage of the production process.","recipes":[36462],"objectives":[{"kind":"craft","items":[{"name":"Base Tent","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":215,"name":"Specialized Materials I","job":4,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1000,"gold":1600,"text":"Our researchers have been experiencing a shortage of equipment and materials─the result of oversight on our part. As an impediment to research means an impediment to the initiative as a whole, this must be addressed with all haste. We ask that you fulfill the researchers' requests, which range from small items that are readily prepared to large items that require multiple stages of processing.","recipes":[36463],"objectives":[{"kind":"craft","items":[{"name":"Researcher's Leather Strap","quantity":2}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":216,"name":"EX: Specialized Materials II","job":4,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1000,"gold":1600,"text":"Our researchers have been experiencing a shortage of equipment and materials─the result of oversight on our part. As an impediment to research means an impediment to the initiative as a whole, this must be addressed with all haste. We ask that you fulfill the researchers' requests, which range from small items that are readily prepared to large items that require multiple stages of processing.","recipes":[36464],"objectives":[{"kind":"craft","items":[{"name":"Researcher's Water-resistant Leather","quantity":2}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":217,"name":"EX+: Large Research Materials","job":4,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":300,"silver":1000,"gold":1600,"text":"Our researchers have been experiencing a shortage of equipment and materials─the result of oversight on our part. As an impediment to research means an impediment to the initiative as a whole, this must be addressed with all haste. We ask that you fulfill the researchers' requests, which range from small items that are readily prepared to large items that require multiple stages of processing.","recipes":[36465],"objectives":[{"kind":"craft","items":[{"name":"Starship Leather","quantity":2}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":218,"name":"EX: Rest Facility Materials","job":4,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":850
