<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cosmic Solver – Sinus Ardorum</title>
<meta name="description" content="Offline step-by-step crafting assistant for Final Fantasy XIV Cosmic Exploration (Sinus Ardorum). Manually operated; reads nothing from the game.">
<style>:root {
  --bg: #f4f5f7; --panel: #ffffff; --ink: #1b1f24; --muted: #5d6673; --line: #d9dde3;
  --accent: #2d5bd7; --accent-ink: #ffffff; --ok: #1f8a4c; --bad: #c0392b; --warn: #b7791f;
  --rec-bg: #10233f; --rec-ink: #ffffff; --chip: #eef1f5; --bar: #e3e7ec;
  --c-normal: #8a919c; --c-good: #d64545; --c-excellent: #b445d6; --c-poor: #555b63; --c-centered: #c9a000;
  --c-sturdy: #2f6fd6; --c-pliant: #2e9e5b; --c-malleable: #3b3fa8; --c-primed: #8a4fd6; --c-goodomen: #e07b39; --c-robust: #138a8a;
  --radius: 10px; --gap: 12px;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --panel: #181c22; --ink: #e8ebef; --muted: #9aa3ae; --line: #2b313a;
    --accent: #6d93ff; --accent-ink: #0b0e12; --chip: #232932; --bar: #262c35; --rec-bg: #1e3a66;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --panel: #181c22; --ink: #e8ebef; --muted: #9aa3ae; --line: #2b313a;
  --accent: #6d93ff; --accent-ink: #0b0e12; --chip: #232932; --bar: #262c35; --rec-bg: #1e3a66;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header.top { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
header.top h1 { font-size: 16px; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header.top .planet { color: var(--muted); font-weight: 400; }
main { max-width: 1180px; margin: 0 auto; padding: 12px 16px 40px; display: grid; gap: var(--gap); grid-template-columns: 1fr; }
@media (min-width: 900px) { main.crafting { grid-template-columns: 380px 1fr; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; min-width: 0; }
.card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
.card h2 .grow { flex: 1; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--chip); border-radius: 8px; padding: 7px 10px; min-height: 36px; }
button:hover { border-color: var(--accent); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.ghost { background: transparent; }
button.small { min-height: 28px; padding: 3px 8px; font-size: 13px; }
button[disabled] { opacity: .45; cursor: not-allowed; }
input[type=number], input[type=text], select { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-height: 36px; width: 100%; }
label.inline { display: inline-flex; align-items: center; gap: 6px; margin-right: 12px; white-space: nowrap; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
.field { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
.field input, .field select { color: var(--ink); font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border-radius: 999px; padding: 4px 10px; min-height: 30px; font-size: 13px; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip.on .muted { color: inherit; opacity: .85; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.warn { color: var(--warn); }
.bad { color: var(--bad); }
.ok { color: var(--ok); }
.missions { max-height: 300px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; margin-top: 8px; }
.mission { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; padding: 8px 10px; }
.mission:last-child { border-bottom: 0; }
.mission.on { background: var(--chip); box-shadow: inset 3px 0 0 var(--accent); }
.mission .t { font-weight: 600; }
.mission .m { font-size: 12px; color: var(--muted); }
.badge { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 6px; background: var(--chip); border: 1px solid var(--line); margin-right: 4px; color: var(--ink); }
.badge.x { border-color: var(--c-primed); }
.rec { background: var(--rec-bg); color: var(--rec-ink); border-radius: var(--radius); padding: 14px 16px; }
.rec .lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .75; }
.rec .act { font-size: clamp(26px, 6vw, 40px); font-weight: 750; line-height: 1.1; margin: 4px 0 6px; overflow-wrap: anywhere; }
.rec .why { font-size: 15px; opacity: .95; }
.rec .est { font-size: 12px; opacity: .8; margin-top: 6px; }
.rec.thinking .act { opacity: .55; }
.rec.done { background: #1f6f43; }
.rec.failed { background: #7d2a22; }
.report { margin-top: 10px; }
.report .q { font-size: 13px; color: var(--muted); margin: 6px 0 4px; }
.conds { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
.cond { min-height: 46px; font-weight: 600; border-width: 2px; position: relative; text-align: left; padding-left: 12px; }
.cond kbd { position: absolute; right: 6px; top: 4px; font-size: 10px; opacity: .65; font-family: inherit; }
.cond.likely { box-shadow: 0 0 0 2px var(--accent) inset; }
.cond.fail { border-style: dashed; }
.c-0 { border-color: var(--c-normal); } .c-1 { border-color: var(--c-good); } .c-2 { border-color: var(--c-excellent); }
.c-3 { border-color: var(--c-poor); } .c-4 { border-color: var(--c-centered); } .c-5 { border-color: var(--c-sturdy); }
.c-6 { border-color: var(--c-pliant); } .c-7 { border-color: var(--c-malleable); } .c-8 { border-color: var(--c-primed); }
.c-9 { border-color: var(--c-goodomen); } .c-10 { border-color: var(--c-robust); }
.condtag { display: inline-block; padding: 2px 8px; border-radius: 6px; border: 2px solid; font-weight: 600; }
.bars { display: grid; gap: 8px; }
.bar { position: relative; height: 22px; background: var(--bar); border-radius: 6px; overflow: hidden; }
.bar .fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); opacity: .85; }
.bar.q .fill { background: #c28a12; }
.bar.d .fill { background: #3a8f6a; }
.bar.cp .fill { background: #7a5cc4; }
.bar .txt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; font-size: 13px; font-weight: 600; color: var(--ink); mix-blend-mode: normal; }
.bar .tick { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); opacity: .55; }
.statgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px 12px; margin-top: 8px; font-size: 14px; }
.buffs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.buff { background: var(--chip); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; font-size: 13px; }
.controls { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.hist { max-height: 260px; overflow: auto; font-size: 13px; }
.hist ol { margin: 0; padding-left: 22px; }
.hist li { margin: 2px 0; }
.alts { font-size: 12px; margin-top: 6px; opacity: .85; }
dialog { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); color: var(--ink); padding: 14px; max-width: min(640px, 94vw); width: 100%; }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog h3 { margin: 0 0 10px; font-size: 16px; }
.note { font-size: 12px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 8px; margin: 8px 0; }
.toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 20; }
.hidden { display: none !important; }
details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.kbdhelp kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 12px; }
</style>
</head>

g to our findings, in addition to certain beverages, furnishings such as bookshelves promote mental well-being, and we ask our artisans to contribute items that have this effect.","recipes":[36187],"objectives":[{"kind":"craft","items":[{"name":"Habitat Chair","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":20,"name":"Test Material Gathering Tools","job":0,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1300,"text":"As the final step in determining the viability of materials sourced here in Sinus Ardorum, we must put them to the proof in actual products. These materials have already been confirmed safe, and we now ask our artisans to use them to produce prototypes of items such as tools and clothing. Should these meet our stringent standards, we will move to employ the materials widely in the initiative.","recipes":[36188,36189],"objectives":[{"kind":"craft","items":[{"name":"Survey Fishing Rod","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":21,"name":"High-quality Rest Beds","job":0,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1300,"text":"The sky of Etheirys is notable for changing its hue during the course of the day. This phenomenon appears to have a calming effect on people, and in its absence, we fear that initiative members may become prone to illness. In order to ensure everyone's well-being, we wish to improve our rest and relaxation facilities, and ask our artisans to provide comfortable furnishings such as chairs, cushions, and beds.","recipes":[36190,36191],"objectives":[{"kind":"craft","items":[{"name":"Habitat Bed","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":22,"name":"High-durability Fiberboard","job":0,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1800,"gold":2400,"text":"While metals are indispensable in our quest to explore the cosmos, other materials common to Etheirys are no less vital; leather, cloth, and wood all find use in various essential items such as uniforms and furnishings. To ensure the quality of finished products, we have established exacting specifications for base components we require in quantity, and ask that they be prepared to that standard.","recipes":[36192],"objectives":[{"kind":"craft","items":[{"name":"Standard High-density Fiberboard","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":23,"name":"Premium-grade Paper","job":0,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2300,"gold":3000,"text":"The initiative seeks capable artisans to refine paper and fiber from materials harvested from local flora as well as fauna brought in from northern Ilsabard. Although we primarily store our research data in terminals, we must also prepare physical reports to send to the Studium for archival purposes. That being the case, we require exceptionally durable products that will stand the test of time.","recipes":[36193],"objectives":[{"kind":"craft","items":[{"name":"Stellar Paper","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":24,"name":"Starship Insulation","job":0,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":700,"gold":1000,"text":"We seek various outfitting materials for the interior of habitation modules and other structures. Although we have been outfitting the living spaces in our recommended fashion, it has come to our attention that the children of man have diverse tastes. With the initiative being a long-term undertaking, we wish to provide a wider selection of materials as part of our commitment to creating a comfortable environment for mission members.","recipes":[36194],"objectives":[{"kind":"craft","items":[{"name":"Enrichment Insulation","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":25,"name":"High Burn Charcoal","job":0,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":700,"gold":1000,"text":"Reports are on the rise of supplies being in shortage at remote work sites. While such occurrences are not critical while our operations are limited to Sinus Ardorum, it could be a matter of life and death when we eventually venture to distant stars. To that end, we are redoubling our efforts to maintain our stockpiles, and kindly ask for contributions of essential items such as medical equipment and heating fuel.","recipes":[36195],"objectives":[{"kind":"craft","items":[{"name":"Fieldwork Charcoal","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":26,"name":"Lunar Flora Test Processing","job":0,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2600,"gold":3000,"text":"Our researchers have identified new vegetation in Weddingway's Bower that yields useful materials such as fiber and resin. However, an analysis has revealed that there are volatile elements in their composition, and an experienced hand is required in their processing. We seek skilled artisans to test refine the raw materials to determine whether they can be a viable resource for the initiative.","recipes":[36196,36197,36198],"objectives":[{"kind":"craft","items":[{"name":"Experimental Lumber","quantity":1},{"name":"Experimental Plank","quantity":1},{"name":"Experimental Resin","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":27,"name":"EX: Test Material Final Processing","job":0,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2500,"gold":3000,"text":"As the final step in determining the viability of materials sourced here in Sinus Ardorum, we must put them to the proof in actual products. These materials have already been confirmed safe, and we now ask our artisans to use them to produce prototypes of items such as tools and clothing. Should these meet our stringent standards, we will move to employ the materials widely in the initiative.","recipes":[36199],"objectives":[{"kind":"craft","items":[{"name":"Experimental Fishing Rod","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":28,"name":"EX: Serving Trays","job":0,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":840,"gold":1000,"text":"Every day, more people arrive from Etheirys to join the initiative, and this has accelerated the depletion of supplies throughout the Moongate Hub. While most are non-mission-critical items such as cafeteria trays and containers, it would not instill confidence in newcomers if we cannot provide the basics. As such, we ask our artisans to help replenish our stores of daily necessities.","recipes":[36200],"objectives":[{"kind":"craft","items":[{"name":"Habitat Wooden Plates","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":29,"name":"EX: Bunk Beds","job":0,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":840,"gold":1000,"text":"The sky of Etheirys is notable for changing its hue during the course of the day. This phenomenon appears to have a calming effect on people, and in its absence, we fear that initiative members may become prone to illness. In order to ensure everyone's well-being, we wish to improve our rest and relaxation facilities, and ask our artisans to provide comfortable furnishings such as chairs, cushions, and beds.","recipes":[36201],"objectives":[{"kind":"craft","items":[{"name":"Habitat Bunk Bed","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":30,"name":"EX: Work Support Equipment","job":0,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2800,"gold":3000,"text":"While the initiative has attracted many artisans from Etheirys, some are struggling more than others to adapt to an unfamiliar work environment. Left to their own devices, they cannot be expected to produce their best, and this will have implications on our productivity. To help our artisans to feel at ease, we seek contributions of furnishings and equipment that will enhance their experience.","recipes":[36202,36203,36204],"objectives":[{"kind":"craft","items":[{"name":"Stellar Woodworking Bench","quantity":1},{"name":"Stellar Goldsmithing Bench","quantity":1},{"name":"Stellar Leatherworking Bench","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":31,"name":"EX+: High-quality Crafting Tools","job":0,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":420,"silver":560,"gold":880,"text":"As the initiative grows in scale, more mission members are reporting that they lack the necessary tools to carry out their work, or that they must work with tools in poor repair. If this is allowed to continue, it will have a serious impact on efficiency and morale. To ensure that our mission stays on course, we request contributions of equipment, with a focus on those that have been prone to shortage.","recipes":[36205,36206],"objectives":[{"kind":"craft","items":[{"name":"Survey Spinning Wheel","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":32,"name":"EX+: Elevating Platforms","job":0,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":330,"silver":560,"gold":880,"text":"As the initiative progresses, certain unanticipated needs have begun to arise. These mainly consist of equipment used in the construction of new facilities along with the related safety gear, and we now turn to our artisans to supply these items to our specifications. As they find use in a wide range of demanding situations, from dizzying heights to deep tunnels, they must be durable as well as versatile in function.","recipes":[36207,36208],"objectives":[{"kind":"craft","items":[{"name":"Mobile Work Stairs","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":33,"name":"Power Transmission Shafts I","job":0,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2300,"gold":3000,"text":"We seek components needed for the facilities due to be built around the Moongate Hub, as well as the Cosmoliner network. As the Cosmoliner will be deployed on other stars following satisfactory testing in Sinus Ardorum, we are looking to stockpile a large amount of components in preparation. In the case of bulky or complex items, we request that artisans report to us at each stage of the production process.","recipes":[36209],"objectives":[{"kind":"craft","items":[{"name":"Cosmoliner Shaft Component","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":34,"name":"EX: Power Transmission Shafts II","job":0,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2500,"gold":3000,"text":"We seek components needed for the facilities due to be built around the Moongate Hub, as well as the Cosmoliner network. As the Cosmoliner will be deployed on other stars following satisfactory testing in Sinus Ardorum, we are looking to stockpile a large amount of components in preparation. In the case of bulky or complex items, we request that artisans report to us at each stage of the production process.","recipes":[36210],"objectives":[{"kind":"craft","items":[{"name":"Cosmoliner Shaft","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":35,"name":"Specialized Materials I","job":0,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1000,"gold":1600,"text":"Our researchers have been experiencing a shortage of equipment and materials─the result of oversight on our part. As an impediment to research means an impediment to the initiative as a whole, this must be addressed with all haste. We ask that you fulfill the researchers' requests, which range from small items that are readily prepared to large items that require multiple stages of processing.","recipes":[36211],"objectives":[{"kind":"craft","items":[{"name":"Researcher's Water-resistant Plank","quantity":2}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":36,"name":"EX: Specialized Materials II","job":0,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1000,"gold":1600,"text":"Our researchers have been experiencing a shortage of equipment and materials─the result of oversight on our part. As an impediment to research means an impediment to the initiative as a whole, this must be addressed with all haste. We ask that you fulfill the researchers' requests, which range from small items that are readily prepared to large items that require multiple stages of processing.","recipes":[36212],"objectives":[{"kind":"craft","items":[{"name":"Researcher's Water-resistant Resin","quantity":2}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":37,"name":"EX+: Research Water Tank","job":0,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":300,"silver":1000,"gold":1600,"text":"Our researchers have been experiencing a shortage of equipment and materials─the result of oversight on our part. As an impediment to research means an impediment to the initiative as a whole, this must be addressed with all haste. We ask that you fulfill the researchers' requests, which range from small items that are readily prepared to large items that require multiple stages of processing.","recipes":[36213],"objectives":[{"kind":"craft","items":[{"name":"Analysis and Breeding Tank","quantity":2}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":38,"name":"EX: Rest Facility Materials","job":0,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":850,"gold":1000,"text":"In the nations whence our researchers hail, there are apparently places of relaxation called “cafés.” Having conducted research into these establishments, we now seek to improve the rest and relaxation facilities at the Moongate Hub. According to our findings, in addition to certain beverages, furnishings such as bookshelves promote mental well-being, and we ask our artisans to contribute items that have this effect.","recipes":[36214],"objectives":[{"kind":"craft","items":[{"name":"Habitat Hardcover Book","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":39,"name":"EX+: Rest Facility Furnishings","job":0,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":240,"silver":900,"gold":1000,"text":"In the nations whence our researchers hail, there are apparently places of relaxation called “cafés.” Having conducted research into these establishments, we now seek to improve the rest and relaxation facilities at the Moongate Hub. According to our findings, in addition to certain beverages, furnishings such as bookshelves promote mental well-being, and we ask our artisans to contribute items that have this effect.","recipes":[36215],"objectives":[{"kind":"craft","items":[{"name":"Habitat Bookshelf","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":40,"name":"Packing Materials I","job":0,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2300,"gold":3000,"text":"In Sinus Ardorum, the transportation of materials is primarily handled by rover, but the rough terrain means that we must package everything carefully to prevent damage. To that end, there is always a need for packaging and related items, which we now ask our artisans to provide. The requirements vary depending on the object to be transported, so please prepare them according to specifications.","recipes":[36216],"objectives":[{"kind":"craft","items":[{"name":"Cosmotized Transport Lumber","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":41,"name":"EX: Packing Materials II","job":0,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2500,"gold":3000,"text":"In Sinus Ardorum, the transportation of materials is primarily handled by rover, but the rough terrain means that we must package everything carefully to prevent damage. To that end, there is always a need for packaging and related items, which we now ask our artisans to provide. The requirements vary depending on the object to be transported, so please prepare them according to specifications.","recipes":[36217],"objectives":[{"kind":"craft","items":[{"name":"Transport Fiberboard","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":42,"name":"EX+: Rover Packing Materials","job":0,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":270,"silver":2700,"gold":3000,"text":"In Sinus Ardorum, the transportation of materials is primarily handled by rover, but the rough terrain means that we must package everything carefully to prevent damage. To that end, there is always a need for packaging and related items, which we now ask our artisans to provide. The requirements vary depending on the object to be transported, so please prepare them according to specifications.","recipes":[36218],"objectives":[{"kind":"craft","items":[{"name":"Rover Packing Material","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":43,"name":"EX+: Biofuel I","job":0,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":600,"silver":980,"gold":1080,"text":"On Etheirys and in Mare Lamentorum, there are apparently rare resources whose locations are passed down through folklore. We have discovered that materials of comparable rarity exist in Sinus Ardorum, and wish to use them to advance our initiative. As they are highly difficult to process, great preparation and care must be taken. We will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[36219,36220],"objectives":[{"kind":"craft","items":[{"name":"Cosmotized Petrified Orb","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":44,"name":"EX+: Biofuel II","job":0,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":600,"silver":980,"gold":1080,"text":"On Etheirys and in Mare Lamentorum, there are apparently rare resources whose locations are passed down through folklore. We have discovered that materials of comparable rarity exist in Sinus Ardorum, and wish to use them to advance our initiative. As they are highly difficult to process, great preparation and care must be taken. We will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[36222,36223],"objectives":[{"kind":"craft","items":[{"name":"Cosmotized Distilled Oil","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":45,"name":"EX+: Biofuel III","job":0,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":420,"silver":1000,"gold":1080,"text":"On Etheirys and in Mare Lamentorum, there are apparently rare resources whose locations are passed down through folklore. We have discovered that materials of comparable rarity exist in Sinus Ardorum, and wish to use them to advance our initiative. As they are highly difficult to process, great preparation and care must be taken. We will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[36225,36227],"objectives":[{"kind":"craft","items":[{"name":"Survey Biofuel","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":46,"name":"Multi-purpose Plating","job":1,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Sinus Ardorum is in dire need of materials to support the construction and development of the Moongate Hub, an intrastellar transportation system, on-site domiciles, and infrastructure necessary for travel to other stars. Of these materials, metal plating is some of the highest in demand, specifically that which meets the strict regulations of cosmic exploration. We seek talented crafters capable of fulfilling our metallurgical needs.","recipes":[36228],"objectives":[{"kind":"craft","items":[{"name":"Standard Metal Plating","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":47,"name":"Spare Starship Parts","job":1,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"The new starship we have under construction is the lynchpin of our plans to explore the cosmos. We require artisans to manufacture the hard alloy that will serve as the primary element of its exterior cladding, as well as creating a surplus for repair purposes. As a vessel destined to navigate stellar currents, it must be sturdy enough to withstand the most turbulent aether fluctuations, and the resilient alloy you provide will be further processed into hull plating and other parts as dictated by the starship's unique specifications.","recipes":[36229],"objectives":[{"kind":"craft","items":[{"name":"Starship Gear","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":48,"name":"Alloy Inspection","job":1,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Lunar adamantite is a mineral unique to the moon, but it seems that the samples collected within Sinus Ardorum exhibit even greater durability than what we've encountered thus far─a property that could prove extremely useful in the construction of starships and various other moon-based facilities. We call upon skilled metalworkers to forge a steady supply of ingots from our stockpiled ore that we might explore and develop new applications for use in our cosmic initiative.","recipes":[36230],"objectives":[{"kind":"craft","items":[{"name":"Lunar Alloy Ingot","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":49,"name":"Custom Parts (Simple)","job":1,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Whether it be on the moon or another star we've yet to explore, our future ground-based expeditions are certain to encounter impassable terrain. Drones have proven useful for transporting supplies, but we are also looking to modify them to perform detailed aerial surveys in regions which challenge our surface vehicles. We encourage artisans to submit a range of parts that we might customize our drones and expand their practical functionality.","recipes":[36231],"objectives":[{"kind":"craft","items":[{"name":"Drone Rods","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":50,"name":"Multi-purpose Metal Components","job":1,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"The Cosmic Exploration Initiative employs a wide range of machinery, but supplying individually tailored parts for the maintenance of each device on-site would lead to astronomical operation costs. To alleviate this expense, we've imposed a “cosmic standard” on all basic components used in our equipment. Recent reports cite an alarming shortage of the joints and shafts needed to keep the facilities running, and we are welcoming all contributions forged to the aforementioned specifications.","recipes":[36232],"objectives":[{"kind":"craft","items":[{"name":"Standard Nails","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":51,"name":"Mass-produced Necessities","job":1,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"The Cosmic Exploration Initiative employs a wide range of machinery, but supplying individually tailored parts for the maintenance of each device on-site would lead to astronomical operation costs. To alleviate this expense, we've imposed a “cosmic standard” on all basic components used in our equipment. Recent reports cite an alarming shortage of the joints and shafts needed to keep the facilities running, and we are welcoming all contributions forged to the aforementioned specifications.","recipes":[36233],"objectives":[{"kind":"craft","items":[{"name":"Standard Rivets","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":52,"name":"Standardized Heavy Plating","job":1,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Sinus Ardorum is in dire need of materials to support the construction and development of the Moongate Hub, an intrastellar transportation system, on-site domiciles, and infrastructure necessary for travel to other stars. Of these materials, metal plating is some of the highest in demand, specifically that which meets the strict regulations of cosmic exploration. We seek talented crafters capable of fulfilling our metallurgical needs.","recipes":[36234],"objectives":[{"kind":"craft","items":[{"name":"Standard Metal Plating","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":53,"name":"Starship Shafts","job":1,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"The new starship we have under construction is the lynchpin of our plans to explore the cosmos. We require artisans to manufacture the hard alloy that will serve as the primary element of its exterior cladding, as well as creating a surplus for repair purposes. As a vessel destined to navigate stellar currents, it must be sturdy enough to withstand the most turbulent aether fluctuations, and the resilient alloy you provide will be further processed into hull plating and other parts as dictated by the starship's unique specifications.","recipes":[36235],"objectives":[{"kind":"craft","items":[{"name":"Starship Shaft","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":54,"name":"Worker's Mining Tools","job":1,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1300,"gold":3000,"text":"As the initiative grows in scale, more mission members are reporting that they lack the necessary tools to carry out their work, or that they must work with tools in poor repair. If this is allowed to continue, it will have a serious impact on efficiency and morale. To ensure that our mission stays on course, we request contributions of equipment, with a focus on those that have been prone to shortage.","recipes":[36236],"objectives":[{"kind":"craft","items":[{"name":"Survey Maul","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":55,"name":"Standardized Alloy Rivets","job":1,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":700,"gold":1500,"text":"The Cosmic Exploration Initiative employs a wide range of machinery, but supplying individually tailored parts for the maintenance of each device on-site would lead to astronomical operation costs. To alleviate this expense, we've imposed a “cosmic standard” on all basic components used in our equipment. Recent reports cite an alarming shortage of the joints and shafts needed to keep the facilities running, and we are welcoming all contributions forged to the aforementioned specifications.","recipes":[36237,36238],"objectives":[{"kind":"craft","items":[{"name":"Standard Alloy Rivets","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":56,"name":"Worker's Carpentry Tools","job":1,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1100,"gold":2500,"text":"As the initiative grows in scale, more mission members are reporting that they lack the necessary tools to carry out their work, or that they must work with tools in poor repair. If this is allowed to continue, it will have a serious impact on efficiency and morale. To ensure that our mission stays on course, we request contributions of equipment, with a focus on those that have been prone to shortage.","recipes":[36239,36240],"objectives":[{"kind":"craft","items":[{"name":"Survey Crosscut Saw","quantity":2}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":57,"name":"Custom Parts (Intermediate)","job":1,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2250,"text":"Whether it be on the moon or another star we've yet to explore, our future ground-based expeditions are certain to encounter impassable terrain. Drones have proven useful for transporting supplies, but we are also looking to modify them to perform detailed aerial surveys in regions which challenge our surface vehicles. We encourage artisans to submit a range of parts that we might customize our drones and expand their practical functionality.","recipes":[36241,36242],"objectives":[{"kind":"craft","items":[{"name":"Indurate Drone Rods","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":58,"name":"Insulated Equipment","job":1,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":700,"gold":1500,"text":"Several of our new Etheirys colleagues have lodged complaints concerning Sinus Ardorum's “cold,” “dark,” and “impractical” working conditions. While we are unable to address every source of dissatisfaction, requests for improvement are taken very seriously as we strive to provide the most comfortable environment possible. Qualified artisans are encouraged to participate in this endeavor through the manufacture of optimized tools and equipment.","recipes":[36243,36244],"objectives":[{"kind":"craft","items":[{"name":"Large Enrichment Oven","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":59,"name":"Rover Shafts","job":1,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1600,"gold":2400,"text":"The Cosmic Exploration Initiative employs a wide range of machinery, but supplying individually tailored parts for the maintenance of each device on-site would lead to astronomical operation costs. To alleviate this expense, we've imposed a “cosmic standard” on all basic components used in our equipment. Recent reports cite an alarming shortage of the joints and shafts needed to keep the facilities running, and we are welcoming all contributions forged to the aforementioned specifications.","recipes":[36245],"objectives":[{"kind":"craft","items":[{"name":"Rover Shaft","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":60,"name":"Standardized Light Plating","job":1,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1600,"gold":2400,"text":"Sinus Ardorum is in dire need of materials to support the construction and development of the Moongate Hub, an intrastellar transportation system, on-site domiciles, and infrastructure necessary for travel to other stars. Of these materials, metal plating is some of the highest in demand, specifically that which meets the strict regulations of cosmic exploration. We seek talented crafters capable of fulfilling our metallurgical needs.","recipes":[36246],"objectives":[{"kind":"craft","items":[{"name":"Standard Metal Plating","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":61,"name":"Worker's Smithing Tools","job":1,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1700,"gold":2000,"text":"As the initiative grows in scale, more mission members are reporting that they lack the necessary tools to carry out their work, or that they must work with tools in poor repair. If this is allowed to continue, it will have a serious impact on efficiency and morale. To ensure that our mission stays on course, we request contributions of equipment, with a focus on those that have been prone to shortage.","recipes":[36247],"objectives":[{"kind":"craft","items":[{"name":"Survey Cross-pein Hammer","quantity":2}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":62,"name":"Bathing Fixtures","job":1,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":2700,"gold":3000,"text":"As appears to be characteristic of Sharlayan itself, the initiative has been welcoming new members from all corners of Etheirys. Thus, when it comes to devising a comforting “home away from home” environment for this eclectic cohort, simply borrowing elements from any singular culture will not suffice. We request all veteran artisans to submit recreations of Etheirys furnishings that we might build a broad selection of regional styles.","recipes":[36248],"objectives":[{"kind":"craft","items":[{"name":"Habitat Shower","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":63,"name":"Ceruleum Stoves","job":1,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1600,"gold":2400,"text":"Several of our new Etheirys colleagues have lodged complaints concerning Sinus Ardorum's “cold,” “dark,” and “impractical” working conditions. While we are unable to address every source of dissatisfaction, requests for improvement are taken very seriously as we strive to provide the most comfortable environment possible. Qualified artisans are encouraged to participate in this endeavor through the manufacture of optimized tools and equipment.","recipes":[36249],"objectives":[{"kind":"craft","items":[{"name":"Enrichment Stove","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":64,"name":"Habitation Lighting","job":1,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":2700,"gold":3000,"text":"As the initiative progresses, the scale of inventory management, not to mention the number of people taking up residence on base, continues to expand at a rapid pace. We find ourselves in need of larger storage solutions, as well as general amenities such as benches and lighting equipment. In the case of bulky or complex items, we request that artisans report to us at each stage of the production process.","recipes":[36250],"objectives":[{"kind":"craft","items":[{"name":"Habitat Ceiling Light","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":65,"name":"Lunar Material Tool Processing","job":1,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1300,"text":"As the initiative grows in scale, more mission members are reporting that they lack the necessary tools to carry out their work, or that they must work with tools in poor repair. If this is allowed to continue, it will have a serious impact on efficiency and morale. To ensure that our mission stays on course, we request contributions of equipment, with a focus on those that have been prone to shortage.","recipes":[36251,36252],"objectives":[{"kind":"craft","items":[{"name":"Survey File","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":66,"name":"Lunar Material Part Processing","job":1,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1300,"text":"For our next round of testing, we'd like to ascertain the degree of precision crafting that can be attained using the moon's native materials. Replicating Etheirys's engineered goods will provide us an initial reference point, but we are hopeful that the lessons learned during this process will be applicable to future initiative projects. Ideally, these parts will be used to improve Moongate Hub facilities, so contributing artisans should concentrate on demonstrating fine detail while also preserving the necessary function. ","recipes":[36253,36254],"objectives":[{"kind":"craft","items":[{"name":"Standard Fitting","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":67,"name":"Key Facility Plating","job":1,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1800,"gold":2400,"text":"Sinus Ardorum is in dire need of materials to support the construction and development of the Moongate Hub, an intrastellar transportation system, on-site domiciles, and infrastructure necessary for travel to other stars. Of these materials, metal plating is some of the highest in demand, specifically that which meets the strict regulations of cosmic exploration. We seek talented crafters capable of fulfilling our metallurgical needs.","recipes":[36255],"objectives":[{"kind":"craft","items":[{"name":"Standard Metal Plating","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":68,"name":"Rare Material Processing","job":1,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2300,"gold":3000,"text":"Lunar adamantite is a mineral unique to the moon, but it seems that the samples collected within Sinus Ardorum exhibit even greater durability than what we've encountered thus far─a property that could prove extremely useful in the construction of starships and various other moon-based facilities. We call upon skilled metalworkers to forge a steady supply of ingots from our stockpiled ore that we might explore and develop new applications for use in our cosmic initiative.","recipes":[36256],"objectives":[{"kind":"craft","items":[{"name":"Indurate Lunar Adamantite Ingot","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":69,"name":"Construction Necessities","job":1,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":700,"gold":1000,"text":"The Cosmic Exploration Initiative employs a wide range of machinery, but supplying individually tailored parts for the maintenance of each device on-site would lead to astronomical operation costs. To alleviate this expense, we've imposed a “cosmic standard” on all basic components used in our equipment. Recent reports cite an alarming shortage of the joints and shafts needed to keep the facilities running, and we are welcoming all contributions forged to the aforementioned specifications.","recipes":[36257],"objectives":[{"kind":"craft","items":[{"name":"Indurate Rivets","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":70,"name":"Worker's Sheet Metal Tools","job":1,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":700,"gold":1000,"text":"As the initiative grows in scale, more mission members are reporting that they lack the necessary tools to carry out their work, or that they must work with tools in poor repair. If this is allowed to continue, it will have a serious impact on efficiency and morale. To ensure that our mission stays on course, we request contributions of equipment, with a focus on those that have been prone to shortage.","recipes":[36258],"objectives":[{"kind":"craft","items":[{"name":"Survey Raising Hammer","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":71,"name":"Meteoric Material Test Processing","job":1,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2600,"gold":3000,"text":"Our researchers have discovered meteorites in the Fallen Tears that yield a range of useful minerals. However, an analysis has revealed that there are volatile elements in their composition, and an experienced hand is required in their processing. We seek skilled artisans to test refine the raw materials to determine whether they can be a viable resource for the initiative.","recipes":[36259,36260,36261],"objectives":[{"kind":"craft","items":[{"name":"Cosmotized Lunar Adamantite Ingot","quantity":1},{"name":"Cosmotized Chondrite Ingot","quantity":1},{"name":"Cosmotized Ilmenite Plate","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":72,"name":"EX: Replica Far Eastern Furnishings","job":1,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2500,"gold":3000,"text":"As appears to be characteristic of Sharlayan itself, the initiative has been welcoming new members from all corners of Etheirys. Thus, when it comes to devising a comforting “home away from home” environment for this eclectic cohort, simply borrowing elements from any singular culture will not suffice. We request all veteran artisans to submit recreations of Etheirys furnishings that we might build a broad selection of regional styles.","recipes":[36262],"objectives":[{"kind":"craft","items":[{"name":"Habitat Cooking Stove","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":73,"name":"EX: Fine-grade Material Processing","job":1,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":840,"gold":1000,"text":"For our next round of testing, we'd like to ascertain the degree of precision crafting that can be attained using the moon's native materials. Replicating Etheirys's engineered goods will provide us an initial reference point, but we are hopeful that the lessons learned during this process will be applicable to future initiative projects. Ideally, these parts will be used to improve Moongate Hub facilities, so contributing artisans should concentrate on demonstrating fine detail while also preserving the necessary function. ","recipes":[36263],"objectives":[{"kind":"craft","items":[{"name":"Habitat Partition","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":74,"name":"EX: Moongate Hub Equipment","job":1,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":840,"gold":1000,"text":"Although the moon is bathed in the same sunlight and starlight as Etheirys, the lack of atmosphere to scatter this light makes for dark skies and darker shadows. In order to maintain a properly lit working environment throughout our facilities, we request that all available artisans turn their hands to the manufacture of specified illumination devices.","recipes":[36264],"objectives":[{"kind":"craft","items":[{"name":"Habitat Lighting Rod","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":75,"name":"EX: Work Support Equipment","job":1,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2800,"gold":3000,"text":"Several of our new Etheirys colleagues have lodged complaints concerning Sinus Ardorum's “cold,” “dark,” and “impractical” working conditions. While we are unable to address every source of dissatisfaction, requests for improvement are taken very seriously as we strive to provide the most comfortable environment possible. Qualified artisans are encouraged to participate in this endeavor through the manufacture of optimized tools and equipment.","recipes":[36265,36266,36267],"objectives":[{"kind":"craft","items":[{"name":"Enrichment Furnace","quantity":1},{"name":"Enrichment Workbench","quantity":1},{"name":"Enrichment Oven","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":76,"name":"EX+: High-durability Material Processing","job":1,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":420,"silver":560,"gold":880,"text":"Expeditions into the lunar nadir have detected promising sources of liquid and gaseous fuels which, when properly researched and developed, will prove highly valuable in future initiative applications. To that end, we request the construction of the tanks and containers necessary for safely storing and transporting these resources to the Moongate Hub.","recipes":[36268,36269],"objectives":[{"kind":"craft","items":[{"name":"High-durability Tank","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":77,"name":"EX+: Impact-resistant Material Processing","job":1,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":330,"silver":560,"gold":880,"text":"Interior construction in the Moongate Hub employs the basic materials recommended by our current guidelines. It is problematic, however, to assume that this same standard of structural integrity will suffice once the initiative progresses to unknown─and potentially less hospitable─reaches of the cosmos. We hope to preemptively solve this issue by refitting facilities with materials of greater durability, and request skilled artisans to manufacture replacement partitions and other interior components from sturdy metals.","recipes":[36270,36271],"objectives":[{"kind":"craft","items":[{"name":"Impact-resistant Shelter Wall","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":78,"name":"Hub Furnishings and Fixtures I","job":1,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2300,"gold":3000,"text":"As the initiative progresses, the scale of inventory management, not to mention the number of people taking up residence on base, continues to expand at a rapid pace. We find ourselves in need of larger storage solutions, as well as general amenities such as benches and lighting equipment. In the case of bulky or complex items, we request that artisans report to us at each stage of the production process.","recipes":[36272],"objectives":[{"kind":"craft","items":[{"name":"Storage Trunk Materials","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":79,"name":"EX: Hub Furnishings and Fixtures II","job":1,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2500,"gold":3000,"text":"As the initiative progresses, the scale of inventory management, not to mention the number of people taking up residence on base, continues to expand at a rapid pace. We find ourselves in need of larger storage solutions, as well as general amenities such as benches and lighting equipment. In the case of bulky or complex items, we request that artisans report to us at each stage of the production process.","recipes":[36273],"objectives":[{"kind":"craft","items":[{"name":"Hub Storage Trunk","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":80,"name":"Specialized Materials I","job":1,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1000,"gold":1600,"text":"As we expand the research facilities and living quarters in the Moongate Hub, we are looking for artisans to undertake the larger manufacturing tasks such as water tanks, vaults, and vending machines, as well as crafting spare parts for repairs. Owing to the size of said projects, we will transport the finished product to its intended location using heavy machinery─your only concern should be ensuring the smooth operation of its precision mechanisms.","recipes":[36274],"objectives":[{"kind":"craft","items":[{"name":"Rust-resistant Metal Ingot","quantity":2}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":81,"name":"EX: Specialized Materials II","job":1,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1000,"gold":1600,"text":"As we expand the research facilities and living quarters in the Moongate Hub, we are looking for artisans to undertake the larger manufacturing tasks such as water tanks, vaults, and vending machines, as well as crafting spare parts for repairs. Owing to the size of said projects, we will transport the finished product to its intended location using heavy machinery─your only concern should be ensuring the smooth operation of its precision mechanisms.","recipes":[36275],"objectives":[{"kind":"craft","items":[{"name":"Pressure-resistant Glass","quantity":2}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":82,"name":"EX+: Research Water Tank","job":1,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":300,"silver":1000,"gold":1600,"text":"As we expand the research facilities and living quarters in the Moongate Hub, we are looking for artisans to undertake the larger manufacturing tasks such as water tanks, vaults, and vending machines, as well as crafting spare parts for repairs. Owing to the size of said projects, we will transport the finished product to its intended location using heavy machinery─your only concern should be ensuring the smooth operation of its precision mechanisms.","recipes":[36276],"objectives":[{"kind":"craft","items":[{"name":"Researcher's Cultivation Tank","quantity":2}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":83,"name":"EX: Starship Building Materials","job":1,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":850,"gold":1000,"text":"The new starship we have under construction is the lynchpin of our plans to explore the cosmos. We require artisans to manufacture the hard alloy that will serve as the primary element of its exterior cladding, as well as creating a surplus for repair purposes. As a vessel destined to navigate stellar currents, it must be sturdy enough to withstand the most turbulent aether fluctuations, and the resilient alloy you provide will be further processed into hull plating and other parts as dictated by the starship's unique specifications.","recipes":[36277],"objectives":[{"kind":"craft","items":[{"name":"Indurate Alloy Ingot","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":84,"name":"EX+: Starship Building Material Processing","job":1,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":240,"silver":900,"gold":1000,"text":"The new starship we have under construction is the lynchpin of our plans to explore the cosmos. We require artisans to manufacture the hard alloy that will serve as the primary element of its exterior cladding, as well as creating a surplus for repair purposes. As a vessel destined to navigate stellar currents, it must be sturdy enough to withstand the most turbulent aether fluctuations, and the resilient alloy you provide will be further processed into hull plating and other parts as dictated by the starship's unique specifications.","recipes":[36278],"objectives":[{"kind":"craft","items":[{"name":"Indurate Starship Plating","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":85,"name":"High-performance Drone Materials I","job":1,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2300,"gold":3000,"text":"Whether it be on the moon or another star we've yet to explore, our future ground-based expeditions are certain to encounter impassable terrain. Drones have proven useful for transporting supplies, but we are also looking to modify them to perform detailed aerial surveys in regions which challenge our surface vehicles. We encourage artisans to submit a range of parts that we might customize our drones and expand their practical functionality.","recipes":[36279],"obje
