 essential items such as medical equipment and heating fuel.","recipes":[36497],"objectives":[{"kind":"craft","items":[{"name":"Work Rope","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":240,"name":"Sterile Yarn","job":5,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1600,"gold":2400,"text":"While metals are indispensable in our quest to explore the cosmos, other materials common to Etheirys are no less vital; leather, cloth, and wood all find use in various essential items such as uniforms and furnishings. To ensure the quality of finished products, we have established exacting specifications for base components we require in quantity, and ask that they be prepared to that standard.","recipes":[36498],"objectives":[{"kind":"craft","items":[{"name":"Standard Cotton Yarn","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":241,"name":"High-grade Curtains","job":5,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1700,"gold":2000,"text":"We seek various outfitting materials for the interior of habitation modules and other structures. Although we have been outfitting the living spaces in our recommended fashion, it has come to our attention that the children of man have diverse tastes. With the initiative being a long-term undertaking, we wish to provide a wider selection of materials as part of our commitment to creating a comfortable environment for mission members.","recipes":[36499],"objectives":[{"kind":"craft","items":[{"name":"Habitat Curtain","quantity":2}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":242,"name":"Transport Yarn","job":5,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":2700,"gold":3000,"text":"In Sinus Ardorum, the transportation of materials is primarily handled by rover, but the rough terrain means that we must package everything carefully to prevent damage. To that end, there is always a need for packaging and related items, which we now ask our artisans to provide. The requirements vary depending on the object to be transported, so please prepare them according to specifications.","recipes":[36500],"objectives":[{"kind":"craft","items":[{"name":"Transport Cloth","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":243,"name":"Heat-resistant Composite Fiber","job":5,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1600,"gold":2400,"text":"The initiative seeks capable artisans to refine paper and fiber from materials harvested from local flora as well as fauna brought in from northern Ilsabard. Although we primarily store our research data in terminals, we must also prepare physical reports to send to the Studium for archival purposes. That being the case, we require exceptionally durable products that will stand the test of time.","recipes":[36501],"objectives":[{"kind":"craft","items":[{"name":"Stable Fiber","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":244,"name":"Rest Supplies","job":5,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":2700,"gold":3000,"text":"In the nations whence our researchers hail, there are apparently places of relaxation called “cafés.” Having conducted research into these establishments, we now seek to improve the rest and relaxation facilities at the Moongate Hub. According to our findings, in addition to certain beverages, furnishings such as bookshelves promote mental well-being, and we ask our artisans to contribute items that have this effect.","recipes":[36502],"objectives":[{"kind":"craft","items":[{"name":"Habitat Woolen Yarn","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":245,"name":"Test Material Hats","job":5,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1300,"text":"As the final step in determining the viability of materials sourced here in Sinus Ardorum, we must put them to the proof in actual products. These materials have already been confirmed safe, and we now ask our artisans to use them to produce prototypes of items such as tools and clothing. Should these meet our stringent standards, we will move to employ the materials widely in the initiative.","recipes":[36503,36504],"objectives":[{"kind":"craft","items":[{"name":"Survey Hat","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":246,"name":"Rest Cushions","job":5,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1300,"text":"The sky of Etheirys is notable for changing its hue during the course of the day. This phenomenon appears to have a calming effect on people, and in its absence, we fear that initiative members may become prone to illness. In order to ensure everyone's well-being, we wish to improve our rest and relaxation facilities, and ask our artisans to provide comfortable furnishings such as chairs, cushions, and beds.","recipes":[36505,36506],"objectives":[{"kind":"craft","items":[{"name":"Habitat Cushions","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":247,"name":"High-durability Yarn","job":5,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1800,"gold":2400,"text":"While metals are indispensable in our quest to explore the cosmos, other materials common to Etheirys are no less vital; leather, cloth, and wood all find use in various essential items such as uniforms and furnishings. To ensure the quality of finished products, we have established exacting specifications for base components we require in quantity, and ask that they be prepared to that standard.","recipes":[36507],"objectives":[{"kind":"craft","items":[{"name":"Standard Cotton Yarn","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":248,"name":"High-grade Composite Fiber","job":5,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2300,"gold":3000,"text":"The initiative seeks capable artisans to refine paper and fiber from materials harvested from local flora as well as fauna brought in from northern Ilsabard. Although we primarily store our research data in terminals, we must also prepare physical reports to send to the Studium for archival purposes. That being the case, we require exceptionally durable products that will stand the test of time.","recipes":[36508],"objectives":[{"kind":"craft","items":[{"name":"Stellar Fiber","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":249,"name":"High-grade Bedroom Curtains","job":5,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":700,"gold":1000,"text":"We seek various outfitting materials for the interior of habitation modules and other structures. Although we have been outfitting the living spaces in our recommended fashion, it has come to our attention that the children of man have diverse tastes. With the initiative being a long-term undertaking, we wish to provide a wider selection of materials as part of our commitment to creating a comfortable environment for mission members.","recipes":[36509],"objectives":[{"kind":"craft","items":[{"name":"Enrichment Curtain","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":250,"name":"First-aid Bandaging","job":5,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":700,"gold":1000,"text":"Reports are on the rise of supplies being in shortage at remote work sites. While such occurrences are not critical while our operations are limited to Sinus Ardorum, it could be a matter of life and death when we eventually venture to distant stars. To that end, we are redoubling our efforts to maintain our stockpiles, and kindly ask for contributions of essential items such as medical equipment and heating fuel.","recipes":[36510],"objectives":[{"kind":"craft","items":[{"name":"First-aid Bandaging","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":251,"name":"Lunar Flora Test Processing","job":5,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2600,"gold":3000,"text":"Our researchers have identified new vegetation in Weddingway's Bower that yields useful materials such as fiber and resin. However, an analysis has revealed that there are volatile elements in their composition, and an experienced hand is required in their processing. We seek skilled artisans to test refine the raw materials to determine whether they can be a viable resource for the initiative.","recipes":[36511,36512,36513],"objectives":[{"kind":"craft","items":[{"name":"Experimental Thread","quantity":1},{"name":"Experimental Cloth","quantity":1},{"name":"Experimental Fiber","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":252,"name":"EX: Test Material Final Processing","job":5,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2500,"gold":3000,"text":"As the final step in determining the viability of materials sourced here in Sinus Ardorum, we must put them to the proof in actual products. These materials have already been confirmed safe, and we now ask our artisans to use them to produce prototypes of items such as tools and clothing. Should these meet our stringent standards, we will move to employ the materials widely in the initiative.","recipes":[36514],"objectives":[{"kind":"craft","items":[{"name":"Experimental Gatherer's Overalls","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":253,"name":"EX: Weaving Materials","job":5,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":840,"gold":1000,"text":"Every day, more people arrive from Etheirys to join the initiative, and this has accelerated the depletion of supplies throughout the Moongate Hub. While most are non-mission-critical items such as cafeteria trays and containers, it would not instill confidence in newcomers if we cannot provide the basics. As such, we ask our artisans to help replenish our stores of daily necessities.","recipes":[36515],"objectives":[{"kind":"craft","items":[{"name":"Habitat Sewing Kit","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":254,"name":"EX: Rest Cushions","job":5,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":840,"gold":1000,"text":"The sky of Etheirys is notable for changing its hue during the course of the day. This phenomenon appears to have a calming effect on people, and in its absence, we fear that initiative members may become prone to illness. In order to ensure everyone's well-being, we wish to improve our rest and relaxation facilities, and ask our artisans to provide comfortable furnishings such as chairs, cushions, and beds.","recipes":[36516],"objectives":[{"kind":"craft","items":[{"name":"Habitat Sofa Cushions","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":255,"name":"EX: Familiar Furnishings","job":5,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2800,"gold":3000,"text":"While the initiative has attracted many artisans from Etheirys, some are struggling more than others to adapt to an unfamiliar work environment. Left to their own devices, they cannot be expected to produce their best, and this will have implications on our productivity. To help our artisans to feel at ease, we seek contributions of furnishings and equipment that will enhance their experience.","recipes":[36517,36518,36519],"objectives":[{"kind":"craft","items":[{"name":"Enrichment Oasis Rug","quantity":1},{"name":"Enrichment Glade Rug","quantity":1},{"name":"Enrichment Riviera Rug","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":256,"name":"EX+: Cold-weather Work Hats","job":5,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":420,"silver":560,"gold":880,"text":"As the initiative grows in scale, more mission members are reporting that they lack the necessary tools to carry out their work, or that they must work with tools in poor repair. If this is allowed to continue, it will have a serious impact on efficiency and morale. To ensure that our mission stays on course, we request contributions of equipment, with a focus on those that have been prone to shortage.","recipes":[36520,36521],"objectives":[{"kind":"craft","items":[{"name":"Survey Trapper's Hat","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":257,"name":"EX+: Crafter's Overalls","job":5,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":330,"silver":560,"gold":880,"text":"As the initiative progresses, certain unanticipated needs have begun to arise. These mainly consist of equipment used in the construction of new facilities along with the related safety gear, and we now turn to our artisans to supply these items to our specifications. As they find use in a wide range of demanding situations, from dizzying heights to deep tunnels, they must be durable as well as versatile in function.","recipes":[36522,36523],"objectives":[{"kind":"craft","items":[{"name":"Survey Artisan's Garb","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":258,"name":"Cosmoliner Materials I","job":5,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2300,"gold":3000,"text":"We seek ],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":261,"name":"EX: Specialized Materials II","job":5,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1000,"gold":1600,"text":"Our researchers have been experiencing a shortage of equipment and materials─the result of oversight on our part. As an impediment to research means an impediment to the initiative as a whole, this must be addressed with all haste. We ask that you fulfill the researchers' requests, which range from small items that are readily prepared to large items that require multiple stages of processing.","recipes":[36527],"objectives":[{"kind":"craft","items":[{"name":"Researcher's Cosmotized Cloth","quantity":2}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":262,"name":"EX+: Large Research Materials","job":5,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":300,"silver":1000,"gold":1600,"text":"Our researchers have been experiencing a shortage of equipment and materials─the result of oversight on our part. As an impediment to research means an impediment to the initiative as a whole, this must be addressed with all haste. We ask that you fulfill the researchers' requests, which range from small items that are readily prepared to large items that require multiple stages of processing.","recipes":[36528],"objectives":[{"kind":"craft","items":[{"name":"Starship Cloth","quantity":2}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":263,"name":"EX: Rest Facility Materials","job":5,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":850,"gold":1000,"text":"In the nations whence our researchers hail, there are apparently places of relaxation called “cafés.” Having conducted research into these establishments, we now seek to improve the rest and relaxation facilities at the Moongate Hub. According to our findings, in addition to certain beverages, furnishings such as bookshelves promote mental well-being, and we ask our artisans to contribute items that have this effect.","recipes":[36529],"objectives":[{"kind":"craft","items":[{"name":"Treated Habitat Cloth","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":264,"name":"EX+: Rest Facility Furnishings","job":5,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":240,"silver":900,"gold":1000,"text":"In the nations whence our researchers hail, there are apparently places of relaxation called “cafés.” Having conducted research into these establishments, we now seek to improve the rest and relaxation facilities at the Moongate Hub. According to our findings, in addition to certain beverages, furnishings such as bookshelves promote mental well-being, and we ask our artisans to contribute items that have this effect.","recipes":[36530],"objectives":[{"kind":"craft","items":[{"name":"Habitat Cushions","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":265,"name":"Packing Materials I","job":5,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2300,"gold":3000,"text":"In Sinus Ardorum, the transportation of materials is primarily handled by rover, but the rough terrain means that we must package everything carefully to prevent damage. To that end, there is always a need for packaging and related items, which we now ask our artisans to provide. The requirements vary depending on the object to be transported, so please prepare them according to specifications.","recipes":[36531],"objectives":[{"kind":"craft","items":[{"name":"Transport String","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":266,"name":"EX: Packing Materials II","job":5,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2500,"gold":3000,"text":"In Sinus Ardorum, the transportation of materials is primarily handled by rover, but the rough terrain means that we must package everything carefully to prevent damage. To that end, there is always a need for packaging and related items, which we now ask our artisans to provide. The requirements vary depending on the object to be transported, so please prepare them according to specifications.","recipes":[36532],"objectives":[{"kind":"craft","items":[{"name":"Thick Survey Cloth","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":267,"name":"EX+: Rover Packing Materials","job":5,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":270,"silver":2700,"gold":3000,"text":"In Sinus Ardorum, the transportation of materials is primarily handled by rover, but the rough terrain means that we must package everything carefully to prevent damage. To that end, there is always a need for packaging and related items, which we now ask our artisans to provide. The requirements vary depending on the object to be transported, so please prepare them according to specifications.","recipes":[36533],"objectives":[{"kind":"craft","items":[{"name":"Rover Packing Material","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":268,"name":"EX+: Crew Suits I","job":5,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":600,"silver":980,"gold":1080,"text":"On Etheirys and in Mare Lamentorum, there are apparently rare resources whose locations are passed down through folklore. We have discovered that materials of comparable rarity exist in Sinus Ardorum, and wish to use them to advance our initiative. As they are highly difficult to process, great preparation and care must be taken. We will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[36534,36535],"objectives":[{"kind":"craft","items":[{"name":"Cosmotized Composite Fiber","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":269,"name":"EX+: Crew Suits II","job":5,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":600,"silver":980,"gold":1080,"text":"On Etheirys and in Mare Lamentorum, there are apparently rare resources whose locations are passed down through folklore. We have discovered that materials of comparable rarity exist in Sinus Ardorum, and wish to use them to advance our initiative. As they are highly difficult to process, great preparation and care must be taken. We will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[36537,36538],"objectives":[{"kind":"craft","items":[{"name":"Cosmotized Cloth","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":270,"name":"EX+: Crew Suits III","job":5,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":420,"silver":1000,"gold":1080,"text":"On Etheirys and in Mare Lamentorum, there are apparently rare resources whose locations are passed down through folklore. We have discovered that materials of comparable rarity exist in Sinus Ardorum, and wish to use them to advance our initiative. As they are highly difficult to process, great preparation and care must be taken. We will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[36540,36542],"objectives":[{"kind":"craft","items":[{"name":"Survey Crew Suit","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":271,"name":"Foundation Bricks","job":6,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"As construction of various facilities in Sinus Ardorum proceeds, demand has increased for bricks to stabilize the foundations of our facilities and lubricant to reduce the wear on metal parts. If we are to meet our schedule, a stable supply of these essentials is of the utmost importance. Looking ahead to further expansion, we have developed a set of standards that all equipment used in the Cosmic Exploration Initiative must follow, and request that all delivered materials meet said standards.","recipes":[36543],"objectives":[{"kind":"craft","items":[{"name":"Standard Brick","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":272,"name":"Spice Processing","job":6,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"An analysis of the vegetation in Weddingway's Bower has found that many specimens are exceptionally nutritious. Our researchers have theorized that such plants could be used as a basis for new types of cosmetics and food products─if only someone could solve the problem of the peculiar odor these plants emit. To that end, we shall make all the technology we have available at the disposal of artisans willing to help tackle this conundrum.","recipes":[36544],"objectives":[{"kind":"craft","items":[{"name":"Lunar Spices","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":273,"name":"Building Adhesive","job":6,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Feedback from our workers has spurred a decision to improve the overall durability of the materials used at our construction sites. Procuring stronger, more versatile mortar and adhesive would ensure that our facilities endure even the harshest conditions. With future expansion of operations in mind, a set of standards has been developed for all materials used by the Cosmic Exploration Initiative. We ask that all deliveries meet said standards and are made with materials which can be found on the lunar surface.","recipes":[36545],"objectives":[{"kind":"craft","items":[{"name":"Standard Mortar","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":274,"name":"Nutrient Supplements","job":6,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Upon scanning the vital signs of our workers who brave the harsh lunar environment, dodging falling meteorites and eluding toxic spongoi, we have found that some have neglected sleep and food in pursuit of the unknown, giving rise to worrying nutritional imbalances. If this problem is not addressed immediately, we risk a significant deterioration in the health of our most dedicated. We have prepared an ample supply of ingredients and supplements to address this issue, and ask that they be processed into beverages and food that will meet the nutritional needs of our workers.","recipes":[36546],"objectives":[{"kind":"craft","items":[{"name":"Worker's Nutrient Mixture","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":275,"name":"Aquatic Adhesive","job":6,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"We have discovered a rare but nutrient-rich fluid within one of the aquatic plants cultivated in the Moongate Hub. Our researchers have suggested using this fluid to assist in the long-term preservation of our food, but first we must have samples of preserved foodstuffs and emergency supplies to evaluate its efficacy. While this fluid may only be the result of an uncommon mutation, we believe the potential applications to be worth exploring. We ask our artisans to provide us with foodstuffs or alchemical agents as their skills apply.","recipes":[36547],"objectives":[{"kind":"craft","items":[{"name":"Standard Glue","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":276,"name":"Medicated Feed Research","job":6,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Research into the breeding of aquatic life harvested in Sinus Ardorum proceeds apace, yet we have discovered that the feed on hand is suitable only for wild specimens. While cultivated specimens consume the feed, health scans do not show the expected improvements. We ask that our artisans deliver a mixture that meets the preferences of our cultivated animals, and that its ingredients are sourced from the local environment.","recipes":[36548],"objectives":[{"kind":"craft","items":[{"name":"Survey Porridge","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":277,"name":"Heat-resistant Bricks","job":6,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"As construction of various facilities in Sinus Ardorum proceeds, demand has increased for bricks to stabilize the foundations of our facilities and lubricant to reduce the wear on metal parts. If we are to meet our schedule, a stable supply of these essentials is of the utmost importance. Looking ahead to further expansion, we have developed a set of standards that all equipment used in the Cosmic Exploration Initiative must follow, and request that all delivered materials meet said standards.","recipes":[36549],"objectives":[{"kind":"craft","items":[{"name":"Standard Brick","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":278,"name":"Health Drinks","job":6,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Upon scanning the vital signs of our workers who brave the harsh lunar environment, dodging falling meteorites and eluding toxic spongoi, we have found that some have neglected sleep and food in pursuit of the unknown, giving rise to worrying nutritional imbalances. If this problem is not addressed immediately, we risk a significant deterioration in the health of our most dedicated. We have prepared an ample supply of ingredients and supplements to address this issue, and ask that they be processed into beverages and food that will meet the nutritional needs of our workers.","recipes":[36550],"objectives":[{"kind":"craft","items":[{"name":"Worker's Health Drink","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":279,"name":"Construction Paint","job":6,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1300,"gold":3000,"text":"As construction of various facilities in Sinus Ardorum proceeds, demand has increased for bricks to stabilize the foundations of our facilities and lubricant to reduce the wear on metal parts. If we are to meet our schedule, a stable supply of these essentials is of the utmost importance. Looking ahead to further expansion, we have developed a set of standards that all equipment used in the Cosmic Exploration Initiative must follow, and request that all delivered materials meet said standards.","recipes":[36551],"objectives":[{"kind":"craft","items":[{"name":"Standard Paint","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":280,"name":"Traditional Veneer","job":6,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":700,"gold":1500,"text":"Long-term habitation among the stars is unprecedented for most peoples, and among the many unknowns involved is its effect on mental well-being. We believe it a matter that demands careful consideration, and ask that our artisans of varied backgrounds create furnishings and food that evoke familiarity and comfort. Special focus should be placed on promoting mental harmony through aesthetic and olfactory means.","recipes":[36552,36553],"objectives":[{"kind":"craft","items":[{"name":"Enrichment Concrete","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":281,"name":"Night Lighting","job":6,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1100,"gold":2500,"text":"We have discovered a rare but nutrient-rich fluid within one of the aquatic plants cultivated in the Moongate Hub. Our researchers have suggested using this fluid to assist in the long-term preservation of our food, but first we must have samples of preserved foodstuffs and emergency supplies to evaluate its efficacy. While this fluid may only be the result of an uncommon mutation, we believe the potential applications to be worth exploring. We ask our artisans to provide us with foodstuffs or alchemical agents as their skills apply.","recipes":[36554,36555],"objectives":[{"kind":"craft","items":[{"name":"Habitat Candles","quantity":2}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":282,"name":"Emergency Foodstuffs Development","job":6,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2250,"text":"In the vastness of the cosmos, none can predict what manner of accidents might occur. Should the unthinkable happen─for instance, if a ship were to stall in a stellar current, leaving it unmoored in the dark void of space─how would we survive? We must prepare for all eventualities, and to that end we mean to stockpile compact, stable, and long-lasting foodstuffs aboard our ship, not to mention carrots of happiness. We ask that all capable artisans deliver rations and beverages fortified with sufficient nutrients.","recipes":[36556,36557],"objectives":[{"kind":"craft","items":[{"name":"Emergency Food","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":283,"name":"Experimental Potables","job":6,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":700,"gold":1500,"text":"We have received requests from initiative members hailing from Sharlayan to expand the variety of items available in the Moongate Hub's cafeteria. They have expressed a preference for high-energy meals that can be replenished at a moment' e food ingredients in smaller portions to accommodate various dietary preferences. To meet this need, we require storage items such as dishes, pots, and jars.","recipes":[36573],"objectives":[{"kind":"craft","items":[{"name":"Habitat Dishware","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":296,"name":"Lunar Seafood Processing","job":6,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2600,"gold":3000,"text":"A new species of aquatic life discovered in Calabash Cove apparently contains multiple beneficial substances. However, the substances have proven extremely delicate, and often degrade during processing. We seek skilled artisans to help us refine a stable method to extract and process these substances, and advise the utmost caution when handling the materials.","recipes":[36574,36575,36576],"objectives":[{"kind":"craft","items":[{"name":"Experimental Lubricant","quantity":1},{"name":"Experimental Alchemic","quantity":1},{"name":"Experimental Resin","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":297,"name":"EX: Emergency Potables","job":6,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2500,"gold":3000,"text":"In the vastness of the cosmos, none can predict what manner of accidents might occur. Should the unthinkable happen─for instance, if a ship were to stall in a stellar current, leaving it unmoored in the dark void of space─how would we survive? We must prepare for all eventualities, and to that end we mean to stockpile compact, stable, and long-lasting foodstuffs aboard our ship, not to mention carrots of happiness. We ask that all capable artisans deliver rations and beverages fortified with sufficient nutrients.","recipes":[36577],"objectives":[{"kind":"craft","items":[{"name":"Bottled Stable Drinks","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id  We ask that capable artisans do their utmost to create meals matching this image while using the provided nutritional ingredients.","recipes":[36596],"objectives":[{"kind":"craft","items":[{"name":"Worker's Jelly Drink","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":313,"name":"EX+: Dichromatic Compound I","job":6,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":600,"silver":980,"gold":1080,"text":"On Etheirys and in Mare Lamentorum, there are apparently rare resources whose locations are passed down through folklore. We have discovered that materials of comparable rarity exist in Sinus Ardorum, and wish to use them to advance our initiative. As they are highly difficult to process, great preparation and care must be taken. We will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[36597,36598],"objectives":[{"kind":"craft","items":[{"name":"Cosmotized Yellow Alchemic","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":314,"name":"EX+: Dichromatic Compound II","job":6,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":600,"silver":980,"gold":1080,"text":"On Etheirys and in Mare Lamentorum, there are apparently rare resources whose locations are passed down through folklore. We have discovered that materials of comparable rarity exist in Sinus Ardorum, and wish to use them to advance our initiative. As they are highly difficult to process, great preparation and care must be taken. We will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[36600,36601],"objectives":[{"kind":"craft","items":[{"name":"Cosmotized Blue Alchemic","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":315,"name":"EX+: Dichromatic Compound III","job":6,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":420,"silver":1000,"gold":1080,"text":"On Etheirys and in Mare Lamentorum, there are apparently rare resources whose locations are passed down through folklore. We have discovered that materials of comparable rarity exist in Sinus Ardorum, and wish to use them to advance our initiative. As they are highly difficult to process, great preparation and care must be taken. We will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[36603,36605],"objectives":[{"kind":"craft","items":[{"name":"Prismatic Survey Alchemic","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":316,"name":"Standard Lubricant","job":7,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"As construction of various facilities in Sinus Ardorum proceeds, demand has increased for bricks to stabilize the foundations of our facilities and lubricant to reduce the wear on metal parts. If we are to meet our schedule, a stable supply of these essentials is of the utmost importance. Looking ahead to further expansion, we have developed a set of standards that all equipment used in the Cosmic Exploration Initiative must follow, and request that all delivered materials meet said standards.","recipes":[36606],"objectives":[{"kind":"craft","items":[{"name":"Standard Lubricant","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":317,"name":"Spice Processing","job":7,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"An analysis of the vegetation in Weddingway's Bower has found that many specimens are exceptionally nutritious. Our researchers have theorized that such plants could be used as a basis for new types of cosmetics and food products─if only someone could solve the problem of the peculiar odor these plants emit. To that end, we shall make all the technology we have available at the disposal of artisans willing to help tackle this conundrum.","recipes":[36607],"objectives":[{"kind":"craft","items":[{"name":"Lunar Spices","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":318,"name":"Building Adhesive","job":7,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Feedback from our workers has spurred a decision to improve the overall durability of the materials used at our construction sites. Procuring stronger, more versatile mortar and adhesive would ensure that our facilities endure even the harshest conditions. With future expansion of operations in mind, a set of standards has been developed for all materials used by the Cosmic Exploration Initiative. We ask that all deliveries meet said standards and are made with materials which can be found on the lunar surface.","recipes":[36608],"objectives":[{"kind":"craft","items":[{"name":"Standard Adhesive","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":319,"name":"Aquatic Nutrient Concentrate","job":7,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Upon scanning the vital signs of our workers who brave the harsh lunar environment, dodging falling meteorites and eluding toxic spongoi, we have found that some have neglected sleep and food in pursuit of the unknown, giving rise to worrying nutritional imbalances. If this problem is not addressed immediately, we risk a significant deterioration in the health of our most dedicated. We have prepared an ample supply of ingredients and supplements to address this issue, and ask that they be processed into beverages and food that will meet the nutritional needs of our workers.","recipes":[36609],"objectives":[{"kind":"craft","items":[{"name":"Lunar Broth","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":320,"name":"Aquatic Ink","job":7,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"We have discovered a rare but nutrient-rich fluid within one of the aquatic plants cultivated in the Moongate Hub. Our researchers have suggested using this fluid to assist in the long-term preservation of our food, but first we must have samples of preserved foodstuffs and emergency supplies to evaluate its efficacy. While this fluid may only be the result of an uncommon mutation, we believe the potential applications to be worth exploring. We ask our artisans to provide us with foodstuffs or alchemical agents as their skills apply.","recipes":[36610],"objectives":[{"kind":"craft","items":[{"name":"Researcher's Ink","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":321,"name":"Medicated Feed Research","job":7,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Research into the breeding of aquatic life harvested in Sinus Ardorum proceeds apace, yet we have discovered that the feed on hand is suitable only for wild specimens. While cultivated specimens consume the feed, health scans do not show the expected improvements. We ask that our artisans deliver a mixture that meets the preferences of our cultivated animals, and that its ingredients are sourced from the local environment.","recipes":[36611],"objectives":[{"kind":"craft","items":[{"name":"Survey Porridge","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":322,"name":"Heat-resistant Lubricant","job":7,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"As construction of various facilities in Sinus Ardorum proceeds, demand has increased for bricks to stabilize the foundations of our facilities and lubricant to reduce the wear on metal parts. If we are to meet our schedul ed sleep and food in pursuit of the unknown, giving rise to worrying nutritional imbalances. If this problem is not addressed immediately, we risk a significant deterioration in the health of our most dedicated. We have prepared an ample supply of ingredients and supplements to address this issue, and ask that they be processed into beverages and food that will meet the nutritional needs of our workers.","recipes":[36635],"objectives":[{"kind":"craft","items":[{"name":"Super Jubilance Juice","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":340,"name":"Cafeteria Goods","job":7,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":700,"gold":1000,"text":"As the initiative continues to gain more workers from Etheirys, we have been faced with a shortage of essential supplies to meet their needs for food, clothing, and shelter. With this in mind, we would like to replenish and expand the variety of items offered in the cafeteria and our habitation modules. Furthermore, as the members of the initiative become more diverse, there is a growing need to store food ingredients in smaller portions to accommodate various dietary preferences. To meet this need, we require storage items such as dishes, pots, and jars.","recipes":[36636],"objectives":[{"kind":"craft","items":[{"name":"Habitat Breakfast","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":341,"name":"Lunar Seafood Processing","job":7,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2600,"gold":3000,"text":"A new species of aquatic life discovered in Calabash Cove apparently contains multiple beneficial substances. However, the substances have proven extremely delicate, and often degrade during processing. We seek skilled artisans to help us refine a stable method to extract and process these substances, and advise the utmost caution when handling the materials.","recipes":[36637,36638,36639],"objectives":[{"kind":"craft","items":[{"name":"Experimental Flour","quantity":1},{"name":"Experimental Salt","quantity":1},{"name":"Experimental Oil","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":342,"name":"EX: Stable Food Mass Production","job":7,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2500,"gold":3000,"text":"In the vastness of the cosmos, none can predict what manner of accidents might occur. Should the unthinkable happen─for instance, if a ship were to stall in a stellar current, leaving it unmoored in the dark void of space─how would we survive? We must prepare for all eventualities, and to that end we mean to stockpile compact, stable, and long-lasting foodstuffs aboard our ship, not to mention carrots of happiness. We ask that all capable artisans deliver rations and beverages fortified with sufficient nutrients.","recipes":[36640],"objectives":[{"kind":"craft","items":[{"name":"Cosmotized Stable Ration","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":343,"name":"EX: Sharlayan Dish Inspection","job":7,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":840,"gold":1000,"text":"An analysis of the vegetation in Weddingway's Bower has found that many specimens are exceptionally nutritious. Our researchers have theorized that such plants could be used as a basis for new types of cosmetics and food products─if only someone could solve the problem of the peculiar odor these plants emit. To that end, we shall make all the technology we have available at the disposal of artisans willing to help tackle this conundrum.","recipes":[36641],"objectives":[{"kind":"craft","items":[{"name":"Launch Party Rusk","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":344,"name":"EX: Simple Field Rations","job":7,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":840,"gold":1000,"text":"Long-term habitation among the stars is unprecedented for most peoples, and among the many unknowns involved is its effect on mental well-being. We believe it a matter that demands careful consideration, and ask that our artisans of varied backgrounds create furnishings and food that evoke familiarity and comfort. Special focus should be placed on promoting mental harmony through aesthetic and olfactory means.","recipes":[36642],"objectives":[{"kind":"craft","items":[{"name":"Launch Party Grilled Banquet","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":345,"name":"EX: Portable Nutrients","job":7,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2800,"gold":3000,"text":"It has come to the initiative's attention that the adventurers in Etheirys employ special foods and tinctures to enhance their abilities prior to engaging in decisive battles or delicate tasks. Having such items at our disposal would certainly help us deal with the various crises which arise in the course of our work. All available artisans are requested to deliver portable foodstuffs and alchemics which will make our workers more efficient.","recipes":[36643,36644,36645],"objectives":[{"kind":"craft","items":[{"name":"Survey Red Drop","quantity":1},{"name":"Survey Green Drop","quantity":1},{"name":"Survey Yellow Drop","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":346,"name":"EX+: Cured Seafood","job":7,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":420,"silver":560,"gold":880,"text":"We have discovered a rare but nutrient-rich fluid within one of the aquatic plants cultivated in the Moongate Hub. Our researchers have suggested using this fluid to assist in the long-term preservation of our food, but first we must have samples of preserved foodstuffs and emergency supplies to evaluate its efficacy. While this fluid may only be the result of an uncommon mutation, we believe the potential applications to be worth exploring. We ask our artisans to provide us with foodstuffs or alchemical agents as their skills apply.","recipes":[36646,36647],"objectives":[{"kind":"craft","items":[{"name":"Cured Fish","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":347,"name":"EX+: Cured Meat","job":7,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":330,"silver":560,"gold":880,"text":"We have discovered that one of the aquatic organisms raised in the Moongate Hub secretes a fluid rich in nutrients, but have yet to test its effect on the various peoples which work with us. To determine whether this secretion is fit for consumption, the fluid must be processed into an edible form. While the organism in question may be only an anomalous mutation, we believe it has great potential, and recommend processing it into food products or alchemical mixtures.","recipes":[36648,36649],"objectives":[{"kind":"craft","items":[{"name":"Cured Meat","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":348,"name":"Worker's Banquet Preparation I","job":7,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2300,"gold":3000,"text":"The initiative has decided to treat our workers to warm meals and fatigue-relieving medicine as a reward for their efforts. Considering our numbers, such an undertaking is no small feat, and requires the preparation of large quantities of product that maintains uniform quality in both effectiveness and flavor. Due to the complexity of the task, we ask that our artisans report to us for evaluation periodically during the course of their work.","recipes":[36650],"objectives":[{"kind":"craft","items":[{"name":"Communal Meal Supplies","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":349,"name":"EX: Worker's Banquet Preparation II","job":7,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2500,"gold":3000,"text":"The initiative has decided to treat our workers to warm meals and fatigue-relieving medicine as a reward for their efforts. Considering our numbers, such an undertaking is no small feat, and requires the preparation of large quantities of product that maintains uniform quality in both effectiveness and flavor. Due to the complexity of the task, we ask that our artisans report to us for evaluation periodically during the course of their work.","recipes":[36651],"objectives":[{"kind":"craft","items":[{"name":"Communal Stew","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":350,"name":"Loporrit Dietary Improvement I","job":7,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1000,"gold":1600,"text":"While Hydaelyn has blessed us Loporrits with an industriousness that can endure countless centuries, we are still driven by our spirits, and as such our performance fluctuates in relation to our mental well-being. To keep morale high, we request items that will enhance the mood of Loporrit workers. Just as people from Etheirys find comfort in verdant greens and soothing blues, we take solace in ashen greys that remind us of the moon─and of course, anything that tastes like carrots is a delicacy to our palates.","recipes":[36652],"objectives":[{"kind":"craft","items":[{"name":"Loporrit Juice","quantity":2}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":351,"name":"EX: Loporrit Dietary Improvement II","job":7,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1000,"gold":1600,"text":"While Hydaelyn has blessed us Loporrits with an industriousness that can endure countless centuries, we are still driven by our spirits, and as such our performance fluctuates in relation to our mental well-being. To keep morale high, we request items that will enhance the mood of Loporrit workers. Just as people from Etheirys find comfort in verdant greens and soothing blues, we take solace in ashen greys that remind us of the moon─and of course, anything that tastes like carrots is a delicacy to our palates.","recipes":[36653],"objectives":[{"kind":"craft","items":[{"name":"Loporrit White Drop","quantity":2}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":352,"name":"EX+: Loporrit Dietary Improvement III","job":7,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":300,"silver":1000,"gold":1600,"text":"While Hydaelyn has blessed us Loporrits with an industriousness that can endure countless centuries, we are still driven by our spirits, and as such our performance fluctuates in relation to our mental well-being. To keep morale high, we request items that will enhance the mood of Loporrit workers. Just as people from Etheirys find comfort in verdant greens and soothing blues, we take solace in ashen greys that remind us of the moon─and of course, anything that tastes like carrots is a delicacy to our palates.","recipes":[36654],"objectives":[{"kind":"craft","items":[{"name":"Loporrit Pellets","quantity":2}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":353,"name":"EX: Aquaculture Feed I","job":7,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":850,"gold":1000,"text":"Research into the breeding of aquatic life harvested in Sinus Ardorum proceeds apace, yet we have discovered that the feed on hand is suitable only for wild specimens. While cultivated specimens consume the feed, health scans do not show the expected improvements. We ask that our artisans deliver a mixture that meets the preferences of our cultivated animals, and that its ingredients are sourced from the local environment.","recipes":[36655],"objectives":[{"kind":"craft","items":[{"name":"Aquaculture Extract","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":354,"name":"EX+: Aquaculture Feed II","job":7,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":240,"silver":900,"gold":1000,"text":"Research into the breeding of aquatic life harvested in Sinus Ardorum proceeds apace, yet we have discovered that the feed on hand is suitable only for wild specimens. While cultivated specimens consume the feed, health scans do not show the expected improvements. We ask that our artisans deliver a mixture that meets the preferences of our cultivated animals, and that its ingredients are sourced from the local environment.","recipes":[36656],"objectives":[{"kind":"craft","items":[{"name":"Aquaculture Pellet","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":355,"name":"Highly Nutritious Foodstuffs I","job":7,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2300,"gold":3000,"text":"We have received requests from initiative members hailing from Sharlayan to expand the variety of items available in the Moongate Hub's cafeteria. They have expressed a preference for high-energy meals that can be replenished at a moment's notice, and we have made an image of a meal we believe meets these demands. We ask that capable artisans do their utmost to create meals matching this image while using the provided nutritional ingredients.","recipes":[36657],"objectives":[{"kind":"craft","items":[{"name":"Worker's Paste","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":356,"name":"EX: Highly Nutritious Foodstuffs II","job":7,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":2500,"gold":3000,"text":"We have received requests from initiative members hailing from Sharlayan to expand the variety of items available in the Moongate Hub's cafeteria. They have expressed a preference for high-energy meals that can be replenished at a moment's notice, and we have made an image of a meal we believe meets these demands. We ask that capable artisans do their utmost to create meals matching this image while using the provided nutritional ingredients.","recipes":[36658],"objectives":[{"kind":"craft","items":[{"name":"Worker's Vanilla Nutrient Bar","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":357,"name":"EX+: Highly Nutritious Foodstuffs III","job":7,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":270,"silver":2700,"gold":3000,"text":"We have received requests from initiative members hailing from Sharlayan to expand the variety of items available in the Moongate Hub's cafeteria. They have expressed a preference for high-energy meals that can be replenished at a moment's notice, and we have made an image of a meal we believe meets these demands. We ask that capable artisans do their utmost to create meals matching this image while using the provided nutritional ingredients.","recipes":[36659],"objectives":[{"kind":"craft","items":[{"name":"Worker's Omni-nutritious Meal","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":358,"name":"EX+: Whole Meals I","job":7,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":600,"silver":980,"gold":1080,"text":"On Etheirys and in Mare Lamentorum, there are apparently rare resources whose locations are passed down through folklore. We have discovered that materials of comparable rarity exist in Sinus Ardorum, and wish to use them to advance our initiative. As they are highly difficult to process, great preparation and care must be taken. We will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[36660,36661],"objectives":[{"kind":"craft","items":[{"name":"Cosmotized Mushroom Paste","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":359,"name":"EX+: Whole Meals II","job":7,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":600,"silver":980,"gold":1080,"text":"On Etheirys and in Mare Lamentorum, there are apparently rare resources whose locations are passed down through folklore. We have discovered that materials of comparable rarity exist in Sinus Ardorum, and wish to use them to advance our initiative. As they are highly difficult to process, great preparation and care must be taken. We will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[36663,36664],"objectives":[{"kind":"craft","items":[{"name":"Cosmotized Cheese","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":360,"name":"EX+: Whole Meals III","job":7,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":420,"silver":1000,"gold":1080,"text":"On Etheirys and in Mare Lamentorum, there are apparently rare resources whose locations are passed down through folklore. We have discovered that materials of comparable rarity exist in Sinus Ardorum, and wish to use them to advance our initiative. As they are highly difficult to process, great preparation and care must be taken. We will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[36666,36668],"objectives":[{"kind":"craft","items":[{"name":"Balanced Survey Meal","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":496,"name":"EX: Aquatic Resource Research Tanks","job":0,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1800,"gold":2700,"text":"For the preservation and study of aquatic resources, development of vessels which recreate their natural environment is crucial. To ensure we can handle such resources with the utmost care in our interstellar travels, experimentation here on the moon is essential. Therefore, we would begin trialing the manufacture of preservative vessels for specimens procured from Sinus Ardorum's springs. Contributors are requested to model these vessels after the Studium's research tanks, reinforcing them for the purposes of transport.","recipes":[36669],"objectives":[{"kind":"score","items":[],"bronzeScore":900,"specialAction":null,"specialActionCharges":0}]},{"id":497,"name":"EX: Impact-resistant Containers","job":2,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1800,"gold":2700,"text":"For the preservation and study of aquatic resources, development of vessels which recreate their natural environment is crucial. To ensure we can handle such resources with the utmost care in our interstellar travels, experimentation here on the moon is essential. Therefore, we would begin trialing the manufacture of preservative vessels for specimens procured from Sinus Ardorum's springs. Contributors are requested to model these vessels after the Studium's research tanks, reinforcing them for the purposes of transport.","recipes":[36673],"objectives":[{"kind":"score","items":[],"bronzeScore":900,"specialAction":null,"specialActionCharges":0}]},{"id":498,"name":"EX: Soothing Censers","job":3,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1800,"gold":2700,"text":"Unlike Mare Lamentorum, where structures wrought by Hydaelyn yet stand, Sinus Ardorum bears no trace of Etheirys's civilization. It makes a Loporrit wonder: can materials procured from this forlorn place be crafted into items which provide warmth and comfort to people's lives? It is with this query in mind that contributors are requested to utilize lunar resources in the recreation of furnishings seen on Etheirys. Once the finished product's safety is confirmed, we shall invite initiative members to review the utility of such items in their capacity as a reminder of home.","recipes":[36675],"objectives":[{"kind":"score","items":[],"bronzeScore":900,"specialAction":null,"specialActionCharges":0}]},{"id":499,"name":"EX+: Automaton Digging","job":1,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1800,"gold":2700,"text":"Storage capacity on the starship is limited, and thus it is essential we improve our ability to procure locally sourced materials during our interstellar expeditions. Therefore, we ask that contributors craft experimental tools using only materials found in Sinus Ardorum. This shall be an exercise not only of practical use to our future interstellar endeavors, but a scientific inquiry into what manner of tools contributors can craft from lunar resources.","recipes":[36671],"objectives":[{"kind":"score","items":[],"bronzeScore":900,"specialAction":null,"specialActionCharges":0}]},{"id":500,"name":"EX+: Lunar Leather","job":4,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1800,"gold":2700,"text":"Among the flora and minerals found in Sinus Ardorum, there are many which possess peculiar properties. Using them as materials for manufacturing will surely contribute to the pursuit of technical ingenuity on Etheirys. We have confirmed that the mineral matter and fibers procured from such sources possess a complementary composition for the processing of leather and cloth. We ask that contributors process these materials according to our specifications.","recipes":[36677],"objectives":[{"kind":"score","items":[],"bronzeScore":900,"specialAction":null,"specialActionCharges":0}]},{"id":501,"name":"EX+: High-quality Floor Tiling","job":5,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1800,"gold":2700,"text":"Unlike Mare Lamentorum, where structures wrought by Hydaelyn yet stand, Sinus Ardorum bears no trace of Etheirys's civilization. It makes a Loporrit wonder: can materials procured from this forlorn place be crafted into items which provide warmth and comfort to people's lives? It is with this query in mind that contributors are requested to utilize lunar resources in the recreation of furnishings seen on Etheirys. Once the finished product's safety is confirmed, we shall invite initiative members to review the utility of such items in their capacity as a reminder of home.","recipes":[36679],"objectives":[{"kind":"score","items":[],"bronzeScore":900,"specialAction":null,"specialActionCharges":0}]},{"id":502,"name":"EX: Lunar Tanning Agents","job":4,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1800,"gold":2700,"text":"Among the flora and minerals found in Sinus Ardorum, there are many which possess peculiar properties. Using them as materials for manufacturing will surely contribute to the pursuit of technical ingenuity on Etheirys. We have confirmed that the mineral matter and fibers procured from such sources possess a complementary composition for the processing of leather and cloth. We ask that contributors process these materials according to our specifications.","recipes":[36678],"objectives":[{"kind":"score","items":[],"bronzeScore":900,"specialAction":null,"specialActionCharges":0}]},{"id":503,"name":"EX: Special Spongoi Processing","job":5,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1800,"gold":2700,"text":"Among the flora and minerals found in Sinus Ardorum, there are many which possess peculiar properties. Using them as materials for manufacturing will surely contribute to the pursuit of technical ingenuity on Etheirys. We have confirmed that the mineral matter and fibers procured from such sources possess a complementary composition for the processing of leather and cloth. We ask that contributors process these materials according to our specifications.","recipes":[36680],"objectives":[{"kind":"score","items":[],"bronzeScore":900,"specialAction":null,"specialActionCharges":0}]},{"id":504,"name":"EX: Freshness Preservation","job":7,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1800,"gold":2700,"text":"Sources of sustenance are of vital importance to Etheirys-born members of the initiative, this much is known. While some resources found in Sinus Ardorum can be used as a food source, many unfortunately expire rapidly. To circumvent this, we ask that contributors procure the designated resources, and prepare them immediately for preservation, that they be can used as rations for an extended period of time.","recipes":[36683],"objectives":[{"kind":"score","items":[],"bronzeScore":900,"specialAction":null,"specialActionCharges":0}]},{"id":505,"name":"EX+: Lunar Tools","job":0,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1800,"gold":2700,"text":"Storage capacity on the starship is limited, and thus it is essential we improve our ability to procure locally sourced materials during our interstellar expeditions. Therefore, we ask that contributors craft experimental tools using only materials found in Sinus Ardorum. This shall be an exercise not only of practical use to our future interstellar endeavors, but a scientific inquiry into what manner of tools contributors can craft from lunar resources.","recipes":[36670],"objectives":[{"kind":"score","items":[],"bronzeScore":900,"specialAction":null,"specialActionCharges":0}]},{"id":506,"name":"EX+: High Burn Furnace","job":2,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1800,"gold":2700,"text":"Storage capacity on the starship is limited, and thus it is essential we improve our ability to procure locally sourced materials during our interstellar expeditions. Therefore, we ask that contributors craft experimental tools using only materials found in Sinus Ardorum. This shall be an exercise not only of practical use to our future interstellar endeavors, but a scientific inquiry into what manner of tools contributors can craft from lunar resources.","recipes":[36674],"objectives":[{"kind":"score","items":[],"bronzeScore":900,"specialAction":null,"specialActionCharges":0}]},{"id":507,"name":"EX+: Mushroom-borne Comfort","job":6,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1800,"gold":2700,"text":"Unlike Mare Lamentorum, where structures wrought by Hydaelyn yet stand, Sinus Ardorum bears no trace of Etheirys's civilization. It makes a Loporrit wonder: can materials procured from this forlorn place be crafted into items which provide warmth and comfort to people's lives? It is with this query in mind that contributors are requested to utilize lunar resources in the recreation of furnishings seen on Etheirys. Once the finished product's safety is confirmed, we shall invite initiative members to review the utility of such items in their capacity as a reminder of home.","recipes":[36681],"objectives":[{"kind":"score","items":[],"bronzeScore":900,"specialAction":null,"specialActionCharges":0}]},{"id":508,"name":"EX: Processed Aquatic Metals","job":1,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1800,"gold":2700,"text":"We have discovered that a combination of rare meteoric irons, crystals, secretions from fish, and more have formed into precipitates in springs found throughout Sinus Ardorum. Surely, such materials, imbued with unique aetherial properties as they are, unlock countless possibilities for the development of myriad items. Contributors are requested to process these resources into a more malleable state for production.","recipes":[36672],"objectives":[{"kind":"score","items":[],"bronzeScore":900,"specialAction":null,"specialActionCharges":0}]},{"id":509,"name":"EX: Refined Moon Gel","job":6,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1800,"gold":2700,"text":"We have discovered that a combination of rare meteoric irons, crystals, secretions from fish, and more have formed into precipitates in springs found throughout Sinus Ardorum. Surely, such materials, imbued with unique aetherial properties as they are, unlock countless possibilities for the development of myriad items. Contributors are requested to process these resources into a more malleable state for production.","recipes":[36682],"objectives":[{"kind":"score","items":[],"bronzeScore":900,"specialAction":null,"specialActionCharges":0}]},{"id":510,"name":"EX+: Crystallic Gems","job":3,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1800,"gold":2700,"text":"We have discovered that a combination of rare meteoric irons, crystals, secretions from fish, and more have formed into precipitates in springs found throughout Sinus Ardorum. Surely, such materials, imbued with unique aetherial properties as they are, unlock countless possibilities for the development of myriad items. Contributors are requested to process these resources into a more malleable state for production.","recipes":[36676],"objectives":[{"kind":"score","items":[],"bronzeScore":900,"specialAction":null,"specialActionCharges":0}]},{"id":511,"name":"EX+: Eel Rations","job":7,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1800,"gold":2700,"text":"Sources of sustenance are of vital importance to Etheirys-born members of the initiative, this much is known. While some resources found in Sinus Ardorum can be used as a food source, many unfortunately expire rapidly. To circumvent this, we ask that contributors procure the designated resources, and prepare them immediately for preservation, that they be can used as rations for an extended period of time.","recipes":[36684],"objectives":[{"kind":"score","items":[],"bronzeScore":900,"specialAction":null,"specialActionCharges":0}]},{"id":512,"name":"Work Ladders","job":0,"rank":"D","minLevel":10,"synced":true,"critical":true,"timeLimitSec":1200,"silver":0,"gold":0,"text":"An astromagnetic storm has caused a shutdown of the systems in Piercingway Tunnel. While they are currently being restarted in safe mode, the lighting fixtures are inoperative, hindering excavations coming in and out of Gleamslope. However, we face a shortage of the materials and tools to make these emergency repairs, and ask that any available hands make prompt deliveries of supplies directly to the site.","recipes":[36685],"objectives":[{"kind":"score","items":[],"bronzeScore":900,"specialAction":null,"specialActionCharges":0},{"kind":"deliver","items":[],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":513,"name":"Kindling","job":0,"rank":"D","minLevel":10,"synced":true,"critical":true,"timeLimitSec":1200,"silver":0,"gold":0,"text":"The sporing mist has given rise to highly toxic mutant spongoi in the southern sector of Weddingway's Bower. Their spores can adhere to nearby workers, plants, and ships, and immediate eradication is necessary to prevent adverse effects. Workers are already burning the spongoi away with flamethrowers, but they face a shortage of fuel, flame-resistant cloth, and protective gear. We require skilled artisans to prepare these materials and deliver them with the utmost haste.","recipes":[36686],"objectives":[{"kind":"score","items":[],"bronzeScore":900,"specialAction":null,"specialActionCharges":0},{"kind":"deliver","items":[],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":514,"name":"Fungal Building Materials","job":0,"rank":"D","minLevel":10,"synced":true,"critical":true,"timeLimitSec":1200,"silver":0,"gold":0,"text":"It appears Weddingway's Bower is home to a form of beneficial spongos, which can be found to the east of the blooming beds. With robust and viscous mycelium, we believe it can be processed into durable fabric suited for interstellar exploration or converted into hard, lightweight construction materials that can adapt to varied environments. Since the spongoi must be processed immediately after collection, we are putting out an urgent call for skilled artisans. We look forward to your valuable contribution to the initiative.","recipes":[36687],"objectives":[{"kind":"score","items":[],"bronzeScore":900,"specialAction":null,"specialActionCharges":0},{"kind":"deliver","items":[],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":515,"name":"Meteorite Drills","job":1,"rank":"D","minLevel":10,"synced":true,"critical":true,"timeLimitSec":1200,"silver":0,"gold":0,"text":"A shower of small meteorites was detected to the southwest of the Moongate Hub, and the objects have become obstructions to various activities in the area. While prompt removal of the meteorites is necessary, we believe some may contain rare and valuable metals, which we hope to extract and utilize as resources. Our teams have already begun breaking down the fallen objects, but they report a shortage of spare tools. We request the swift delivery of said tools and the retrieval of valuable meteorites from the area.","recipes":[36690],"objectives":[{"kind":"score","items":[],"bronzeScore":900,"specialAction":null,"specialActionCharges":0},{"kind":"deliver","items":[],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":516,"name":"Vacuum Muzzles","job":1,"rank":"D","minLevel":10,"synced":true,"critical":true,"timeLimitSec":1200,"silver":0,"gold":0,"text":"One of our expeditions into the lunar nadir has come across an unusual gas emission, thought to be caused by a meteor impact. While the gas appears to be harmless in small amounts, the risks of inhaling it in large quantities remain unclear. We are currently working to remove the accumulated gas, but the high volume of the substance has caused a shortage of necessary equipment and gear, which we ask our artisans to deliver directly.","recipes":[36694],"objectives":[{"kind":"score","items":[],"bronzeScore":900,"specialAction":null,"specialActionCharges":0},{"kind":"deliver","items":[],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":517,"name":"Flamethrower Parts","job":1,"rank":"D","minLevel":10,"synced":true,"critical":true,"timeLimitSec":1200,"silver":0,"gold":0,"text":"A mutant species of cactus has been identified near the blooming beds in Weddingway's Bower─we suspect as a result of the sporing mist. It appears its spines are toxic, and workers have been deployed to the area to eradicate the cacti before they become thorns in our collective sides. They report shortages of equipment and fuel, so we request skilled artisans to prepare and deliver more supplies so that the burning can continue unabated.","recipes":[36691],"objectives":[{"kind":"score","items":[],"bronzeScore":900,"specialAction":null,"specialActionCharges":0},{"kind":"deliver","items":[],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":518,"name":"Spare Vacuum Tanks","job":2,"rank":"D","minLevel":10,"synced":true,"critical":true,"timeLimitSec":1200,"silver":0,"gold":0,"text":"We have detected a large eruption of aether at the rock slide located in the southern sector of the Cosmoor. Thankfully, the surface is stable and there is no danger of collapse, meaning that the aether can be harvested as a resource. Operations are already underway on-site, but the volume of aether greatly exceeds expectations, creating a need for additional tanks and parts. We ask that any available artisans deliver these supplies as quickly as possible.","recipes":[36695],"objectives":[{"kind":"score","items":[],"bronzeScore":900,"specialAction":null,"specialActionCharges":0},{"kind":"deliver","items":[],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":519,"name":"Vehicular Plating","job":2,"rank":"D","minLevel":10,"synced":true,"critical":true,"timeLimitSec":1200     if (s.iq >= 10 && ok(A.TrainedFinesse) && qg(A.TrainedFinesse) >= need) return A.TrainedFinesse;
    // Steady Hand: risk-free Daring/Hasty.
    if (s.exped && ok(A.DaringTouch) && (s.ssh > 0 || CS.successRate(A.DaringTouch, s) >= 85)) return A.DaringTouch;
    if (s.ssh > 0 && ok(A.HastyTouch) && s.iq < 10) return A.HastyTouch;
    // Durability: make sure the next quality actions can be paid for.

    if (!inCombo && (d <= 15 || (d <= 25 && s.manip === 0))) {
      if (usable(A.TrainedPerfection, s, st) && d > 5) {

      else if (s.manip === 0 && ok(A.Manipulation, 74)) return A.Manipulation;
      else if (d <= 15 && ok(A.MastersMend, 74)) return A.MastersMend;

      if (st.maxDurability - d >= 35 && ok(A.ImmaculateMend, 40)) return A.ImmaculateMend;

    if (good) {

      if (s.iq < 10 && ok(A.PreciseTouch)) return A.PreciseTouch;

    }

      if (s.inno === 0 && ok(A.Innovation, 40)) return A.Innovation;

        if (s.inno === 0 && ok(A.Innovation, 24)) return A.Innovation;
        if (ok(A.ByregotsBlessing)) return A.ByregotsBlessing;

      if (s.gs === 0 && ok(A.GreatStrides, 24)) return A.GreatStrides;
      if (s.iq >= 10 && ok(A.TrainedFinesse, finisherCp) && s.inno > 0) return A.TrainedFinesse;

    if (ctx.sshBudget > 0 && s.sshCharges > 0 && s.ssh === 0 && d >= 26 && s.iq <= 7 && usable(A.StellarSteadyHand, s, st))
      return A.StellarSteadyHand;
    if (s.wn === 0 && s.iq <= 4 && ok(A.WasteNotII, 200) && d <= st.maxDurability - 10 && st.maxDurability <= 70) return A.WasteNotII;
