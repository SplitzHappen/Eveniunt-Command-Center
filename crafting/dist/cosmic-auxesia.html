<title>Cosmic Solver – Auxesia</title>

<style>:root {
  --bg: #f4f5f7; --panel: #ffffff; --ink: #1b1f24; --muted: #5d6673; --line: #d9dde3;
  --accent: #2d5bd7; --accent-ink: #ffffff; --ok: #1f8a4c; --bad: #c0392b; --warn: #b7791f;
  --rec-bg: #10233f; --rec-ink: #ffffff; --chip: #eef1f5; --bar: #e3e7ec;
  --c-normal: #8a919c; --c-good: #d64545; --c-excellent: #b445d6; --c-poor: #555b63; --c-centered: #c9a000;
  --c-sturdy: #2f6fd6; --c-pliant: #2e9e5b; --c-malleable: #3b3fa8; --c-primed: #8a4fd6; --c-goodomen: #e07b39; --c-robust: #138a8a;
  --radius: 10px; --gap: 12px;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --panel: #181c22; --ink: #e8ebef; --muted: #9aa3ae; --line: #2b313a;
    --accent: #6d93ff; --accent-ink: #0b0e12; --chip: #232932; --bar: #262c35; --rec-bg: #1e3a66;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --panel: #181c22; --ink: #e8ebef; --muted: #9aa3ae; --line: #2b313a;
  --accent: #6d93ff; --accent-ink: #0b0e12; --chip: #232932; --bar: #262c35; --rec-bg: #1e3a66;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header.top { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
header.top h1 { font-size: 16px; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header.top .planet { color: var(--muted); font-weight: 400; }
main { max-width: 1180px; margin: 0 auto; padding: 12px 16px 40px; display: grid; gap: var(--gap); grid-template-columns: 1fr; }
@media (min-width: 900px) { main.crafting { grid-template-columns: 380px 1fr; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; min-width: 0; }
.card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
.card h2 .grow { flex: 1; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--chip); border-radius: 8px; padding: 7px 10px; min-height: 36px; }
button:hover { border-color: var(--accent); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.ghost { background: transparent; }
button.small { min-height: 28px; padding: 3px 8px; font-size: 13px; }
button[disabled] { opacity: .45; cursor: not-allowed; }
input[type=number], input[type=text], select { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-height: 36px; width: 100%; }
label.inline { display: inline-flex; align-items: center; gap: 6px; margin-right: 12px; white-space: nowrap; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
.field { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
.field input, .field select { color: var(--ink); font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border-radius: 999px; padding: 4px 10px; min-height: 30px; font-size: 13px; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip.on .muted { color: inherit; opacity: .85; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.warn { color: var(--warn); }
.bad { color: var(--bad); }
.ok { color: var(--ok); }
.missions { max-height: 300px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; margin-top: 8px; }
.mission { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; padding: 8px 10px; }
.mission:last-child { border-bottom: 0; }
.mission.on { background: var(--chip); box-shadow: inset 3px 0 0 var(--accent); }
.mission .t { font-weight: 600; }
.mission .m { font-size: 12px; color: var(--muted); }
.badge { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 6px; background: var(--chip); border: 1px solid var(--line); margin-right: 4px; color: var(--ink); }
.badge.x { border-color: var(--c-primed); }
.rec { background: var(--rec-bg); color: var(--rec-ink); border-radius: var(--radius); padding: 14px 16px; }
.rec .lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .75; }
.rec .act { font-size: clamp(26px, 6vw, 40px); font-weight: 750; line-height: 1.1; margin: 4px 0 6px; overflow-wrap: anywhere; }
.rec .why { font-size: 15px; opacity: .95; }
.rec .est { font-size: 12px; opacity: .8; margin-top: 6px; }
.rec.thinking .act { opacity: .55; }
.rec.done { background: #1f6f43; }
.rec.failed { background: #7d2a22; }
.report { margin-top: 10px; }
.report .q { font-size: 13px; color: var(--muted); margin: 6px 0 4px; }
.conds { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
.cond { min-height: 46px; font-weight: 600; border-width: 2px; position: relative; text-align: left; padding-left: 12px; }
.cond kbd { position: absolute; right: 6px; top: 4px; font-size: 10px; opacity: .65; font-family: inherit; }
.cond.likely { box-shadow: 0 0 0 2px var(--accent) inset; }
.cond.fail { border-style: dashed; }
.c-0 { border-color: var(--c-normal); } .c-1 { border-color: var(--c-good); } .c-2 { border-color: var(--c-excellent); }
.c-3 { border-color: var(--c-poor); } .c-4 { border-color: var(--c-centered); } .c-5 { border-color: var(--c-sturdy); }
.c-6 { border-color: var(--c-pliant); } .c-7 { border-color: var(--c-malleable); } .c-8 { border-color: var(--c-primed); }
.c-9 { border-color: var(--c-goodomen); } .c-10 { border-color: var(--c-robust); }
.condtag { display: inline-block; padding: 2px 8px; border-radius: 6px; border: 2px solid; font-weight: 600; }
.bars { display: grid; gap: 8px; }
.bar { position: relative; height: 22px; background: var(--bar); border-radius: 6px; overflow: hidden; }
.bar .fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); opacity: .85; }
.bar.q .fill { background: #c28a12; }
.bar.d .fill { background: #3a8f6a; }
.bar.cp .fill { background: #7a5cc4; }
.bar .txt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; font-size: 13px; font-weight: 600; color: var(--ink); mix-blend-mode: normal; }
.bar .tick { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); opacity: .55; }
.statgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px 12px; margin-top: 8px; font-size: 14px; }
.buffs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.buff { background: var(--chip); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; font-size: 13px; }
.controls { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.hist { max-height: 260px; overflow: auto; font-size: 13px; }
.hist ol { margin: 0; padding-left: 22px; }
.hist li { margin: 2px 0; }
.alts { font-size: 12px; margin-top: 6px; opacity: .85; }
dialog { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); color: var(--ink); padding: 14px; max-width: min(640px, 94vw); width: 100%; }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog h3 { margin: 0 0 10px; font-size: 16px; }
.note { font-size: 12px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 8px; margin: 8px 0; }
.toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 20; }
.hidden { display: none !important; }
details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.kbdhelp kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 12px; }
</style>
</head>

iotic relationships and environmental impacts on a smaller scale. Naturally, manufacturing the gardens will require sufficient time and resources, and all botanical contributions to this project are welcome as we deepen our understanding of Voyager society.","recipes":[37977],"objectives":[{"kind":"score","items":[],"bronzeScore":600,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1387,"name":"Habitation Furniture Renewal","job":0,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1000,"gold":1600,"text":"Many of our researchers upend their lives across the sea of stars and into new habitation modules each time we set course for a new destination. The wear and tear on their furnishings and belongings is inevitable after prolonged use, and many items that were brought in brand-new to Sinus Ardorum have seen better days upon their arrival to Auxesia. As it is our duty to ensure these dedicated workers have their creature comforts met and maintained, we ask all available artisans to aid us in the manufacture of new and improved furnishings.","recipes":[37978],"objectives":[{"kind":"craft","items":[{"name":"Habitat Bunk Bed","quantity":2}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":1388,"name":"Weatherproof Material Development II","job":0,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":880,"gold":1050,"text":"If you have spent a considerable amount of time on Auxesia, then you are doubtless familiar with the auroral flares that occur in its atmosphere. According to initiative skywatchers, these flares are not, in fact, natural─they are intentional phenomena, devised by the Voyagers for the acceleration of plant growth within the city. While the myriad colors and lights are a feast for the eyes, auroral flares may pose great risk to our delicate machinery. To counteract this, we intend to develop a unique variety of parasol that can shield these fragile instruments from the aurora's rays.","recipes":[37979,37980],"objectives":[{"kind":"craft","items":[{"name":"Flareproof Parasol","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1389,"name":"EX: Resilient Survey Equipment","job":0,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":800,"gold":1000,"text":"Due to Auxesia's verdant environs, the variety of supplies we consume varies greatly from our previous destinations. Sharp foliage damages uniforms and shoes, while the unique water places extra wear upon our fishing equipment. We proffer our hands out to those who can craft improved equipment with the star's natural features in mind, as we will require as many contributions as possible for the research teams' continued endeavors.","recipes":[37981],"objectives":[{"kind":"score","items":[],"bronzeScore":400,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":1390,"name":"EX: Superior Transport Supplies","job":0,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":800,"gold":1000,"text":"Preliminary tests have revealed that Auxesian plant life is especially susceptible to changes in humidity and temperature, and will wither away if not properly preserved. As a result, improvements to our freight transport systems will be necessary if we wish to ship harvested specimens safely to Etheirys. We petition the aid of deft and eager volunteers willing to enhance the freight units' capabilities and push our technology to the pinnacle of its potential. ","recipes":[37982],"objectives":[{"kind":"score","items":[],"bronzeScore":400,"specialAction":"StellarSteadyHand","specialActionCharges":1}]},{"id":1391,"name":"EX: Auxesian Fuel Development","job":0,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":800,"gold":1000,"text":"In a fortuitous development, we have discovered resin-rich fatwood resources on Auxesia, similar in quality to that of Oizys. When one considers the limited ceruleum we can transport from star to star, this discovery is a boon to all who yearn for a fuel supply closer to home. The key to combustible success, then, will be the creation of an accessible and environmentally friendly fuel with these resources, and we implore our contributors to lend their expertise to the development process. As this star is more...flammable than most, we plan to train users in the fuel's potential risks and inform them that it is meant primarily for short-term use.","recipes":[37983],"objectives":[{"kind":"craft","items":[{"name":"Processed Survey Fuel","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1392,"name":"EX+: Portable Weatherproof Supplies","job":0,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1800,"gold":2000,"text":"If you have spent a considerable amount of time on Auxesia, then you are doubtless familiar with the auroral flares that occur in its atmosphere. According to initiative skywatchers, these flares are not, in fact, natural─they are intentional phenomena, devised by the Voyagers for the acceleration of plant growth within the city. While the myriad colors and lights are a feast for the eyes, auroral flares may pose great risk to our delicate machinery. To counteract this, we intend to develop a unique variety of parasol that can shield these fragile instruments from the aurora's rays.","recipes":[37984],"objectives":[{"kind":"craft","items":[{"name":"Flareproof Compact Parasol","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1393,"name":"EX+: Purified Biofuel Development","job":0,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":980,"gold":1080,"text":"Our arsenal of initiative-developed equipment shares one inspiring quality─each and every invention has been ingeniously developed from locally sourced materials, no matter the star's environs. We intend to push these innovations to the limit here on resource-rich Auxesia by fashioning much-needed equipment from its flora, such as purified biofuel and specialized uniforms for researchers and explorers. Our staff encourages as many submissions as possible, as we would like to promptly deliver these new creations to all who require them.","recipes":[37985,37986],"objectives":[{"kind":"craft","items":[{"name":"Purified Biofuel","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1394,"name":"EX+: Voyager Resource Research","job":0,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":540,"silver":1800,"gold":2000,"text":"The flow of aether was of paramount importance in Voyager society, which prided itself on its sophisticated magicks. In fact, a scan of the city's core infrastructure has revealed intricate webs of catalysts with varying aetheric conductivity, including three-dimensional arcane geometries within some structures. To more thoroughly ascertain the ins and outs of this technology, the research team plans to build miniature versions of these structures for experimentation. They have requested all able procurers to supply us with the materials to accommodate their needs, such as resins and fibers.","recipes":[37987],"objectives":[{"kind":"score","items":[],"bronzeScore":1000,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":1395,"name":"Master: Heavy Machinery Fuel Refinement","job":0,"rank":"Master","minLevel":100,"synced":false,"critical":false,"timeLimitSec":300,"silver":0,"gold":0,"text":"We have received new blueprints from our research team, all drafted with a similar goal in mind─to utilize the wealth of knowledge and concepts we have devised over the course of this initiative. Within these drafts are plans for sustainable biofuel, climate-resistant cosmic suits, and lightweight suits for our pilots, among other flawless ideas. To those experts who are keen to break boundaries and see these dreams into reality with us, we seek your support and your expertise now more than ever.","recipes":[38198],"objectives":[{"kind":"score","items":[],"bronzeScore":1000,"specialAction":"MaterialMiracle","specialActionCharges":2},{"kind":"score","items":[],"bronzeScore":2500,"specialAction":"MaterialMiracle","specialActionCharges":2},{"kind":"score","items":[],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":1396,"name":"Master: Potent Alchemical Compound Development","job":0,"rank":"Master","minLevel":100,"synced":false,"critical":false,"timeLimitSec":240,"silver":0,"gold":0,"text":"We have received new blueprints from our research team, all drafted with a similar goal in mind─to utilize the wealth of knowledge and concepts we have devised over the course of this initiative. Within these drafts are plans for alchemical solutions to improve plant growth, high-durability suits for our pilots, and flexible-yet-lightweight suits for our higher-ranked individuals, among other flawless ideas. To those experts who are keen to break boundaries and see these dreams into reality with us, we seek your support and your expertise now more than ever.","recipes":[38199],"objectives":[{"kind":"score","items":[],"bronzeScore":1000,"specialAction":"StellarSteadyHand","specialActionCharges":4},{"kind":"score","items":[],"bronzeScore":2500,"specialAction":"StellarSteadyHand","specialActionCharges":4},{"kind":"score","items":[],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":4}]},{"id":1397,"name":"Master: Renewable Fuel Survey","job":0,"rank":"Master","minLevel":100,"synced":false,"critical":false,"timeLimitSec":420,"silver":0,"gold":0,"text":"We have received new blueprints from our research team, all drafted with a similar goal in mind─to utilize the wealth of knowledge and concepts we have devised over the course of this initiative. Within these drafts are plans for more efficient purified biofuel, powersuits with strengthened output capabilities, and high-quality admiral suits for celebratory purposes, among other flawless ideas. To those experts who are keen to break boundaries and see these dreams into reality with us, we seek your support and your expertise now more than ever.","recipes":[38200],"objectives":[{"kind":"score","items":[],"bronzeScore":2000,"specialAction":"MaterialMiracle","specialActionCharges":4},{"kind":"score","items":[],"bronzeScore":3500,"specialAction":"MaterialMiracle","specialActionCharges":4},{"kind":"score","items":[],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":4}]},{"id":1398,"name":"Multi-purpose Alloy Ingots","job":1,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"While we were not expecting the forest isles of Auxesia to yield minerals in significant quantities, preliminary investigations have happily confirmed the presence of a variety of metals suitable for producing alloys that meet the initiative's stringent standards. As part of our endeavor to increase self-sufficiency on the star, we call upon our capable artisans to prepare ingots on-site.","recipes":[37988],"objectives":[{"kind":"craft","items":[{"name":"Standard Auxesian Alloy Ingot","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1399,"name":"Aether Resistance Treatment (Bronze)","job":1,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Weather phenomena characterized by unusual aetheric turbulence have been observed on Auxesia, not least of all floracanes. These events appear to accelerate the deterioration of foreign metals, and the effect is worryingly pronounced in areas removed from the rainbow crystal. In light of this, we wish to treat metals for aether resistance prior to use─unglamorous work, but critical to our success nonetheless.","recipes":[37989],"objectives":[{"kind":"craft","items":[{"name":"Standard Treated Bronze Ingot","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1400,"name":"Heavy Machinery Components I","job":1,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"While we have been employing new machinery and equipment on Auxesia to great effect, a shortage of replacement parts is all it takes to throw a cosmic wrench in our productivity. To ensure that our work continues hoppingly, we seek to bolster our stockpiles with those components that are in demand at work sites. Your contributions underpin our ongoing exploratory progress, and we ask that you spare no effort.","recipes":[37990],"objectives":[{"kind":"craft","items":[{"name":"Heavy Machinery Alloy Plating","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1401,"name":"Urban Exploration Provisions","job":1,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"As the restoration of the city's systems progresses, the magic-based control of vegetation has shown improved capacity, and we expect it will soon effectively keep noxious species in check. Yet though such plants may cause harm, total eradication is not an option, for they are a part of the ecosystem. An appropriate degree of hands-on management is the key, to which end we seek to build up a store of forestry implements.","recipes":[37991],"objectives":[{"kind":"craft","items":[{"name":"Ruins Rivet","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1402,"name":"Multi-purpose Alloy Ingot Resupply","job":1,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"While we were not expecting the forest isles of Auxesia to yield minerals in significant quantities, preliminary investigations have happily confirmed the presence of a variety of metals suitable for producing alloys that meet the initiative's stringent standards. As part of our endeavor to increase self-sufficiency on the star, we call upon our capable artisans to prepare ingots on-site.","recipes":[37992],"objectives":[{"kind":"craft","items":[{"name":"Standard Auxesian Alloy Ingot","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1403,"name":"Aether Resistance Treatment (Silver)","job":1,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Weather phenomena characterized by unusual aetheric turbulence have been observed on Auxesia, not least of all floracanes. These events appear to accelerate the deterioration of foreign metals, and the effect is worryingly pronounced in areas removed from the rainbow crystal. In light of this, we wish to treat metals for aether resistance prior to use─unglamorous work, but critical to our success nonetheless.","recipes":[37993],"objectives":[{"kind":"craft","items":[{"name":"Standard Treated Silver Ingot","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1404,"name":"Heavy Machinery Components II","job":1,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1300,"gold":3000,"text":"While we have been employing new machinery and equipment on Auxesia to great effect, a shortage of replacement parts is all it takes to throw a cosmic wrench in our productivity. To ensure that our work continues hoppingly, we seek to bolster our stockpiles with those components that are in demand at work sites. Your contributions underpin our ongoing exploratory progress, and we ask that you spare no effort.","recipes":[37994],"objectives":[{"kind":"craft","items":[{"name":"Heavy Machinery Gear","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1405,"name":"Forestry Implements","job":1,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":700,"gold":1500,"text":"As the restoration of the city's systems progresses, the magic-based control of vegetation has shown improved capacity, and we expect it will soon effectively keep noxious species in check. Yet though such plants may cause harm, total eradication is not an option, for they are a part of the ecosystem. An appropriate degree of hands-on management is the key, to which end we seek to build up a store of forestry implements.","recipes":[37995,37996],"objectives":[{"kind":"craft","items":[{"name":"Standard Hand Axe","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1406,"name":"Improved Alloy Ingots","job":1,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1600,"gold":2400,"text":"While we were not expecting the forest isles of Auxesia to yield minerals in significant quantities, preliminary investigations have happily confirmed the presence of a variety of metals suitable for producing alloys that meet the initiative's stringent standards. As part of our endeavor to increase self-sufficiency on the star, we call upon our capable artisans to prepare ingots on-site.","recipes":[37997],"objectives":[{"kind":"craft","items":[{"name":"Standard Auxesian Alloy Ingot","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":1407,"name":"Aether Resistance Treatment (Gold)","job":1,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1600,"gold":2400,"text":"Weather phenomena characterized by unusual aetheric turbulence have been observed on Auxesia, not least of all floracanes. These events appear to accelerate the deterioration of foreign metals, and the effect is worryingly pronounced in areas removed from the rainbow crystal. In light of this, we wish to treat metals for aether resistance prior to use─unglamorous work, but critical to our success nonetheless.","recipes":[37998],"objectives":[{"kind":"craft","items":[{"name":"Standard Treated Gold Ingot","quantity":3}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":3}]},{"id":1408,"name":"Heavy Machinery Components III","job":1,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":2700,"gold":3000,"text":"While we have been employing new machinery and equipment on Auxesia to great effect, a shortage of replacement parts is all it takes to throw a cosmic wrench in our productivity. To ensure that our work continues hoppingly, we seek to bolster our stockpiles with those components that are in demand at work sites. Your contributions underpin our ongoing exploratory progress, and we ask that you spare no effort.","recipes":[37999],"objectives":[{"kind":"craft","items":[{"name":"Standard Vehicle Track Material","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":1409,"name":"Additional Forestry Implements","job":1,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1500,"text":"As the restoration of the city's systems progresses, the magic-based control of vegetation has shown improved capacity, and we expect it will soon effectively keep noxious species in check. Yet though such plants may cause harm, total eradication is not an option, for they are a part of the ecosystem. An appropriate degree of hands-on management is the key, to which end we seek to build up a store of forestry implements.","recipes":[38000,38001],"objectives":[{"kind":"craft","items":[{"name":"Survey Ruby Scythe","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1410,"name":"Additional Exploration Provisions","job":1,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1600,"gold":2100,"text":"While we have identified magical passageways in structures like the Sprouting Towerling, these routes appear to be traversable only by the Voyagers. If we are to reach the tower's upper sections, we must do so the old-fashioned way and erect scaffolding. As we did not ship in sufficient materials, however, we ask our artisans to produce the shortfall while bearing the star's unique environmental conditions in mind.","recipes":[38002,38003],"objectives":[{"kind":"craft","items":[{"name":"Exploration Steel Beam","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1411,"name":"Improved Alloy Ingot Resupply","job":1,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1600,"text":"While we were not expecting the forest isles of Auxesia to yield minerals in significant quantities, preliminary investigations have happily confirmed the presence of a variety of metals suitable for producing alloys that meet the initiative's stringent standards. As part of our endeavor to increase self-sufficiency on the star, we call upon our capable artisans to prepare ingots on-site.","recipes":[38004],"objectives":[{"kind":"craft","items":[{"name":"Standard Auxesian Alloy Ingot","quantity":2}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1412,"name":"Aether Resistance Treatment (Platinum)","job":1,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1600,"text":"Weather phenomena characterized by unusual aetheric turbulence have been observed on Auxesia, not least of all floracanes. These events appear to accelerate the deterioration of foreign metals, and the effect is worryingly pronounced in areas removed from the rainbow crystal. In light of this, we wish to treat metals for aether resistance prior to use─unglamorous work, but critical to our success nonetheless.","recipes":[38005],"objectives":[{"kind":"craft","items":[{"name":"Standard Treated Platinum Ingot","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1413,"name":"Advanced Forestry Equipment","job":1,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1400,"gold":2000,"text":"While we have been employing new machinery and equipment on Auxesia to great effect, a shortage of replacement parts is all it takes to throw a cosmic wrench in our productivity. To ensure that our work continues hoppingly, we seek to bolster our stockpiles with those components that are in demand at work sites. Your contributions underpin our ongoing exploratory progress, and we ask that you spare no effort.","recipes":[38006],"objectives":[{"kind":"craft","items":[{"name":"Survey Chainsaw","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1414,"name":"Forestry Supplies","job":1,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1400,"gold":2000,"text":"As the restoration of the city's systems progresses, the magic-based control of vegetation has shown improved capacity, and we expect it will soon effectively keep noxious species in check. Yet though such plants may cause harm, total eradication is not an option, for they are a part of the ecosystem. An appropriate degree of hands-on management is the key, to which end we seek to build up a store of forestry implements.","recipes":[38007],"objectives":[{"kind":"score","items":[],"bronzeScore":600,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1415,"name":"Aetheric Gauge Development I","job":1,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1000,"gold":1600,"text":"When investigating Voyager structures, it is critical to identify the invisible flow of aether, otherwise we risk inadvertently causing damage to ancient relics. To that end, we wish to develop a portable aetheric gauge which will be distributed to our researchers on the front lines of exploration. We would be duly grateful for contributions of components such as lenses, as well as the production of the instruments themselves.","recipes":[38008],"objectives":[{"kind":"craft","items":[{"name":"Survey Lens","quantity":2}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":1416,"name":"High-durability Heavy Machinery Parts","job":1,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":880,"gold":1050,"text":"Our newly deployed logging machina are powerful and effective at their tasks, but by the same token, they undergo extreme wear and require frequent, time-consuming servicing. This has resulted in low utilization rates, and the growing calls for harder-wearing components come as no surprise. We ask our artisans to employ their skills to produce durable replacement parts that can withstand rigorous use.","recipes":[38009,38010],"objectives":[{"kind":"craft","items":[{"name":"High-durability Heavy Machinery Part","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1417,"name":"EX: Superior Exploration Materials","job":1,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":800,"gold":1000,"text":"While we have identified magical passageways in structures like the Sprouting Towerling, these routes appear to be traversable only by the Voyagers. If we are to reach the tower's upper sections, we must do so the old-fashioned way and erect scaffolding. As we did not ship in sufficient materials, however, we ask our artisans to produce the shortfall while bearing the star's unique environmental conditions in mind.","recipes":[38011],"objectives":[{"kind":"score","items":[],"bronzeScore":400,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":1418,"name":"EX: High-durability Wire","job":1,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":800,"gold":1000,"text":"Due to the dramatic terrain of the exploration site, the winches fitted on our new machina are nothing short of indispensable for transporting equipment and other heavy items. However, Auxesia's unusual environment is extremely harsh on the metal of the cables, causing premature degradation. It would be a disaster if a cable were to snap at the wrong moment, and we wish to build up a stockpile so as to ensure timely servicing.","recipes":[38012],"objectives":[{"kind":"score","items":[],"bronzeScore":400,"specialAction":"StellarSteadyHand","specialActionCharges":1}]},{"id":1419,"name":"EX: Environmental Maintenance Equipment","job":1,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":800,"gold":1000,"text":"As we explore this lush planet, we must be mindful of our impact on the environment. The exhaust fumes emitted by ceruleum engines, for instance, may have an adverse effect on plant life. While lasting harm has yet to be observed, in order to minimize the risk, we have decided to introduce filtering exhaust systems. Their development will require great skill, but we have utmost confidence in our artisans.","recipes":[38013],"objectives":[{"kind":"craft","items":[{"name":"Exploration Exhaust Pipe","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1420,"name":"EX+: Voyager Relic Restoration","job":1,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1800,"gold":2000,"text":"The Voyagers left behind many of their vehicles throughout the city, notable among them the Timberdrone, a flying variety whose potential uses we are exploring. While the units appear to have been magically propelled, their inner construction is relatively simple, and it should be possible to restore them with our technology. In order to employ them in the initiative, we call upon our artisans to provide the specified components.","recipes":[38014],"objectives":[{"kind":"craft","items":[{"name":"Voyager Relic Restoration Component","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1421,"name":"EX+: Aetheric Gauge Development II","job":1,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":980,"gold":1080,"text":"When investigating Voyager structures, it is critical to identify the invisible flow of aether, otherwise we risk inadvertently causing damage to ancient relics. To that end, we wish to develop a portable aetheric gauge which will be distributed to our researchers on the front lines of exploration. We would be duly grateful for contributions of components such as lenses, as well as the production of the instruments themselves.","recipes":[38015,38016],"objectives":[{"kind":"craft","items":[{"name":"Survey Aetheric Magnifying Glass","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1422,"name":"EX+: Advanced Aetheric Gauge Development","job":1,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":540,"silver":1800,"gold":2000,"text":"As the restoration of the city's systems progresses, the flow of aether at the exploration site has become increasingly complex and stratified. Our researchers toil to shed light on its workings, but they are sorely shorthanded. We wish to lend them a helping paw by developing an advanced aetheric gauge that automatically takes readings. Such an instrument will not be easy to devise, and we are counting on our artisans to rise to the occasion.","recipes":[38017],"objectives":[{"kind":"score","items":[],"bronzeScore":1000,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":1423,"name":"Master: Boring Drill Upgrade","job":1,"rank":"Master","minLevel":100,"synced":false,"critical":false,"timeLimitSec":300,"silver":0,"gold":0,"text":"Our artisans need hardly be told that the quality of one's tools directly influences productivity. In view of this, we wish to upgrade our equipment based on user feedback, in the hope that it will lead to more efficient exploration. The task will demand great technical expertise, and we humbly ask that you contribute yours, drawing upon the sum of your experiences on the initiative as you carry out the enhancements.","recipes":[38201],"objectives":[{"kind":"score","items":[],"bronzeScore":1000,"specialAction":"MaterialMiracle","specialActionCharges":2},{"kind":"score","items":[],"bronzeScore":2500,"specialAction":"MaterialMiracle","specialActionCharges":2},{"kind":"score","items":[],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":1424,"name":"Master: Ruin Restoration Supplies","job":1,"rank":"Master","minLevel":100,"synced":false,"critical":false,"timeLimitSec":240,"silver":0,"gold":0,"text":"Voyager structures often feature oversized resin glass windows, and our analysis has revealed that they amplify the light waves that plants require for growth. However, the passage of time has seen many a window frame fall into disrepair, and this is where our artisans come in. We ask that you not only restore the windows, but reflect upon the artistry of the Voyagers as you bring your skills to bear.","recipes":[38202],"objectives":[{"kind":"score","items":[],"bronzeScore":1000,"specialAction":"StellarSteadyHand","specialActionCharges":4},{"kind":"score","items":[],"bronzeScore":2500,"specialAction":"StellarSteadyHand","specialActionCharges":4},{"kind":"score","items":[],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":4}]},{"id":1425,"name":"Master: Core Mechanism Structure Sample","job":1,"rank":"Master","minLevel":100,"synced":false,"critical":false,"timeLimitSec":420,"silver":0,"gold":0,"text":"In coming to the Voyagers' home planet, we have enhanced our understanding of their civilization in leaps and bounds. Among other things, we are now very close to unraveling the secrets of the various implements we discovered on Oizys. Drawing upon our latest findings, we ask you to produce replicas of these relics. Your meticulous craftsmanship will afford us greater insights into Voyager civilization.","recipes":[38203],"objectives":[{"kind":"score","items":[],"bronzeScore":2000,"specialAction":"MaterialMiracle","specialActionCharges":4},{"kind":"score","items":[],"bronzeScore":3500,"specialAction":"MaterialMiracle","specialActionCharges":4},{"kind":"score","items":[],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":4}]},{"id":1426,"name":"Multi-purpose Alloy Ingots","job":2,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"While we were not expecting the forest isles of Auxesia to yield minerals in significant quantities, preliminary investigations have happily confirmed the presence of a variety of metals suitable for producing alloys that meet the initiative's stringent standards. As part of our endeavor to increase self-sufficiency on the star, we call upon our capable artisans to prepare ingots on-site.","recipes":[38018],"objectives":[{"kind":"craft","items":[{"name":"Standard Auxesian Alloy Ingot","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1427,"name":"Aether Resistance Treatment (Bronze)","job":2,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Weather phenomena characterized by unusual aetheric turbulence have been observed on Auxesia, not least of all floracanes. These events appear to accelerate the deterioration of foreign metals, and the effect is worryingly pronounced in areas removed from the rainbow crystal. In light of this, we wish to treat metals for aether resistance prior to use─unglamorous work, but critical to our success nonetheless.","recipes":[38019],"objectives":[{"kind":"craft","items":[{"name":"Standard Treated Bronze Ingot","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1428,"name":"Heavy Machinery Components I","job":2,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"While we have been employing new machinery and equipment on Auxesia to great effect, a shortage of replacement parts is all it takes to throw a cosmic wrench in our productivity. To ensure that our work continues hoppingly, we seek to bolster our stockpiles with those components that are in demand at work sites. Your contributions underpin our ongoing exploratory progress, and we ask that you spare no effort.","recipes":[38020],"objectives":[{"kind":"craft","items":[{"name":"Heavy Machinery Alloy Plating","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1429,"name":"Urban Exploration Provisions","job":2,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"As the restoration of the city's systems progresses, the magic-based control of vegetation has shown improved capacity, and we expect it will soon effectively keep noxious species in check. Yet though such plants may cause harm, total eradication is not an option, for they are a part of the ecosystem. An appropriate degree of hands-on management is the key, to which end we seek to build up a store of forestry implements.","recipes":[38021],"objectives":[{"kind":"craft","items":[{"name":"Ruins Rivet","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1430,"name":"Multi-purpose Alloy Ingot Resupply","job":2,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"While we were not expecting the forest isles of Auxesia to yield minerals in significant quantities, preliminary investigations have happily confirmed the presence of a variety of metals suitable for producing alloys that meet the initiative's stri ated Gold Ingot","quantity":3}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":3}]},{"id":1436,"name":"Heavy Machinery Components III","job":2,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":2700,"gold":3000,"text":"While we have been employing new machinery and equipment on Auxesia to great effect, a shortage of replacement parts is all it takes to throw a cosmic wrench in our productivity. To ensure that our work continues hoppingly, we seek to bolster our stockpiles with those components that are in demand at work sites. Your contributions underpin our ongoing exploratory progress, and we ask that you spare no effort.","recipes":[38029],"objectives":[{"kind":"craft","items":[{"name":"Standard Vehicle Track Material","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":1437,"name":"Additional Forestry Implements","job":2,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1500,"text":"As the restoration of the city's systems progresses, the magic-based control of vegetation has shown improved capacity, and we expect it will soon effectively keep noxious species in check. Yet though such plants may cause harm, total eradication is not an option, for they are a part of the ecosystem. An appropriate degree of hands-on management is the key, to which end we seek to build up a store of forestry implements.","recipes":[38030,38031],"objectives":[{"kind":"craft","items":[{"name":"Survey Ruby Scythe","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1438,"name":"Additional Exploration Provisions","job":2,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1600,"gold":2100,"text":"While we have identified magical passageways in structures like the Sprouting Towerling, these routes appear to be traversable only by the Voyagers. If we are to reach the tower's upper sections, we must do so the old-fashioned way and erect scaffolding. As we did not ship in sufficient materials, however, we ask our artisans to produce the shortfall while bearing the star's unique environmental conditions in mind.","recipes":[38032,38033],"objectives":[{"kind":"craft","items":[{"name":"Exploration Steel Beam","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1439,"name":"Improved Alloy Ingot Resupply","job":2,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1600,"text":"While we were not expecting the forest isles of Auxesia to yield minerals in significant quantities, preliminary investigations have happily confirmed the presence of a variety of metals suitable for producing alloys that meet the initiative's stringent standards. As part of our endeavor to increase self-sufficiency on the star, we call upon our capable artisans to prepare ingots on-site.","recipes":[38034],"objectives":[{"kind":"craft","items":[{"name":"Standard Auxesian Alloy Ingot","quantity":2}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1440,"name":"Aether Resistance Treatment (Platinum)","job":2,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1600,"text":"Weather phenomena characterized by unusual aetheric turbulence have been observed on Auxesia, not least of all floracanes. These events appear to accelerate the deterioration of foreign metals, and the effect is worryingly pronounced in areas removed from the rainbow crystal. In light of this, we wish to treat metals for aether resistance prior to use─unglamorous work, but critical to our success nonetheless.","recipes":[38035],"objectives":[{"kind":"craft","items":[{"name":"Standard Treated Platinum Ingot","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1441,"name":"Advanced Fores as the production of the instruments themselves.","recipes":[38038],"objectives":[{"kind":"craft","items":[{"name":"Survey Lens","quantity":2}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":1444,"name":"High-durability Heavy Machinery Parts","job":2,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":880,"gold":1050,"text":"Our newly deployed logging machina are powerful and effective at their tasks, but by the same token, they undergo extreme wear and require frequent, time-consuming servicing. This has resulted in low utilization rates, and the growing calls for harder-wearing components come as no surprise. We ask our artisans to employ their skills to produce durable replacement parts that can withstand rigorous use.","recipes":[38039,38040],"objectives":[{"kind":"craft","items":[{"name":"High-durability Heavy Machinery Part","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1445,"name":"EX: Superior Exploration Materials","job":2,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":800,"gold":1000,"text":"While we have identified magical passageways in structures like the Sprouting Towerling, these routes appear to be traversable only by the Voyagers. If we are to reach the tower's upper sections, we must do so the old-fashioned way and erect scaffolding. As we did not ship in sufficient materials, however, we ask our artisans to produce the shortfall while bearing the star's unique environmental conditions in mind.","recipes":[38041],"objectives":[{"kind":"score","items":[],"bronzeScore":400,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":1446,"name":"EX: High-durability Wire","job":2,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":800,"gold":1000,"text":"Due to the dramatic terrain of the exploration site, the winches fitted on our new machina are nothing short of indispensable for transporting equipment and other heavy items. However, Auxesia's unusual environment is extremely harsh on the metal of the cables, causing premature degradation. It would be a disaster if a cable were to snap at the wrong moment, and we wish to build up a stockpile so as to ensure timely servicing.","recipes":[38042],"objectives":[{"kind":"score","items":[],"bronzeScore":400,"specialAction":"StellarSteadyHand","specialActionCharges":1}]},{"id":1447,"name":"EX: Environmental Maintenance Equipment","job":2,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":800,"gold":1000,"text":"As we explore this lush planet, we must be mindful of our impact on the environment. The exhaust fumes emitted by ceruleum engines, for instance, may have an adverse effect on plant life. While lasting harm has yet to be observed, in order to minimize the risk, we have decided to introduce filtering exhaust systems. Their development will require great skill, but we have utmost confidence in our artisans.","recipes":[38043],"objectives":[{"kind":"craft","items":[{"name":"Exploration Exhaust Pipe","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1448,"name":"EX+: Voyager Relic Restoration","job":2,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1800,"gold":2000,"text":"The Voyagers left behind many of their vehicles throughout the city, notable among them the Timberdrone, a flying variety whose potential uses we are exploring. While the units appear to have been magically propelled, their inner construction is relatively simple, and it should be possible to restore them with our technology. In order to employ them in the initiative, we call upon our artisans to provide the specified components.","recipes":[38044],"objectives":[{"kind":"craft","items":[{"name":"Voyager Relic Restoration Component","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1449,"name":"EX+: Aetheric Gauge Development II","job":2,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":980,"gold":1080,"text":"When investigating Voyager structures, it is critical to identify the invisible flow of aether, otherwise we risk inadvertently causing damage to ancient relics. To that end, we wish to develop a portable aetheric gauge which will be distributed to our researchers on the front lines of exploration. We would be duly grateful for contributions of components such as lenses, as well as the production of the instruments themselves.","recipes":[38045,38046],"objectives":[{"kind":"craft","items":[{"name":"Survey Aetheric Magnifying Glass","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1450,"name":"EX+: Advanced Aetheric Gauge Development","job":2,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":540,"silver":1800,"gold":2000,"text":"As the restoration of the city's systems progresses, the flow of aether at the exploration site has become increasingly complex and stratified. Our researchers toil to shed light on its workings, but they are sorely shorthanded. We wish to lend them a helping paw by developing an advanced aetheric gauge that automatically takes readings. Such an instrument will not be easy to devise, and we are counting on our artisans to rise to the occasion.","recipes":[38047],"objectives":[{"kind":"score","items":[],"bronzeScore":1000,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":1451,"name":"Master: Sublimator Diffuser Upgrade","job":2,"rank":"Master","minLevel":100,"synced":false,"critical":false,"timeLimitSec":300,"silver":0,"gold":0,"text":"Our artisans need hardly be told that the quality of one's tools directly influences productivity. In view of this, we wish to upgrade our equipment based on user feedback, in the hope that it will lead to more efficient ex ively keep noxious species in check. Yet though such plants may cause harm, total eradication is not an option, for they are a part of the ecosystem. An appropriate degree of hands-on management is the key, to which end we seek to build up a store of forestry implements.","recipes":[38055,38056],"objectives":[{"kind":"craft","items":[{"name":"Standard Hand Axe","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1462,"name":"Improved Alloy Ingots","job":3,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1600,"gold":2400,"text":"While we were not expecting the forest isles of Auxesia to yield minerals in significant quantities, preliminary investigations have happily confirmed the presence of a variety of metals suitable for producing alloys that meet the initiative's stringent standards. As part of our endeavor to increase self-sufficiency on the star, we call upon our capable artisans to prepare ingots on-site.","recipes":[38057],"objectives":[{"kind":"craft","items":[{"name":"Standard Auxesian Alloy Ingot","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":1463,"name":"Aether Resistance Treatment (Gold)","job":3,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1600,"gold":2400,"text":"Weather phenomena characterized by unusual aetheric turbulence have been observed on Auxesia, not least of all floracanes. These events appear to accelerate the deterioration of foreign metals, and the effect is worryingly pronounced in areas removed from the rainbow crystal. In light of this, we wish to treat metals for aether resistance prior to use─unglamorous work, but critical to our success nonetheless.","recipes":[38058],"objectives":[{"kind":"craft","items":[{"name":"Standard Treated Gold Ingot","quantity":3}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":3}]},{"id":1464,"name":"Heavy Machinery Components III","job":3,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":2700,"gold":3000,"text":"While we have been employing new machinery and equipment on Auxesia to great effect, a shortage of replacement parts is all it takes to throw a cosmic wrench in our productivity. To ensure that our work continues hoppingly, we seek to bolster our stockpiles with those components that are in demand at work sites. Your contributions underpin our ongoing exploratory progress, and we ask that you spare no effort.","recipes":[38059],"objectives":[{"kind":"craft","items":[{"name":"Standard Vehicle Track Material","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":1465,"name":"Additional Forestry Implements","job":3,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1500,"text":"As the restoration of the city's systems progresses, the magic-based control of vegetation has shown improved capacity, and we expect it will soon effectively keep noxious species in check. Yet though such plants may cause harm, total eradication is not an option, for they are a part of the ecosystem. An appropriate degree of hands-on management is the key, to which end we seek to build up a store of forestry implements.","recipes":[38060,38061],"objectives":[{"kind":"craft","items":[{"name":"Survey Ruby Scythe","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1466,"name":"Additional Exploration Provisions","job":3,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1600,"gold":2100,"text":"While we have identified magical passageways in structures like the Sprouting Towerling, these routes appear to be traversable only by the Voyagers. If we are to reach the tower's upper sections, we must do so the old-fashioned way and erect scaffolding. As we did not ship in sufficient materials, however, we ask our artisans to produce the shortfall while bearing the star's unique environmental conditions in mind.","recipes":[38062,38063],"objectives":[{"kind":"craft","items":[{"name":"Exploration Steel Beam","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1467,"name":"Improved Alloy Ingot Resupply","job":3,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1600,"text":"While we were not expecting the forest isles of Auxesia to yield minerals in significant quantities, preliminary investigations have happily confirmed the presence of a variety of metals suitable for producing alloys that meet the initiative's stringent standards. As part of our endeavor to increase self-sufficiency on the star, we call upon our capable artisans to prepare ingots on-site.","recipes":[38064],"objectives":[{"kind":"craft","items":[{"name":"Standard Auxesian Alloy Ingot","quantity":2}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1468,"name":"Aether Resistance Treatment (Platinum)","job":3,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1600,"text":"Weather phenomena characterized by unusual aetheric turbulence have been observed on Auxesia, not least of all floracanes. These events appear to accelerate the deterioration of foreign metals, and the effect is worryingly pronounced in areas removed from the rainbow crystal. In light of this, we wish to treat metals for aether resistance prior to use─unglamorous work, but critical to our success nonetheless.","recipes":[38065],"objectives":[{"kind":"craft","items":[{"name":"Standard Treated Platinum Ingot","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1469,"name":"Advanced Forestry Equipment","job":3,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1400,"gold":2000,"text":"While we have been employing new machinery and equipment on Auxesia to great effect, a shortage of replacement parts is all it takes to throw a cosmic wrench in our productivity. To ensure that our work continues hoppingly, we seek to bolster our stockpiles with those components that are in demand at work sites. Your contributions underpin our ongoing exploratory progress, and we ask that you spare no effort.","recipes":[38066],"objectives":[{"kind":"craft","items":[{"name":"Survey Chainsaw","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1470,"name":"Forestry Supplies","job":3,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1400,"gold":2000,"text":"As the restoration of the city's systems progresses, the magic-based control of vegetation has shown improved capacity, and we expect it will soon effectively keep noxious species in check. Yet though such plants may cause harm, total eradication is not an option, for they are a part of the ecosystem. An appropriate degree of hands-on management is the key, to which end we seek to build up a store of forestry implements.","recipes":[38067],"objectives":[{"kind":"score","items":[],"bronzeScore":600,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1471,"name":"Aetheric Gauge Development I","job":3,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1000,"gold":1600,"text":"When investigating Voyager structures, it is critical to identify the invisible flow of aether, otherwise we risk inadvertently causing damage to ancient relics. To that end, we wish to develop a portable aetheric gauge which will be distributed to our researchers on the front lines of exploration. We would be duly grateful for contributions of components such as lenses, as well as the production of the instruments themselves.","recipes":[38068],"objectives":[{"kind":"craft","items":[{"name":"Survey Lens","quantity":2}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":1472,"name":"High-durability Heavy Machinery Parts","job":3,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":880,"gold":1050,"text":"Our newly deployed logging machina are powerful and effective at their tasks, but by the same token, they undergo extreme wear and require frequent, time-consuming servicing. This has resulted in low utilization rates, and the growing calls for harder-wearing components come as no surprise. We ask our artisans to employ their skills to produce durable replacement parts that can withstand rigorous use.","recipes":[38069,38070],"objectives":[{"kind":"craft","items":[{"name":"High-durability Heavy Machinery Part","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1473,"name":"EX: Superior Exploration Materials","job":3,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":800,"gold":1000,"text":"While we have identified magical passageways in structures like the Sprouting Towerling, these routes appear to be traversable only by the Voyagers. If we are to reach the tower's upper sections, we must do so the old-fashioned way and erect scaffolding. As we did not ship in sufficient materials, however, we ask our artisans to produce the shortfall while bearing the star's unique environmental conditions in mind.","recipes":[38071],"objectives":[{"kind":"score","items":[],"bronzeScore":400,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":1474,"name":"EX: High-durability Wire","job":3,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":800,"gold":1000,"text":"Due to the dramatic terrain of the exploration site, the winches fitted on our new machina are nothing short of indispensable for transporting equipment and other heavy items. However, Auxesia's unusual environment is extremely harsh on the metal of the cables, causing premature degradation. It would be a disaster if a cable were to snap at the wrong moment, and we wish to build up a stockpile so as to ensure timely servicing.","recipes":[38072],"objectives":[{"kind":"score","items":[],"bronzeScore":400,"specialAction":"StellarSteadyHand","specialActionCharges":1}]},{"id":1475,"name":"EX: Environmental Maintenance Equipment","job":3,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":800,"gold":1000,"text":"As we explore this lush planet, we must be mindful of our impact on the environment. The exhaust fumes emitted by ceruleum engines, for instance, may have an adverse effect on plant life. While lasting harm has yet to be observed, in order to minimize the risk, we have decided to introduce filtering exhaust systems. Their development will require great skill, but we have utmost confidence in our artisans.","recipes":[38073],"objectives":[{"kind":"craft","items":[{"name":"Exploration Exhaust Pipe","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1476,"name":"EX+: Voyager Relic Restoration","job":3,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1800,"gold":2000,"text":"The Voyagers left behind many of their vehicles throughout the city, notable among them the Timberdrone, a flying variety whose potential uses we are exploring. While the units appear to have been magically propelled, their inner construction is relatively simple, and it should be possible to restore them with our technology. In order to employ them in the initiative, we call upon our artisans to provide the specified components.","recipes":[38074],"objectives":[{"kind":"craft","items":[{"name":"Voyager Relic Restoration Component","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1477,"name":"EX+: Aetheric Gauge Development II","job":3,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":980,"gold":1080,"text":"When investigating Voyager structures, it is critical to identify the invisible flow of aether, otherwise we risk inadvertently causing damage to ancient relics. To that end, we wish to develop a portable aetheric gauge which will be distributed to our researchers on the front lines of exploration. We would be duly grateful for contributions of components such as lenses, as well as the production of the instruments themselves.","recipes":[38075,38076],"objectives":[{"kind":"craft","items":[{"name":"Survey Aetheric Magnifying Glass","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1478,"name":"EX+: Advanced Aetheric Gauge Development","job":3,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":540,"silver":1800,"gold":2000,"text":"As the restoration of the city's systems progresses, the flow of aether at the exploration site has become increasingly complex and stratified. Our researchers toil to shed light on its workings, but they are sorely shorthanded. We wish to lend them a helping paw by developing an advanced aetheric gauge that automatically takes readings. Such an instrument will not be easy to devise, and we are counting on our artisans to rise to the occasion.","recipes":[38077],"objectives":[{"kind":"score","items":[],"bronzeScore":1000,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":1479,"name":"Master: Welder Upgrade","job":3,"rank":"Master","minLevel":100,"synced":false,"critical":false,"timeLimitSec":300,"silver":0,"gold":0,"text":"Our artisans need hardly be told that the quality of one's tools directly influences productivity. In view of this, we wish to upgrade our equipment based on user feedback, in the hope that it will lead to more efficient exploration. The task will demand great technical expertise, and we humbly ask that you contribute yours, drawing upon the sum of your experiences on the initiative as you carry out the enhancements.","recipes":[38207],"objectives":[{"kind":"score","items":[],"bronzeScore":1000,"specialAction":"MaterialMiracle","specialActionCharges":2},{"kind":"score","items":[],"bronzeScore":2500,"specialAction":"MaterialMiracle","specialActionCharges":2},{"kind":"score","items":[],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":1480,"name":"Master: Ruin Restoration Supplies","job":3,"rank":"Master","minLevel":100,"synced":false,"critical":false,"timeLimitSec":240,"silver":0,"gold":0,"text":"Voyager structures often feature oversized resin glass windows, and our analysis has revealed that they amplify the light waves that plants require for growth. However, the passage of time has seen many a window frame fall into disrepair, and this is where our artisans come in. We ask that you not only restore the windows, but reflect upon the artistry of the Voyagers as you bring your skills to bear.","recipes":[38208],"objectives":[{"kind":"score","items":[],"bronzeScore":1000,"specialAction":"StellarSteadyHand","specialActionCharges":4},{"kind":"score","items":[],"bronzeScore":2500,"specialAction":"StellarSteadyHand","specialActionCharges":4},{"kind":"score","items":[],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":4}]},{"id":1481,"name":"Master: Voyager Terminal Reproduction","job":3,"rank":"Master","minLevel":100,"synced":false,"critical":false,"timeLimitSec":420,"silver":0,"gold":0,"text":"In coming to the Voyagers' home planet, we have enhanced our understanding of their civilization in leaps and bounds. Among other things, we are now very close to unraveling the secrets of the various implements we discovered on Oizys. Drawing upon our latest findings, we ask you to produce replicas of these relics. Your meticulous craftsmanship will afford us greater insights into Voyager civilization.","recipes":[38209],"objectives":[{"kind":"score","items":[],"bronzeScore":2000,"specialAction":"MaterialMiracle","specialActionCharges":4},{"kind":"score","items":[],"bronzeScore":3500,"specialAction":"MaterialMiracle","specialActionCharges":4},{"kind":"score","items":[],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":4}]},{"id":1482,"name":"Multi-purpose Rope","job":4,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Auxesia boasts an abundance of unique flora─each and every species an invaluable resource. Some of the star's native plant fibers, for example, can be woven into highly sought-after ropes. However, before we can distribute these products, the initiative must establish safety standards to prevent potential injury. In order to meet demand and decide upon said standards, we require a surplus of quality handcrafted ropes based on those manufactured at our previous destinations.","recipes":[38078],"objectives":[{"kind":"craft","items":[{"name":"Standard Reinforced Rope","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1483,"name":"Reinforced Construction Materials","job":4,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Though ages have passed since the Voyagers' disappearance from their city, their architecture remains flawless and free of weathering. We believe our predecessors may have applied a magicked treatment on the materials used in these structures─one that blends hardier resources like metal and glass into their lumber. Our researchers are keen to emulate these feats of engineering, and beseech all able artisans to submit their own experimental samples based on our findings.","recipes":[38079],"objectives":[{"kind":"craft","items":[{"name":"Standard Reinforced Fiber","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1484,"name":"Ruin Restoration Supplies","job":4,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Aether circulation was once viewed with great importance in the Voyagers' city. As such, we have utilized aetheric stimulants to quicken our own restoration efforts across the region. Alas, these stimulants have one drawback: they are quickly washed away by the star's natural humidity. To counter this, we mean to employ a resin-based substitute with similar properties, but spreading it throughout the city regularly will require a stable supply from our contributors.","recipes":[38080],"objectives":[{"kind":"craft","items":[{"name":"Hyperconductive Survey Resin","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1485,"name":"Transport Supply Samples I","job":4,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Preliminary tests have revealed that Auxesian plant life is especially susceptible to changes in humidity and temperature, and will wither away if not properly preserved. As a result, improvements to our freight transport systems will be necessary if we wish to ship harvested specimens safely to Etheirys. We petition the aid of deft and eager volunteers willing to enhance the freight units' capabilities and push our technology to the pinnacle of its potential. ","recipes":[38081],"objectives":[{"kind":"craft","items":[{"name":"Superior Freight Component","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1486,"name":"Additional Multi-purpose Rope","job":4,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Auxesia boasts an abundance of unique flora─each and every species an invaluable resource. Some of the star's native plant fibers, for example, can be woven into highly sought-after ropes. However, before we can distribute these products, the initiative must establish safety standards to prevent potential injury. In order to meet demand and decide upon said standards, we require a surplus of quality handcrafted ropes based on those manufactured at our previous destinations.","recipes":[38082],"objectives":[{"kind":"craft","items":[{"name":"Standard Reinforced Rope","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1487,"name":"Reinforced Material Research","job":4,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Though ages have passed since the Voyagers' disappearance from their city, their architecture remains flawless and free of weathering. We believe our predecessors may have applied a magicked treatment on the materials used in these structures─one that blends hardier resources like metal and glass into their lumber. Our researchers are keen to emulate these feats of engineering, and beseech all able artisans to submit their own experimental samples based on our findings.","recipes":[38083],"objectives":[{"kind":"craft","items":[{"name":"Standard Reinforced Fiber","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1488,"name":"Additional Restoration Supplies","job":4,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1300,"gold":3000,"text":"Aether circulation was once viewed with great importance in the Voyagers' city. As such, we have utilized aetheric stimulants to quicken our own restoration efforts across the region. Alas, these stimulants have one drawback: they are quickly washed away by the star's natural humidity. To counter this, we mean to employ a resin-based substitute with similar properties, but spreading it throughout the city regularly will require a stable supply from our contributors.","recipes":[38084],"objectives":[{"kind":"craft","items":[{"name":"Hyperconductive Survey Resin","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1489,"name":"Transport Supply
