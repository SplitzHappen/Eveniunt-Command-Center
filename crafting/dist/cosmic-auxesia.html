 structures─one that blends hardier resources like metal and glass into their lumber. Our researchers are keen to emulate these feats of engineering, and beseech all able artisans to submit their own experimental samples based on our findings.","recipes":[38088],"objectives":[{"kind":"craft","items":[{"name":"Standard Reinforced Fiber","quantity":3}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":3}]},{"id":1492,"name":"Advanced Restoration Supplies","job":4,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":2700,"gold":3000,"text":"Aether circulation was once viewed with great importance in the Voyagers' city. As such, we have utilized aetheric stimulants to quicken our own restoration efforts across the region. Alas, these stimulants have one drawback: they are quickly washed away by the star's natural humidity. To counter this, we mean to employ a resin-based substitute with similar properties, but spreading it throughout the city regularly will require a stable supply from our contributors.","recipes":[38089],"objectives":[{"kind":"craft","items":[{"name":"Hyperconductive Survey Resin","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":1493,"name":"Transport Supply Overhaul","job":4,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1500,"text":"Preliminary tests have revealed that Auxesian plant life is especially susceptible to changes in humidity and temperature, and will wither away if not properly preserved. As a result, improvements to our freight transport systems will be necessary if we wish to ship harvested specimens safely to Etheirys. We petition the aid of deft and eager volunteers willing to enhance the freight units' capabilities and push our technology to the pinnacle of its potential. ","recipes":[38090,38091],"objectives":[{"kind":"craft","items":[{"name":"Superior Freight Component","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1494,"name":"Weatherproof Material Development I","job":4,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1600,"gold":2100,"text":"If you have spent a considerable amount of time on Auxesia, then you are doubtless familiar with the auroral flares that occur in its atmosphere. According to initiative skywatchers, these flares are not, in fact, natural─they are intentional phenomena, devised by the Voyagers for the acceleration of plant growth within the city. While the myriad colors and lights are a feast for the eyes, auroral flares may pose great risk to our delicate machinery. To counteract this, we intend to develop a unique variety of parasol that can shield these fragile instruments from the aurora's rays.","recipes":[38092,38093],"objectives":[{"kind":"craft","items":[{"name":"Flareproof Parasol","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1495,"name":"Additional Enhanced Rope","job":4,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1600,"text":"Auxesia boasts an abundance of unique flora─each and every species an invaluable resource. Some of the star's native plant fibers, for example, can be woven into highly sought-after ropes. However, before we can distribute these products, the initiative must establish safety standards to prevent potential injury. In order to meet demand and decide upon said standards, we require a surplus of quality handcrafted ropes based on those manufactured at our previous destinations.","recipes":[38094],"objectives":[{"kind":"craft","items":[{"name":"Standard Reinforced Rope","quantity":2}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1496,"name":"Reinforced Construction Material Replication","job":4,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1600,"text":"Though ages have passed since the Voyagers' disappearance from their city, their architecture remains flawless and free of weathering. We believe our predecessors may have applied a magicked treatment on the materials used in these structures─one that blends hardier resources like metal and glass into their lumber. Our researchers are keen to emulate these feats of engineering, and beseech all able artisans to submit their own experimental samples based on our findings.","recipes":[38095],"objectives":[{"kind":"craft","items":[{"name":"Standard Reinforced Fiber","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1497,"name":"Alchemical Compound Development","job":4,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1400,"gold":2000,"text":"Aether circulation was once viewed with great importance in the Voyagers' city. As such, we have utilized aetheric stimulants to quicken our own restoration efforts across the region. Alas, these stimulants have one drawback: they are quickly washed away by the star's natural humidity. To counter this, we mean to employ a resin-based substitute with similar properties, but spreading it throughout the city regularly will require a stable supply from our contributors.","recipes":[38096],"objectives":[{"kind":"craft","items":[{"name":"Survey Formula Compounds","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1498,"name":"Botanic Supplies","job":4,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1400,"gold":2000,"text":"A sweeping study of the region's flora has revealed the possibility that the city's diverse plant life was, in fact, systematically organized in every district. In pursuit of more concrete answers, the research team has opted to assemble miniature gardens, that they might study certain species' symbiotic relationships and environmental impacts on a smaller scale. Naturally, manufacturing the gardens will require sufficient time and resources, and all botanical contributions to this project are welcome as we deepen our understanding of Voyager society.","recipes":[38097],"objectives":[{"kind":"score","items":[],"bronzeScore":600,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1499,"name":"Habitation Furniture Renewal","job":4,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1000,"gold":1600,"text":"Many of our researchers upend their lives across the sea of stars and into new habitation modules each time we set course for a new destination. The wear and tear on their furnishings and belongings is inevitable after prolonged use, and many items that were brought in brand-new to Sinus Ardorum have seen better days upon their arrival to Auxesia. As it is our duty to ensure these dedicated workers have their creature comforts met and maintained, we ask all available artisans to aid us in the manufacture of new and improved furnishings.","recipes":[38098],"objectives":[{"kind":"craft","items":[{"name":"Habitat Sofa","quantity":2}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":1500,"name":"Weatherproof Material Development II","job":4,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":880,"gold":1050,"text":"If you have spent a considerable amount of time on Auxesia, then you are doubtless familiar with the auroral flares that occur in its atmosphere. According to initiative skywatchers, these flares are not, in fact, natural─they are intentional phenomena, devised by the Voyagers for the acceleration of plant growth within the city. While the myriad colors and lights are a feast for the eyes, auroral flares may pose great risk to our delicate machinery. To counteract this, we intend to develop a unique variety of parasol that can shield these fragile instruments from the aurora's rays.","recipes":[38099,38100],"objectives":[{"kind":"craft","items":[{"name":"Flareproof Parasol","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1501,"name":"EX: Resilient Survey Equipment","job":4,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":800,"gold":1000,"text":"Due to Auxesia's verdant environs, the variety of supplies we consume varies greatly from our previous destinations. Sharp foliage damages uniforms and shoes, while the unique water places extra wear upon our fishing equipment. We proffer our hands out to those who can craft improved equipment with the star's natural features in mind, as we will require as many contributions as possible for the research teams' continued endeavors.","recipes":[38101],"objectives":[{"kind":"score","items":[],"bronzeScore":400,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":1502,"name":"EX: Superior Transport Supplies","job":4,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":800,"gold":1000,"text":"Preliminary tests have revealed that Auxesian plant life is especially susceptible to changes in humidity and temperature, and will wither away if not properly preserved. As a result, improvements to our freight transport systems will be necessary if we wish to ship harvested specimens safely to Etheirys. We petition the aid of deft and eager volunteers willing to enhance the freight units' capabilities and push our technology to the pinnacle of its potential. ","recipes":[38102],"objectives":[{"kind":"score","items":[],"bronzeScore":400,"specialAction":"StellarSteadyHand","specialActionCharges":1}]},{"id":1503,"name":"EX: Auxesian Fuel Development","job":4,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":800,"gold":1000,"text":"In a fortuitous development, we have discovered resin-rich fatwood resources on Auxesia, similar in quality to that of Oizys. When one considers the limited ceruleum we can transport from star to star, this discovery is a boon to all who yearn for a fuel supply closer to home. The key to combustible success, then, will be the creation of an accessible and environmentally friendly fuel with these resources, and we implore our contributors to lend their expertise to the development process. As this star is more...flammable than most, we plan to train users in the fuel's potential risks and inform them that it is meant primarily for short-term use.","recipes":[38103],"objectives":[{"kind":"craft","items":[{"name":"Survey Processed Oilcloth","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1504,"name":"EX+: Portable Weatherproof Supplies","job":4,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1800,"gold":2000,"text":"If you have spent a considerable amount of time on Auxesia, then you are doubtless familiar with the auroral flares that occur in its atmosphere. According to initiative skywatchers, these flares are not, in fact, natural─they are intentional phenomena, devised by the Voyagers for the acceleration of plant growth within the city. While the myriad colors and lights are a feast for the eyes, auroral flares may pose great risk to our delicate machinery. To counteract this, we intend to develop a unique variety of parasol that can shield these fragile instruments from the aurora's rays.","recipes":[38104],"objectives":[{"kind":"craft","items":[{"name":"Flareproof Compact Parasol","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1505,"name":"EX+: Cosmic Operator Suits","job":4,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":980,"gold":1080,"text":"Our arsenal of initiative-developed equipment shares one inspiring quality─each and every invention has been ingeniously developed from locally sourced materials, no matter the star's environs. We intend to push these innovations to the limit here on resource-rich Auxesia by fashioning much-needed equipment from its flora, such as purified biofuel and specialized uniforms for researchers and explorers. Our staff encourages as many submissions as possible, as we would like to promptly deliver these new creations to all who require them.","recipes":[38105,38106],"objectives":[{"kind":"craft","items":[{"name":"Survey Operator Suit","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1506,"name":"EX+: Voyager Resource Research","job":4,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":540,"silver":1800,"gold":2000,"text":"The flow of aether was of paramount importance in Voyager society, which prided itself on its sophisticated magicks. In fact, a scan of the city's core infrastructure has revealed intricate webs of catalysts with varying aetheric conductivity, including three-dimensional arcane geometries within some structures. To more thoroughly ascertain the ins and outs of this technology, the research team plans to build miniature versions of these structures for experimentation. They have requested all able procurers to supply us with the materials to accommodate their needs, such as resins and fibers.","recipes":[38107],"objectives":[{"kind":"score","items":[],"bronzeScore":1000,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":1507,"name":"Master: Improved Cosmic Suits","job":4,"rank":"Master","minLevel":100,"synced":false,"critical":false,"timeLimitSec":300,"silver":0,"gold":0,"text":"We have received new blueprints from our research team, all drafted with a similar goal in mind─to utilize the wealth of knowledge and concepts we have devised over the course of this initiative. Within these drafts are plans for sustainable biofuel, climate-resistant cosmic suits, and lightweight suits for our pilots, among other flawless ideas. To those experts who are keen to break boundaries and see these dreams into reality with us, we seek your support and your expertise now more than ever.","recipes":[38210],"objectives":[{"kind":"score","items":[],"bronzeScore":1000,"specialAction":"MaterialMiracle","specialActionCharges":2},{"kind":"score","items":[],"bronzeScore":2500,"specialAction":"MaterialMiracle","specialActionCharges":2},{"kind":"score","items":[],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":1508,"name":"Master: Improved Pilot Suits","job":4,"rank":"Master","minLevel":100,"synced":false,"critical":false,"timeLimitSec":240,"silver":0,"gold":0,"text":"We have received new blueprints from our research team, all drafted with a similar goal in mind─to utilize the wealth of knowledge and concepts we have devised over the course of this initiative. Within these drafts are plans for alchemical solutions to improve plant growth, high-durability suits for our pilots, and flexible-yet-lightweight suits for our higher-ranked individuals, among other flawless ideas. To those experts who are keen to break boundaries and see these dreams into reality with us, we seek your support and your expertise now more than ever.","recipes":[38211],"objectives":[{"kind":"score","items":[],"bronzeScore":1000,"specialAction":"StellarSteadyHand","specialActionCharges":4},{"kind":"score","items":[],"bronzeScore":2500,"specialAction":"StellarSteadyHand","specialActionCharges":4},{"kind":"score","items":[],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":4}]},{"id":1509,"name":"Master: Fine-grade Powersuits","job":4,"rank":"Master","minLevel":100,"synced":false,"critical":false,"timeLimitSec":420,"silver":0,"gold":0,"text":"We have received new blueprints from our research team, all drafted with a similar goal in mind─to utilize the wealth of knowledge and concepts we have devised over the course of this initiative. Within these drafts are plans for more efficient purified biofuel, powersuits with strengthened output capabilities, and high-quality admiral suits for celebratory purposes, among other flawless ideas. To those experts who are keen to break boundaries and see these dreams into reality with us, we seek your support and your expertise now more than ever.","recipes":[38212],"objectives":[{"kind":"score","items":[],"bronzeScore":2000,"specialAction":"MaterialMiracle","specialActionCharges":4},{"kind":"score","items":[],"bronzeScore":3500,"specialAction":"MaterialMiracle","specialActionCharges":4},{"kind":"score","items":[],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":4}]},{"id":1510,"name":"Multi-purpose Rope","job":5,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Auxesia boasts an abundance of unique flora─each and every species an invaluable resource. Some of the star's native plant fibers, for example, can be woven into highly sought-after ropes. However, before we can distribute these products, the initiative must establish safety standards to prevent potential injury. In order to meet demand and decide upon said standards, we require a surplus of quality handcrafted ropes based on those manufactured at our previous destinations.","recipes":[38108],"objectives":[{"kind":"craft","items":[{"name":"Standard Reinforced Rope","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1511,"name":"Reinforced Construction Materials","job":5,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Though ages have passed since the Voyagers' disappearance from their city, their architecture remains flawless and free of weathering. We believe our predecessors may have applied a magicked treatment on the materials used in these structures─one that blends hardier resources like metal and glass into their lumber. Our researchers are keen to emula ty handcrafted ropes based on those manufactured at our previous destinations.","recipes":[38124],"objectives":[{"kind":"craft","items":[{"name":"Standard Reinforced Rope","quantity":2}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1524,"name":"Reinforced Construction Material Replication","job":5,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1600,"text":"Though ages have passed since the Voyagers' disappearance from their city, their architecture remains flawless and free of weathering. We believe our predecessors may have applied a magicked treatment on the materials used in these structures─one that blends hardier resources like metal and glass into their lumber. Our researchers are keen to emulate these feats of engineering, and beseech all able artisans to submit their own experimental samples based on our findings.","recipes":[38125],"objectives":[{"kind":"craft","items":[{"name":"Standard Reinforced Fiber","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1525,"name":"Alchemical Compound Development","job":5,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1400,"gold":2000,"text":"Aether circulation was once viewed with great importance in the Voyagers' city. As such, we have utilized aetheric stimulants to quicken our own restoration efforts across the region. Alas, these stimulants have one drawback: they are quickly washed away by the star's natural humidity. To counter this, we mean to employ a resin-based substitute with similar properties, but spreading it throughout the city regularly will require a stable supply from our contributors.","recipes":[38126],"objectives":[{"kind":"craft","items":[{"name":"Survey Formula Compounds","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1526,"name":"Botanic Supplies","job":5,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1400,"gold":2000,"text":"A sweeping study of the region's flora has revealed the possibility that the city's diverse plant life was, in fact, systematically organized in every district. In pursuit of more concrete answers, the research team has opted to assemble miniature gardens, that they might study certain species' symbiotic relationships and environmental impacts on a smaller scale. Naturally, manufacturing the gardens will require sufficient time and resources, and all botanical contributions to this project are welcome as we deepen our understanding of Voyager society.","recipes":[38127],"objectives":[{"kind":"score","items":[],"bronzeScore":600,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1527,"name":"Habitation Furniture Renewal","job":5,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1000,"gold":1600,"text":"Many of our researchers upend their lives across the sea of stars and into new habitation modules each time we set course for a new destination. The wear and tear on their furnishings and belongings is inevitable after prolonged use, and many items that were brought in brand-new to Sinus Ardorum have seen better days upon their arrival to Auxesia. As it is our duty to ensure these dedicated workers have their creature comforts met and maintained, we ask all available artisans to aid us in the manufacture of new and improved furnishings.","recipes":[38128],"objectives":[{"kind":"craft","items":[{"name":"Habitat Cushions","quantity":2}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":1528,"name":"Weatherproof Material Development II","job":5,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":880,"gold":1050,"text":"If you have spent a considerable amount of time on Auxesia, then you are doubtless familiar with the auroral flares that occur in its atmosphere. According to initiative skywatchers, these flares are not, in fact, natural─they are intentional phenomena, devised by the Voyagers for the acceleration of plant growth within the city. While the myriad colors and lights are a feast for the eyes, auroral flares may pose great risk to our delicate machinery. To counteract this, we intend to develop a unique variety of parasol that can shield these fragile instruments from the aurora's rays.","recipes":[38129,38130],"objectives":[{"kind":"craft","items":[{"name":"Flareproof Parasol","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1529,"name":"EX: Resilient Survey Equipment","job":5,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":800,"gold":1000,"text":"Due to Auxesia's verdant environs, the variety of supplies we consume varies greatly from our previous destinations. Sharp foliage damages uniforms and shoes, while the unique water places extra wear upon our fishing equipment. We proffer our hands out to those who can craft improved equipment with the star's natural features in mind, as we will require as many contributions as possible for the research teams' continued endeavors.","recipes":[38131],"objectives":[{"kind":"score","items":[],"bronzeScore":400,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":1530,"name":"EX: Superior Transport Supplies","job":5,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":800,"gold":1000,"text":"Preliminary tests have revealed that Auxesian plant life is especially susceptible to changes in humidity and temperature, and will wither away if not properly preserved. As a result, improvements to our freight transport systems will be necessary if we wish to ship harvested specimens safely to Etheirys. We petition the aid of deft and eager volunteers willing to enhance the freight units' capabilities and push our technology to the pinnacle of its potential. ","recipes":[38132],"objectives":[{"kind":"score","items":[],"bronzeScore":400,"specialAction":"StellarSteadyHand","specialActionCharges":1}]},{"id":1531,"name":"EX: Auxesian Fuel Development","job":5,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":800,"gold":1000,"text":"In a fortuitous development, we have discovered resin-rich fatwood resources on Auxesia, similar in quality to that of Oizys. When one considers the limited ceruleum we can transport from star to star, this discovery is a boon to all who yearn for a fuel supply closer to home. The key to combustible success, then, will be the creation of an accessible and environmentally friendly fuel with these resources, and we implore our contributors to lend their expertise to the development process. As this star is more...flammable than most, we plan to train users in the fuel's potential risks and inform them that it is meant primarily for short-term use.","recipes":[38133],"objectives":[{"kind":"craft","items":[{"name":"Survey Processed Oilcloth","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1532,"name":"EX+: Portable Weatherproof Supplies","job":5,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1800,"gold":2000,"text":"If you have spent a considerable amount of time on Auxesia, then you are doubtless familiar with the auroral flares that occur in its atmosphere. According to initiative skywatchers, these flares are not, in fact, natural─they are intentional phenomena, devised by the Voyagers for the acceleration of plant growth within the city. While the myriad colors and lights are a feast for the eyes, auroral flares may pose great risk to our delicate machinery. To counteract this, we intend to develop a unique variety of parasol that can shield these fragile instruments from the aurora's rays.","recipes":[38134],"objectives":[{"kind":"craft","items":[{"name":"Flareproof Compact Parasol","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1533,"name":"EX+: Explorer Suits","job":5,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":980,"gold":1080,"text":"Our arsenal of initiative-developed equipment shares one inspiring quality─each and every invention has been ingeniously developed from locally sourced materials, no matter the star's environs. We intend to push these innovations to the limit here on resource-rich Auxesia by fashioning much-needed equipment from its flora, such as purified biofuel and specialized uniforms for researchers and explorers. Our staff encourages as many submissions as possible, as we would like to promptly deliver these new creations to all who require them.","recipes":[38135,38136],"objectives":[{"kind":"craft","items":[{"name":"Survey Explorer Suit","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1534,"name":"EX+: Voyager Resource Research","job":5,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":540,"silver":1800,"gold":2000,"text":"The flow of aether was of paramount importance in Voyager society, which prided itself on its sophisticated magicks. In fact, a scan of the city's core infrastructure has revealed intricate webs of catalysts with varying aetheric conductivity, including three-dimensional arcane geometries within some structures. To more thoroughly ascertain the ins and outs of this technology, the research team plans to build miniature versions of these structures for experimentation. They have requested all able procurers to supply us with the materials to accommodate their needs, such as resins and fibers.","recipes":[38137],"objectives":[{"kind":"score","items":[],"bronzeScore":1000,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":1535,"name":"Master: Improved Crew Suits","job":5,"rank":"Master","minLevel":100,"synced":false,"critical":false,"timeLimitSec":300,"silver":0,"gold":0,"text":"We have received new blueprints from our research team, all drafted with a similar goal in mind─to utilize the wealth of knowledge and concepts we have devised over the course of this initiative. Within these drafts are plans for sustainable biofuel, climate-resistant cosmic suits, and lightweight suits for our pilots, among other flawless ideas. To those experts who are keen to break boundaries and see these dreams into reality with us, we seek your support and your expertise now more than ever.","recipes":[38213],"objectives":[{"kind":"score","items":[],"bronzeScore":1000,"specialAction":"MaterialMiracle","specialActionCharges":2},{"kind":"score","items":[],"bronzeScore":2500,"specialAction":"MaterialMiracle","specialActionCharges":2},{"kind":"score","items":[],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":1536,"name":"Master: Improved Captain's Suits","job":5,"rank":"Master","minLevel":100,"synced":false,"critical":false,"timeLimitSec":240,"silver":0,"gold":0,"text":"We have received new blueprints from our research team, all drafted with a similar goal in mind─to utilize the wealth of knowledge and concepts we have devised over the course of this initiative. Within these drafts are plans for alchemical solutions to improve plant growth, high-durability suits for our pilots, and flexible-yet-lightweight suits for our higher-ranked individuals, among other flawless ideas. To those experts who are keen to break boundaries and see these dreams into reality with us, we seek your support and your expertise now more than ever.","recipes":[38214],"objectives":[{"kind":"score","items":[],"bronzeScore":1000,"specialAction":"StellarSteadyHand","specialActionCharges":4},{"kind":"score","items":[],"bronzeScore":2500,"specialAction":"StellarSteadyHand","specialActionCharges":4},{"kind":"score","items":[],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":4}]},{"id":1537,"name":"Master: Star Admiral's Ornamentation","job":5,"rank":"Master","minLevel":100,"synced":false,"critical":false,"timeLimitSec":420,"silver":0,"gold":0,"text":"We have received new blueprints from our research team, all drafted with a similar goal in mind─to utilize the wealth of knowledge and concepts we have devised over the course of this initiative. Within these drafts are plans for more efficient purified biofuel, powersuits with strengthened output capabilities, and high-quality admiral suits for celebratory purposes, among other flawless ideas. To those experts who are keen to break boundaries and see these dreams into reality with us, we seek your support and your expertise now more than ever.","recipes":[38215],"objectives":[{"kind":"score","items":[],"bronzeScore":2000,"specialAction":"MaterialMiracle","specialActionCharges":4},{"kind":"score","items":[],"bronzeScore":3500,"specialAction":"MaterialMiracle","specialActionCharges":4},{"kind":"score","items":[],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":4}]},{"id":1538,"name":"Mineral Resource Procurement","job":6,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Certain rare plants on Auxesia reinforce their fibers with metals, making them a valuable resource in the verdant metropolis. The material would doubtless have many applications in our work, and, as luck would have it, the research team has demonstrated that certain reagents can be used to extract the mineralized fibers. We call upon our artisans skilled in preparing plants and herbs to turn their hand to the task!","recipes":[38138],"objectives":[{"kind":"craft","items":[{"name":"Mineralized Plant Fiber","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1539,"name":"Long-life Potables","job":6,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"The abundant plant life on Auxesia suggests ample water resources. Indeed, we have uncovered plentiful wellsprings and suspect the lowlands to contain rivers and wetlands. Alas, water may be everywhere, but not a drop to drink. In its natural state, Auxesian water contains elements that are harmful when ingested by thirsty members of the initiative. It is imperative that we purify and sterilize a robust stockpile of usable water.","recipes":[38139],"objectives":[{"kind":"craft","items":[{"name":"Potable Survey Water","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1540,"name":"Experimental Loporrit Enrichment","job":6,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"For time immemorial, we Loporrits have needed nothing more than a nibble on a carrot to revitalize and sustain ourselves. Now, through the Cosmic Exploration Initiative, we have experienced firstpaw the myriad cuisines enjoyed by the people of Etheirys. Should we not likewise explore the untapped potential of the humble carrot? In an effort to provide our Loporrit contributors in the field with a convenient and satisfying snack, we turn first to the development of carrot-flavored pellets.","recipes":[38140],"objectives":[{"kind":"craft","items":[{"name":"Survey Carrot Tea","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1541,"name":"Portable Provisions","job":6,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Though home to a myriad of botanical specimens, Auxesia is distinctly lacking in herbivores and the fruiting plants that might support such species. Nevertheless, the potential for nutritious provisions is found in even roots and leaves. Such Auxesian extracts may even pave the way to a foodstuff of nutritional efficiency and popularity second only to Archon loaf!","recipes":[38141],"objectives":[{"kind":"craft","items":[{"name":"Survey Supply Jelly","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1542,"name":"Additional Mineral Resource Procurement","job":6,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Certain rare plants on Auxesia reinforce their fibers with metals, making them a valuable resource in the verdant metropolis. The material would doubtless have many applications in our work, and, as luck would have it, the research team has demonstrated that certain reagents can be used to extract the mineralized fibers. We call upon our artisans skilled in preparing plants and herbs to turn their hand to the task!","recipes":[38142],"objectives":[{"kind":"craft","items":[{"name":"Mineralized Plant Fiber","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1543,"name":"Additional Long-life Potables","job":6,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"The abundant plant life on Auxesia suggests ample water resources. Indeed, we have uncovered plentiful wellsprings and suspect the lowlands to contain rivers and wetlands. Alas, water may be everywhere, but not a drop to drink. In its natural state, Auxesian water contains elements that are harmful when ingested by thirsty members of the initiative. It is imperative that we purify and sterilize a robust stockpile of usable water.","recipes":[38143],"objectives":[{"kind":"craft","items":[{"name":"Potable Survey Water","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1544,"name":"Further Experimental Loporrit Enrichment","job":6,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1300,"gold":3000,"text":"For time immemorial, we Loporrits have needed nothing more than a nibble on a carrot to revitalize and sustain ourselves. Now, through the Cosmic Explorat me":"Heavy Machinery Water Reserves","job":6,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1600,"gold":2400,"text":"The abundant plant life on Auxesia suggests ample water resources. Indeed, we have uncovered plentiful wellsprings and suspect the lowlands to contain rivers and wetlands. Alas, water may be everywhere, but not a drop to drink. In its natural state, Auxesian water contains elements that are harmful when ingested by thirsty members of the initiative. It is imperative that we purify and sterilize a robust stockpile of usable water.","recipes":[38148],"objectives":[{"kind":"craft","items":[{"name":"Potable Survey Water","quantity":3}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":3}]},{"id":1548,"name":"Enhanced Loporrit Enrichment","job":6,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":2700,"gold":3000,"text":"For time immemorial, we Loporrits have needed nothing more than a nibble on a carrot to revitalize and sustain ourselves. Now, through the Cosmic Exploration Initiative, we have experienced firstpaw the myriad cuisines enjoyed by the people of Etheirys. Should we not likewise explore the untapped potential of the humble carrot? In an effort to provide our Loporrit contributors in the field with a convenient and satisfying snack, we turn first to the development of carrot-flavored pellets.","recipes":[38149],"objectives":[{"kind":"craft","items":[{"name":"Survey Carrot Tea","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":1549,"name":"Advanced Portable Provisions","job":6,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1500,"text":"Though home to a myriad of botanical specimens, Auxesia is distinctly lacking in herbivores and the fruiting plants that might support such species. Nevertheless, the potential for nutritious provisions is found in even roots and leaves. Such Auxesian extracts may even pave the way to a foodstuff of nutritional efficiency and popularity second only to Archon loaf!","recipes":[38150,38151],"objectives":[{"kind":"craft","items":[{"name":"Survey Supply Jelly","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1550,"name":"Portable Foodstuff Improvements","job":6,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1600,"gold":2100,"text":"The import of foodstuffs via the *Galactic Way* has vastly improved, allowing diners in the habitation module refectory to select from limited meal options. There remains the issue, however, of improving portable provisions for contributors working in the field. Used to a certain level of luxury at the base, contributors are now demanding that their field provisions should have at least some level of flavor. We are requesting the aid of skilled artisans to meet these unreasonable expectations!","recipes":[38152,38153],"objectives":[{"kind":"craft","items":[{"name":"Survey Preservative","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1551,"name":"Mineral Resource Development","job":6,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1600,"text":"Certain rare plants on Auxesia reinforce their fibers with metals, making them a valuable resource in the verdant metropolis. The material would doubtless have many applications in our work, and, as luck would have it, the research team has demonstrated that certain reagents can be used to extract the mineralized fibers. We call upon our artisans skilled in preparing plants and herbs to turn their hand to the task!","recipes":[38154],"objectives":[{"kind":"craft","items":[{"name":"Mineralized Plant Fiber","quantity":2}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1552,"name":"Long-lasting Coolant","job":6,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1600,"text":"The abundant plant life on Auxesia suggests ample water resources. Indeed, we have uncovered plentiful wellsprings and suspect the lowlands to contain rivers and wetlands. Alas, water may be everywhere, but not a drop to drink. In its natural state, Auxesian water contains elements that are harmful when ingested by thirsty members of the initiative. It is imperative that we purify and sterilize a robust stockpile of usable water.","recipes":[38155],"objectives":[{"kind":"craft","items":[{"name":"Potable Survey Water","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1553,"name":"Loporrit Enrichment Research","job":6,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1400,"gold":2000,"text":"For time immemorial, we Loporrits have needed nothing more than a nibble on a carrot to revitalize and sustain ourselves. Now, through the Cosmic Exploration Initiative, we have experienced firstpaw the myriad cuisines enjoyed by the people of Etheirys. Should we not likewise explore the untapped potential of the humble carrot? In an effort to provide our Loporrit contributors in the field with a convenient and satisfying snack, we turn first to the development of carrot-flavored pellets.","recipes":[38156],"objectives":[{"kind":"craft","items":[{"name":"Survey Carrot Tea","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1554,"name":"Fieldwork Essentials","job":6,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1400,"gold":2000,"text":"It has been observed that the children of Etheirys find a well-trimmed lawn as soothing as we Loporrits find a carrot patch calming. Fortunately, there are several such grassy locales within the bounds of our survey area, presenting ideal sites for relaxation facilities. We seek to provide picnicking sets for outdoor dining and gently scented candles to maximize the morrow's motivation!","recipes":[38157],"objectives":[{"kind":"score","items":[],"bronzeScore":600,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1555,"name":"Applied Auxesian Flora","job":6,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1000,"gold":1600,"text":"Though home to a myriad of botanical specimens, Auxesia is distinctly lacking in herbivores and the fruiting plants that might support such species. Nevertheless, the potential for nutritious provisions is found in even roots and leaves. Such Auxesian extracts may even pave the way to a foodstuff of nutritional efficiency and popularity second only to Archon loaf!","recipes":[38158],"objectives":[{"kind":"craft","items":[{"name":"Auxesian Botanical Juice","quantity":2}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":1556,"name":"Further Portable Foodstuff Improvements","job":6,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":880,"gold":1050,"text":"The import of foodstuffs via the *Galactic Way* has vastly improved, allowing diners in the habitation module refectory to select from limited meal options. There remains the issue, however, of improving portable provisions for contributors working in the field. Used to a certain level of luxury at the base, contributors are now demanding that their field provisions should have at least some level of flavor. We are requesting the aid of skilled artisans to meet these unreasonable expectations!","recipes":[38159,38160],"objectives":[{"kind":"craft","items":[{"name":"Survey Preservative","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1557,"name":"EX: Auxesian Extract Applications","job":6,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":800,"gold":1000,"text":"Our previous expeditions demonstrated that natural resources can be processed into a wide array of materials, and this is equally true on Auxesia. Preservatives and adhesives from plant oils, spices to simultaneously preserve food and add flavor─our researchers may have near-endless ideas, but are sorely lacking in the skills to translate them into reality. Any contributors available to process raw materials are greatly encouraged to do so.","recipes":[38161],"objectives":[{"kind":"score","items":[],"bronzeScore":400,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":1558,"name":"EX: Sustainable Construction Materials","job":6,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":800,"gold":1000,"text":"Auxesian architecture seems to rely heavily on incorporating plant life, which means we must be especially vigilant that our activities do not have any adverse environmental effects. As such, we have decided to use easily disassembled biomaterials in the construction of our base. Natural materials require specific methods of processing, and we are requesting the support of skilled contributors to ensure that all materials meet our safety requirements.","recipes":[38162],"objectives":[{"kind":"score","items":[],"bronzeScore":400,"specialAction":"StellarSteadyHand","specialActionCharges":1}]},{"id":1559,"name":"EX: Launch Party Liquor","job":6,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":800,"gold":1000,"text":"With work on Auxesia progressing apace, some teams are planning a celebration of our efforts thus far. It has come to our attention that several contributors─who have been known to enjoy a drink─are planning to commemorate the occasion by brewing a spirit from Auxesian flora, before sending the completed product to Etheirys. Connoisseurs from across Etheirys will no doubt flock to buy the liquor from a distant star, and we cannot leave this matter to amateurs. Expert artisans are called upon to create the finest vintage, befitting the initiative's name!","recipes":[38163],"objectives":[{"kind":"craft","items":[{"name":"Finest Launch Party Liquor","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1560,"name":"EX+: Periphery Provisions","job":6,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1800,"gold":2000,"text":"Contributors working at isolated outposts on Oizys heaped praise on our self-heating lunches, and there is a similarly high level of demand on Auxesia. Given the proliferation of plant life and damp environs, we think it prudent to improve both the heating element and the preservatives utilized. To protect the star from unintended fires─and the stomachs of our contributors from spoiled food─we are requesting the cooperation of experts in both fields. Rest assured, quality control will be *rigorously* conducted.","recipes":[38164],"objectives":[{"kind":"craft","items":[{"name":"Simplified Survey Exothermic Agent","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1561,"name":"EX+: Renewable Resource Development","job":6,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":980,"gold":1080,"text":"Auxesian architecture seems to rely heavily on incorporating plant life, which means we must be especially vigilant that our activities do not have any adverse environmental effects. As such, we have decided to use easily disassembled biomaterials in the construction of our base. Natural materials require specific methods of processing, and we are requesting the support of skilled contributors to ensure that all materials meet our safety requirements.","recipes":[38165,38166],"objectives":[{"kind":"craft","items":[{"name":"Survey Concrete","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1562,"name":"EX+: The Ultimate Yeast","job":6,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":540,"silver":1800,"gold":2000,"text":"In their voyage across the stars, our research team has continued to seek the answer to the question: what makes the perfect, all-purpose yeast? In a dramatic development, yeast derived from strains found in Sinus Ardorum demonstrated unprecedented activity when exposed to the auroral flares of Auxesia. This opportunity must be seized with both paws! The ultimate yeast, effective throughout the universe, is within our grasp.","recipes":[38167],"objectives":[{"kind":"score","items":[],"bronzeScore":1000,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":1563,"name":"Master: Advanced Ruins Formula","job":6,"rank":"Master","minLevel":100,"synced":false,"critical":false,"timeLimitSec":300,"silver":0,"gold":0,"text":"The initiative issues a challenge to its expert alchemists and culinarians! Your skills, finely honed through countless contributions, lead here: the development of the ultimate formula to stimulate aetheric circulation in an urban environment; and the ultimate cosmic ration, providing a nutritionally complete meal three minutes after the simple addition of boiling water. This is the very pinnacle of progress!","recipes":[38216],"objectives":[{"kind":"score","items":[],"bronzeScore":1000,"specialAction":"MaterialMiracle","specialActionCharges":2},{"kind":"score","items":[],"bronzeScore":2500,"specialAction":"MaterialMiracle","specialActionCharges":2},{"kind":"score","items":[],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":1564,"name":"Master: Advanced Restoration Materials","job":6,"rank":"Master","minLevel":100,"synced":false,"critical":false,"timeLimitSec":240,"silver":0,"gold":0,"text":"Construction on Auxesia utilizes biomaterials where possible, to preserve the natural environs. The knowledge and experience gained in this process will no doubt prove invaluable in applications far beyond this star. Thus far, two items have been deemed suitable for further research and development: glass blocks made from processed resin, and rations made from nutrient-dense Auxesian beans.","recipes":[38217],"objectives":[{"kind":"score","items":[],"bronzeScore":1000,"specialAction":"StellarSteadyHand","specialActionCharges":4},{"kind":"score","items":[],"bronzeScore":2500,"specialAction":"StellarSteadyHand","specialActionCharges":4},{"kind":"score","items":[],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":4}]},{"id":1565,"name":"Master: Cosmic Tool Catalyst","job":6,"rank":"Master","minLevel":100,"synced":false,"critical":false,"timeLimitSec":420,"silver":0,"gold":0,"text":"Cosmic tool research is entering its final stage here on Auxesia, and the engineering team is struggling to fulfill demand for the required materials. Researchingway has turned to you─now indisputably the most experienced artisan in the known universe─to complete the ultimate catalyst, described in exacting and near-incomprehensible detail in the inventive Loporrit's notes.","recipes":[38218],"objectives":[{"kind":"score","items":[],"bronzeScore":2000,"specialAction":"MaterialMiracle","specialActionCharges":4},{"kind":"score","items":[],"bronzeScore":3500,"specialAction":"MaterialMiracle","specialActionCharges":4},{"kind":"score","items":[],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":4}]},{"id":1566,"name":"Mineral Resource Procurement","job":7,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Certain rare plants on Auxesia reinforce their fibers with metals, making them a valuable resource in the verdant metropolis. The material would doubtless have many applications in our work, and, as luck would have it, the research team has demonstrated that certain reagents can be used to extract the mineralized fibers. We call upon our artisans skilled in preparing plants and herbs to turn their hand to the task!","recipes":[38168],"objectives":[{"kind":"craft","items":[{"name":"Mineralized Plant Fiber","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1567,"name":"Long-life Potables","job":7,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"The abundant plant life on Auxesia suggests ample water resources. Indeed, we have uncovered plentiful wellsprings and suspect the lowlands to contain rivers and wetlands. Alas, water may be everywhere, but not a drop to drink. In its natural state, Auxesian water contains elements that are harmful when ingested by thirsty members of the initiative. It is imperative that we purify and sterilize a robust stockpile of usable water.","recipes":[38169],"objectives":[{"kind":"craft","items":[{"name":"Potable Survey Water","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1568,"name":"Experimental Loporrit Enrichment","job":7,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"For time immemorial, we Loporrits have needed nothing more than a nibble on a carrot to revitalize and sustain ourselves. Now, through the Cosmic Exploration Initiative, we have experienced firstpaw the myriad cuisines enjoyed by the people of Etheirys. Should we not likewise explore the untapped potential of the humble carrot? In an effort to provide our Loporrit contributors in the field with a convenient and satisfying snack, we turn first to the development of carrot-flavored pellets.","recipes":[38170],"objectives":[{"kind":"craft","items":[{"name":"Survey Carrot Pellets","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1569,"name":"Portable Provisions","job":7,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Though home to a myriad of botanical specimens, Au 100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1400,"gold":2000,"text":"It has been observed that the children of Etheirys find a well-trimmed lawn as soothing as we Loporrits find a carrot patch calming. Fortunately, there are several such grassy locales within the bounds of our survey area, presenting ideal sites for relaxation facilities. We seek to provide picnicking sets for outdoor dining and gently scented candles to maximize the morrow's motivation!","recipes":[38187],"objectives":[{"kind":"score","items":[],"bronzeScore":600,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1583,"name":"Applied Auxesian Flora","job":7,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1000,"gold":1600,"text":"Though home to a myriad of botanical specimens, Auxesia is distinctly lacking in herbivores and the fruiting plants that might support such species. Nevertheless, the potential for nutritious provisions is found in even roots and leaves. Such Auxesian extracts may even pave the way to a foodstuff of nutritional efficiency and popularity second only to Archon loaf!","recipes":[38188],"objectives":[{"kind":"craft","items":[{"name":"Auxesian Soup","quantity":2}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":1584,"name":"Further Portable Foodstuff Improvements","job":7,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":880,"gold":1050,"text":"The import of foodstuffs via the *Galactic Way* has vastly improved, allowing diners in the habitation module refectory to select from limited meal options. There remains the issue, however, of improving portable provisions for contributors working in the field. Used to a certain level of luxury at the base, contributors are now demanding that their field provisions should have at least some level of flavor. We are requesting the aid of skilled artisans to meet these unreasonable expectati n Flora","job":7,"rank":"Master","minLevel":100,"synced":false,"critical":false,"timeLimitSec":240,"silver":0,"gold":0,"text":"Construction on Auxesia utilizes biomaterials where possible, to preserve the natural environs. The knowledge and experience gained in this process will no doubt prove invaluable in applications far beyond this star. Thus far, two items have been deemed suitable for further research and development: glass blocks made from processed resin, and rations made from nutrient-dense Auxesian beans.","recipes":[38220],"objectives":[{"kind":"score","items":[],"bronzeScore":1000,"specialAction":"StellarSteadyHand","specialActionCharges":4},{"kind":"score","items":[],"bronzeScore":2500,"specialAction":"StellarSteadyHand","specialActionCharges":4},{"kind":"score","items":[],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":4}]},{"id":1593,"name":"Master: Cosmic Tool Catalyst","job":7,"rank":"Master","minLevel":100,"synced":false,"critical":false,"timeLimitSec":420,"silver":0,"gold":0,"text":"Cosmic tool research is entering its final stage here on Auxesia, and the engineering team is struggling to fulfill demand for the required materials. Researchingway has turned to you─now indisputably the most experienced artisan in the known universe─to complete the ultimate catalyst, described in exacting and near-incomprehensible detail in the inventive Loporrit's notes.","recipes":[38221],"objectives":[{"kind":"score","items":[],"bronzeScore":2000,"specialAction":"MaterialMiracle","specialActionCharges":4},{"kind":"score","items":[],"bronzeScore":3500,"specialAction":"MaterialMiracle","specialActionCharges":4},{"kind":"score","items":[],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":4}]},{"id":1678,"name":"Firepower Fuel","job":0,"rank":"D","minLevel":10,"synced":true,"critical":true,"timeLimitSec":1200,"silver":0,"gold":0,"text":"We have confirmed the existence of invasive lunar fungi on the Scrambling Ways. The traveling spores were likely attached to freight from Sinus Ardorum, and auroral flares have accelerated their growth tenfold. As we have yet to determine what influence this patch of fungi may pose on Auxesia's climate, we reluctantly turn to the most destructive solution: incineration. Thus, we ready our flamethrowers and implore those with the relevant skill sets to contribute to this combustive cause with all due haste.","recipes":[38222],"objectives":[{"kind":"score","items":[],"bronzeScore":600,"specialAction":null,"specialActionCharges":0},{"kind":"deliver","items":[],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1679,"name":"Wakening Incense","job":0,"rank":"D","minLevel":10,"synced":true,"critical":true,"timeLimitSec":1200,"silver":0,"gold":0,"text":"What a turn of events! The floracane, on a sweep to remove foreign matter from the city, appears to have had a dramatic effect on the Loporrits. Contact with the aetheric petals induces a strangely intoxicated state, and we are receiving reports that a group of Loporrits working in the field has undergone particularly severe exposure. While Loporrits near the base are protected by the rainbow crystal's influence, this leaves our relief efforts short-pawed. Contributors unaffected by the floracane are requested to provide immediate aid to the victims!","recipes":[38223],"objectives":[{"kind":"score","items":[],"bronzeScore":600,"specialAction":null,"specialActionCharges":0},{"kind":"deliver","items":[],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1680,"name":"Plant Incineration Equipment","job":1,"rank":"D","minLevel":10,"synced":true,"critical":true,"timeLimitSec":1200,"silver":0,"gold":0,"text":"An infestation of plants thought to be of Oizys origin has abruptly sprouted on the isle west of the Timberlodge. The prevailing theory is that stray seeds accompanied our cargo from Terra Firma and had their growth here accelerated by auroral radiation. We seek immediate assistance with the removal of invasive species before they take root in other parts of Auxesia. While incineration is the preferred method, volunteers are requested to harvest foreign specimens by hand in areas where flamethrowers would harm the native vegetation.","recipes":[38224],"objectives":[{"kind":"score","items":[],"bronzeScore":600,"specialAction":null,"specialActionCharges":0},{"kind":"deliver","items":[],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1681,"name":"Boring Drill Bits","job":1,"rank":"D","minLevel":10,"synced":true,"critical":true,"timeLimitSec":1200,"silver":0,"gold":0,"text":"We have received numerous reports claiming that an overgrowth of ore-rich fruit has sprouted north of the Timberlodge. While this particular species is generally subterranean, auroral flare activity has pushed its growth to the limit, enabling it to sprout towards the surface. Eyewitnesses report that these rarities retract their roots once the flares subside, so we must make the most of this moment if we wish to harvest and further analyze the crop. Those who can provide drill components and other necessary materials during this time will be well rewarded for their efforts.","recipes":[38225],"objectives":[{"kind":"score","items":[],"bronzeScore":600,"specialAction":null,"specialActionCharges":0},{"kind":"deliver","items":[],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1682,"name":"Machina Repair Plating","job":2,"rank":"D","minLevel":10,"synced":true,"critical":true,"timeLimitSec":1200,"silver":0,"gold":0,"text":"According to reports, the floracane caused several vacuum suits working in a remote location to malfunction. Though able to return to the southern sector of Pileus Pergola, the rapid unscheduled descent destroyed several key components. The suits will cease all operations for the duration of the floracane to prevent further damage, but repairs will be carried out in situ to allow a swi       return '<button class="mission' + (x.id === app.missionId ? ' on' : '') + '" data-act="mission" data-v="' + x.id + '" role="option">' +
        '<div class="t">' + esc(x.name) + '</div><div class="m">' +
        '<span class="badge">' + x.rank + '</span>' + (ex ? '<span class="badge x">Expert</span>' : '') +

        (x.critical ? '<span class="badge">Critical</span>' : '') + (x.timeLimitSec ? '<span class="badge">' + Math.round(x.timeLimitSec / 60) + ' min</span>' : '') +

  }
  function numField(label, key, v, min, max) {
