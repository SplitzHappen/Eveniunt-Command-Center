<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Cosmic Solver – Oizys</title>
<meta name="description" content="Offline step-by-step crafting assistant for Final Fantasy XIV Cosmic Exploration (Oizys). Manually operated; reads nothing from the game.">
<style>:root {
  --bg: #f4f5f7; --panel: #ffffff; --ink: #1b1f24; --muted: #5d6673; --line: #d9dde3;
  --accent: #2d5bd7; --accent-ink: #ffffff; --ok: #1f8a4c; --bad: #c0392b; --warn: #b7791f;
  --rec-bg: #10233f; --rec-ink: #ffffff; --chip: #eef1f5; --bar: #e3e7ec;
  --c-normal: #8a919c; --c-good: #d64545; --c-excellent: #b445d6; --c-poor: #555b63; --c-centered: #c9a000;
  --c-sturdy: #2f6fd6; --c-pliant: #2e9e5b; --c-malleable: #3b3fa8; --c-primed: #8a4fd6; --c-goodomen: #e07b39; --c-robust: #138a8a;
  --radius: 10px; --gap: 12px;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --panel: #181c22; --ink: #e8ebef; --muted: #9aa3ae; --line: #2b313a;
    --accent: #6d93ff; --accent-ink: #0b0e12; --chip: #232932; --bar: #262c35; --rec-bg: #1e3a66;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --panel: #181c22; --ink: #e8ebef; --muted: #9aa3ae; --line: #2b313a;
  --accent: #6d93ff; --accent-ink: #0b0e12; --chip: #232932; --bar: #262c35; --rec-bg: #1e3a66;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header.top { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
header.top h1 { font-size: 16px; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header.top .planet { color: var(--muted); font-weight: 400; }
main { max-width: 1180px; margin: 0 auto; padding: 12px 16px 40px; display: grid; gap: var(--gap); grid-template-columns: 1fr; }
@media (min-width: 900px) { main.crafting { grid-template-columns: 380px 1fr; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; min-width: 0; }
.card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
.card h2 .grow { flex: 1; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--chip); border-radius: 8px; padding: 7px 10px; min-height: 36px; }
button:hover { border-color: var(--accent); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.ghost { background: transparent; }
button.small { min-height: 28px; padding: 3px 8px; font-size: 13px; }
button[disabled] { opacity: .45; cursor: not-allowed; }
input[type=number], input[type=text], select { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-height: 36px; width: 100%; }
label.inline { display: inline-flex; align-items: center; gap: 6px; margin-right: 12px; white-space: nowrap; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
.field { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
.field input, .field select { color: var(--ink); font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border-radius: 999px; padding: 4px 10px; min-height: 30px; font-size: 13px; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip.on .muted { color: inherit; opacity: .85; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.warn { color: var(--warn); }
.bad { color: var(--bad); }
.ok { color: var(--ok); }
.missions { max-height: 300px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; margin-top: 8px; }
.mission { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; padding: 8px 10px; }
.mission:last-child { border-bottom: 0; }
.mission.on { background: var(--chip); box-shadow: inset 3px 0 0 var(--accent); }
.mission .t { font-weight: 600; }
.mission .m { font-size: 12px; color: var(--muted); }
.badge { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 6px; background: var(--chip); border: 1px solid var(--line); margin-right: 4px; color: var(--ink); }
.badge.x { border-color: var(--c-primed); }
.rec { background: var(--rec-bg); color: var(--rec-ink); border-radius: var(--radius); padding: 14px 16px; }
.rec .lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .75; }
.rec .act { font-size: clamp(26px, 6vw, 40px); font-weight: 750; line-height: 1.1; margin: 4px 0 6px; overflow-wrap: anywhere; }
.rec .why { font-size: 15px; opacity: .95; }
.rec .est { font-size: 12px; opacity: .8; margin-top: 6px; }
.rec.thinking .act { opacity: .55; }
.rec.done { background: #1f6f43; }
.rec.failed { background: #7d2a22; }
.report { margin-top: 10px; }
.report .q { font-size: 13px; color: var(--muted); margin: 6px 0 4px; }
.conds { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
.cond { min-height: 46px; font-weight: 600; border-width: 2px; position: relative; text-align: left; padding-left: 12px; }
.cond kbd { position: absolute; right: 6px; top: 4px; font-size: 10px; opacity: .65; font-family: inherit; }
.cond.likely { box-shadow: 0 0 0 2px var(--accent) inset; }
.cond.fail { border-style: dashed; }
.c-0 { border-color: var(--c-normal); } .c-1 { border-color: var(--c-good); } .c-2 { border-color: var(--c-excellent); }
.c-3 { border-color: var(--c-poor); } .c-4 { border-color: var(--c-centered); } .c-5 { border-color: var(--c-sturdy); }
.c-6 { border-color: var(--c-pliant); } .c-7 { border-color: var(--c-malleable); } .c-8 { border-color: var(--c-primed); }
.c-9 { border-color: var(--c-goodomen); } .c-10 { border-color: var(--c-robust); }
.condtag { display: inline-block; padding: 2px 8px; border-radius: 6px; border: 2px solid; font-weight: 600; }
.bars { display: grid; gap: 8px; }
.bar { position: relative; height: 22px; background: var(--bar); border-radius: 6px; overflow: hidden; }
.bar .fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); opacity: .85; }
.bar.q .fill { background: #c28a12; }
.bar.d .fill { background: #3a8f6a; }
.bar.cp .fill { background: #7a5cc4; }
.bar .txt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; font-size: 13px; font-weight: 600; color: var(--ink); mix-blend-mode: normal; }
.bar .tick { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); opacity: .55; }
.statgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px 12px; margin-top: 8px; font-size: 14px; }
.buffs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.buff { background: var(--chip); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; font-size: 13px; }
.controls { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.hist { max-height: 260px; overflow: auto; font-size: 13px; }
.hist ol { margin: 0; padding-left: 22px; }
.hist li { margin: 2px 0; }
.alts { font-size: 12px; margin-top: 6px; opacity: .85; }
dialog { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); color: var(--ink); padding: 14px; max-width: min(640px, 94vw); width: 100%; }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog h3 { margin: 0 0 10px; font-size: 16px; }
.note { font-size: 12px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 8px; margin: 8px 0; }
.toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 20; }
.hidden { display: none !important; }
details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.kbdhelp kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 12px; }
</style>
</head>

aterialMiracle","specialActionCharges":2}]},{"id":1058,"name":"Secure Tents","job":0,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":880,"gold":1050,"text":"We are seeking to improve the tents used by contributors stationed far from Terra Firma. This will be achieved by rendering them less susceptible to damage from floating rocks and errant sand. It is our hope that sturdy, dust-proof sleeping quarters will offer sounder sleep out in the field, and elevate workplace efficiency to new heights.","recipes":[37517,37518],"objectives":[{"kind":"craft","items":[{"name":"Oizys Pop-up Tent","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1059,"name":"EX: Mass-produced Transportation Materials","job":0,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":800,"gold":1000,"text":"According to reports, the *Galactic Way* was recently caught in a gravitational anomaly when leaving Oizys's atmosphere. The crew were able to quickly regain control of the vessel, but the onboard cargo sadly sustained major damage. Clearly, cushioning alone is insufficient to guarantee safe exports of the star's rare materials. We are therefore seeking artisans to produce a variety of sturdy, expertly crafted materials to secure freight during transit.","recipes":[37519],"objectives":[{"kind":"score","items":[],"bronzeScore":400,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":1060,"name":"EX: Excavation Necessities","job":0,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":800,"gold":1000,"text":"Here upon Oizys, we are all locked in a protracted battle against dust, but its ill effects are most keenly felt near excavation sites, where much of it is generated. Indeed, some contributors assigned to excavation duties have begun to complain of respiratory ailments. We wish to remedy the issue before it spirals out of control, and therefore ask contributors to produce comfortable dust-filtering masks for distribution.","recipes":[37520],"objectives":[{"kind":"score","items":[],"bronzeScore":400,"specialAction":"StellarSteadyHand","specialActionCharges":1}]},{"id":1061,"name":"EX: Excavation Equipment","job":0,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":800,"gold":1000,"text":"Desert Burrow has proven to be far larger than we initially predicted, not to mention filled with archaeological marvels. While our researchers delight in these discoveries, a more pressing concern faces us: severe shortages of excavation equipment. Contributors are called upon to meet the demand for sturdy scaffolding and rugged gloves. These vital supplies will help further accelerate our efforts to uncover relics and learn more of Oizys's past.","recipes":[37521],"objectives":[{"kind":"craft","items":[{"name":"Excavator's Scaffolding","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1062,"name":"EX: Beach Break Supplies","job":0,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1600,"text":"One of our La Noscean-born contributors submitted a request to make use of the Sound Pole on their days off─a request which we have duly authorized. Although we generally advise against bathing in the waters due to the intense electromagnetism in the sector, the risk posed by short breaks on the beach was deemed minimal. To help enhance the area's natural potential for relaxation, we require artisans to provide a variety of leisure supplies.","recipes":[37522],"objectives":[{"kind":"craft","items":[{"name":"Leisurely Parasol Set","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1063,"name":"EX+: Planetary Resource Utilization","job":0,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":980,"gold":1080,"text":"With infrastructure expanding apace, we can at last begin to improve living conditions for our hardworking contributors. To support this benevolent endeavor, artisans are requested to fabricate a range of comfortable furnishings. By utilizing local materials in particular, it is hoped we might also gauge the potential of Oizys's natural resources for myriad other applications.","recipes":[37523,37524],"objectives":[{"kind":"craft","items":[{"name":"Enriching Hammock","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1064,"name":"EX+: Organic Material Advanced Processing","job":0,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":540,"silver":1800,"gold":2000,"text":"Although Oizys's mineral wealth is much vaunted, our research teams are also investigating potential uses for the star's vegetation. Having evolved over millennia to thrive despite the ravages of gravitational anomalies, many species harbor promising properties we might utilize. To help further our investigation, contributors are asked to remove impurities from resin and fiber extracted from local flora, and process the resulting materials.","recipes":[37525],"objectives":[{"kind":"score","items":[],"bronzeScore":1000,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":1065,"name":"EX+: Renewable Fuel I","job":0,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":980,"gold":1080,"text":"We require a number of talented artisans to work with the rare resources unearthed on the star. Those who receive this directive may consider themselves among the initiative's finest contributors─deemed to possess the exceptional skills necessary for such a task. Due to the scarcity of these resources and the challenges inherent in processing them, we will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[37526,37527],"objectives":[{"kind":"craft","items":[{"name":"Oizys Scrap Wood","quantity":1}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":1}]},{"id":1066,"name":"EX+: Renewable Fuel II","job":0,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":600,"silver":980,"gold":1080,"text":"We require a number of talented artisans to work with the rare resources unearthed on the star. Those who receive this directive may consider themselves among the initiative's finest contributors─deemed to possess the exceptional skills necessary for such a task. Due to the scarcity of these resources and the challenges inherent in processing them, we will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[37528,37529],"objectives":[{"kind":"craft","items":[{"name":"Compressed Oizys Timber","quantity":1}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":1}]},{"id":1067,"name":"EX+: Renewable Fuel III","job":0,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":480,"silver":1000,"gold":1080,"text":"We require a number of talented artisans to work with the rare resources unearthed on the star. Those who receive this directive may consider themselves among the initiative's finest contributors─deemed to possess the exceptional skills necessary for such a task. Due to the scarcity of these resources and the challenges inherent in processing them, we will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[37530,37531],"objectives":[{"kind":"craft","items":[{"name":"Oizys Quasicoke","quantity":1}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":1}]},{"id":1068,"name":"Multi-purpose Alloy Components","job":1,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Many varieties of ore have been identified on Oizys that should be useful to the initiative. Given their abundance and ease of extraction, it is believed that the Voyagers had no interest in harnessing such mineral resources, which is a blessing for us. Our researchers have determined the alloy ratios for these ores to attain satisfactory hardness, and we call upon our able artisans to produce ingots of such.","recipes":[37532],"objectives":[{"kind":"craft","items":[{"name":"Standard Oizys Alloy Ingot","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1069,"name":"Oizys-primed Metal Processing I","job":1,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"We have determined that the gravitational anomalies on Oizys are in fact magical phenomena. Consequently, certain devices may malfunction unless they are shielded from aetheric interference. In order to mitigate this risk and protect our equipment, we require our artisans to treat materials for aether resistance. Meticulous craftsmanship is essential to ensure the efficacy of the treatment.","recipes":[37533],"objectives":[{"kind":"craft","items":[{"name":"Standard Alloy Plating","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1070,"name":"Gravitational Anomaly Gear I","job":1,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"While we employ rainbow crystals to stabilize gravity in the exploration zone, localized fluctuations still occur due to the influence of gravity spheres. In the interests of safety, we wish to secure equipment using wires and rivets, and seek contributions of such fastenings. Large quantities delivered on an ongoing basis will be required to cover all areas subjected to gravitational anomalies.","recipes":[37534],"objectives":[{"kind":"craft","items":[{"name":"Standard Wire","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1071,"name":"Supplementary Excavation Equipment I","job":1,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Drone scans have revealed that numerous ancient ruins lie buried on Oizys. While the most expedient way to reach these structures is to excavate with heavy machinery, most of the work must be performed by hand to avoid causing damage. To that end, we seek contributions of digging implements to be used at excavation sites─the better the quality, the more efficiently we can carry out the task.","recipes":[37535],"objectives":[{"kind":"craft","items":[{"name":"Excavator's Spade","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1072,"name":"Multi-purpose Alloy Component Resupply","job":1,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Many varieties of ore have been identified on Oizys that should be useful to the initiative. Given their abundance and ease of extraction, it is believed that the Voyagers had no interest in harnessing such mineral resources, which is a blessing for us. Our researchers have determined the alloy ratios for these ores to attain satisfactory hardness, and we call upon our able artisans to produce ingots of such.","recipes":[37536],"objectives":[{"kind":"craft","items":[{"name":"Standard Oizys Alloy Ingot","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1073,"name":"Oizys-primed Metal Processing II","job":1,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"We have determined that the gravitational anomalies on Oizys are in fact magical phenomena. Consequently, certain devices may malfunction unless they are shielded from aetheric interference. In order to mitigate this risk and protect our equipment, we require our artisans to treat materials for aether resistance. Meticulous craftsmanship is essential to ensure the efficacy of the treatment.","recipes":[37537],"objectives":[{"kind":"craft","items":[{"name":"Standard Magnetic Shielding","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1074,"name":"Gravitational Anomaly Gear II","job":1,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1300,"gold":3000,"text":"While we employ rainbow crystals to stabilize gravity in the exploration zone, localized fluctuations still occur due to the influence of gravity spheres. In the interests of safety, we wish to secure equipment using wires and rivets, and seek contributions of such fastenings. Large quantities delivered on an ongoing basis will be required to cover all areas subjected to gravitational anomalies.","recipes":[37538],"objectives":[{"kind":"craft","items":[{"name":"Standard Rivets","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1075,"name":"Supplementary Excavation Equipment II","job":1,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":700,"gold":1500,"text":"Drone scans have revealed that numerous ancient ruins lie buried on Oizys. While the most expedient way to reach these structures is to excavate with heavy machinery, most of the work must be performed by hand to avoid causing damage. To that end, we seek contributions of digging implements to be used at excavation sites─the better the quality, the more efficiently we can carry out the task.","recipes":[37539,37540],"objectives":[{"kind":"craft","items":[{"name":"Excavator's Barrow","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1076,"name":"Enhanced Alloy Components","job":1,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1600,"gold":2400,"text":"Many varieties of ore have been identified on Oizys that should be useful to the initiative. Given their abundance and ease of extraction, it is believed that the Voyagers had no interest in harnessing such mineral resources, which is a blessing for us. Our researchers have determined the alloy ratios for these ores to attain satisfactory hardness, and we call upon our able artisans to produce ingots of such.","recipes":[37541],"objectives":[{"kind":"craft","items":[{"name":"Standard Oizys Alloy Ingot","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":1077,"name":"Oizys-primed Containers I","job":1,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1600,"gold":2400,"text":"We have determined that the gravitational anomalies on Oizys are in fact magical phenomena. Consequently, certain devices may malfunction unless they are shielded from aetheric interference. In order to mitigate this risk and protect our equipment, we require our artisans to treat materials for aether resistance. Meticulous craftsmanship is essential to ensure the efficacy of the treatment.","recipes":[37542],"objectives":[{"kind":"craft","items":[{"name":"Standard Gravity Containers","quantity":3}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":3}]},{"id":1078,"name":"Gravitational Anomaly Gear III","job":1,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":2700,"gold":3000,"text":"While we employ rainbow crystals to stabilize gravity in the exploration zone, localized fluctuations still occur due to the influence of gravity spheres. In the interests of safety, we wish to secure equipment using wires and rivets, and seek contributions of such fastenings. Large quantities delivered on an ongoing basis will be required to cover all areas subjected to gravitational anomalies.","recipes":[37543],"objectives":[{"kind":"craft","items":[{"name":"Improved Rivets","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":1079,"name":"Advanced Excavation Equipment","job":1,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1500,"text":"Drone scans have revealed that numerous ancient ruins lie buried on Oizys. While the most expedient way to reach these structures is to excavate with heavy machinery, most of the work must be performed by hand to avoid causing damage. To that end, we seek contributions of digging implements to be used at excavation sites─the better the quality, the more efficiently we can carry out the task.","recipes":[37544,37545],"objectives":[{"kind":"craft","items":[{"name":"Excavator's Chisel","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1080,"name":"Powersuit Components","job":1,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1600,"gold":2100,"text":"We have recently developed a powered suit that enhances the physical capabilities of workers. This sophisticated device works by augmenting the wearer's motor functions, allowing them to transport heavy objects. Yet while an assembly line has been set up, the suit's complexity has made it difficult to reach production targets. In order to make up the shortfall, we ask our artisans to contribute a number of components.","recipes":[37546,37547],"objectives":[{"kind":"craft","items":[{"name":"Indicolite Plate","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1081,"name":"Enhanced Alloy Component Resupply","job":1,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1600,"text":"Many varieties of ore have been identified on Oizys that should be useful to the initiative. Given their abundance and ease of extraction, it is believed that the Voyagers had no interest in harnessing such mineral resources, which is a blessing for us. Our researchers have determined the alloy ratios for these ores to attain satisfactory hardness, and we call upon our able artisans to produce ingots of such.","recipes":[37548],"objectives":[{"kind":"craft","items":[{"name":"Standard Oizys Alloy Ingot","quantity":2}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1082,"name":"Voyager Civilization Survey","job":1,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1600,"text":"Fragments of artifacts have been discovered within the ruins on Oizys, prompting our researchers to speculate after their complete forms. In order to deepen our understanding of the Voyagers, we ask our artisans to restore these artifacts based on projections. While they are expected to somewhat resemble objects on Etheirys, we would welcome any insights into our cosmic predecessors' way of life.","recipes":[37549],"objectives":[{"kind":"craft","items":[{"name":"Restored Voyagers' Weapon","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1083,"name":"Gravitational Anomaly Gear Advanced Processing","job":1,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1400,"gold":2000,"text":"While we employ rainbow crystals to stabilize gravity in the exploration zone, localized fluctuations still occur due to the influence of gravity spheres. In the interests of safety, we wish to secure equipment using wires and rivets, and seek contributions of such fastenings. Large quantities delivered on an ongoing basis will be required to cover all areas subjected to gravitational anomalies.","recipes":[37550],"objectives":[{"kind":"craft","items":[{"name":"Enhanced Oversized Rivets","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1084,"name":"Oversized Drill Resupply","job":1,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1400,"gold":2000,"text":"Drone scans have revealed that numerous ancient ruins lie buried on Oizys. While the most expedient way to reach these structures is to excavate with heavy machinery, most of the work must be performed by hand to avoid causing damage. To that end, we seek contributions of digging implements to be used at excavation sites─the better the quality, the more efficiently we can carry out the task.","recipes":[37551],"objectives":[{"kind":"score","items":[],"bronzeScore":600,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1085,"name":"Coastal Installation Material Rust-proofing","job":1,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1000,"gold":1600,"text":"Oizys is home to a geographical feature previously unseen on the initiative: an ocean. Unlike the locale on the moon which is one only in name, this is genuinely a vast body of water, and its briny breeze has already caused corrosion at the nearby base. With the longevity of the installation in mind, we wish to stockpile rust-resistant materials for maintenance and repairs, and request contributions of such.","recipes":[37552],"objectives":[{"kind":"craft","items":[{"name":"Initiative Rust-resistant Panel","quantity":2}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":1086,"name":"Oizys-primed Containers II","job":1,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":880,"gold":1050,"text":"We have determined that the gravitational anomalies on Oizys are in fact magical phenomena. Consequently, certain devices may malfunction unless they are shielded from aetheric interference. In order to mitigate this risk and protect our equipment, we require our artisans to treat materials for aether resistance. Meticulous craftsmanship is essential to ensure the efficacy of the treatment.","recipes":[37553,37554],"objectives":[{"kind":"craft","items":[{"name":"Initiative Long Storage Container","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1087,"name":"EX: Oddweight Azurite Refining","job":1,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":800,"gold":1000,"text":"Our researchers have reported that oddweight azurite, deposits of which are found in areas such as Shadefleet, appears highly resistant to gravitational anomalies. This singular property, attributed to an aetheric composition that suppresses magic, promises to make the ore invaluable for our efforts on Oizys, and we request the cooperation of artisans to produce ingots of high purity for testing purposes.","recipes":[37555],"objectives":[{"kind":"score","items":[],"bronzeScore":400,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":1088,"name":"EX: Gravity Generator Miniaturization I","job":1,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":800,"gold":1000,"text":"Gravity generators have been a boon on Oizys, allowing feats such as the construction of a rock bridge between the Unmoored Anchor and Shadefeet. However, their large size renders them largely immobile, and we wish to develop compact units that offer portability and flexibility. We call upon our capable artisans to produce prototypes based on blueprints prepared by our engineers.","recipes":[37556],"objectives":[{"kind":"score","items":[],"bronzeScore":400,"specialAction":"StellarSteadyHand","specialActionCharges":1}]},{"id":1089,"name":"EX: Powersuit Chest Component","job":1,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":800,"gold":1000,"text":"We have recently developed a powered suit that enhances the physical capabilities of workers. This sophisticated device works by augmenting the wearer's motor functions, allowing them to transport heavy objects. Yet while an assembly line has been set up, the suit's complexity has made it difficult to reach production targets. In order to make up the shortfall, we ask our artisans to contribute a number of components.","recipes":[37557],"objectives":[{"kind":"craft","items":[{"name":"Initiative Powersuit Component","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1090,"name":"EX: Maintenance Part Advanced Processing","job":1,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1600,"text":"Water and energy are the lifeblood of our installations. Should their delivery networks fail, operations would grind to a halt, and the importance of regular maintenance and timely repair cannot be overstated. As we settle in for the long haul on Oizys, it is critical that we have ample stockpiles of replacement parts. To that end, we would turn to our artisans to contribute items that meet our exacting specifications.","recipes":[37558],"objectives":[{"kind":"craft","items":[{"name":"Infrastructure Maintenance Part","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1091,"name":"EX+: Gravity Generator Miniaturization II","job":1,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":980,"gold":1080,"text":"While the prototype compact gravity generator has performed satisfactorily in the field, there are a number of areas in which it could be improved. On this occasion, we request the assembly of revised generators that incorporate an upgrade module primarily designed to boost beam accuracy. As the process is anticipated to be highly challenging, our artisans are advised to spare no preparation.","recipes":[37559,37560],"objectives":[{"kind":"craft","items":[{"name":"Improved Portable Gravity Generator","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1092,"name":"EX+: Voyager Artifact Restoration","job":1,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":540,"silver":1800,"gold":2000,"text":"Metal artifacts are being discovered in considerable quantities within the ruins on Oizys, but due to severe dilapidation, most are of limited value in our study of the Voyagers. In hopes of a breakthrough, we seek artisans to restore the artifacts based on reconstructed images produced by archaeologists. Advanced techniques and a delicate touch will be required in the handling of these precious relics.","recipes":[37561],"objectives":[{"kind":"score","items":[],"bronzeScore":1000,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":1093,"name":"EX+: Voyager Implement Reproduction I","job":1,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":980,"gold":1080,"text":"What form did the Voyagers take? In the absence of biological evidence, the tools and furnishings they once used are the puzzle pieces for solving this mystery, serving to reveal characteristics such as size and physiology. Our researchers wish to recreate such items based on schematics produced with available data, and we seek contributions from artisans who possess the requisite skills and attention to detail.","recipes":[37562,37563],"objectives":[{"kind":"craft","items":[{"name":"Voyagers' Precision Circuit Board","quantity":1}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":1}]},{"id":1094,"name":"EX+: Voyager Implement Reproduction II","job":1,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":600,"silver":980,"gold":1080,"text":"What form did the Voyagers take? In the absence of biological evidence, the tools and furnishings they once used are the puzzle pieces for solving this mystery, serving to reveal characteristics such as size and physiology. Our researchers wish to recreate such items based on schematics produced with available data, and we seek contributions from artisans who possess the requisite skills and attention to detail.","recipes":[37564,37565],"objectives":[{"kind":"craft","items":[{"name":"Voyagers' High-purity Crystal","quantity":1}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":1}]},{"id":1095,"name":"EX+: Large Voyager Device Restoration","job":1,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":480,"silver":1000,"gold":1080,"text":"What form did the Voyagers take? In the absence of biological evidence, the tools and furnishings they once used are the puzzle pieces for solving this mystery, serving to reveal characteristics such as size and physiology. Our researchers wish to recreate such items based on schematics produced with available data, and we seek contributions from artisans who possess the requisite skills and attention to detail.","recipes":[37566,37567],"objectives":[{"kind":"craft","items":[{"name":"Reproduced Voyagers' Ornament","quantity":1}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":1}]},{"id":1096,"name":"Multi-purpose Alloy Components","job":2,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Many varieties of ore have been identified on Oizys that should be useful to the initiative. Given their abundance and ease of extraction, it is believed that the Voyagers had no interest in harnessing such mineral resources, which is a blessing for us. Our researchers have determined the alloy ratios for these ores to attain satisfactory hardness, and we call upon our able artisans to produce ingots of such.","recipes":[37568],"objectives":[{"kind":"craft","items":[{"name":"Standard Oizys Alloy Ingot","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1097,"name":"Oizys-primed Metal Processing I","job":2,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"We have determined that the gravitational anomalies on Oizys are in fact magical phenomena. Consequently, certain devices may malfunction unless they are shielded from aetheric interference. In order to mitigate this risk and protect our equipm  of workers. This sophisticated device works by augmenting the wearer's motor functions, allowing them to transport heavy objects. Yet while an assembly line has been set up, the suit's complexity has made it difficult to reach production targets. In order to make up the shortfall, we ask our artisans to contribute a number of components.","recipes":[37582,37583],"objectives":[{"kind":"craft","items":[{"name":"Indicolite Plate","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1109,"name":"Enhanced Alloy Component Resupply","job":2,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1600,"text":"Many varieties of ore have been identified on Oizys that should be useful to the initiative. Given their abundance and ease of extraction, it is believed that the Voyagers had no interest in harnessing such mineral resources, which is a blessing for us. Our researchers have determined the alloy ratios for these ores to attain satisfactory hardness, and we call upon our able artisans to produce ingots of such.","recipes":[37584],"objectives":[{"kind":"craft","items":[{"name":"Standard Oizys Alloy Ingot","quantity":2}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1110,"name":"Voyager Civilization Survey","job":2,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1600,"text":"Fragments of artifacts have been discovered within the ruins on Oizys, prompting our researchers to speculate after their complete forms. In order to deepen our understanding of the Voyagers, we ask our artisans to restore these artifacts based on projections. While they are expected to somewhat resemble objects on Etheirys, we would welcome any insights into our cosmic predecessors' way of life.","recipes":[37585],"objectives":[{"kind":"craft","items":[{"name":"Restored Voyagers' Armor","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1111,"name":"Gravitational Anomaly Gear Advanced Processing","job":2,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1400,"gold":2000,"text":"While we employ rainbow crystals to stabilize gravity in the exploration zone, localized fluctuations still occur due to the influence of gravity spheres. In the interests of safety, we wish to secure equipment using wires and rivets, and seek contributions of such fastenings. Large quantities delivered on an ongoing basis will be required to cover all areas subjected to gravitational anomalies.","recipes":[37586],"objectives":[{"kind":"craft","items":[{"name":"Enhanced Oversized Rivets","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1112,"name":"Oversized Drill Resupply","job":2,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1400,"gold":2000,"text":"Drone scans have revealed that numerous ancient ruins lie buried on Oizys. While the most expedient way to reach these structures is to excavate with heavy machinery, most of the work must be performed by hand to avoid causing damage. To that end, we seek contributions of digging implements to be used at excavation sites─the better the quality, the more efficiently we can carry out the task.","recipes":[37587],"objectives":[{"kind":"score","items":[],"bronzeScore":600,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1113,"name":"Coastal Installation Material Rust-proofing","job":2,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1000,"gold":1600,"text":"Oizys is home to a geographical feature previously unseen on the initiative: an ocean. Unlike the locale on the moon which is one only in name, this is genuinely a vast body of water, and its briny breeze has already caused corrosion at the nearby base. With the longevity of the installation in mind, we wish to stockpile rust-resistant materials for maintenance and repairs, and request contributions of such.","recipes":[37588],"objectives":[{"kind":"craft","items":[{"name":"Initiative Rust-resistant Panel","quantity":2}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":1114,"name":"Oizys-primed Containers II","job":2,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":880,"gold":1050,"text":"We have determined that the gravitational anomalies on Oizys are in fact magical phenomena. Consequently, certain devices may malfunction unless they are shielded from aetheric interference. In order to mitigate this risk and protect our equipment, we require our artisans to treat materials for aether resistance. Meticulous craftsmanship is essential to ensure the efficacy of the treatment.","recipes":[37589,37590],"objectives":[{"kind":"craft","items":[{"name":"Initiative Long Storage Container","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1115,"name":"EX: Oddweight Azurite Refining","job":2,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":800,"gold":1000,"text":"Our researchers have reported that oddweight azurite, deposits of which are found in areas such as Shadefleet, appears highly resistant to gravitational anomalies. This singular property, attributed to an aetheric composition that suppresses magic, promises to make the ore invaluable for our efforts on Oizys, and we request the cooperation of artisans to produce ingots of high purity for testing purposes.","recipes":[37591],"objectives":[{"kind":"score","items":[],"bronzeScore":400,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":1116,"name":"EX: Gravity Generator Miniaturization I","job":2,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":800,"gold":1000,"text":"Gravity generators have been a boon on Oizys, allowing feats such as the construction of a rock bridge between the Unmoored Anchor and Shadefeet. However, their large size renders them largely immobile, and we wish to develop compact units that offer portability and flexibility. We call upon our capable artisans to produce prototypes based on blueprints prepared by our engineers.","recipes":[37592],"objectives":[{"kind":"score","items":[],"bronzeScore":400,"specialAction":"StellarSteadyHand","specialActionCharges":1}]},{"id":1117,"name":"EX: Powersuit Chest Component","job":2,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":800,"gold":1000,"text":"We have recently developed a powered suit that enhances the physical capabilities of workers. This sophisticated device works by augmenting the wearer's motor functions, allowing them to transport heavy objects. Yet while an assembly line has been set up, the suit's complexity has made it difficult to reach production targets. In order to make up the shortfall, we ask our artisans to contribute a number of components.","recipes":[37593],"objectives":[{"kind":"craft","items":[{"name":"Initiative Powersuit Component","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1118,"name":"EX: Maintenance Part Advanced Processing","job":2,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1600,"text":"Water and energy are the lifeblood of our installations. Should their delivery networks fail, operations would grind to a halt, and the importance of regular maintenance and timely repair cannot be overstated. As we settle in for the long haul on Oizys, it is critical that we have ample stockpiles of replacement parts. To that end, we would turn to our artisans to contribute items that meet our exacting specifications.","recipes":[37594],"objectives":[{"kind":"craft","items":[{"name":"Infrastructure Maintenance Part","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1119,"name":"EX+: Gravity Generator Miniaturization II","job":2,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":980,"gold":1080,"text":"While the prototype compact gravity generator has performed satisfactorily in the field, there are a number of areas in which it could be improved. On this occasion, we request the assembly of revised generators that incorporate an upgrade module primarily designed to boost beam accuracy. As the process is anticipated to be highly challenging, our artisans are advised to spare no preparation.","recipes":[37595,37596],"objectives":[{"kind":"craft","items":[{"name":"Improved Portable Gravity Generator","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1120,"name":"EX+: Voyager Artifact Restoration","job":2,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":540,"silver":1800,"gold":2000,"text":"Metal artifacts are being discovered in considerable quantities within the ruins on Oizys, but due to severe dilapidation, most are of limited value in our study of the Voyagers. In hopes of a breakthrough, we seek artisans to restore the artifacts based on reconstructed images produced by archaeologists. Advanced techniques and a delicate touch will be required in the handling of these precious relics.","recipes":[37597],"objectives":[{"kind":"score","items":[],"bronzeScore":1000,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":1121,"name":"EX+: Voyager Implement Reproduction I","job":2,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":980,"gold":1080,"text":"What form did the Voyagers take? In the absence of biological evidence, the tools and furnishings they once used are the puzzle pieces for solving this mystery, serving to reveal characteristics such as size and physiology. Our researchers wish to recreate such items based  harnessing such mineral resources, which is a blessing for us. Our researchers have determined the alloy ratios for these ores to attain satisfactory hardness, and we call upon our able artisans to produce ingots of such.","recipes":[37620],"objectives":[{"kind":"craft","items":[{"name":"Standard Oizys Alloy Ingot","quantity":2}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1138,"name":"Voyager Civilization Survey","job":3,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1600,"text":"Fragments of artifacts have been discovered within the ruins on Oizys, prompting our researchers to speculate after their complete forms. In order to deepen our understanding of the Voyagers, we ask our artisans to restore these artifacts based on projections. While they are expected to somewhat resemble objects on Etheirys, we would welcome any insights into our cosmic predecessors' way of life.","recipes":[37621],"objectives":[{"kind":"craft","items":[{"name":"Restored Voyagers' Bracers","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1139,"name":"Gravitational Anomaly Gear Advanced Processing","job":3,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1400,"gold":2000,"text":"While we employ rainbow crystals to stabilize gravity in the exploration zone, localized fluctuations still occur due to the influence of gravity spheres. In the interests of safety, we wish to secure equipment using wires and rivets, and seek contributions of such fastenings. Large quantities delivered on an ongoing basis will be required to cover all areas subjected to gravitational anomalies.","recipes":[37622],"objectives":[{"kind":"craft","items":[{"name":"Enhanced Oversized Rivets","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1140,"name":"Oversized Drill Resupply","job":3,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1400,"gold":2000,"text":"Drone scans have revealed that numerous ancient ruins lie buried on Oizys. While the most expedient way to reach these structures is to excavate with heavy machinery, most of the work must be performed by hand to avoid causing damage. To that end, we seek contributions of digging implements to be used at excavation sites─the better the quality, the more efficiently we can carry out the task.","recipes":[37623],"objectives":[{"kind":"score","items":[],"bronzeScore":600,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1141,"name":"Coastal Installation Material Rust-proofing","job":3,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1000,"gold":1600,"text":"Oizys is home to a geographical feature previously unseen on the initiative: an ocean. Unlike the locale on the moon which is one only in name, this is genuinely a vast body of water, and its briny breeze has already caused corrosion at the nearby base. With the longevity of the installation in mind, we wish to stockpile rust-resistant materials for maintenance and repairs, and request contributions of such.","recipes":[37624],"objectives":[{"kind":"craft","items":[{"name":"Initiative Rust-resistant Panel","quantity":2}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":1142,"name":"Oizys-primed Containers II","job":3,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":880,"gold":1050,"text":"We have determined that the gravitational anomalies on Oizys are in fact magical phenomena. Consequently, certain devices may malfunction unless they are shielded from aetheric interference. In order to mitigate this risk and protect our equipment, we require our artisans to treat materials for aether resistance. Meticulous craftsmanship is essential to ensure the efficacy of the treatment.","recipes":[37625,37626],"objectives":[{"kind":"craft","items":[{"name":"Initiative Long Storage Container","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1143,"name":"EX: Oddweight Azurite Refining","job":3,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":800,"gold":1000,"text":"Our researchers have reported that oddweight azurite, deposits of which are found in areas such as Shadefleet, appears highly resistant to gravitational anomalies. This singular property, attributed to an aetheric composition that suppresses magic, promises to make the ore invaluable for our efforts on Oizys, and we request the cooperation of artisans to produce ingots of high purity for testing purposes.","recipes":[37627],"objectives":[{"kind":"score","items":[],"bronzeScore":400,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":1144,"name":"EX: Gravity Generator Miniaturization I","job":3,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":800,"gold":1000,"text":"Gravity generators have been a boon on Oizys, allowing feats such as the construction of a rock bridge between the Unmoored Anchor and Shadefeet. However, their large size renders them largely immobile, and we wish to develop compact units that offer portability and flexibility. We call upon our capable artisans to produce prototypes based on blueprints prepared by our engineers.","recipes":[37628],"objectives":[{"kind":"score","items":[],"bronzeScore":400,"specialAction":"StellarSteadyHand","specialActionCharges":1}]},{"id":1145,"name":"EX: Powersuit Chest Component","job":3,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":800,"gold":1000,"text":"We have recently developed a powered suit that enhances the physical capabilities of workers. This sophisticated device works by augmenting the wearer's motor functions, allowing them to transport heavy objects. Yet while an assembly line has been set up, the suit's complexity has made it difficult to reach production targets. In order to make up the shortfall, we ask our artisans to contribute a number of components.","recipes":[37629],"objectives":[{"kind":"craft","items":[{"name":"Initiative Powersuit Component","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1146,"name":"EX: Maintenance Part Advanced Processing","job":3,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1600,"text":"Water and energy are the lifeblood of our installations. Should their delivery networks fail, operations would grind to a halt, and the importance of regular maintenance and timely repair cannot be overstated. As we settle in for the long haul on Oizys, it is critical that we have ample stockpiles of replacement parts. To that end, we would turn to our artisans to contribute items that meet our exacting specifications.","recipes":[37630],"objectives":[{"kind":"craft","items":[{"name":"Infrastructure Maintenance Part","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1147,"name":"EX+: Gravity Generator Miniaturization II","job":3,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":980,"gold":1080,"text":"While the prototype compact gravity generator has performed satisfactorily in the field, there are a number of areas in which it could be improved. On this occasion, we request the assembly of revised generators that incorporate an upgrade module primarily designed to boost beam accuracy. As the process is anticipated to be highly challenging, our artisans are advised to spare no preparation.","recipes":[37631,37632],"objectives":[{"kind":"craft","items":[{"name":"Improved Portable Gravity Generator","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1148,"name":"EX+: Voyager Artifact Restoration","job":3,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":540,"silver":1800,"gold":2000,"text":"Metal artifacts are being discovered in considerable quantities within the ruins on Oizys, but due to severe dilapidation, most are of limited value in our study of the Voyagers. In hopes of a breakthrough, we seek artisans to restore the artifacts based on reconstructed images produced by archaeologists. Advanced techniques and a delicate touch will be required in the handling of these precious relics.","recipes":[37633],"objectives":[{"kind":"score","items":[],"bronzeScore":1000,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":1149,"name":"EX+: Voyager Implement Reproduction I","job":3,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":980,"gold":1080,"text":"What form did the Voyagers take? In the absence of biological evidence, the tools and furnishings they once used are the puzzle pieces for solving this mystery, serving to reveal characteristics such as size and physiology. Our researchers wish to recreate such items based on schematics produced with available data, and we seek contributions from artisans who possess the requisite skills and attention to detail.","recipes":[37634,37635],"objectives":[{"kind":"craft","items":[{"name":"Voyagers' Precision Circuit Board","quantity":1}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":1}]},{"id":1150,"name":"EX+: Voyager Implement Reproduction II","job":3,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":600,"silver":980,"gold":1080,"text":"What form did the Voyagers take? In the absence of biological evidence, the tools and furnishings they once used are the puzzle pieces for solving this mystery, serving to reveal characteristics such as size and physiology. Our researchers wish to recreate such items based on schematics produced with available data, and we seek contributions from artisans who possess the requisite skills and attention to detail.","recipes":[37636,37637],"objectives":[{"kind":"craft","items":[{"name":"Voyagers' High-purity Crystal","quantity":1}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":1}]},{"id":1151,"name":"EX+: Production Precision Processing","job":3,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":480,"silver":1000,"gold":1080,"text":"What form did the Voyagers take? In the absence of biological evidence, the tools and furnishings they once used are the puzzle pieces for solving this mystery, serving to reveal characteristics such as size and physiology. Our researchers wish to recreate such items based on schematics produced with available data, and we seek contributions from artisans who possess the requisite skills and attention to detail.","recipes":[37638,37639],"objectives":[{"kind":"craft","items":[{"name":"Reproduced Voyagers' Displays","quantity":1}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":1}]},{"id":1152,"name":"Multi-purpose Fiber","job":4,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"The initiative utilizes fiber in many of its machines, with adjustments made in different locations to heighten environmental compatibility. On Oizys, for example, allowances must be made to cope with the star's gravitational anomalies. While we constantly strive to meet the ever-growing demand for fiber, assistance with our production efforts is always appreciated. Contributors are thus called upon to make routine deliveries of this vital material.","recipes":[37640],"objectives":[{"kind":"craft","items":[{"name":"Standard Hardened Fiber","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1153,"name":"Resilient Resource Processing I","job":4,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Through recent studies, we have come to understand Oizys's gravitational anomalies as magical phenomena. We must therefore ensure our equipment is protected from aetheric interference, lest we are plagued with malfunctions. Artisans are asked to manufacture the aether-resistant shielding crucial for this endeavor.","recipes":[37641],"objectives":[{"kind":"craft","items":[{"name":"Standard Protective Sheeting","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1154,"name":"Cushioned Packaging Materials","job":4,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Many of us have experienced the stomach-churning turbulence that sometimes befalls the *Galactic Way* during its landing sequence on Oizys. Although this is merely the influence of the star's gravitational anomalies, and not a fault with the vessel itself, the issue has led to occasional cargo damage. To mitigate the problem, we ask contributors to supply lightweight cushioning materials that may then be utilized on the craft.","recipes":[37642],"objectives":[{"kind":"craft","items":[{"name":"Standard Matting","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1155,"name":"Stabilizing Materials I","job":4,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"We have received reports of highly localized gravitational anomalies wreaking havoc, causing unsecured equipment and materials to float into the air. Based on our analysis, the most effective means of combating the issue is to simply weigh affected articles down with heavy objects. However, owing to the anomalies' intensity, standard rope will not suffice when fastening these rudimentary anchors. We thus seek skilled artisans to fabricate exceptionally strong rope fit for the task.","recipes":[37643],"objectives":[{"kind":"craft","items":[{"name":"Standard Rope","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1156,"name":"Additional Multi-purpose Fiber","job":4,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"The initiative utilizes fiber in many of its machines, with adjustments made in different locations to heighten environmental compatibility. On Oizys, for example, allowances must be made to cope with the star's gravitational anomalies. While we constantly strive to meet the ever-growing demand for fiber, assistance with our production efforts is always appreciated. Contributors are thus called upon to make routine deliveries of this vital material.","recipes":[37644],"objectives":[{"kind":"craft","items":[{"name":"Standard Hardened Fiber","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1157,"name":"Resilient Resource Processing II","job":4,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Through recent studies, we have come to understand Oizys's gravitational anomalies as magical phenomena. We must therefore ensure our equipment is protected from aetheric interference, lest we are plagued with malfunctions. Artisans are asked to manufacture the aether-resistant shielding crucial for this endeavor.","recipes":[37645],"objectives":[{"kind":"craft","items":[{"name":"Standard Protective Sheeting","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1158,"name":"Improved Cushioning Materials I","job":4,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1300,"gold":3000,"text":"Many of us have experienced the stomach-churning turbulence that sometimes befalls the *Galactic Way* during its landing sequence on Oizys. Although this is merely the influence of the star's gravitational anomalies, and not a fault with the vessel itself, the issue has led to occasional cargo damag
