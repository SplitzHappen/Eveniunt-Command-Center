"synced":true,"critical":false,"timeLimitSec":0,"silver":1600,"gold":2400,"text":"Through recent studies, we have come to understand Oizys's gravitational anomalies as magical phenomena. We must therefore ensure our equipment is protected from aetheric interference, lest we are plagued with malfunctions. Artisans are asked to manufacture the aether-resistant shielding crucial for this endeavor.","recipes":[37650],"objectives":[{"kind":"craft","items":[{"name":"Standard Protective Sheeting","quantity":3}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":3}]},{"id":1162,"name":"Improved Cushioning Materials II","job":4,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":2700,"gold":3000,"text":"Many of us have experienced the stomach-churning turbulence that sometimes befalls the *Galactic Way* during its landing sequence on Oizys. Although this is merely the influence of the star's gravitational anomalies, and not a fault with the vessel itself, the issue has led to occasional cargo damage. To mitigate the problem, we ask contributors to supply lightweight cushioning materials that may then be utilized on the craft.","recipes":[37651],"objectives":[{"kind":"craft","items":[{"name":"Standard Matting","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":1163,"name":"Stabilizing Materials III","job":4,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1500,"text":"We have received reports of highly localized gravitational anomalies wreaking havoc, causing unsecured equipment and materials to float into the air. Based on our analysis, the most effective means of combating the issue is to simply weigh affected articles down with heavy objects. However, owing to the anomalies' intensity, standard rope will not suffice when fastening these rudimentary anchors. We thus seek skilled artisans to fabricate exceptionally strong rope fit for the task.","recipes":[37652,37653],"objectives":[{"kind":"craft","items":[{"name":"Standard Rope","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1164,"name":"Resilient Tents","job":4,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1600,"gold":2100,"text":"We are seeking to improve the tents used by contributors stationed far from Terra Firma. This will be achieved by rendering them less susceptible to damage from floating rocks and errant sand. It is our hope that sturdy, dust-proof sleeping quarters will offer sounder sleep out in the field, and elevate workplace efficiency to new heights.","recipes":[37654,37655],"objectives":[{"kind":"craft","items":[{"name":"Oizys Pop-up Tent","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1165,"name":"Additional Enhanced Fiber","job":4,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1600,"text":"The initiative utilizes fiber in many of its machines, with adjustments made in different locations to heighten environmental compatibility. On Oizys, for example, allowances must be made to cope with the star's gravitational anomalies. While we constantly strive to meet the ever-growing demand for fiber, assistance with our production efforts is always appreciated. Contributors are thus called upon to make routine deliveries of this vital material.","recipes":[37656],"objectives":[{"kind":"craft","items":[{"name":"Standard Hardened Fiber","quantity":2}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1166,"name":"Fuel Processing and Storage","job":4,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1600,"text":"Recent reports from the Sound Pole indicate that a mass of driftwood has washed ashore. Tidal fluctuations induced by the star's gravitational anomalies are the likely cause─although it is not the phenomena, but the wood itself, that is our focus. Field researchers have discovered the material to be packed with resin-rich fatwood, and we fully intend to explore its use as a fuel source. There is also potential to extract the resin and produce oilcloth, which has a variety of preservative applications.","recipes":[37657],"objectives":[{"kind":"craft","items":[{"name":"Survey Oilcloth","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1167,"name":"High-performance Cushioning Materials","job":4,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1400,"gold":2000,"text":"Many of us have experienced the stomach-churning turbulence that sometimes befalls the *Galactic Way* during its landing sequence on Oizys. Although this is merely the influence of the star's gravitational anomalies, and not a fault with the vessel itself, the issue has led to occasional cargo damage. To mitigate the problem, we ask contributors to supply lightweight cushioning materials that may then be utilized on the craft.","recipes":[37658],"objectives":[{"kind":"craft","items":[{"name":"Soft Standard Sheeting","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1168,"name":"Stabilization Research","job":4,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1400,"gold":2000,"text":"We have received reports of highly localized gravitational anomalies wreaking havoc, causing unsecured equipment and materials to float into the air. Based on our analysis, the most effective means of combating the issue is to simply weigh affected articles down with heavy objects. However, owing to the anomalies' intensity, standard rope will not suffice when fastening these rudimentary anchors. We thus seek skilled artisans to fabricate exceptionally strong rope fit for the task.","recipes":[37659],"objectives":[{"kind":"score","items":[],"bronzeScore":600,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1169,"name":"Resilient Resource Specialist Processing","job":4,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1000,"gold":1600,"text":"Through recent studies, we have come to understand Oizys's gravitational anomalies as magical phenomena. We must therefore ensure our equipment is protected from aetheric interference, lest we are plagued with malfunctions. Artisans are asked to manufacture the aether-resistant shielding crucial for this endeavor.","recipes":[37660],"objectives":[{"kind":"craft","items":[{"name":"Enhanced Protective Sheeting","quantity":2}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":1170,"name":"Secure Tents","job":4,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":880,"gold":1050,"text":"We are seeking to improve the tents used by contributors stationed far from Terra Firma. This will be achieved by rendering them less susceptible to damage from floating rocks and errant sand. It is our hope that sturdy, dust-proof sleeping quarters will offer sounder sleep out in the field, and elevate workplace efficiency to new heights.","recipes":[37661,37662],"objectives":[{"kind":"craft","items":[{"name":"Oizys Pop-up Tent","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1171,"name":"EX: Mass-produced Transportation Materials","job":4,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":800,"gold":1000,"text":"According to reports, the *Galactic Way* was recently caught in a gravitational anomaly when leaving Oizys's atmosphere. The crew were able to quickly regain control of the vessel, but the onboard cargo sadly sustained major damage. Clearly, cushioning alone is insufficient to guarantee safe exports of the star's rare materials. We are therefore seeking artisans to produce a variety of sturdy, expertly crafted materials to secure freight during transit.","recipes":[37663],"objectives":[{"kind":"score","items":[],"bronzeScore":400,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":1172,"name":"EX: Excavation Necessities","job":4,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":800,"gold":1000,"text":"Here upon Oizys, we are all locked in a protracted battle against dust, but its ill effects are most keenly felt near excavation sites, where much of it is generated. Indeed, some contributors assigned to excavation duties have begun to complain of respiratory ailments. We wish to remedy the issue before it spirals out of control, and therefore ask contributors to produce comfortable dust-filtering masks for distribution.","recipes":[37664],"objectives":[{"kind":"score","items":[],"bronzeScore":400,"specialAction":"StellarSteadyHand","specialActionCharges":1}]},{"id":1173,"name":"EX: Excavation Equipment","job":4,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":800,"gold":1000,"text":"Desert Burrow has proven to be far larger than we initially predicted, not to mention filled with archaeological marvels. While our researchers delight in these discoveries, a more pressing concern faces us: severe shortages of excavation equipment. Contributors are called upon to meet the demand for sturdy scaffolding and rugged gloves. These vital supplies will help further accelerate our efforts to uncover relics and learn more of Oizys's past.","recipes":[37665],"objectives":[{"kind":"craft","items":[{"name":"Excavator's Gloves","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1174,"name":"EX: Beach Break Supplies","job":4,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1600,"text":"One of our La Noscean-born contributors submitted a request to make use of the Sound Pole on their days off─a request which we have duly authorized. Although we generally advise against bathing in the waters due to the intense electromagnetism in the sector, the risk posed by short breaks on the beach was deemed minimal. To help enhance the area's natural potential for relaxation, we require artisans to provide a variety of leisure supplies.","recipes":[37666],"objectives":[{"kind":"craft","items":[{"name":"Leisurely Heat-resistant Leather Wear","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1175,"name":"EX+: Planetary Resource Utilization","job":4,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":980,"gold":1080,"text":"With infrastructure expanding apace, we can at last begin to improve living conditions for our hardworking contributors. To support this benevolent endeavor, artisans are requested to fabricate a range of comfortable furnishings. By utilizing local materials in particular, it is hoped we might also gauge the potential of Oizys's natural resources for myriad other applications.","recipes":[37667,37668],"objectives":[{"kind":"craft","items":[{"name":"Enriching Mat","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1176,"name":"EX+: Organic Material Advanced Processing","job":4,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":540,"silver":1800,"gold":2000,"text":"Although Oizys's mineral wealth is much vaunted, our research teams are also investigating potential uses for the star's vegetation. Having evolved over millennia to thrive despite the ravages of gravitational anomalies, many species harbor promising properties we might utilize. To help further our investigation, contributors are asked to remove impurities from resin and fiber extracted from local flora, and process the resulting materials.","recipes":[37669],"objectives":[{"kind":"score","items":[],"bronzeScore":1000,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":1177,"name":"EX+: Star Admiral's Trouser Fabric I","job":4,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":980,"gold":1080,"text":"We require a number of talented artisans to work with the rare resources unearthed on the star. Those who receive this directive may consider themselves among the initiative's finest contributors─deemed to possess the exceptional skills necessary for such a task. Due to the scarcity of these resources and the challenges inherent in processing them, we will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[37670,37671],"objectives":[{"kind":"craft","items":[{"name":"Soft Survey Leather","quantity":1}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":1}]},{"id":1178,"name":"EX+: Star Admiral's Trouser Fabric II","job":4,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":600,"silver":980,"gold":1080,"text":"We require a number of talented artisans to work with the rare resources unearthed on the star. Those who receive this directive may consider themselves among the initiative's finest contributors─deemed to possess the exceptional skills necessary for such a task. Due to the scarcity of these resources and the challenges inherent in processing them, we will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[37672,37673],"objectives":[{"kind":"craft","items":[{"name":"Survey Cushion Leather","quantity":1}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":1}]},{"id":1179,"name":"EX+: Star Admiral's Trouser Fabric III","job":4,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":480,"silver":1000,"gold":1080,"text":"We require a number of talented artisans to work with the rare resources unearthed on the star. Those who receive this directive may consider themselves among the initiative's finest contributors─deemed to possess the exceptional skills necessary for such a task. Due to the scarcity of these resources and the challenges inherent in processing them, we will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[37674,37675],"objectives":[{"kind":"craft","items":[{"name":"Star Admiral's Trouser Fabric","quantity":1}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":1}]},{"id":1180,"name":"Multi-purpose Fiber","job":5,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"The initiative utilizes fiber in many of its machines, with adjustments made in different locations to heighten environmental compatibility. On Oizys, for example, allowances must be made to cope with the star's gravitational anomalies. While we constantly strive to meet the ever-growing demand for fiber, assistance with our production efforts is always appreciated. Contributors are thus called upon to make routine deliveries of this vital material.","recipes":[37676],"objectives":[{"kind":"craft","items":[{"name":"Standard Hardened Fiber","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1181,"name":"Resilient Resource Processing I","job":5,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Through recent studies, we have come to understand Oizys's gravitational anomalies as magical phenomena. We must therefore ensure our equipment is protected from aetheric interference, lest we are plagued with malfunctions. Artisans are asked to manufacture the aether-resistant shielding crucial for this endeavor.","recipes":[37677],"objectives":[{"kind":"craft","items":[{"name":"Standard Protective Sheeting","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1182,"name":"Cushioned Packaging Materials","job":5,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Many of us have experienced the stomach-churning turbulence that sometimes befalls the *Galactic Way* during its landing sequence on Oizys. Although this is merely the influence of the star's gravitational anomalies, and not a fault with the vessel itself, the issue has led to occasional cargo damage. To mitigate the problem, we ask contributors to supply lightweight cushioning materials that may then be utilized on the craft.","recipes":[37678],"objectives":[{"kind":"craft","items":[{"name":"Standard Cushion Cloth","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1183,"name":"Stabilizing Materials I","job":5,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"We have received reports of highly localized gravitational anomalies wreaking havoc, causing unsecured equipment and materials to float into the air. Based on our analysis, the most effective means of combating the issue is to simply weigh affected articles down with heavy objects. However, owing to the anomalies' intensity, standard rope will not suffice when fastening these rudimentary anchors. We thus seek skilled artisans to fabricate exceptionally strong rope fit for the task.","recipes":[37679],"objectives":[{"kind":"craft","items":[{"name":"Standard Rope","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1184,"name":"Additional Multi-purpose Fiber","job":5,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"The initiative utilizes fiber in many of its machines, with adjustments made in different locations to heighten environmental compatibility. On Oizys, for example, allowances must be made to cope with the star's gravitational anomalies. While we constantly strive to r such a task. Due to the scarcity of these resources and the challenges inherent in processing them, we will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[37706,37707],"objectives":[{"kind":"craft","items":[{"name":"Recycled Survey Velvet","quantity":1}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":1}]},{"id":1206,"name":"EX+: Star Admiral's Ornamentation II","job":5,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":600,"silver":980,"gold":1080,"text":"We require a number of talented artisans to work with the rare resources unearthed on the star. Those who receive this directive may consider themselves among the initiative's finest contributors─deemed to possess the exceptional skills necessary for such a task. Due to the scarcity of these resources and the challenges inherent in processing them, we will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[37708,37709],"objectives":[{"kind":"craft","items":[{"name":"Recycled Survey Silk","quantity":1}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":1}]},{"id":1207,"name":"EX+: Star Admiral's Ornamentation III","job":5,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":480,"silver":1000,"gold":1080,"text":"We require a number of talented artisans to work with the rare resources unearthed on the star. Those who receive this directive may consider themselves among the initiative's finest contributors─deemed to possess the exceptional skills necessary for such a task. Due to the scarcity of these resources and the challenges inherent in processing them, we will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[37710,37711],"objectives":[{"kind":"craft","items":[{"name":"Star Admiral's Coat Fabric","quantity":1}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":1}]},{"id":1208,"name":"Emergency Water Supply","job":6,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"The procurement of potable water is paramount to the initiative's─and, indeed, mankind's─survival. While we expected few water sources on Oizys's desolate landscape, its naturally occurring gravitational anomalies have presented us with a pleasant surprise: the discovery of a floating, spherical water source. Though its contents must be cleansed of some impurities, we believe that this water will meet our various needs, and require a stable supply for both research and consumption.","recipes":[37712],"objectives":[{"kind":"craft","items":[{"name":"Foregone Oasis Water","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1209,"name":"Survey Ferrofluid","job":6,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"On a star as gravitationally unstable as Oizys, what goes up does not necessarily come down. As a result, it becomes increasingly difficult to transport and store liquids such as fuel, lubricants, and sealants. To solve this conundrum, we have begun employing magnetically reactive ferrofluid. It is a vital resource for the maintenance of the initiative's precision machinery, and thus we implore our members to contribute as many samples as possible.","recipes":[37713],"objectives":[{"kind":"craft","items":[{"name":"Survey Ferrofluid","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1210,"name":"Quakeproof Materials","job":6,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Oizys's gravitational fluctuations occasionally result in meteorological and seismic phenomena, such as powerful wind gusts or minor earthquakes. Although the tremors may not be felt by the average researcher or Loporrit, they are no less dangerous than the windstorms, and could inflict long-term damage on our infrastructure if left unchecked. To combat the elements, we seek sturdy-yet-pliable construction materials for Terra Firma, that we might stave off any potential wear and tear.","recipes":[37714],"objectives":[{"kind":"craft","items":[{"name":"Tempered Survey Glass","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1211,"name":"Recycled Fuel Research I","job":6,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Presently, our main method of transporting supplies to and from Etheirys is via the *Galactic Way*. The crew has put much time and effort into these endeavors, but they are not without their fair share of troubles, and schedule delays do occur from time to time. In light of these circumstances, we must put forth every effort to conserve resources, and Mumukko has proposed we all do our part to repurpose used materials into fuels and fertilizers.","recipes":[37715],"objectives":[{"kind":"craft","items":[{"name":"Recycled Survey Fuel","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1212,"name":"Water Supply Preservation","job":6,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"The procurement of potable water is paramount to the initiative's─and, indeed, mankind's─survival. While we expected few water sources on Oizys's desolate landscape, its naturally occurring gravitational anomalies have presented us with a pleasant surprise: the discovery of a floating, spherical water source. Though its contents must be cleansed of some impurities, we believe that this water will meet our various needs, and require a stable supply for both research and consumption.","recipes":[37716],"objectives":[{"kind":"craft","items":[{"name":"Foregone Oasis Water","quantity":3}],"bronzeScor ly rationed─even when there is legitimate cause to celebrate! While we do strive to keep a small stock of these items for special occasions, there is growing concern for their shelf life. For morale's sake, we beseech those well versed in the culinary sciences to provide us with long-lasting confections or preservatives.","recipes":[37726,37727],"objectives":[{"kind":"craft","items":[{"name":"Survey Preservatives","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1221,"name":"High-purity Water","job":6,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1600,"text":"The procurement of potable water is paramount to the initiative's─and, indeed, mankind's─survival. While we expected few water sources on Oizys's desolate landscape, its naturally occurring gravitational anomalies have presented us with a pleasant surprise: the discovery of a floating, spherical water source. Though its contents must be cleansed of some impurities, we believe that this water will meet our various needs, and require a stable supply for both research and consumption.","recipes":[37728],"objectives":[{"kind":"craft","items":[{"name":"Foregone Oasis Water","quantity":2}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1222,"name":"Advanced Communicator Ferrofluid","job":6,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1600,"text":"On a star as gravitationally unstable as Oizys, what goes up does not necessarily come down. As a result, it becomes increasingly difficult to transport and store liquids such as fuel, lubricants, and sealants. To solve this conundrum, we have begun employing magnetically reactive ferrofluid. It is a vital resource for the maintenance of the initiative's precision machinery, and thus we implore our members to contribute as many samples as possible.","recipes":[37729],"objectives":[{"kind":"craft","items":[{"name":"Survey Ferrofluid","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1223,"name":"Ruin Reinforcement Components","job":6,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1400,"gold":2000,"text":"Oizys's gravitational fluctuations occasionally result in meteorological and seismic phenomena, such as powerful wind gusts or minor earthquakes. Although the tremors may not be felt by the average researcher or Loporrit, they are no less dangerous than the windstorms, and could inflict long-term damage on our infrastructure if left unchecked. To combat the elements, we seek sturdy-yet-pliable construction materials for Terra Firma, that we might stave off any potential wear and tear.","recipes":[37730],"objectives":[{"kind":"craft","items":[{"name":"Tempered Survey Glass","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1224,"name":"Recycled Fuel Research III","job":6,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1400,"gold":2000,"text":"Presently, our main method of transporting supplies to and from Etheirys is via the *Galactic Way*. The crew has put much time and effort into these endeavors, but they are not without their fair share of troubles, and schedule delays do occur from time to time. In light of these circumstances, we must put forth every effort to conserve resources, and Mumukko has proposed we all do our part to repurpose used materials into fuels and fertilizers.","recipes":[37731],"objectives":[{"kind":"score","items":[],"bronzeScore":600,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1225,"name":"High-quality Foodstuffs II","job":6,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1000,"gold":1600,"text":"Initiative members have expressed interest in distributing fruit to better satiate and satisfy our hardworking contributors. Unfortunately, Oizys's hostile climes are unsuitable for cultivating orchards, and the amount of fresh foodstuffs we can import is extremely limited. To counter this, we plan to research natural additives for more effective flavor preservation and develop high-quality dried fruit in the process. We welcome the expertise of seasoned culinarians and nutritionists to expedite our efforts.","recipes":[37732],"objectives":[{"kind":"craft","items":[{"name":"Survey Desiccant","quantity":2}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":1226,"name":"High-quality Foodstuffs III","job":6,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":880,"gold":1050,"text":"As ever, luxury imports from Etheirys are few and far between. Due to our meager supply on Oizys, celebratory wines and sweetmeats are strictly rationed─even when there is legitimate cause to celebrate! While we do strive to keep a small stock of these items for special occasions, there is growing concern for their shelf life. For morale's sake, we beseech those well versed in the culinary sciences to provide us with long-lasting confections or preservatives.","recipes":[37733,37734],"objectives":[{"kind":"craft","items":[{"name":"Survey Preservatives","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1227,"name":"EX: Archon Loaf Improvement Plan","job":6,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":800,"gold":1000,"text":"Although exceedingly rare, there are individuals who will experience feelings of euphoria during perceived times of strife. Perhaps unsurprisingly, these...optimistic individuals do exist among our members, and they regularly attempt to discover silver linings in adversity. In some extreme cases, these folk even challenge themselves to enhance their rations of Archon loaf─infamous for its abysmal flavor─by slathering it with various condiments. We entreat all culinary experts to contribute to their cause by delivering them unbridled happiness in the form of new condiments.","recipes":[37735],"objectives":[{"kind":"score","items":[],"bronzeScore":400,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":1228,"name":"EX: Refined Yeast Research","job":6,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":800,"gold":1000,"text":"Many among us have asked, “Is it possible to concoct an alcoholic beverage with Oizys's natural flora?” As if in answer to our fervent curiosity, our best and brightest have approved the use of our initiative-developed lunar yeast to find out. However, as its name implies, the yeast was initially developed for use in Sinus Ardorum, and so it falls to us to adapt it for Oizys's environs. We encourage all prospective cultivators to pitch in and aid the development of a new, gravity-resistant strain.","recipes":[37736],"objectives":[{"kind":"score","items":[],"bronzeScore":400,"specialAction":"StellarSteadyHand","specialActionCharges":1}]},{"id":1229,"name":"EX: Experimental Fermentation","job":6,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":800,"gold":1000,"text":"Our long-term experimental cultivation efforts have been rewarded, and we have managed to harvest several varieties of vegetables and legumes on Oizys. Whether our palates can tolerate them, however, remains to be seen. To better answer this question, we are currently enlisting experts in the culinary and medical sciences who can analyze the crops' nutritional properties and process them into palatable products─successful outcomes would be a major leap forward for the initiative.","recipes":[37737],"objectives":[{"kind":"craft","items":[{"name":"Refined Experimental Cultivar Juice","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1230,"name":"EX: Outskirts Supply Improvements","job":6,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1600,"text":"To ensure that no researcher goes without a hot meal, we are currently devising self-heating box lunches for those stationed in more remote locations across Oizys. In doing so, we hope to prevent further incidents involving researchers “accidentally” burning their Archon loaf to a crisp with fire magicks, and we encourage any culinarily minded artisans to join us in development.","recipes":[37738],"objectives":[{"kind":"craft","items":[{"name":"Survey Exothermic Agent","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1231,"name":"EX+: Terminal Restoration Supplies","job":6,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":980,"gold":1080,"text":"The Voyagers' ruins contain various crystalline terminals that were once operated by large streams of aether. However, the passage of time has rendered the terminals' functions─and many of its internal mechanisms─inefficient. To restore their original functionalities, we must first ensure the crystals can properly absorb aether, which will require coating them in a healthy supply of aetheric stimulants and amplifiers. This, of course, is where our contributors come in, and those who can repurpose our existing stock of alchemical supplies for this task will be greatly rewarded.","recipes":[37739,37740],"objectives":[{"kind":"craft","items":[{"name":"Survey Aetheric Stimulant","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1232,"name":"EX+: Excavation Materials","job":6,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":540,"silver":1800,"gold":2000,"text":"Due to eras of tectonic activity, a wealth of ancient objects in the Voyagers' ruins are entombed deep within the bedrock. Were we simply unearthing resources, we would have no qualms about utilizing our machinery to excavate them. Doing so in the ruins, however, would risk damaging invaluable relics, so we shall require a more alchemical approach to overcome these stony obstacles. As this task may involve the creation of potent─and highly corrosive─concoctions, we recommend it only to artisans with ample experience handling dangerous materials.","recipes":[37741],"objectives":[{"kind":"score","items":[],"bronzeScore":1000,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":1233,"name":"EX+: Cosmic Tool Enhancement I","job":6,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":980,"gold":1080,"text":"As part of our continued cosmic tool development project, our experts are currently redoubling their efforts to manufacture materials from Oizys-sourced resources. Due to the rarity of these resources and the difficulty involved in processing them, however, we have chosen to recruit only a handful of talented contributors to the cause. We will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[37742,37743],"objectives":[{"kind":"craft","items":[{"name":"Cosmic Tool-compatible Synthetic Earth Cluster","quantity":1}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":1}]},{"id":1234,"name":"EX+: Cosmic Tool Enhancement II","job":6,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":600,"silver":980,"gold":1080,"text":"As part of our continued cosmic tool development project, our experts are currently redoubling their efforts to manufacture materials from Oizys-sourced resources. Due to the rarity of these resources and the difficulty involved in processing them, however, we have chosen to recruit only a handful of talented contributors to the cause. We will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[37744,37745],"objectives":[{"kind":"craft","items":[{"name": a stable supply for both research and consumption.","recipes":[37757],"objectives":[{"kind":"craft","items":[{"name":"Foregone Oasis Water","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":1245,"name":"Mammet Ferrofluid","job":7,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1600,"gold":2400,"text":"On a star as gravitationally unstable as Oizys, what goes up does not necessarily come down. As a result, it becomes increasingly difficult to transport and store liquids such as fuel, lubricants, and sealants. To solve this conundrum, we have begun employing magnetically reactive ferrofluid. It is a vital resource for the maintenance of the initiative's precision machinery, and thus we implore our members to contribute as many samples as possible.","recipes":[37758],"objectives":[{"kind":"craft","items":[{"name":"Survey Ferrofluid","quantity":3}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":3}]},{"id":1246,"name":"Windproof Materials","job":7,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":2700,"gold":3000,"text":"Oizys's gravitational fluctuations occasionally result in meteorological and seismic phenomena, such as powerful wind gusts or minor earthquakes. Although the tremors may not be felt by the average researcher or Loporrit, they are no less dangerous than the windstorms, and could inflict long-term damage on our infrastructure if left unchecked. To combat the elements, we seek sturdy-yet-pliable construction materials for Terra Firma, that we might stave off any potential wear and tear.","recipes":[37759],"objectives":[{"kind":"craft","items":[{"name":"Microelastic Survey Putty","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":1247,"name":"Recycled Fuel Research I","job":7,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1500,"text":"Presently, our main method of transporting supplies to and from Etheirys is via the *Galactic Way*. The crew has put much time and effort into these endeavors, but they are not without their fair share of troubles, and schedule delays do occur from time to time. In light of these circumstances, we must put forth every effort to conserve resources, and Mumukko has proposed we all do our part to repurpose used materials into fuels and fertilizers.","recipes":[37760,37761],"objectives":[{"kind":"craft","items":[{"name":"Recycled Survey Fertilizer","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1248,"name":"High-quality Foodstuffs I","job":7,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1600,"gold":2100,"text":"As ever, luxury imports from Etheirys are few and far between. Due to our meager supply on Oizys, celebratory wines and sweetmeats are strictly rationed─even when there is legitimate cause to celebrate! While we do strive to keep a small stock of these items for special occasions, there is growing concern for their shelf life. For morale's sake, we beseech those well versed in the culinary sciences to provide us with long-lasting confections or preservatives.","recipes":[37762,37763],"objectives":[{"kind":"craft","items":[{"name":"Stable Fruitcake","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1249,"name":"High-purity Water","job":7,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1600,"text":"The procurement of potable water is paramount to the initiative's─and, indeed, mankind's─survival. While we expected few water sources on Oizys's desolate landscape, its naturally occurring gravitational anomalies have presented us with a pleasant surprise: the discovery of a floating, spherical water source. Though its contents must be cleansed of some impurities, we believe that this water will meet our various needs, and require a stable supply for both research and consumption.","recipes":[37764],"objectives":[{"kind":"craft","items":[{"name":"Foregone Oasis Water","quantity":2}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1250,"name":"Advanced Communicator Ferrofluid","job":7,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1600,"text":"On a star as gravitationally unstable as Oizys, what goes up does not necessarily come down. As a result, it becomes increasingly difficult to transport and store liquids such as fuel, lubricants, and sealants. To solve this conundrum, we have begun employing magnetically reactive ferrofluid. It is a vital resource for the maintenance of the initiative's precision machinery, and thus we implore our members to contribute as many samples as possible.","recipes":[37765],"objectives":[{"kind":"craft","items":[{"name":"Survey Ferrofluid","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1251,"name":"Ruin Reinforcement Components","job":7,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1400,"gold":2000,"text":"Oizys's gravitational fluctuations occasionally result in meteorological and seismic phenomena, such as powerful wind gusts or minor earthquakes. Although the tremors may not be felt by the average researcher or Loporrit, they are no less dangerous than the windstorms, and could inflict long-term damage on our infrastructure if left unchecked. To combat the elements, we seek sturdy-yet-pliable construction materials for Terra Firma, that we might stave off any potential wear and tear.","recipes":[37766],"objectives":[{"kind":"craft","items":[{"name":"Microelastic Survey Putty","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1252,"name":"Recycled Fuel Research II","job":7,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1400,"gold":2000,"text":"Presently, our main method of transporting supplies to and from Etheirys is via the *Galactic Way*. The crew has put much time and effort into these endeavors, but they are not without their fair share of troubles, and schedule delays do occur from time to time. In light of these circumstances, we must put forth every effort to conserve resources, and Mumukko has proposed we all do our part to repurpose used materials into fuels and fertilizers.","recipes":[37767],"objectives":[{"kind":"score","items":[],"bronzeScore":600,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1253,"name":"High-quality Foodstuffs II","job":7,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1000,"gold":1600,"text":"Initiative members have expressed interest in distributing fruit to better satiate and satisfy our hardworking contributors. Unfortunately, Oizys's hostile climes are unsuitable for cultivating orchards, and the amount of fresh foodstuffs we can import is extremely limited. To counter this, we plan to research natural additives for more effective flavor preservation and develop high-quality dried fruit in the process. We welcome the expertise of seasoned culinarians and nutritionists to expedite our efforts.","recipes":[37768],"objectives":[{"kind":"craft","items":[{"name":"Stable Dried Fruit","quantity":2}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":1254,"name":"High-quality Foodstuffs III","job":7,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":880,"gold":1050,"text":"As ever, luxury imports from Etheirys are few and far between. Due to our meager supply on Oizys, celebratory wines and sweetmeats are strictly rationed─even when there is legitimate cause to celebrate! While we do strive to keep a small stock of these items for special occasions, there is growing concern for their shelf life. For morale's sake, we beseech those well versed in the culinary sciences to provide us with long-lasting confections or preservatives.","recipes":[37769,37770],"objectives":[{"kind":"craft","items":[{"name":"Stable Fruitcake","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1255,"name":"EX: Archon Loaf Improvement Plan","job":7,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":800,"gold":1000,"text":"Although exceedingly rare, there are individuals who will experience feelings of euphoria during perceived times of strife. Perhaps unsurprisingly, these...optimistic individuals do exist among our members, and they regularly attempt to discover silver linings in adversity. In some extreme cases, these folk even challenge themselves to enhance their rations of Archon loaf─infamous for its abysmal flavor─by slathering it with various condiments. We entreat all culinary experts to contribute to their cause by delivering them unbridled happiness in the form of new condiments.","recipes":[37771],"objectives":[{"kind":"score","items":[],"bronzeScore":400,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":1256,"name":"EX: Refined Yeast Research","job":7,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":800,"gold":1000,"text":"Many among us have asked, “Is it possible to concoct an alcoholic beverage with Oizys's natural flora?” As if in answer to our fervent curiosity, our best and brightest have approved the use of our initiative-developed lunar yeast to find out. However, as its name implies, the yeast was initially developed for use in Sinus Ardorum, and so it falls to us to adapt it for Oizys's environs. We encourage all prospective cultivators to pitch in and aid the development of a new, gravity-resistant strain.","recipes":[37772],"objectives":[{"kind":"score","items":[],"bronzeScore":400,"specialAction":"StellarSteadyHand","specialActionCharges":1}]},{"id":1257,"name":"EX: Experimental Fermentation","job":7,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":800,"gold":1000,"text":"Our long-term experimental cultivation efforts have been rewarded, and we have managed to harvest several varieties of vegetables and legumes on Oizys. Whether our palates can tolerate them, however, remains to be seen. To better answer this question, we are currently enlisting experts in the culinary and medical sciences who can analyze the crops' nutritional properties and process them into palatable products─successful outcomes would be a major leap forward for the initiative.","recipes":[37773],"objectives":[{"kind":"craft","items":[{"name":"Refined Quasimeatballs","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1258,"name":"EX: Outskirts Supply Improvements","job":7,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1600,"text":"To ensure that no researcher goes without a hot meal, we are currently devising self-heating box lunches for those stationed in more remote locations across Oizys. In doing so, we hope to prevent further incidents involving researchers “accidentally” burning their Archon loaf to a crisp with fire magicks, and we encourage any culinarily minded artisans to join us in development.","recipes":[37774],"objectives":[{"kind":"craft","items":[{"name":"Survey Self-heating Box Lunch","quantity":2}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":2}]},{"id":1259,"name":"EX+: Terminal Restoration Supplies","job":7,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":980,"gold":1080,"text":"The Voyagers' ruins contain various crystalline terminals that were once operated by large streams of aether. However, the passage of time has rendered the terminals' functions─and many of its internal mechanisms─inefficient. To restore their original functionalities, we must first ensure the crystals can properly absorb aether, which will require coating them in a healthy supply of aetheric stimulants and amplifiers. This, of course, is where our contributors come in, and those who can repurpose our existing stock of alchemical supplies for this task will be greatly rewarded.","recipes":[37775,37776],"objectives":[{"kind":"craft","items":[{"name":"Survey Aether Amplifier","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1260,"name":"EX+: Excavation Materials","job":7,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":540,"silver":1800,"gold":2000,"text":"Due to eras of tectonic activity, a wealth of ancient objects in the Voyagers' ruins are entombed deep within the bedrock. Were we simply unearthing resources, we would have no qualms about utilizing our machinery to excavate them. Doing so in the ruins, however, would risk damaging invaluable relics, so we shall require a more alchemical approach to overcome these stony obstacles. As this task may involve the creation of potent─and highly corrosive─concoctions, we recommend it only to artisans with ample experience handling dangerous materials.","recipes":[37777],"objectives":[{"kind":"score","items":[],"bronzeScore":1000,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":1261,"name":"EX+: Cosmic Tool Refinement I","job":7,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":980,"gold":1080,"text":"As part of our continued cosmic tool development project, our experts are currently redoubling their efforts to manufacture materials from Oizys-sourced resources. Due to the rarity of these resources and the difficulty involved in processing them, however, we have chosen to recruit only a handful of talented contributors to the cause. We will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[37778,37779],"objectives":[{"kind":"craft","items":[{"name":"Cosmic Tool-compatible Repair Oil","quantity":1}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":1}]},{"id":1262,"name":"EX+: Cosmic Tool Refinement II","job":7,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":600,"silver":980,"gold":1080,"text":"As part of our continued cosmic tool development project, our experts are currently redoubling their efforts to manufacture materials from Oizys-sourced resources. Due to the rarity of these resources and the difficulty involved in processing them, however, we have chosen to recruit only a handful of talented contributors to the cause. We will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[37780,37781],"objectives":[{"kind":"craft","items":[{"name":"Cosmic Tool-compatible Polish","quantity":1}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":1}]},{"id":1263,"name":"EX+: Cosmic Tool Refinement III","job":7,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":480,"silver":1000,"gold":1080,"text":"As part of our continued cosmic tool development project, our experts are currently redoubling their efforts to manufacture materials from Oizys-sourced resources. Due to the rarity of these resources and the difficulty involved in processing them, however, we have chosen to recruit only a handful of talented contributors to the cause. We will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[37782,37783],"objectives":[{"kind":"craft","items":[{"name":"Pure Cosmic Tool-compatible Gel","quantity":1}],"bronzeScore":null,"specialAction":"StellarSteadyHand","specialActionCharges":1}]},{"id":1348,"name":"Hydrophytic Flora Biofuel","job":0,"rank":"D","minLevel":10,"synced":true,"critical":true,"timeLimitSec":1200,"silver":0,"gold":0,"text":"The bubble bloom in effect over our survey perimeter has caused a rapid increase in humidity, which in turn has induced a spontaneous proliferation of moisture-craving vegetation. With suitable processing, it is expected that these promising specimens will supply the initiative with a viable source of biofuel and preservative agents. Workers are requested to make their way to the affected locale and assist with harvesting and on-site processing before the bloom abates.","recipes":[37784],"objectives":[{"kind":"score","items":[],"bronzeScore":600,"specialAction":null,"specialActionCharges":0},{"kind":"deliver","items":[],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1349,"name":"Relic Restoration Brushes","job":0,"rank":"D","minLevel":10,"synced":true,"critical":true,"timeLimitSec":1200,"silver":0,"gold":0,"text":"Aerial drones transporting archaeological samples have crash-landed in the pond east of the Megalithopolis after violent crosswinds damaged their navigational instruments. We ask that workers hasten to the area to retrieve the samples before they are completely submerged in the mud. We also request the delivery of cleaning supplies to assist with the on-site restoration of the muddied relics.","recipes":[37785],"objectives":[{"kind":"score","items":[],"bronzeScore":600,"specialAction":null,"specialActionCharges":0},{"kind":"deliver","items":[],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1350,"name":"Compact Gravity Generator","job":1,"rank":"D","minLevel":10,"synced":true,"critical":true,"timeLimitSec":1200,"silver":0,"gold":0,"text":"A localized gravitational anomaly has manifested in the vicinity of the Shielding Wall. The sudden shift has left vital field equipment suspended in midair, greatly impeding our exploratory efforts. Personnel in the area are attempting to anchor the equipment using portable gravity generators, but face a shortage of necessary components. We urgently request that all available workers contribute their skills and help supply this emergency operation.","recipes":[37786],"objectives":[{"kind":"score","items":[],"bronzeScore":600,"specialAction":null,"specialActionCharges":0},{"kind":"deliver","items":[],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1351,"name":"Astrodrill Replacement Bit","job":1,"rank":"D","minLevel":10,"synced":true,"critical":true,"timeLimitSec":1200,"silver":0,"gold":0,"text":"Oizys's gravitational anomalies are accompanied by atmospheric pressure fluctuations which give rise to powerful gusting winds. One of these sudden gales caused a massive rockfall in the south of the Long-lost Carrot, and a crew has already begun clearing away the debris. Upon beginning their work, however, they discovered a rare ore in the scattered rocks, and have requested the assistance of skilled miners to help extract this unexpected prize. Artisans are also called upon to provide replacement parts for the heavily taxed astrodrills.","recipes":[37787],"objectives":[{"kind":"score","items":[],"bronzeScore":600,"specialAction":null,"specialActionCharges":0},{"kind":"deliver","items":[],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1352,"name":"Rover Chain","job":2,"rank":"D","minLevel":10,"synced":true,"critical":true,"timeLimitSec":1200,"silver":0,"gold":0,"text":"A container in the northern section of Terra Firma was catapulted skywards after an abrupt weakening of local gravitational forces, with the object in question currently floating at such an extreme altitude that all plans for recovery have been abandoned as unfeasible. Its contents included a large quantity of rover parts, and there are concerns that its unexpected departure will cause delays to any required maintenance or repairs. Artisans capable of reproducing this lost stock are encouraged to make deliveries to the provided depository.","recipes":[37788],"objectives":[{"kind":"score","items":[],"bronzeScore":600,"specialAction":null,"specialActionCharges":0},{"kind":"deliver","items":[],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1353,"name":"Overturned Rover Repair","job":2,"rank":"D","minLevel":10,"synced":true,"critical":true,"timeLimitSec":1200,"silver":0,"gold":0,"text":"A rover carrying crates of pananoodles─a dietary staple second only to Archon loaf in nutritional importance─has been overturned by a powerful gust of wind. Now that the gale has died down and poses negligible safety risks, we request that all available hands proceed with haste to the incident site. Personnel with culinary expertise are also urged to assist with restocking the ruined pananoodle supplies.","recipes":[37789],"objectives":[{"kind":"score","items":[],"bronzeScore":600,"specialAction":null,"specialActionCharges":0},{"kind":"deliver","items":[],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1354,"name":"Portable Beacon","job":3,"rank":"D","minLevel":10,"synced":true,"critical":true,"timeLimitSec":1200,"silver":0,"gold":0,"text":"A container in the northern section of Terra Firma was catapulted skywards after an abrupt weakening of local gravitational forces, with the object in question currently floating at such an extreme altitude that all plans for recovery have been abandoned as unfeasible. Its contents included a large quantity of rover parts, and there are concerns that its unexpected departure will cause delays to any required maintenance or repairs. Artisans capable of reproducing this lost stock are encouraged to make deliveries to the provided depository.","recipes":[37790],"objectives":[{"kind":"score","items":[],"bronzeScore":600,"specialAction":null,"specialActionCharges":0},{"kind":"deliver","items":[],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1355,"name":"Wrought Metallic Coral","job":3,"rank":"D","minLevel":10,"synced":true,"critical":true,"timeLimitSec":1200,"silver":0,"gold":0,"text":"A field researcher passing through the Sound Pole has discovered drifting bubbles containing what appears to be metallic coral. It is theorized that the bubble bloom has lifted matter from the ocean deeps along with the seawater itself. Compounded by the effects of gravitational anomalies, it seems the coral-filled bubbles are being scattered across the coast. We request workers in the field to collect these samples of aquatic flora that we might further our research into the star's geological and vegetative peculiarities.","recipes":[37791],"objectives":[{"kind":"score","items":[],"bronzeScore":600,"specialAction":null,"specialActionCharges":0},{"kind":"deliver","items":[],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1356,"name":"Sturdy Leather Band","job":4,"rank":"D","minLevel":10,"synced":true,"critical":true,"timeLimitSec":1200,"silver":0,"gold":0,"text":"A localized gravitational anomaly has manifested in the vicinity of the Shielding Wall. The sudden shift has left vital field equipment suspended in midair, greatly impeding our exploratory efforts. Personnel in the area are attempting to anchor the equipment using portable gravity generators, but face a shortage of necessary components. We urgently request that all available workers contribute their skills and help supply this emergency operation.","recipes":[37792],"objectives":[{"kind":"score","items":[],"bronzeScore":600,"specialAction":null,"specialActionCharges":0},{"kind":"deliver","items":[],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1357,"name":"Mechanic's Gloves","job":4,"rank":"D","minLevel":10,"synced":true,"critical":true,"timeLimitSec":1200,"silver":0,"gold":0,"text":"A rover carrying crates of pananoodles─a dietary staple second only to Archon loaf in nutritional importance─has been overturned by a powerful gust of wind. Now that the gale has died down and poses negligible safety risks, we request that all availa       return A.StellarSteadyHand;

    if (s.iq >= 10 && ok(A.TrainedFinesse)) return A.TrainedFinesse;
    if (s.wn === 0 && ok(A.PrudentTouch)) return A.PrudentTouch;
    if (ok(A.BasicTouch)) return A.BasicTouch;

      var best = alive[0];

      var kept = alive.slice(0, keep);
      for (var j = keep; j < alive.length; j++) {
        if (alive[j].n >= nTarget && mean(best) - mean(alive[j]) < 1.5 * (se(best) + se(alive[j]))) kept.push(alive[j]);
      }

    }

    var maxN = 0;

      // Appraisal, Careful Observation, Quick Innovation) are recommended only
      // when they clearly beat the best step action; otherwise they add input
      // for no measurable gain.
      for (var q = 1; q < pool.length; q++) {
        if (pool[q].a.step) {
          var margin = mean(chosen) - mean(pool[q]);
          if (margin < Math.max(0.01, 1.5 * (se(chosen) + se(pool[q])))) chosen = pool[q];
          break;
        }
      }
    }
    if (!ctx.fast && pool.length > 1) {
      // Reliable mode: among statistically tied options prefer guaranteed actions.
      for (var p = 1; p < pool.length; p++) {
        var alt = pool[p];
        var tied = mean(chosen) - mean(alt) < 0.5 * (se(chosen) + se(alt));
        if (tied && CS.successRate(chosen.a, sCtx) < 100 && CS.successRate(alt.a, sCtx) >= 100) { chosen = alt; break; }
      }
    }
    var estimate = {
      pTarget: chosen.hit / chosen.n, pComplete: chosen.comp / chosen.n, n: chosen.n,
      meanQuality: chosen.comp ? Math.round(chosen.qsum / chosen.comp) : 0,
      se: Math.sqrt(Math.max(1e-9, (chosen.hit / chosen.n) * (1 - chosen.hit / chosen.n) / chosen.n))
    };
    var alternatives = stats.slice().sort(function (x, y) { return mean(y) - mean(x); }).slice(0, 5).map(function (c) {
      return { action: c.a, value: mean(c), pTarget: c.hit / c.n, n: c.n };
    });
    return {
      action: chosen.a,
      reason: explain(chosen.a, sCtx, st, ctx, estimate),
      estimate: estimate,
      alternatives: alternatives,
      fallback: false,
      timedOut: timedOut,
      heuristic: heuristic,
      ms: now() - t0
    };
  }
  function mean(c) { return c.n ? c.sum / c.n : -1; }
  function se(c) {
    if (c.n < 2) return 1;
    var m = c.sum / c.n;
    var v = Math.max(0, c.sum2 / c.n - m * m);
    return Math.sqrt(v / c.n);
  }

  // ---------------------------------------------------------------------
  // Short explanations derived from the decision context.
  // ---------------------------------------------------------------------
  function explain(a, s, st, ctx, est) {
    if (!a) return '';
    var remaining = st.maxProgress - s.progress;
    var completes = a.prog && CS.successRate(a, s) >= 100 && CS.progressGain(a, s, st) >= remaining;
    var cn = CS.COND_NAMES[s.cond];

    if (completes) return 'Finish now: more quality is not reachable with the remaining CP and durability.';
    switch (a) {
      case A.MuscleMemory: return 'Opener: Muscle Memory doubles the next progress action.';
      case A.Reflect: return 'Opener: Reflect gives 300% quality and two Inner Quiet stacks.';
      case A.ByregotsBlessing:
        return (CS.qualityGain(a, s, st) >= ctx.target - s.quality ? 'Reaches the quality target: ' : 'Cash in ' + s.iq + ' Inner Quiet stacks: ') +
          "Byregot's Blessing" + (s.cond === COND.Good ? ' on Good.' : '.');
      case A.PreciseTouch: return 'Use ' + cn + ' for Precise Touch (+2 Inner Quiet).';
      case A.IntensiveSynthesis: return 'Use ' + cn + ' for Intensive Synthesis (400% progress).';
      case A.TricksOfTheTrade: return 'Recover 20 CP on ' + cn + '.';
      case A.Groundwork: return (s.cond === COND.Sturdy || s.cond === COND.Robust) ? cn + ' halves durability loss: Groundwork.' : 'Large progress step while durability allows.';
      case A.PreparatoryTouch: return (s.cond === COND.Sturdy || s.cond === COND.Robust) ? cn + ' halves durability loss: Preparatory Touch.' : 'Build quality and two Inner Quiet stacks.';
      case A.Manipulation: return s.cond === COND.Pliant ? 'Restore durability over 8 steps while Pliant halves the CP cost.' : (s.cond === COND.Primed ? 'Primed: Manipulation lasts 10 steps.' : 'Regenerate durability for the next 8 steps.');
      case A.ImmaculateMend: return s.cond === COND.Pliant ? 'Restore all durability while Pliant halves the CP cost.' : 'Restore all durability for the remaining steps.';
      case A.MastersMend: return 'Restore 30 durability to keep crafting.';
      case A.Innovation: return s.cond === COND.Primed ? 'Primed: Innovation lasts 6 steps.' : (s.cond === COND.GoodOmen ? 'Good comes next: set up Innovation.' : 'Boost quality for the next 4 steps.');
      case A.Veneration: return 'Boost progress for the next 4 steps.';
      case A.GreatStrides: return "Double the next quality action (Byregot's Blessing).";
      case A.StellarSteadyHand: return 'Guarantee success for the next three steps (risky actions become safe).';
      case A.MaterialMiracle: return 'Start Material Miracle: favorable conditions every step for about 45 s.';
      case A.RapidSynthesis: return s.ssh > 0 ? 'Steady Hand active: Rapid Synthesis cannot fail.' : (s.cond === COND.Centered ? 'Centered raises Rapid Synthesis to 75%.' : 'High-output progress at 50% success.');
      case A.HastyTouch: return s.ssh > 0 ? 'Steady Hand active: free Hasty Touch that cannot fail.' : 'Free quality step (60% success).';
      case A.DaringTouch: return s.ssh > 0 ? 'Expedience + Steady Hand: Daring Touch cannot fail.' : 'Expedience is up: Daring Touch.';
      case A.CarefulObservation: return 'Re-roll the condition without spending a step.';
      case A.HeartAndSoul: return 'Allow one Good-only action now.';
      case A.QuickInnovation: return 'Free one-step Innovation.';
      case A.TrainedPerfection: return 'Make the next durability-costing action free.';
      case A.FinalAppraisal: return 'Prevent the next progress action from finishing the craft.';
      case A.Observe: return 'Hold a step; Advanced Touch becomes 18 CP next.';
      case A.WasteNot: case A.WasteNotII: return 'Halve durability loss for upcoming steps.';
      case A.CarefulSynthesis: case A.BasicSynthesis: case A.PrudentSynthesis: case A.DelicateSynthesis:

        return est ? 'Best simulated outcome among the usable actions.' : 'Heuristic choice.';
    }
  }

  CS.recommend = recommend;
  CS.legalActions = legalActions;
  CS.mulberry32 = mulberry32;

  }
  function numField(label, key, v, min, max) {
    return '<label class="field">' + label + '<input type="number" inputmode="numeric" data-act="stat" data-k="' + key + '" value="' + v + '" min="' + min + '" max="' + max + '"></label>';
  }
  function chk(label, key, v) {
    return '<label class="inline"><input type="checkbox" data-act="flag" data-k="' + key + '"' + (v ? ' checked' : '') + '> ' + label + '</label>';
  }
  function missionDetail(m, r, p) {
    var h = '<div style="margin-top:12px">';
    h += '<div class="small muted">' + esc(m.text) + '</div>';
    h += '<div class="small" style="margin-top:4px">';

    if (m.rank === 'Master') h += 'Master mission: phased score targets as listed. ';
    h += '</div><div class="note">Game data gives the mission score thresholds but not the score each crafted item earns. The solver therefore optimizes the quality target you pick for this craft, not the mission score directly.</div>';
    if (m.recipes.length > 1) {
      h += '<div class="field" style="margin-top:6px">Recipe for this craft</div><div class="chips">' + m.recipes.map(function (id) {

        return '<button class="chip' + (id === app.recipeId ? ' on' : '') + '" data-act="recipe" data-v="' + id + '">' + esc(x.name) + (x.requiredQuality ? ' (quality ≥ ' + fmt(x.requiredQuality) + ' required)' : '') + '</button>';

      h += '<div class="small" style="margin-top:8px"><b>' + esc(r.name) + '</b> · recipe level ' + r.rlvl + (r.stars ? ' ' + '★'.repeat(r.stars) : '') +
        (r.expert ? ' · expert' : '') + ' · progress ' + fmt(r.progress) + ' · quality ' + fmt(r.quality) + ' · durability ' + r.durability +
        ' · conditions: ' + condList(r.conditionsFlag) + '</div>';
      if (r.maxLevelScaling && p.level < r.maxLevelScaling) h += '<div class="small warn">Level-synced: recipe values scale to your level ' + p.level + '.</div>';
      if (p.level < m.minLevel) h += '<div class="small bad">This mission requires level ' + m.minLevel + '.</div>';
      if (!r.maxLevelScaling && p.level < r.level) h += '<div class="small bad">This recipe is level ' + r.level + '; the solver only supports it at that level.</div>';
      var tg = targets(r);
      if (!app.targetKey || !tg.some(function (t) { return t.key === app.targetKey; })) app.targetKey = defaultTargetKey(r);
      h += '<div class="field" style="margin-top:8px">Quality target for this craft</div><div class="chips">' + tg.map(function (t) {
        return '<button class="chip' + (t.key === app.targetKey ? ' on' : '') + '" data-act="target" data-v="' + t.key + '">' + t.label + (t.sub ? ' <span class="muted">' + t.sub + '</span>' : '') + '</button>';
      }).join('') + '</div>';
