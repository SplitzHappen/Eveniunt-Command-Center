or.","recipes":[37368],"objectives":[{"kind":"craft","items":[{"name":"Weatherproof Survey Rations","quantity":2}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":855,"name":"Refined Yeast I","job":7,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":2700,"gold":3000,"text":"Developing new strains of yeast may be crucial to expanding the limitation of our food supply. Furthermore, the inclusion of yeast in victuals is known to enhance flavor and increase satisfaction in the consumer. Specialists are asked to commence testing and analysis of our stores of lunar fungi to cultivate a product suitable for the initiative's use.","recipes":[37369],"objectives":[{"kind":"craft","items":[{"name":"Experimental Survey Yeast","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":856,"name":"Advanced Fermentation","job":7,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1600,"gold":2400,"text":"Experimental cultivation of vegetables and legumes brought from the moon is currently underway. The findings from our most recent tests have revealed a necessity to improve upon flavor, but otherwise fulfilled the nutritional standards required for supporting life. Experts in the culinary and medicinal fields are encouraged to join our research and discover new methods of implementing our ingredients.","recipes":[37370],"objectives":[{"kind":"craft","items":[{"name":"Quasimeatballs","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":857,"name":"Mid-launch Party Preparations","job":7,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":2700,"gold":3000,"text":"Aside from what can fit in the leftover space of our shipping containers, luxuries are generally not included in transports from the moon. Demand for such commodities has greatly risen among some of our members, so we have decided to begin fermenting lunar yeast to develop alcoholic beverages. We are requesting that contributors participate in the experimental distillation of spirits that will be strictly reserved for celebratory purposes.","recipes":[37371],"objectives":[{"kind":"craft","items":[{"name":"Launch Party Liquor","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":858,"name":"Endangered Aquaculture I","job":7,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1300,"text":"We have introduced aquatic organisms from the moon to the bodies of water near Glassblowers' Beacon in order to cultivate a vital mineral source. Improvements to water quality have been ongoing, but overcoming the environmental discrepancy is still a challenge for some species. We hope nutrient-rich supplements will facilitate growth, thereby improving the health of our cultivars and, ultimately, our personnel.","recipes":[37372,37373],"objectives":[{"kind":"craft","items":[{"name":"Aquaculture Medicine","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":859,"name":"Inorganic Extract Research II","job":7,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1300,"text":"The unique flora carpeting Phaenna's surface is partially composed of glass that, when subjected to refined extraction, produces a high-quality oil. We hope to develop this oil for cooking, soaps, candles, and─most ambitiously─a coffee substitute made by roasting the post-extraction residue. Join us as we revolutionize the use of Phaenna's plants!","recipes":[37374,37375],"objectives":[{"kind":"craft","items":[{"name":"Inorganic Quasioil","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":860,"name":"Refined Archon Loaf II","job":7,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1800,"gold":2400,"text":"Given that so little of Phaenna is edible, we took it upon ourselves to import a large quantity of Archon loaf for the Beacon. To our great distress, however, a majority of non-Sharlayan crew members have now submitted formal complaints about the taste! Thus, at great personal sacrifice do we Loporrits hereby offer unfettered access to our precious supply of carrots... Please, artisans, use them however you must to create a mouthwatering condiment for this bread.","recipes":[37376],"objectives":[{"kind":"craft","items":[{"name":"Carrotinized Spice","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":861,"name":"Precision Instrument Lubricant","job":7,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1800,"gold":2400,"text":"If there's one resource this star has in abundance, it's glass. Going forward, the initiative wishes to maintain its very own cosmic standard of quality, ensuring perfection throughout the refinement process, and continually deliver product samples back to Sinus Ardorum for use in construction and interstellar research. Presently we expect sheets of multi-purpose glass as well as any lubricant by-products created through the smelting process. Repeat deliveries are welcome─bring us your very best!","recipes":[37377],"objectives":[{"kind":"score","items":[],"bronzeScore":1200,"specialAction":null,"specialActionCharges":0}]},{"id":862,"name":"Weatherproof Stable Rations","job":7,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":700,"gold":1000,"text":"The food supply is an ongoing concern partially solved by our aggressive foray into aquaculture, but we are as of yet almost entirely reliant on shipments from Sinus Ardorum. Naturally, it would be foolish to presume the *Galactic Way* will always operate in perfect condition. Therefore, in the interest of crisis prevention, we seek to establish a stockpile of provisions as a countermeasure. For this request, artisans are asked to prioritize nutrition above all else, even flavor.","recipes":[37378],"objectives":[{"kind":"craft","items":[{"name":"Stable Luncheon Meat","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":863,"name":"Refined Yeast II","job":7,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":700,"gold":1000,"text":"Developing new strains of yeast may be crucial to expanding the limitation of our food supply. Furthermore, the inclusion of yeast in victuals is known to enhance flavor and increase satisfaction in the consumer. Specialists are asked to commence testing and analysis of our stores of lunar fungi to cultivate a product suitable for the initiative's use.","recipes":[37379],"objectives":[{"kind":"score","items":[],"bronzeScore":300,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":864,"name":"Endangered Aquaculture II","job":7,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":2600,"gold":3000,"text":"We have introduced aquatic organisms from the moon to the bodies of water near Glassblowers' Beacon in order to cultivate a vital mineral source. Improvements to water quality have been ongoing, but overcoming the environmental discrepancy is still a challenge for some species. We hope nutrient-rich supplements will facilitate growth, thereby improving the health of our cultivars and, ultimately, our personnel.","recipes":[37380,37381,37382],"objectives":[{"kind":"craft","items":[{"name":"Specialist Freshwater Bait Ball","quantity":1},{"name":"Specialist Dunefishing Bait Ball","quantity":1},{"name":"Specialist Lavafishing Bait Ball","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":865,"name":"EX: Automated Fermentation","job":7,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":2500,"gold":3000,"text":"Experimental cultivation of vegetables and legumes brought from the moon is currently underway. The findings from our most recent tests have revealed a necessity to improve upon flavor, but otherwise fulfilled the nutritional standards required for supporting life. Experts in the culinary and medicinal fields are encouraged to join our research and discover new methods of implementing our ingredients.","recipes":[37383],"objectives":[{"kind":"score","items":[],"bronzeScore":1200,"specialAction":null,"specialActionCharges":0}]},{"id":866,"name":"EX: Launch Party Sweets","job":7,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":2500,"gold":3000,"text":"After working for extensive hours outdoors, a contributor has reported that this star resembles a confectionery-rich dreamland spun by faeries. The worker in question has since been treated for extreme mental and physical exhaustion, but their hallucination does bring to light the delicious hues of Phaenna's landscape. Our resources of sugar are precious, but we would like to request the creation of dreamy sweets for special occasions.","recipes":[37384,37385,37386],"objectives":[{"kind":"craft","items":[{"name":"Launch Party Grape Jelly","quantity":1},{"name":"Launch Party Shaved Ice","quantity":1},{"name":"Launch Party Coffee Candy","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":867,"name":"EX: Coffee Break Support","job":7,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":800,"gold":1050,"text":"The unique flora carpeting Phaenna's surface is partially composed of glass that, when subjected to refined extraction, produces a high-quality oil. We hope to develop this oil for cooking, soaps, candles, and─most ambitiously─a coffee substitute made by roasting the post-extraction residue. Join us as we revolutionize the use of Phaenna's plants!","recipes":[37387,37388],"objectives":[{"kind":"craft","items":[{"name":"Restful Coffee Service","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":868,"name":"EX+: Stable Dairy Storage","job":7,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":980,"gold":1080,"text":"Demand has risen among Sharlayan contributors for a palatable taste of home, so we have imported a small supply of a particular dairy dish. Its fermentation ensures that it lasts at least a few days, but some have hypothesized that condensing it into a confection will not only prolong its freshness, but enhance its nutritional value. We request that artisans skilled in culinary and medicinal fields assist us by both creating and condensing this fermented dairy product. Should it prove to be a viable supplement, we will consider larger imports in the future.","recipes":[37389,37390],"objectives":[{"kind":"craft","items":[{"name":"Worker's Skyr","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":869,"name":"EX+: Fermentation Research Results","job":7,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":540,"silver":1800,"gold":2000,"text":"The cultivation of crops imported from the moon and the selective breeding of Phaenna's unique flora continues apace at Glassblowers' Beacon. By gathering and processing these plants for food and decoration, we hope to improve the living environment for all our contributors. This task will require patience and an eye for detail, so we request the assistance of highly skilled artisans.","recipes":[37391],"objectives":[{"kind":"score","items":[],"bronzeScore":900,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":870,"name":"Morale Maintenance I","job":7,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":2300,"gold":3000,"text":"The only thing more puzzling than the workers' insistence on using pen and paper despite having the latest exotablets is their fondness for cooking with needlessly convoluted recipes rather than partaking in our nigh-limitless supply of Archon loaf. Customs that, perhaps, remind them of home. Or so we believe. As these practices seem to enhance rather than hinder their performance, we see no harm in accomodating them. To that end, we ask that our artisans fashion suitable writing and cooking utensils.","recipes":[37392],"objectives":[{"kind":"craft","items":[{"name":"Launch Party Culinary Supply Components","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":871,"name":"Morale Maintenance II","job":7,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":2300,"gold":3000,"text":"The only thing more puzzling than the workers' insistence on using pen and paper despite having the latest exotablets is their fondness for cooking with needlessly convoluted recipes rather than partaking in our nigh-limitless supply of Archon loaf. Customs that, perhaps, remind them of home. Or so we believe. As these practices seem to enhance rather than hinder their performance, we see no harm in accomodating them. To that end, we ask that our artisans fashion suitable writing and cooking utensils.","recipes":[37393],"objectives":[{"kind":"craft","items":[{"name":"Launch Party Culinary Supplies","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":872,"name":"EX: Launch Party Desserts I","job":7,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1700,"gold":2000,"text":"Exploration on Phaenna is proceeding better than we could have hoped. And so, to show our appreciation for everyone's hard work, we've decided to host a celebration. Supplies of wheat and sugar are limited, but we're confident our artisans can produce enough sweets to leave everyone satisfied. For entertainment, we took inspiration from the vibrant landscape and settled on face painting! An unusual request, but we trust our artisans can provide suitable cosmetic supplies to add a splash of color to the festivities.","recipes":[37394],"objectives":[{"kind":"score","items":[],"bronzeScore":800,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":873,"name":"EX: Launch Party Desserts II","job":7,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":600,"gold":800,"text":"Exploration on Phaenna is proceeding better than we could have hoped. And so, to show our appreciation for everyone's hard work, we've decided to host a celebration. Supplies of wheat and sugar are limited, but we're confident our artisans can produce enough sweets to leave everyone satisfied. For entertainment, we took inspiration from the vibrant landscape and settled on face painting! An unusual request, but we trust our artisans can provide suitable cosmetic supplies to add a splash of color to the festivities.","recipes":[37395],"objectives":[{"kind":"craft","items":[{"name":"Launch Party Phaenna Tart","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":874,"name":"EX: Launch Party Desserts III","job":7,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":850,"gold":1000,"text":"Exploration on Phaenna is proceeding better than we could have hoped. And so, to show our appreciation for everyone's hard work, we've decided to host a celebration. Supplies of wheat and sugar are limited, but we're confident our artisans can produce enough sweets to leave everyone satisfied. For entertainment, we took inspiration from the vibrant landscape and settled on face painting! An unusual request, but we trust our artisans can provide suitable cosmetic supplies to add a splash of color to the festivities.","recipes":[37396],"objectives":[{"kind":"score","items":[],"bronzeScore":400,"specialAction":null,"specialActionCharges":0}]},{"id":875,"name":"Emergency Rations Development","job":7,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1400,"gold":2000,"text":"That we might enrich our diet here on Phaenna, we've done our best with precious ingredients sourced from Etheirys. Even so, there have been requests for the kind of compact, high-nutrient meals that were once standard fare at the Moongate Hub. To that end, we've prepared ingredients based on recipes from Sinus Ardorum─now bolstered with an eye-watering dose of nutrient powder. All that remains is for a skilled artisan to turn it into the fuel our eager explorers so crave.","recipes":[37397],"objectives":[{"kind":"craft","items":[{"name":"Emergency Vanilla Nutrient Bar","quantity":2}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":876,"name":"EX: All-nighter Rations Development","job":7,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":850,"gold":1000,"text":"That we might enrich our diet here on Phaenna, we've done our best with precious ingredients sourced from Etheirys. Even so, there have been requests for the kind of compact, high-nutrient meals that were once standard fare at the Moongate Hub. To that end, we've prepared ingredients based on recipes from Sinus Ardorum─now bolstered with an eye-watering dose of nutrient powder. All that remains is for a skilled artisan to turn it into the fuel our eager explorers so crave.","recipes":[37398],"objectives":[{"kind":"score","items":[],"bronzeScore":400,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":877,"name":"EX+: Superior Supplement Trays","job":7,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":540,"silver":1000,"gold":1600,"text":"That we might enrich our diet here on Phaenna, we've done our best with precious ingredients sourced from Etheirys. Even so, there have been requests for the kind of compact, high-nutrient meals that were once standard fare at the Moongate Hub. To that end, we've prepared ingredients based on recipes from Sinus Ardorum─now bolstered with an eye-watering dose of nutrient powder. All that remains is for a skilled artisan to turn it into the fuel our eager explorers so crave.","recipes":[37399],"objectives":[{"kind":"score","items":[],"bronzeScore":800,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":878,"name":"EX+: Ultimate Nutrition I","job":7,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":980,"gold":1080,"text":"A highly precious material has been discovered after exhaustive exploration of the star. We challenge contributors to put their skills to the test by crafting an item that will advance our initiative with this rare resource. As the material is highly difficult to process, great preparation and care must be taken. We will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[37400,37401],"objectives":[{"kind":"craft","items":[{"name":"Cosmotized Restorative Tonic","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":879,"name":"EX+: Ultimate Nutrition II","job":7,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":600,"silver":980,"gold":1080,"text":"A highly precious material has been discovered after exhaustive exploration of the star. We challenge contributors to put their skills to the test by crafting an item that will advance our initiative with this rare resource. As the material is highly difficult to process, great preparation and care must be taken. We will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[37402,37403],"objectives":[{"kind":"craft","items":[{"name":"Cosmotized Hearty Soup","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":880,"name":"EX+: Ultimate Nutrition III","job":7,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":450,"silver":1000,"gold":1080,"text":"A highly precious material has been discovered after exhaustive exploration of the star. We challenge contributors to put their skills to the test by crafting an item that will advance our initiative with this rare resource. As the material is highly difficult to process, great preparation and care must be taken. We will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[37404,37405],"objectives":[{"kind":"craft","items":[{"name":"Cosmotized Health Rations","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":1007,"name":"Wiring Repair Tools","job":0,"rank":"D","minLevel":10,"synced":true,"critical":true,"timeLimitSec":1200,"silver":0,"gold":0,"text":"Severe thunderstorms are causing widespread malfunctions in exploration equipment. Demand for lightning-resistant workwear and repair materials far outstrips supply, and the initiative faces a setback if this shortage is not swiftly addressed. As such, we are issuing an urgent request for these resources to be supplemented. A temporary repository has been established on the east side of Glassblowers' Beacon. All supplies are to be delivered posthaste to this location.","recipes":[37406],"objectives":[{"kind":"score","items":[],"bronzeScore":600,"specialAction":null,"specialActionCharges":0},{"kind":"deliver","items":[],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1008,"name":"Mutated Flora Samples","job":0,"rank":"D","minLevel":10,"synced":true,"critical":true,"timeLimitSec":1200,"silver":0,"gold":0,"text":"Unusual plants have been reported on the Iridized Rise. They appear to be mutations of species found in the vicinity, and feature brightly colored petals of a glass-like material perhaps owing to the currents of cold air. We seek to collect as many samples as possible to advance our research into local soil composition, and ask gatherers to attend to their harvesting. Crafters, meanwhile, can contribute by processing the specimens on-site for use in the lab.","recipes":[37407],"objectives":[{"kind":"score","items":[],"bronzeScore":600,"specialAction":null,"specialActionCharges":0},{"kind":"deliver","items":[],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1009,"name":"Glass Dust Cleaning Tools","job":0,"rank":"D","minLevel":10,"synced":true,"critical":true,"timeLimitSec":1200,"silver":0,"gold":0,"text":"Glass rain is proving to pose a challenge for the initiative, with high winds causing glass dust to accumulate around the Cosmoliner station in Capsule Chasm. While removal operations are underway, the ground crew reports that they lack the resources to tackle the overwhelming amount of dust deposits. This is an urgent request for supplies, including dust-collection tools, dust-filtering masks, and vessels to store the gathered dust. Deliveries should be made directly to the site of the incident.","recipes":[37408],"objectives":[{"kind":"score","items":[],"bronzeScore":600,"specialAction":null,"specialActionCharges":0},{"kind":"deliver","items":[],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1010,"name":"Experimental Lightning Rod Materials","job":1,"rank":"D","minLevel":10,"synced":true,"critical":true,"timeLimitSec":1200,"silver":0,"gold":0,"text":"A fierce thunderstorm has broken out on the northwestern bank of the Saltpeter Shore. If we could avail ourselves of this raging energy, it would provide a tremendous source of power for the initiative. To that end, we are issuing a request for the timely delivery of lightning-rod parts to harness the lightning strikes, and batteries to store the gathered power. Once we obtain data on the utilization of this energy, a fearsome force will become a blessing from the heavens!","recipes":[37409],"objectives":[{"kind":"score","items":[],"bronzeScore":600,"specialAction":null,"specialActionCharges":0},{"kind":"deliver","items":[],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1011,"name":"Vitreobotany Tools","job":1,"rank":"D","minLevel":10,"synced":true,"critical":true,"timeLimitSec":1200,"silver":0,"gold":0,"text":"Needle-like glass formations have been found in the vicinity of the Slumping Plunge, which appear to have formed due to the sudden cooling of the ground by currents of cold air. These formations pose a hazard to the mini rovers working nearby and must be removed. However, given the properties of the materials, protective gear and specialist tools are required to conduct the operation safely. We call upon our crafters to provide these supplies, and gatherers to remove the prickly problem.","recipes":[37410],"objectives":[{"kind":"score","items":[],"bronzeScore":600,"specialAction":null,"specialActionCharges":0},{"kind":"deliver","items":[],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1012,"name":"Nozzle Parts","job":1,"rank":"D","minLevel":10,"synced":true,"critical":true,"timeLimitSec":1200,"silver":0,"gold":0,"text":"We have received an urgent communication from the mobilization station. They request aid in protecting their equipment from the glass rain, which is depositing glass dust on their equipment. If left unchecked, the dust fuses to everything it touches due to the ambient heat, so haste is of the essence. The materials required for the task are in short supply, and those answering the call are asked to proceed directly to the mobilization station with dust-collection tools and protective coating for equipment.","recipes":[37411],"objectives":[{"kind":"score","items":[],"bronzeScore":600,"specialAction":null,"specialActionCharges":0},{"kind":"deliver","items":[],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1013,"name":"Upgrade Parts","job":2,"rank":"D","minLevel":10,"synced":true,"critical":true,"timeLimitSec":1200,"silver":0,"gold":0,"text":"An anomaly has occurred at a lightning transmission facility along the descent towards Capsule Chasm. The wiring has deteriorated prematurely, in all likelihood due to constant exposure to cold air currents. Unless repairs are carried out promptly, it will impede our operations within the chasm as well as the maintenance of the descent. We request the urgent supply of new parts and lightning-resistant oil required to complete repairs on any sections exhibiting problems.","recipes":[37412],"objectives":[{"kind":"score","items":[],"bronzeScore":600,"specialAction":null,"specialActionCharges":0},{"kind":"deliver","items":[],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1014,"name":"Dust Tanks","job":2,"rank":"D","minLevel":10,"synced":true,"critical":true,"timeLimitSec":1200,"silver":0,"gold":0,"text":"Glass rain is proving to pose a challenge for the initiative, with high winds causing glass dust to accumulate around the Cosmoliner station in Capsule Chasm. While removal operations are underway, the ground crew reports that they lack the resources to tackle the overwhelming amount of dust deposits. This is an urgent request for supplies, including dust-collection tools, dust-filtering masks, and vessels to store the gathered dust. Deliveries should be made directly to the site of the incident.","recipes":[37413],"objectives":[{"kind":"score","items":[],"bronzeScore":600,"specialAction":null,"specialActionCharges":0},{"kind":"deliver","items":[],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1015,"name":"Rover Plating","job":2,"rank":"D","minLevel":10,"synced":true,"critical":true,"timeLimitSec":1200,"silver":0,"gold":0,"text":"A rover making its way near the Iridized Rise has lost traction due to the glass rain and overturned. While the driver was thankfully unharmed, the supplies in transit were damaged beyond salvaging. A request has been dispatched to the moon for replacement wares, but to minimize disruptions to our work, we wish for emergency measures to be carried out at the scene of the accident. We ask you to provide repair parts for the rover along with substitutes for the damaged supplies.","recipes":[37414],"objectives":[{"kind":"score","items":[],"bronzeScore":600,"specialAction":null,"specialActionCharges":0},{"kind":"deliver","items":[],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1016,"name":"Precision Components","job":3,"rank":"D","minLevel":10,"synced":true,"critical":true,"timeLimitSec":1200,"silver":0,"gold":0,"text":"A mini rover to the south of Glassblowers' Beacon has been struck by lightning and rendered inoperative. With the entrance to the Glassblown Grotto only a stone's throw away, it poses a potential obstruction to operations, and must be restored to working condition as soon as possible. Our engineers are currently tending to the rover, but they lack a number of crucial parts. This is an urgent request for the required resources to be delivered directly to the repair site.","recipes":[37415],"objectives":[{"kind":"score","items":[],"bronzeScore":600,"specialAction":null,"specialActionCharges":0},{"kind":"deliver","items":[],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1017,"name":"Electroconductive Wire","job":3,"rank":"D","minLevel":10,"synced":true,"critical":true,"timeLimitSec":1200,"silver":0,"gold":0,"text":"A severe thunderstorm is unfolding to the southwest of Glassblowers' Beacon, with lightning strikes threatening to take down the whole Cosmoliner network. Though dangerous, we have no choice but to proceed with the installation of temporary lightning rods on nearby elevated ground. We urgently call for deliveries of the required materials directly to Millefiori, and additionally request cooperation in clearing the path to the hilltop of obstructing flora.","recipes":[37416],"objectives":[{"kind":"score","items":[],"bronzeScore":600,"specialAction":null,"specialActionCharges":0},{"kind":"deliver","items":[],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1018,"name":"Spare Transport Parts","job":3,"rank":"D","minLevel":10,"synced":true,"critical":true,"timeLimitSec":1200,"silver":0,"gold":0,"text":"A rover making its way near the Iridized Rise has lost traction due to the glass rain and overturned. While the driver was thankfully unharmed, the supplies in transit were damaged beyond salvaging. A request has been dispatched to the moon for replacement wares, but to minimize disruptions to our work, we wish for emergency measures to be carried out at the scene of the accident. We ask you to provide repair parts for the rover along with substitutes for the damaged supplies.","recipes":[37417],"objectives":[{"kind":"score","items":[],"bronzeScore":600,"specialAction":null,"specialActionCharges":0},{"kind":"deliver","items":[],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1019,"name":"Wiring Repair Gloves","job":4,"rank":"D","minLevel":10,"synced":true,"critical":true,"timeLimitSec":1200,"silver":0,"gold":0,"text":"Severe thunderstorms are causing widespread malfunctions in exploration equipment. Demand for lightning-resistant workwear and repair materials far outstrips supply, and the initiative faces a setback if this shortage is not swiftly addressed. As such, we are issuing an urgent request for these resources to be supplemented. A temporary repository has been established on the east side of Glassblowers' Beacon. All supplies are to be delivered posthaste to this location.","recipes":[37418],"objectives":[{"kind":"score","items":[],"bronzeScore":600,"specialAction":null,"specialActionCharges":0},{"kind":"deliver","items":[],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":1020,"name":"Reinforced Lumbering Boots","job":4,"rank":"D","minLevel":10,"synced":true,"critical":true,"timeLimitSec":1200,"silver":0,"gold":0,"text":"Needle-like glass formations have been found in the vicinity       return A.StellarSteadyHand;

    if (s.iq >= 10 && ok(A.TrainedFinesse)) return A.TrainedFinesse;
    if (s.wn === 0 && ok(A.PrudentTouch)) return A.PrudentTouch;

        if (alive[j].n >= nTarget && mean(best) - mean(alive[j]) < 1.5 * (se(best) + se(alive[j]))) kept.push(alive[j]);
      }

      // for no measurable gain.

        if (pool[q].a.step) {
          var margin = mean(chosen) - mean(pool[q]);
          if (margin < Math.max(0.01, 1.5 * (se(chosen) + se(pool[q])))) chosen = pool[q];
          break;
        }
      }
    }
    if (!ctx.fast && pool.length > 1) {
      // Reliable mode: among statistically tied options prefer guaranteed actions.
      for (var p = 1; p < pool.length; p++) {
        var alt = pool[p];
        var tied = mean(chosen) - mean(alt) < 0.5 * (se(chosen) + se(alt));
        if (tied && CS.successRate(chosen.a, sCtx) < 100 && CS.successRate(alt.a, sCtx) >= 100) { chosen = alt; break; }
      }
    }
    var estimate = {
      pTarget: chosen.hit / chosen.n, pComplete: chosen.comp / chosen.n, n: chosen.n,
      meanQuality: chosen.comp ? Math.round(chosen.qsum / chosen.comp) : 0,
      se: Math.sqrt(Math.max(1e-9, (chosen.hit / chosen.n) * (1 - chosen.hit / chosen.n) / chosen.n))
    };
    var alternatives = stats.slice().sort(function (x, y) { return mean(y) - mean(x); }).slice(0, 5).map(function (c) {
      return { action: c.a, value: mean(c), pTarget: c.hit / c.n, n: c.n };
    });
    return {
      action: chosen.a,
      reason: explain(chosen.a, sCtx, st, ctx, estimate),
      estimate: estimate,
      alternatives: alternatives,
      fallback: false,
      timedOut: timedOut,
      heuristic: heuristic,
      ms: now() - t0
    };
  }
  function mean(c) { return c.n ? c.sum / c.n : -1; }
  function se(c) {
    if (c.n < 2) return 1;
    var m = c.sum / c.n;
    var v = Math.max(0, c.sum2 / c.n - m * m);

  // ---------------------------------------------------------------------
  // Short explanations derived from the decision context.
  // ---------------------------------------------------------------------
  function explain(a, s, st, ctx, est) {

      case A.Reflect: return 'Opener: Reflect gives 300% quality and two Inner Quiet stacks.';
      case A.ByregotsBlessing:

      case A.PreciseTouch: return 'Use ' + cn + ' for Precise Touch (+2 Inner Quiet).';
      case A.IntensiveSynthesis: return 'Use ' + cn + ' for Intensive Synthesis (400% progress).';
      case A.TricksOfTheTrade: return 'Recover 20 CP on ' + cn + '.';
      case A.Groundwork: return (s.cond === COND.Sturdy || s.cond === COND.Robust) ? cn + ' halves durability loss: Groundwork.' : 'Large progress step while durability allows.';
      case A.PreparatoryTouch: return (s.cond === COND.Sturdy || s.cond === COND.Robust) ? cn + ' halves durability loss: Preparatory Touch.' : 'Build quality and two Inner Quiet stacks.';
      case A.Manipulation: return s.cond === COND.Pliant ? 'Restore durability over 8 steps while Pliant halves the CP cost.' : (s.cond === COND.Primed ? 'Primed: Manipulation lasts 10 steps.' : 'Regenerate durability for the next 8 steps.');
      case A.ImmaculateMend: return s.cond === COND.Pliant ? 'Restore all durability while Pliant halves the CP cost.' : 'Restore all durability for the remaining steps.';
      case A.MastersMend: return 'Restore 30 durability to keep crafting.';
      case A.Innovation: return s.cond === COND.Primed ? 'Primed: Innovation lasts 6 steps.' : (s.cond === COND.GoodOmen ? 'Good comes next: set up Innovation.' : 'Boost quality for the next 4 steps.');
      case A.Veneration: return 'Boost progress for the next 4 steps.';
      case A.GreatStrides: return "Double the next quality action (Byregot's Blessing).";
      case A.StellarSteadyHand: return 'Guarantee success for the next three steps (risky actions become safe).';
      case A.MaterialMiracle: return 'Start Material Miracle: favorable conditions every step for about 45 s.';
      case A.RapidSynthesis: return s.ssh > 0 ? 'Steady Hand active: Rapid Synthesis cannot fail.' : (s.cond === COND.Centered ? 'Centered raises Rapid Synthesis to 75%.' : 'High-output progress at 50% success.');
      case A.HastyTouch: return s.ssh > 0 ? 'Steady Hand active: free Hasty Touch that cannot fail.' : 'Free quality step (60% success).';
      case A.DaringTouch: return s.ssh > 0 ? 'Expedience + Steady Hand: Daring Touch cannot fail.' : 'Expedience is up: Daring Touch.';
      case A.CarefulObservation: return 'Re-roll the condition without spending a step.';
      case A.HeartAndSoul: return 'Allow one Good-only action now.';
      case A.QuickInnovation: return 'Free one-step Innovation.';
      case A.TrainedPerfection: return 'Make the next durability-costing action free.';
      case A.FinalAppraisal: return 'Prevent the next progress action from finishing the craft.';
      case A.Observe: return 'Hold a step; Advanced Touch becomes 18 CP next.';

      case A.CarefulSynthesis: case A.BasicSynthesis: case A.PrudentSynthesis: case A.DelicateSynthesis:

    }
  }

  CS.recommend = recommend;

  function numField(label, key, v, min, max) {

  function missionDetail(m, r, p) {

      var tg = targets(r);

      h += '<div class="field" style="margin-top:8px">Quality target for this craft</div><div class="chips">' + tg.map(function (t) {

      h += '<div class="grid2" style="margin-top:8px">' +
        '<label class="field">Crafts in this mission' + (m.objectives.some(function (o) { return o.kind === 'craft'; }) ? '' : ' (estimate)') + '<input type="number" min="1" max="99" data-act="ses" data-k="craftsTotal" value="' + ses.craftsTotal + '"></label>' +

        '. The solver spends at most ' + budgetText(ses) + ' this craft, spreading the rest over the remaining crafts.</div>';
      h += '<div class="row" style="margin-top:8px"><span class="small muted">Mode</span>' +

  }
  function condList(flag) {
    var out = [];

  }
  function sessionFor(m) {

        missionId: m.id, craftsTotal: plannedCrafts(m), craftsDone: 0,
        sshLeft: sp && sp.action === 'StellarSteadyHand' ? sp.charges : 0,

    }
    return app.session;
  }
  function budgets(ses) {

  }
  function budgetText(ses) {
    var b = budgets(ses);
    var parts = [];
    if (ses.sshLeft) parts.push(b.ssh + ' Steady Hand');
    if (ses.mmLeft) parts.push(b.mm + ' Material Miracle');
    return parts.length ? parts.join(' and ') : 'no special actions';
  }

  // ---------------------------------------------------------------- craft
  function targetQuality(r) {
    var t = targets(r).find(function (x) { return x.key === app.targetKey; });
    if (!t) return r.quality;
    if (t.key === 'custom') return Math.max(0, Math.min(r.quality * 2, +app.customTarget || 0));
    return t.q;
  }
  function startCraft() {
    var m = mission(), r = recipe(), p = currentProfile();
    if (!m || !r) return;
    if (!r.maxLevelScaling && p.level < r.level) { toast('This recipe needs level ' + r.level + '.'); return; }
    if (p.level < m.minLevel) { toast('This mission needs level ' + m.minLevel + '.'); return; }
    var ses = sessionFor(m);
    var st;
    try {
      st = CS.makeSettings(r, p, DB, {
        sshCharges: ses.sshLeft, mmCharges: ses.mmLeft, condModel: app.settings.condModel,
        mmSteps: Math.max(1, Math.round(45 / app.settings.mmSecPerStep))
      });
    } catch (e) { toast('Cannot build this recipe at level ' + p.level + ': ' + e.message); return; }
    var tq = targetQuality(r);
    var b = budgets(ses);
    app.craft = {
      missionId: m.id, recipeId: r.id, st: st, target: tq,
      lowerTiers: (r.tiers || []).filter(function (x) { return x < tq; }),
      state: CS.initialState(st), history: [], pending: null, chosen: null, mmEndsAt: 0,
      budget: b, startSsh: ses.sshLeft, startMm: ses.mmLeft, profileName: p.name, finished: false
    };
    app.setupOpen = false;
    save();
    renderAll();
    think();
  }
  function serializeCraft() {
    var c = app.craft;
    return {
      missionId: c.missionId, recipeId: c.recipeId, st: c.st, target: c.target, lowerTiers: c.lowerTiers,
      state: c.state, history: c.history.map(function (h) { return { state: h.state, action: h.action, ok: h.ok, cond: h.cond, pg: h.pg, qg: h.qg, edit: h.edit }; }),
      mmEndsAt: c.mmEndsAt, budget: c.budget, startSsh: c.startSsh, startMm: c.startMm, profileName: c.profileName,
      session: app.session, recipeKey: app.targetKey

  }
  function restoreCraft(d) {
    if (!d || !DB.recipes[String(d.recipeId)]) return;
    app.missionId = d.missionId; app.recipeId = d.recipeId; app.session = d.session; app.targetKey = d.recipeKey;
    var m = mission(); if (m) app.job = m.job;
    app.craft = {
      missionId: d.missionId, recipeId: d.recipeId, st: d.st, target: d.target, lowerTiers: d.lowerTiers || [],
      state: d.state, history: d.history || [], pending: null, chosen: null, mmEndsAt: d.mmEndsAt || 0,
      budget: d.budget, startSsh: d.startSsh, startMm: d.startMm, profileName: d.profileName
    };
    app.setupOpen = false;
  }

  // Material Miracle is time based (45 s). The engine needs an estimate of how
  // many more steps it covers: remaining seconds / seconds per step.
  function syncMm(s) {
    var c = app.craft;
    if (!c.mmEndsAt) { s.mm = 0; return s; }
    var left = (c.mmEndsAt - Date.now()) / 1000;
    s.mm = left > 0 ? Math.max(1, Math.round(left / app.settings.mmSecPerStep)) : 0;
    if (left <= 0) c.mmEndsAt = 0;
    return s;
  }

  // ---- worker
  var worker = null, workerFailed = false, reqId = 0;
  function getWorker() {
    if (worker || workerFailed) return worker;
    try {
      var src = ENGINE_SRC + '\n;self.onmessage=function(e){var d=e.data;try{var r=CS.recommend(d.state,d.st,d.opt);' +
        'self.postMessage({id:d.id,ok:true,r:{action:r.action?r.action.id:null,reason:r.reason,estimate:r.estimate,ms:r.ms,timedOut:!!r.timedOut,fallback:r.fallback,' +
        'alternatives:(r.alternatives||[]).map(function(a){return{action:a.action.id,pTarget:a.pTarget,value:a.value,n:a.n};})}});}catch(err){self.postMessage({id:d.id,ok:false,error:String(err)});}};';
      var url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
      worker = new Worker(url);
      worker.onerror = function () { workerFailed = true; worker = null; };
    } catch (e) { workerFailed = true; worker = null; }
    return worker;
  }
  function think() {
    var c = app.craft;
    if (!c) return;
    if (c.state.done) { app.rec = null; app.thinking = false; renderCraft(); return; }
    var s = syncMm(CS.copyState(c.state));
    var used = { ssh: c.startSsh - s.sshCharges, mm: c.startMm - s.mmCharges };
    var opt = {
      target: c.target || 0, lowerTiers: c.lowerTiers, mode: app.mode, timeMs: app.settings.thinkMs,
      sshBudget: Math.max(0, c.budget.ssh - used.ssh), mmBudget: Math.max(0, c.budget.mm - used.mm), seed: 1 + c.history.length
    };
    if (opt.target <= 0) opt.target = 1; // "just complete": any quality counts
    var st = Object.assign({}, c.st, { condModel: app.settings.condModel, mmSteps: Math.max(1, Math.round(45 / app.settings.mmSecPerStep)) });
    var id = ++reqId;
    app.thinking = true;
    renderCraft();
    var w = getWorker();
    var done = function (res) {
      if (id !== reqId) return;
      app.thinking = false;
      if (!res.ok) { fallback('Search failed (' + res.error + '); showing the quick heuristic.'); return; }
      var r = res.r;
      app.rec = { action: r.action === null ? null : CS.ACTIONS[r.action], reason: r.reason, estimate: r.estimate, ms: r.ms, timedOut: r.timedOut,
        fallback: r.fallback, alternatives: (r.alternatives || []).map(function (a) { return { action: CS.ACTIONS[a.action], pTarget: a.pTarget, n: a.n }; }) };
      c.pending = app.rec.action; c.chosen = null;
      renderCraft();
    };
    if (w) {
      var timer = setTimeout(function () { fallback('Search timed out; showing the quick heuristic.'); }, Math.max(4000, app.settings.thinkMs * 6));
      w.onmessage = function (e) { if (e.data.id === id) { clearTimeout(timer); done(e.data); } };
      w.postMessage({ id: id, state: s, st: st, opt: opt });
    } else {
      // main-thread fallback: yield first so the page paints
      setTimeout(function () {
        try {
          var r = CS.recommend(s, st, Object.assign({}, opt, { timeMs: Math.min(opt.timeMs, 400) }));
          done({ ok: true, r: { action: r.action ? r.action.id : null, reason: r.reason, estimate: r.estimate, ms: r.ms, timedOut: r.timedOut, fallback: r.fallback,
            alternatives: (r.alternatives || []).map(function (a) { return { action: a.action.id, pTarget: a.pTarget, n: a.n }; }) } });
        } catch (err) { done({ ok: false, error: String(err) }); }
      }, 20);
    }
    function fallback(msg) {
      if (id !== reqId) return;
      reqId++; // drop the late worker answer so the shown advice cannot change under the player
      app.thinking = false;
      // timeMs 0: the heuristic choice, still filtered against certain failure
      var q = CS.recommend(s, st, Object.assign({}, opt, { timeMs: 0 }));
      var a = q.action;
      app.rec = { action: a, reason: q.reason, estimate: null, fallback: true, note: msg, alternatives: [] };
      c.pending = a; c.chosen = null;
      renderCraft();
    }
  }

  function report(cond, ok) {
    var c = app.craft;
    if (!c || c.state.done) return;
    var a = c.chosen || c.pending;
    if (!a) return;
    var s = syncMm(CS.copyState(c.state));
    var why = CS.whyNot(a, s, c.st);
    if (why) { toast(a.name + ' is not usable: ' + why); return; }
    var rate = CS.successRate(a, s);
    var success = rate >= 100 ? true : ok !== false;
    var n = CS.apply(a, s, c.st, success);
    if (!n.done) {
      if (a.step || a === A.CarefulObservation) n.cond = cond;
      else n.cond = s.cond;
    }
    if (a === A.MaterialMiracle) c.mmEndsAt = Date.now() + 43000; // 45 s, less input latency
    c.history.push({ state: c.state, action: a.id, ok: success, cond: n.cond, pg: n.lastPg || 0, qg: n.lastQg || 0, mmEndsAt: c.mmEndsAt });
    delete n.lastPg; delete n.lastQg; delete n.lastOk;
    c.state = n;
    c.chosen = null;
    if (n.done) finishCraft();
    save();
    think();
  }
  function finishCraft() {
    var c = app.craft;
    var ses = app.session;

    }
  }
  function undo() {

    c.state = h.state;
    var prev = c.history[c.history.length - 1];
    if (h.action !== null && CS.ACTIONS[h.action] === A.MaterialMiracle) c.mmEndsAt = 0;
    else if (prev && prev.mmEndsAt && prev.mmEndsAt > Date.now()) c.mmEndsAt = prev.mmEndsAt;
    save(); think();
  }
  function restart() {
    var c = app.craft;
    if (!c) return;
    if (c.counted) { app.session.sshLeft = c.startSsh; app.session.mmLeft = c.startMm; }
    var s = CS.initialState(c.st);
    s.sshCharges = c.startSsh; s.mmCharges = c.startMm;
    c.state = s; c.history = []; c.mmEndsAt = 0; c.counted = false;

  }

    startCraft();
  }

  // ---------------------------------------------------------------- craft view
  function renderCraft() {

    if (!c) { el.classList.add('hidden'); $('#main').classList.remove('crafting'); return; }

    var s = c.state, st = c.st;
    var r = DB.recipes[String(c.recipeId)];
    var h = '';
    // recommendation
    if (s.done) {
      var hit = s.done === 1 && s.quality >= c.target;
      h += '<div class="rec ' + (s.done === 1 ? 'done' : 'failed') + '"><div class="lbl">Craft finished</div><div class="act">' +
        (s.done === 1 ? (hit ? 'Target reached' : 'Completed') : 'Craft failed') + '</div><div class="why">Quality ' + fmt(s.quality) +
        (r.tiers ? ' · ' + tierText(s.quality, r) : '') + (c.target > 0 ? ' · target ' + fmt(c.target) : '') + '</div></div>';
      h += '<div class="controls"><button class="primary" data-act="nextCraft">Next craft (' + (app.session.craftsDone + 2) + ' of ' + app.session.craftsTotal + ')</button>' +
        '<button data-act="undo">Undo last step</button><button data-act="restart">Restart this craft</button></div>';
    } else {
      var a = c.chosen || (app.rec && app.rec.action);
      var rec = app.rec;
      h += '<div class="rec' + (app.thinking ? ' thinking' : '') + '" aria-live="polite"><div class="lbl">' + (c.chosen ? 'You chose' : (app.thinking ? 'Thinking…' : 'Recommended')) + '</div>' +
        '<div class="act" id="recAction">' + (a ? esc(a.name) : (app.thinking ? '…' : 'No usable action')) + '</div>';
      if (rec && !c.chosen && !app.thinking) {
        h += '<div class="why">' + esc(rec.reason || '') + '</div>';
        var est = rec.estimate;
        if (est && app.settings.showEstimate) {
          var pct = Math.round(est.pTarget * 100);
          h += '<div class="est">' + (est.pTarget >= 0.01 ? 'Simulated chance to reach the target: at least ~' + pct + '%' :
            'Target not reached in simulation with these stats; aiming for the most quality (typical result ~' + fmt(est.meanQuality) + (r.tiers ? ', ' + tierText(est.meanQuality, r) : '') + ')') +
            (est.pComplete < 0.995 ? ' · completes ~' + Math.round(est.pComplete * 100) + '%' : '') +

    if (KEY_CONDS.hasOwnProperty(k)) {
      var cond = KEY_CONDS[k];
      var sel = '#craft [data-act=cond][data-v="' + cond + '"][data-ok="' + (e.shiftKey ? '0' : '1') + '"]';
      var b = $(sel);
      if (b) { e.preventDefault(); b.click(); }
      else if ($('#craft [data-act=cond][data-v="' + cond + '"]')) toast('This action cannot fail; press the key without Shift.');
      else toast(CS.COND_NAMES[cond] + ' cannot occur here.');
    }
  });
  $('#btnSettings').onclick = settingsDialog;
  $('#btnHelp').onclick = helpDialog;
  setInterval(function () {
    // refresh the Material Miracle countdown
    if (app.craft && app.craft.mmEndsAt) {
      if (app.craft.mmEndsAt <= Date.now()) { app.craft.mmEndsAt = 0; save(); if (!app.thinking) think(); }
      else if (!app.thinking) { var el = document.querySelector('#craft .buffs'); if (el) el.innerHTML = buffList(app.craft.state); }
    }
  }, 1000);

  function renderAll() { renderSetup(); renderCraft(); }
  if (app.pendingRestore) { try { restoreCraft(app.pendingRestore); } catch (e) { app.craft = null; } }
  renderAll();
  if (app.craft) think();
  // test hook (no effect on normal use)
  window.__cosmicSolver = { app: app, report: report, undo: undo, restart: restart, think: think };
})();
</script>
</body>
</html>
