<style>:root {
  --bg: #f4f5f7; --panel: #ffffff; --ink: #1b1f24; --muted: #5d6673; --line: #d9dde3;
  --accent: #2d5bd7; --accent-ink: #ffffff; --ok: #1f8a4c; --bad: #c0392b; --warn: #b7791f;
  --rec-bg: #10233f; --rec-ink: #ffffff; --chip: #eef1f5; --bar: #e3e7ec;
  --c-normal: #8a919c; --c-good: #d64545; --c-excellent: #b445d6; --c-poor: #555b63; --c-centered: #c9a000;
  --c-sturdy: #2f6fd6; --c-pliant: #2e9e5b; --c-malleable: #3b3fa8; --c-primed: #8a4fd6; --c-goodomen: #e07b39; --c-robust: #138a8a;
  --radius: 10px; --gap: 12px;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --panel: #181c22; --ink: #e8ebef; --muted: #9aa3ae; --line: #2b313a;
    --accent: #6d93ff; --accent-ink: #0b0e12; --chip: #232932; --bar: #262c35; --rec-bg: #1e3a66;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --panel: #181c22; --ink: #e8ebef; --muted: #9aa3ae; --line: #2b313a;
  --accent: #6d93ff; --accent-ink: #0b0e12; --chip: #232932; --bar: #262c35; --rec-bg: #1e3a66;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header.top { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
header.top h1 { font-size: 16px; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header.top .planet { color: var(--muted); font-weight: 400; }
main { max-width: 1180px; margin: 0 auto; padding: 12px 16px 40px; display: grid; gap: var(--gap); grid-template-columns: 1fr; }
@media (min-width: 900px) { main.crafting { grid-template-columns: 380px 1fr; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; min-width: 0; }
.card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
.card h2 .grow { flex: 1; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--chip); border-radius: 8px; padding: 7px 10px; min-height: 36px; }
button:hover { border-color: var(--accent); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.ghost { background: transparent; }
button.small { min-height: 28px; padding: 3px 8px; font-size: 13px; }
button[disabled] { opacity: .45; cursor: not-allowed; }
input[type=number], input[type=text], select { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-height: 36px; width: 100%; }
label.inline { display: inline-flex; align-items: center; gap: 6px; margin-right: 12px; white-space: nowrap; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
.field { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
.field input, .field select { color: var(--ink); font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border-radius: 999px; padding: 4px 10px; min-height: 30px; font-size: 13px; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip.on .muted { color: inherit; opacity: .85; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.warn { color: var(--warn); }
.bad { color: var(--bad); }
.ok { color: var(--ok); }
.missions { max-height: 300px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; margin-top: 8px; }
.mission { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; padding: 8px 10px; }
.mission:last-child { border-bottom: 0; }
.mission.on { background: var(--chip); box-shadow: inset 3px 0 0 var(--accent); }
.mission .t { font-weight: 600; }
.mission .m { font-size: 12px; color: var(--muted); }
.badge { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 6px; background: var(--chip); border: 1px solid var(--line); margin-right: 4px; color: var(--ink); }
.badge.x { border-color: var(--c-primed); }
.rec { background: var(--rec-bg); color: var(--rec-ink); border-radius: var(--radius); padding: 14px 16px; }
.rec .lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .75; }
.rec .act { font-size: clamp(26px, 6vw, 40px); font-weight: 750; line-height: 1.1; margin: 4px 0 6px; overflow-wrap: anywhere; }
.rec .why { font-size: 15px; opacity: .95; }
.rec .est { font-size: 12px; opacity: .8; margin-top: 6px; }
.rec.thinking .act { opacity: .55; }
.rec.done { background: #1f6f43; }
.rec.failed { background: #7d2a22; }
.report { margin-top: 10px; }
.report .q { font-size: 13px; color: var(--muted); margin: 6px 0 4px; }
.conds { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
.cond { min-height: 46px; font-weight: 600; border-width: 2px; position: relative; text-align: left; padding-left: 12px; }
.cond kbd { position: absolute; right: 6px; top: 4px; font-size: 10px; opacity: .65; font-family: inherit; }
.cond.likely { box-shadow: 0 0 0 2px var(--accent) inset; }
.cond.fail { border-style: dashed; }
.c-0 { border-color: var(--c-normal); } .c-1 { border-color: var(--c-good); } .c-2 { border-color: var(--c-excellent); }
.c-3 { border-color: var(--c-poor); } .c-4 { border-color: var(--c-centered); } .c-5 { border-color: var(--c-sturdy); }
.c-6 { border-color: var(--c-pliant); } .c-7 { border-color: var(--c-malleable); } .c-8 { border-color: var(--c-primed); }
.c-9 { border-color: var(--c-goodomen); } .c-10 { border-color: var(--c-robust); }
.condtag { display: inline-block; padding: 2px 8px; border-radius: 6px; border: 2px solid; font-weight: 600; }
.bars { display: grid; gap: 8px; }
.bar { position: relative; height: 22px; background: var(--bar); border-radius: 6px; overflow: hidden; }
.bar .fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); opacity: .85; }
.bar.q .fill { background: #c28a12; }
.bar.d .fill { background: #3a8f6a; }
.bar.cp .fill { background: #7a5cc4; }
.bar .txt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; font-size: 13px; font-weight: 600; color: var(--ink); mix-blend-mode: normal; }
.bar .tick { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); opacity: .55; }
.statgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px 12px; margin-top: 8px; font-size: 14px; }
.buffs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.buff { background: var(--chip); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; font-size: 13px; }
.controls { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.hist { max-height: 260px; overflow: auto; font-size: 13px; }
.hist ol { margin: 0; padding-left: 22px; }
.hist li { margin: 2px 0; }
.alts { font-size: 12px; margin-top: 6px; opacity: .85; }
dialog { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); color: var(--ink); padding: 14px; max-width: min(640px, 94vw); width: 100%; }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog h3 { margin: 0 0 10px; font-size: 16px; }
.note { font-size: 12px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 8px; margin: 8px 0; }
.toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 20; }
.hidden { display: none !important; }
details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.kbdhelp kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 12px; }
</style>

on Phaenna are largely composed of glass. Unsurprisingly, these specimens have garnered much interest among our research teams. While there are still mysteries aplenty to solve, we have been able to ascertain the plants' processing potential, and are experimenting with the manufacture of glass-coated timber and fibers derived from the inorganic flora.","recipes":[36972],"objectives":[{"kind":"craft","items":[{"name":"Standard Timber Pallets","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":564,"name":"Gleaner's Gear II","job":0,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1300,"text":"Although we brought a variety of instruments with us to Phaenna, the unique challenges posed by resource collection and refinement here on the star necessitate more appropriate tools. To meet demand, we are asking contributors to produce a range of specialist equipment. Although some might question the decision to focus on tools suited only to specific tasks, we deem the consequent boost to productivity more than worth the effort.","recipes":[36973,36974],"objectives":[{"kind":"craft","items":[{"name":"Survey Wood Fishing Rod","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":565,"name":"Habitat Bedding","job":0,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1300,"text":"While Sinus Ardorum's close proximity to Etheirys instilled a sense of comfort and reassurance among many of our contributors, life on distant Phaenna is proving less amenable to some. Indeed, as we explore this vitreous, inhospitable planet, creature comforts will have an outsized impact on well-being and morale. We therefore request the provision of sumptuous bedding for use in our habitation modules. After all, what could provide greater comfort than knowing one's bedclothes were crafted with care by a fellow contributor?","recipes":[36975,36976],"objectives":[{"kind":"craft","items":[{"name":"Enriching Bunk Bed","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":566,"name":"Glass Fiber Resupply","job":0,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1800,"gold":2400,"text":"Phaenna is home to a wealth of glass from which we have successfully refined a variety of construction materials and scientific samples, going as far as to establish our own standards to meet our exacting specifications. Speaking of exacting specifications, we are seeking contributors to supply sufficient quantities of high-purity glass fiber. The resulting materials will be used in the transmission cables that run between Glassblowers' Beacon and our other facilities.","recipes":[36977],"objectives":[{"kind":"craft","items":[{"name":"Standard Glass Fiber","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":567,"name":"Advanced Resource Experimentation II","job":0,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1800,"gold":2400,"text":"We are presently pondering how the inorganic flora and impesctors found across Phaenna might be utilized for the initiative. Given the practical limitations of sourcing supplies from the moon, finding a means of transforming these phenomena into viable materials is of utmost concern. As part of this experimentation drive, we ask that contributors help craft the materials we seek.","recipes":[36978],"objectives":[{"kind":"score","items":[],"bronzeScore":1200,"specialAction":null,"specialActionCharges":0}]},{"id":568,"name":"Improved Tent Components","job":0,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":700,"gold":1000,"text":"Phaenna's extreme weather conditions and unique atmospheric composition represent serious challenges to material preservation. Our aim is to develop an innovative, highly functional tent to help better protect the stockpiles essential to our ongoing success. To this end, we request contributors to craft components for use in initial prototypes.","recipes":[36979],"objectives":[{"kind":"craft","items":[{"name":"Inorganic Resin","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":569,"name":"Efficient Recycled Resource Utilization II","job":0,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":700,"gold":1000,"text":"It is crucial we avoid squandering even a speck of the precious resources ferried to Phaenna from the moon. This is precisely why we are hoping to improve our rates of recycling and utilization of reclaimed materials. Certain supplies, including fuel, clothing, and even stationery, are especially well suited to the task. We call upon contributors to show their commitment to sustainability and craft the required items with the resources provided.","recipes":[36980],"objectives":[{"kind":"score","items":[],"bronzeScore":300,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":570,"name":"Phaenna Resource Utilization Research","job":0,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":2600,"gold":3000,"text":"Our formidable contributors have, thus far, skillfully utilized Phaenna's natural resources, but there remains the potential for even more wondrous applications of the star's glassy abundance. On this occasion, we want crafters to take a novel approach to working with familiar materials and manufacture lightweight, flexible, and above all, durable supplies.","recipes":[36981,36982,36983],"objectives":[{"kind":"craft","items":[{"name":"Lightweight Specialist Lumber","quantity":1},{"name":"Dense Specialist Lumber","quantity":1},{"name":"High-grade Specialist Lumber","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":571,"name":"EX: Outdoor Work Equipment","job":0,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":2500,"gold":3000,"text":"As we range ever further across the star, many of our contributors are choosing to sleep on-site when working away from the base. Given Phaenna's harsh climatic conditions, this option requires a fair degree of preparation and commitment. We therefore request the manufacture of supplies to ensure our brave outdoor sleepers can do so in the comfort they deserve.","recipes":[36984],"objectives":[{"kind":"score","items":[],"bronzeScore":1200,"specialAction":null,"specialActionCharges":0}]},{"id":572,"name":"EX: Premium Tools","job":0,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":2500,"gold":3000,"text":"Although we brought a variety of instruments with us to Phaenna, the unique challenges posed by resource collection and refinement here on the star necessitate more appropriate tools. To meet demand, we are asking contributors to produce a range of specialist equipment. Although some might question the decision to focus on tools suited only to specific tasks, we deem the consequent boost to productivity more than worth the effort.","recipes":[36985,36986,36987],"objectives":[{"kind":"craft","items":[{"name":"Specialist Fishing Rod","quantity":1},{"name":"Specialist Spinning Wheel","quantity":1},{"name":"Specialist Grinding Wheel","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":573,"name":"EX: Versatile Packaging Materials","job":0,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":800,"gold":1050,"text":"We wish to relay a portion of the resources discovered on Phaenna back to Sinus Ardorum, where they may be disseminated across Etheirys for preservation or, in the case of the Studium, further analysis. Given the delicate nature of these most valuable samples, we require packaging materials designed expressly for secure transportation aboard a starship─and all the better if they can accommodate variable sizes and quantities. As this project advances, so too will our scope!","recipes":[36988,36989],"objectives":[{"kind":"craft","items":[{"name":"Survey Packaging Materials","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":574,"name":"EX+: Temporary Collection Points","job":0,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":980,"gold":1080,"text":"Though the Cosmoliner's construction is sure to improve efficiency across the board, it cannot cover the entire breadth of the region, and so we seek components for portable storage facilities to use as strategic relay points. Please include with each submission a roof to shield against inclement weather and a sturdy floor to support the weight of the storage containers to be held therein.","recipes":[36990,36991],"objectives":[{"kind":"craft","items":[{"name":"Temporary Collection Point Materials","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":575,"name":"EX+: High-performance Bedding","job":0,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":540,"silver":1800,"gold":2000,"text":"While Sinus Ardorum's close proximity to Etheirys instilled a sense of comfort and reassurance among many of our contributors, life on distant Phaenna is proving less amenable to some. Indeed, as we explore this vitreous, inhospitable planet, creature comforts will have an outsized impact on well-being and morale. We therefore request the provision of sumptuous bedding for use in our habitation modules. After all, what could provide greater comfort than knowing one's bedclothes were crafted with care by a fellow contributor?","recipes":[36992],"objectives":[{"kind":"score","items":[],"bronzeScore":900,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":576,"name":"Phaenna Exploration Equipment I","job":0,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":2300,"gold":3000,"text":"The expedition team has reported a shortage of the supplies they need to safely traverse Phaenna's unforgiving terrain. This is no simple request, as the submissions must be durable enough to withstand even the most hostile of environs. For this reason, we ask that our artisans report to us for evaluation periodically during the course of their work.","recipes":[36993],"objectives":[{"kind":"craft","items":[{"name":"Survey Icebox Supplies","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":577,"name":"Phaenna Exploration Equipment II","job":0,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":2300,"gold":3000,"text":"The expedition team has reported a shortage of the supplies they need to safely traverse Phaenna's unforgiving terrain. This is no simple request, as the submissions must be durable enough to withstand even the most hostile of environs. For this reason, we ask that our artisans report to us for evaluation periodically during the course of their work.","recipes":[36994],"objectives":[{"kind":"craft","items":[{"name":"Survey Icebox","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":578,"name":"EX: Craftwork for the Forum I","job":0,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1700,"gold":2000,"text":"Project manager Mumukko is presently compiling a progress report addressed to the Studium. It goes without saying, but if we fail to convey the value inherent in this initiative, we jeopardize our funding! Therefore, we call upon our most talented contributors to submit their finest Phaenna-made crafts. It is imperative that we demonstrate all the rich and resplendent resources to be found on this star!","recipes":[36995],"objectives":[{"kind":"score","items":[],"bronzeScore":800,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":579,"name":"EX: Craftwork for the Forum II","job":0,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":600,"gold":800,"text":"Project manager Mumukko is presently compiling a progress report addressed to the Studium. It goes without saying, but if we fail to convey the value inherent in this initiative, we jeopardize our funding! Therefore, we call upon our most talented contributors to submit their finest Phaenna-made crafts. It is imperative that we demonstrate all the rich and resplendent resources to be found on this star!","recipes":[36996],"objectives":[{"kind":"craft","items":[{"name":"Planetary Adornment","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":580,"name":"EX: Craftwork for the Forum III","job":0,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":850,"gold":1000,"text":"Project manager Mumukko is presently compiling a progress report addressed to the Studium. It goes without saying, but if we fail to convey the value inherent in this initiative, we jeopardize our funding! Therefore, we call upon our most talented contributors to submit their finest Phaenna-made crafts. It is imperative that we demonstrate all the rich and resplendent resources to be found on this star!","recipes":[36997],"objectives":[{"kind":"score","items":[],"bronzeScore":400,"specialAction":null,"specialActionCharges":0}]},{"id":581,"name":"Habitation Improvement Plan I","job":0,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1400,"gold":2000,"text":"We've noticed a pattern among artisans who spend ample time in the Phaenna wilds: they often lament the drab décor upon their return to Glassblowers' Beacon. Doubtless their eyes have grown accustomed to more vibrant surrounds. So be it! We hereby welcome submissions of Phaenna-inspired furniture─not only to improve life at the base, but to offer as souvenirs, that we might spread these vivid colors to Sinus Ardorum and beyond!","recipes":[36998],"objectives":[{"kind":"craft","items":[{"name":"Enriching Lounge Bench","quantity":2}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":582,"name":"EX: Habitation Improvement Plan II","job":0,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":850,"gold":1000,"text":"We've noticed a pattern among artisans who spend ample time in the Phaenna wilds: they often lament the drab décor upon their return to Glassblowers' Beacon. Doubtless their eyes have grown accustomed to more vibrant surrounds. So be it! We hereby welcome submissions of Phaenna-inspired furniture─not only to improve life at the base, but to offer as souvenirs, that we might spread these vivid colors to Sinus Ardorum and beyond!","recipes":[36999],"objectives":[{"kind":"score","items":[],"bronzeScore":400,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":583,"name":"EX+: Habitation Improvement Plan III","job":0,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":540,"silver":1000,"gold":1600,"text":"We've noticed a pattern among artisans who spend ample time in the Phaenna wilds: they often lament the drab décor upon their return to Glassblowers' Beacon. Doubtless their eyes have grown accustomed to more vibrant surrounds. So be it! We hereby welcome submissions of Phaenna-inspired furniture─not only to improve life at the base, but to offer as souvenirs, that we might spread these vivid colors to Sinus Ardorum and beyond!","recipes":[37000],"objectives":[{"kind":"score","items":[],"bronzeScore":800,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":584,"name":"EX+: Resin Crystal Refinement I","job":0,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":980,"gold":1080,"text":"A highly precious material has been discovered after exhaustive exploration of the star. We challenge contributors to put their skills to the test by crafting an item that will advance our initiative with this rare resource. As the material is highly difficult to process, great preparation and care must be taken. We will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[37001,37002],"objectives":[{"kind":"craft","items":[{"name":"Purified Planetary Resin","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":585,"name":"EX+: Resin Crystal Refinement II","job":0,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":600,"silver":980,"gold":1080,"text":"A highly precious material has been discovered after exhaustive exploration of the star. We challenge contributors to put their skills to the test by crafting an item that will advance our initiative with this rare resource. As the material is highly difficult to process, great preparation and care must be taken. We will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[37003,37004],"objectives":[{"kind":"craft","items":[{"name":"Planetary Jewel Resin","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":586,"name":"EX+: Resin Crystal Refinement III","job":0,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":450,"silver":1000,"gold":1080,"text":"A highly precious material has been discovered after exhaustive exploration of the star. We challenge contributors to put their skills to the test by crafting an item that will advance our initiative with this rare resource. As the material is highly difficult to process, great preparation and care must be taken. We will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[37005,37006],"objectives":[{"kind":"craft","items":[{"name":"Planetary Marble Resin","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":587,"name":"Multi-purpose Glass","job":1,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Phaenna is a treasure trove of glass resources. The initiative has established its own set of standards for the refinement of these valuable materials, with the intention of sending samples back to Sinus Ardorum for use in the construction of facilities and in the pursuit of interstellar research. Contributors are requested to produce quality glass ingots in bulk as we determine the potential applications of this star's abounding resource.","recipes":[37007],"objectives":[{"kind":"craft","items":[{"name":"Standard Glass Ingot","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":588,"name":"Repair Component Processing","job":1,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Included among the supplies sent from Sinus Ardorum are unprocessed materials, which we hope to refine for various purposes. Contributors are requested to process these raw materials to produce components for the Cosmoliner, and ensure the initiative has a stockpile of necessary resources at all times.","recipes":[37008],"objectives":[{"kind":"craft","items":[{"name":"Intricate Cosmoliner Gear","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":589,"name":"Glass Resource Refinement","job":1,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"While this star is home to a prodigious amount of glass, rare minerals have been found within cluster formations on occasion. Were we to succeed in extracting metallic resources from them, the glass itself may become a vein of precious metals for the initiative. As such, we ask that contributors attempt to extract metals from a selection of glass clusters and render them into nuggets and ingots accordingly.","recipes":[37009],"objectives":[{"kind":"craft","items":[{"name":"Phainoalloy Ingot","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":590,"name":"Drone Lenses","job":1,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Advancements are regularly being made with the practical use of glass resources found here. Thus far, local glass has been utilized in the production of lens for delicate equipment such as drones and the Stellascope, but with the proper processing expertise, we believe the glass may even be fashioned into materials for artistic craftworks. Capable contributors are requested to fashion high-quality products fitting this description as a demonstration of this potential application.","recipes":[37010],"objectives":[{"kind":"craft","items":[{"name":"Polarized Drone Lens","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":591,"name":"Base Equipment","job":1,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Though we continue our efforts to maintain an ideal environment on this star via rainbow crystals, Phaenna's climate is unpredictable, and naturally prone to grow harsh. For the safety of all initiative members working outdoors, protective equipment resistant to the elements is desired. Contributors are hence requested to fabricate as many components of varying insulative properties as able.","recipes":[37011],"objectives":[{"kind":"craft","items":[{"name":"Standard Peg","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":592,"name":"Stormproof Components","job":1,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Though we persist in our efforts to maintain an ideal environment via rainbow crystals, the dense aether clouds permeating Phaenna's skies are nevertheless known to trigger various weather phenomena. Lightning strikes in particular can have catastrophic effects, and thus we seek to install additional lightning rods in the exploration zone. Contributors are requested to deliver the requisite components to aid us in achieving that goal.","recipes":[37012],"objectives":[{"kind":"craft","items":[{"name":"Standard Lightning Rod","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":593,"name":"Multi-purpose Glass Resupply","job":1,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Phaenna is a treasure trove of glass resources. The initiative has established its own set of standards for the refinement of these valuable materials, with the intention of sending samples back to Sinus Ardorum for use in the construction of facilities and in the pursuit of interstellar research. Contributors are requested to produce quality glass ingots in bulk as we determine the potential applications of this star's abounding resource.","recipes":[37013],"objectives":[{"kind":"craft","items":[{"name":"Standard Glass Ingot","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":594,"name":"Station Parts","job":1,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Though we continue our efforts to maintain an ideal environment on this star via rainbow crystals, Phaenna's climate is unpredictable, and naturally prone to grow harsh. For the safety of all initiative members working outdoors, protective equipment resistant to the elements is desired. Contributors are hence requested to fabricate as many components of varying insulative properties as able.","recipes":[37014],"objectives":[{"kind":"craft","items":[{"name":"Standard Pile Driver Piece","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":595,"name":"Gathering Tools","job":1,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1300,"gold":3000,"text":"Although we brought a variety of instruments with us to Phaenna, the unique challenges posed by resource collection and refinement here on the star necessitate more appropriate tools. To meet demand, we are asking contributors to produce a range of specialist equipment. Although some might question the decision to focus on tools suited only to specific tasks, we deem the consequent boost to productivity more than worth the effort.","recipes":[37015],"objectives":[{"kind":"craft","items":[{"name":"Survey Four-paw Saw","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":596,"name":"Stormproof Components Resupply","job":1,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":700,"gold":1500,"text":"Though we persist in our efforts to maintain an ideal environment via rainbow crystals, the dense aether clouds permeating Phaenna's skies are nevertheless known to trigger various weather phenomena. Lightning strikes in particular can have catastrophic effects, and thus we seek to install additional lightning rods in the exploration zone. Contributors are requested to deliver the requisite components to aid us in achieving that goal.","recipes":[37016,37017],"objectives":[{"kind":"craft","items":[{"name":"Standard Lightning Rod","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":597,"name":"Glass Furnace Assembly","job":1,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1100,"gold":2500,"text":"Furnaces are required for the refinement of glass, yet due to the equipment's considerable size, it cannot be transported here from Sinus Ardorum. As our present inventory is insufficient, it falls to our talented contributors to locally assemble the remainder that we need. As we will provide the requisite materials for production, we ask only that our artisans produce furnaces according to the needs of each section.","recipes":[37018,37019],"objectives":[{"kind":"craft","items":[{"name":"Enrichment Kiln","quantity":2}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":598,"name":"Drone Precision Components","job":1,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1100,"gold":2500,"text":"Advancements are regularly being made with the practical use of glass resources found here. Thus far, local glass has been utilized in the production of lens for delicate equipment such as drones and the Stellascope, but with the proper processing expertise, we believe the glass may even be fashioned into materials for artistic craftworks. Capable contributors are requested to fashion high-quality products fitting this description as a demonstration of this potential application.","recipes":[37020,37021],"objectives":[{"kind":"craft","items":[{"name":"Magnifying Drone Lens","quantity":2}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":599,"name":"Heaters","job":1,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":700,"gold":1500,"text":"When annealing winds arrive and the entire region grows frigid, it's cold enough to make even a Loporrit's fur stand on end. It is therefore all the more necessary for our fur-deprived─and even abundantly furred!─contributors to warm themselves adequately after tending to a red alert. One and all under our watch must be both warm and snug, and so we request the fabrication of heaters and bathing equipment. We desire a vast enough yield to ensure no soul is deprived of warmth when they most need it.","recipes":[37022,37023],"objectives":[{"kind":"craft","items":[{"name":"Survey Stove","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":600,"name":"Interim Part Processing","job":1,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1600,"gold":2400,"text":"Included among the supplies sent from Sinus Ardorum are unprocessed materials, which we hope to refine for various purposes. Contributors are requested to process these raw materials to produce components for the Cosmoliner, and ensure the initiative has a stockpile of necessary resources at all times.","recipes":[37024],"objectives":[{"kind":"craft","items":[{"name":"Cosmoliner Shaft","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":601,"name":"Phaenna Glass","job":1,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1600,"gold":2400,"text":"Phaenna is a treasure trove of glass resources. The initiative has established its own set of standards for the refinement of these valuable materials, with the intention of sending samples back to Sinus Ardorum for use in the construction of facilities and in the pursuit of interstellar research. Contributors are requested to produce quality glass ingots in bulk as we determine the potential applications of this star's abounding resource.","recipes":[37025],"objectives":[{"kind":"craft","items":[{"name":"Standard Glass Ingot","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":602,"name":"Ore Refinement","job":1,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1600,"text":"While this star is home to a prodigious amount of glass, rare minerals have been found within cluster formations on occasion. Were we to succeed in extracting metallic resources from them, the glass itself may become a vein of precious metals for the initiative. As such, we ask that contributors attempt to extract metals from a selection of glass clusters and render them into nuggets and ingots accordingly.","recipes":[37026],"objectives":[{"kind":"craft","items":[{"name":"Phainonugget","quantity":2}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":603,"name":"Stellascope Lenses","job":1,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":2700,"gold":3000,"text":"Advancements are regularly being made with the practical use of glass resources found here. Thus far, local glass has been utilized in the production of lens for delicate equipment such as drones and the Stellascope, but with the proper processing expertise, we believe the glass may even be fashioned into materials for artistic craftworks. Capable contributors are requested to fashion high-quality products fitting this description as a demonstration of this potential application.","recipes":[37027],"objectives":[{"kind":"craft","items":[{"name":"Test Material Lens Part","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":604,"name":"Weather-resistant Containers","job":1,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1600,"gold":2400,"text":"Though we continue our efforts to maintain an ideal environment on this star via rainbow crystals, Phaenna's climate is unpredictable, and naturally prone to grow harsh. For the safety of all initiative members working outdoors, protective equipment resistant to the elements is desired. Contributors are hence requested to fabricate as many components of varying insulative properties as able.","recipes":[37028],"objectives":[{"kind":"craft","items":[{"name":"Heat-resistant Survey Container","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":605,"name":"Bathing Equipment","job":1,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":2700,"gold":3000,"text":"When annealing winds arrive and the entire region grows frigid, it's cold enough to make even a Loporrit's fur stand on end. It is therefore all the more necessary for our fur-deprived─and even abundantly furred!─contributors to warm themselves adequately after tending to a red alert. One and all under our watch must be both warm and snug, and so we request the fabrication of heaters and bathing equipment. We desire a vast enough yield to ensure no soul is deprived of warmth when they most need it.","recipes":[37029],"objectives":[{"kind":"craft","items":[{"name":"Enriching Bathtub","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":606,"name":"Experimental Stormproof Components","job":1,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1300,"text":"Though we persist in our efforts to maintain an ideal environment via rainbow crystals, the dense aether clouds permeating Phaenna's skies are nevertheless known to trigger various weather phenomena. Lightning strikes in particular can have catastrophic effects, and thus we seek to install additional lightning rods in the exploration zone. Contributors are requested to deliver the requisite components to aid us in achieving that goal.","recipes":[37030,37031],"objectives":[{"kind":"craft","items":[{"name":"Standard Lightning Magnet","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":607,"name":"Large Kitchen Equipment","job":1,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1300,"text":"Although we brought a variety of instruments with us to Phaenna, the unique challenges posed by resource collection and refinement here on the star necessitate more appropriate tools. To meet demand, we are asking contributors to produce a range of specialist equipment. Although some might question the decision to focus on tools suited only to specific tasks, we deem the consequent boost to productivity more than worth the effort.","recipes":[37032,37033],"objectives":[{"kind":"craft","items":[{"name":"Enriching Oversized Frypan","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":608,"name":"Phaenna Glass Resupply","job":1,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1800,"gold":2400,"text":"Phaenna is a treasure trove of glass resources. The initiative has established its own set of standards for the refinement of these valuable materials, with the intention of sending samples back to Sinus Ardorum for use in the construction of facilities and in the pursuit of interstellar research. Contributors are requested to produce quality glass ingots in bulk as we determine the potential applications of this star's abounding resource.","recipes":[37034],"objectives":[{"kind":"craft","items":[{"name":"Standard Glass Ingot","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":609,"name":"Planetary Ore Refinement","job":1,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1800,"gold":2400,"text":"While this star is home to a prodigious amount of glass, rare minerals have been found within cluster formations on occasion. Were we to succeed in extracting metallic resources from them, the glass itself may become a vein of precious metals for the initiative. As such, we ask that contributors attempt to extract metals from a selection of glass clusters and render them into nuggets and ingots accordingly.","recipes":[37035],"objectives":[{"kind":"score","items":[],"bronzeScore":1200,"specialAction":null,"specialActionCharges":0}]},{"id":610,"name":"Precision Component Processing","job":1,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":700,"gold":1000,"text":"Included among the supplies sent from Sinus Ardorum are unprocessed materials, which we hope to refine for various purposes. Contributors are requested to process these raw materials to produce components for the Cosmoliner, and ensure the initiative has a stockpile of necessary resources at all times.","recipes":[37036],"objectives":[{"kind":"craft","items":[{"name":"Standard Stellar Shaft","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":611,"name":"Crafter's Tools","job":1,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":700,"gold":1000,"text":"Although we brought a variety of instruments with us to Phaenna, the unique challenges posed by resource collection and refinement here on the star necessitate more appropriate tools. To meet demand, we are asking contributors to produce a range of specialist equipment. Although some might question the decision to focus on tools suited only to specific tasks, we deem the consequent boost to productivity more than worth the effort.","recipes":[37037],"objectives":[{"kind":"score","items":[],"bronzeScore":300,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":612,"name":"Experimental Alloy Samples","job":1,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":2600,"gold":3000,"text":"A diverse variety of minerals can be found on Phaenna, many of which exhibit a distinctive color. Though difficult to utilize in isolation, refining the minerals with a multitude of metals could produce alloys suitable for our needs. With the aim of widening our pool of resources on this star, we ask that contributors smelt alloy samples for experimental purposes.","recipes":[37038,37039,37040],"objectives":[{"kind":"craft","items":[{"name":"Specialist Alloy Ingot","quantity":1},{"name":"Specialist Alloy Plate","quantity":1},{"name":"Specialist Alloy Nugget","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":613,"name":"EX: Artisanal Craftwork","job":1,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":2500,"gold":3000,"text":"Advancements are regularly being made with the practical use of glass resources found here. Thus far, local glass has been utilized in the production of lens for delicate equipment such as drones and the Stellascope, but with the proper processing expertise, we believe the glass may even be fashioned into materials for artistic craftworks. Capable contributors are requested to fashion high-quality products fitting this description as a demonstration of this potential application.","recipes":[37041],"objectives":[{"kind":"score","items":[],"bronzeScore":1200,"specialAction":null,"specialActionCharges":0}]},{"id":614,"name":"EX: Cosmoliner Parts","job":1,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":2500,"gold":3000,"text":"Though we continue our efforts to maintain an ideal environment on this star via rainbow crystals, Phaenna's climate is unpredictable, and naturally prone to grow harsh. For the safety of all initiative members working outdoors, protective equipment resistant to the elements is desired. Contributors are hence requested to fabricate as many components of varying insulative properties as able.","recipes":[37042,37043,37044],"objectives":[{"kind":"craft","items":[{"name":"Delicate Survey Station Lens","quantity":1},{"name":"Intricate Survey Station Cylinder","quantity":1},{"name":"Intricate Survey Station Piston","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":615,"name":"EX: Glass Furnace Assembly II","job":1,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":800,"gold":1050,"text":"Furnaces are required for the refinement of glass, yet due to the equipment's considerable size, it cannot be transported here from Sinus Ardorum. As our present inventory is insufficient, it falls to our talented contributors to locally assemble the remainder that we need. As we will provide the requisite materials for production, we ask only that our artisans produce furnaces according to the needs of each section.","recipes":[37045,37046],"objectives":[{"kind":"craft","items":[{"name":"Survey Glass Furnace","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":616,"name":"EX+: Experimental Stormproof Components Resupply","job":1,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":980,"gold":1080,"text":"Though we persist in our efforts to maintain an ideal environment via rainbow crystals, the dense aether clouds permeating Phaenna's skies are nevertheless known to trigger various weather phenomena. Lightning strikes in particular can have catastrophic effects, and thus we seek to install additional lightning rods in the exploration zone. Contributors are requested to deliver the requisite components to aid us in achieving that goal.","recipes":[37047,37048],"objectives":[{"kind":"craft","items":[{"name":"Lightning Rod Material","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":617,"name":"EX+: Battery Packs","job":1,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":540,"silver":1800,"gold":2000,"text":"The mini rovers have been a great boon to project efforts around the star. Unfortunately, the vehicles rapidly deplete battery packs, and we now find our reserves running low. Contributors are urged to produce as many battery packs as possible, that we may replenish our stock and have extra on hand in case of emergencies.","recipes":[37049],"objectives":[{"kind":"score","items":[],"bronzeScore":900,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":618,"name":"Glassworker's Tools I","job":1,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":2300,"gold":3000,"text":"Refinement of local resources is ongoing at the base, as our teams learn from distinguished glasswork experts from Etheirys. Unfortunately, we presently lack much of the requisite specialist equipment for this work, and request the procurement of a variety of tools for glassworking. Due to the complexity of this task, we ask that our artisans report to us for evaluation periodically during the course of their work.","recipes":[37050],"objectives":[{"kind":"craft","items":[{"name":"Large Toolbox Components","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":619,"name":"Glassworker's Tools II","job":1,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":2300,"gold":3000,"text":"Refinement of local resources is ongoing at the base, as our teams learn from distinguished glasswork experts from Etheirys. Unfortunately, we presently lack much of the requisite specialist equipment for this work, and request the procurement of a variety of tools for glassworking. Due to the complexity of this task, we ask that our artisans report to us for evaluation periodically during the course of their work.","recipes":[37051],"objectives":[{"kind":"craft","items":[{"name":"Large Glassblowers' Toolbox","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":620,"name":"EX: Operation Chilling-a-Way Drone Parts I","job":1,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1700,"gold":2000,"text":"A foray across Fusingway Vent necessitates the enactment of Operation Chilling-a-Way, with the continued application of coolant from drones overhead to cool the path. The drones utilized in the operation are improved models of the Mare Lamentorum variant, now heat-resistant and outfitted with an emission port for the coolant. We require additional components to upgrade further drones to our current standard.","recipes":[37052],"objectives":[{"kind":"score","items":[],"bronzeScore":800,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":621,"name":"EX: Operation Chilling-a-Way Drone Parts II","job":1,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":600,"gold":800,"text":"A foray across Fusingway Vent necessitates the enactment of Operation Chilling-a-Way, with the continued application of coolant from drones overhead to cool the path. The drones utilized in the operation are improved models of the Mare Lamentorum variant, now heat-resistant and outfitted with an emission port for the coolant. We require additional components to upgrade further drones to our current standard.","recipes":[37053],"objectives":[{"kind":"craft","items":[{"name":"Coolant Drone Core","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":622,"name":"EX: Operation Chilling-a-Way Drone Parts III","job":1,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":850,"gold":1000,"text":"A foray across Fusingway Vent necessitates the enactment of Operation Chilling-a-Way, with the continued application of coolant from drones overhead to cool the path. The drones utilized in the operation are improved models of the Mare Lamentorum variant, now heat-resistant and outfitted with an emission port for the coolant. We require additional components to upgrade further drones to our current standard.","recipes":[37054],"objectives":[{"kind":"score","items":[],"bronzeScore":400,"specialAction":null,"specialActionCharges":0}]},{"id":623,"name":"Stellascope Parts I","job":1,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1400,"gold":2000,"text":"The Cosmic Exploration Initiative intends to launch its exploration into deeper, unknown regions of space from this star─but not without first getting a wider glimpse of what's out there through the Stellascope. It is therefore imperative that we secure sufficient supplies for its continued construction and future maintenance. The Stellascope is the product of our combined knowledge of the cosmos and study of aetherology, and could theoretically give us insight into the flow of aether in distant galaxies. To meet the scope's exacting needs, we request highly aetheroconductive parts of the finest quality from contributors.","recipes":[37055],"objectives":[{"kind":"craft","items":[{"name":"Intricate Stellascope Gear","quantity":2}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":624,"name":"EX: Stellascope Parts II","job":1,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":850,"gold":1000,"text":"The Cosmic Exploration Initiative intends to launch its exploration into deeper, unknown regions of space from this star─but not without first getting a wider glimpse of what's out there through the Stellascope. It is therefore imperative that we secure sufficient supplies for its continued construction and future maintenance. The Stellascope is the product of our combined knowledge of the cosmos and study of aetherology, and could theoretically give us insight into the flow of aether in distant galaxies. To meet the scope's exacting needs, we request highly aetheroconductive parts of the finest quality from contributors.","recipes":[37056],"objectives":[{"kind":"score","items":[],"bronzeScore":400,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":625,"name":"EX+: Stellascope Parts III","job":1,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":540,"silver":1000,"gold":1600,"text":"The Cosmic Exploration Initiative intends to launch its exploration into deeper, unknown regions of space from this star─but not without first getting a wider glimpse of what's out there through the Stellascope. It is therefore imperative that we secure sufficient supplies for its continued construction and future maintenance. The Stellascope is the product of our combined knowledge of the cosmos and study of aetherology, and could theoretically give us insight into the flow of aether in distant galaxies. To meet the scope's exacting needs, we request highly aetheroconductive parts of the finest quality from contributors.","recipes":[37057],"objectives":[{"kind":"score","items":[],"bronzeScore":800,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":626,"name":"EX+: Synthetic Crystal Glass I","job":1,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":980,"gold":1080,"text":"A highly precious material has been discovered after exhaustive exploration of the star. We challenge contributors to put their skills to the test by crafting an item that will advance our initiative with this rare resource. As the material is highly difficult to process, great preparation and care must be taken. We will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[37058,37059],"objectives":[{"kind":"craft","items":[{"name":"Aethercharged Glass","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":627,"name":"EX+: Synthetic Crystal Glass II","job":1,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":600,"silver":980,"gold":1080,"text":"A highly precious material has been discovered after exhaustive exploration of the star. We challenge contributors to put their skills to the test by crafting an item that will advance our initiative with this rare resource. As the material is highly difficult to process, great preparation and care must be taken. We will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[37060,37061],"objectives":[{"kind":"craft","items":[{"name":"Aethercharged Sandglass","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":628,"name":"EX+: Phaenna Craftwork","job":1,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":450,"silver":1000,"gold":1080,"text":"A highly precious material has been discovered after exhaustive exploration of the star. We challenge contributors to put their sk t be both warm and snug, and so we request the fabrication of heaters and bathing equipment. We desire a vast enough yield to ensure no soul is deprived of warmth when they most need it.","recipes":[37079,37080],"objectives":[{"kind":"craft","items":[{"name":"Survey Stove","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":642,"name":"Interim Part Processing","job":2,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1600,"gold":2400,"text":"Included among the supplies sent from Sinus Ardorum are unprocessed materials, which we hope to refine for various purposes. Contributors are requested to process these raw materials to produce components for the Cosmoliner, and ensure the initiative has a stockpile of necessary resources at all times.","recipes":[37081],"objectives":[{"kind":"craft","items":[{"name":"Cosmoliner Shaft","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":643,"name":"Phaenna Glass","job":2,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1600,"gold":2400,"text":"Phaenna is a treasure trove of glass resources. The initiative has established its own set of standards for the refinement of these valuable materials, with the intention of sending samples back to Sinus Ardorum for use in the construction of facilities and in the pursuit of interstellar research. Contributors are requested to produce quality glass ingots in bulk as we determine the potential applications of this star's abounding resource.","recipes":[37082],"objectives":[{"kind":"craft","items":[{"name":"Standard Glass Ingot","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":644,"name":"Ore Refinement","job":2,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1600,"text":"While this star is home to a prodigious amount of glass, rare minerals have been found ue to the equipment's considerable size, it cannot be transported here from Sinus Ardorum. As our present inventory is insufficient, it falls to our talented contributors to locally assemble the remainder that we need. As we will provide the requisite materials for production, we ask only that our artisans produce furnaces according to the needs of each section.","recipes":[37102,37103],"objectives":[{"kind":"craft","items":[{"name":"Survey Stove","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":658,"name":"EX+: Experimental Stormproof Components Resupply","job":2,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":980,"gold":1080,"text":"Though we persist in our efforts to maintain an ideal environment via rainbow crystals, the dense aether clouds permeating Phaenna's skies are nevertheless known to trigger various weather phenomena. Lightning strikes in particular can have catastrophic effects, and thus we seek to install additional lightning rods in the exploration zone. Contributors are requested to deliver the requisite components to aid us in achieving that goal.","recipes":[37104,37105],"objectives":[{"kind":"craft","items":[{"name":"Lightning Rod Stabilizer","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":659,"name":"EX+: Battery Packs","job":2,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":540,"silver":1800,"gold":2000,"text":"The mini rovers have been a great boon to project efforts around the star. Unfortunately, the vehicles rapidly deplete battery packs, and we now find our reserves running low. Contributors are urged to produce as many battery packs as possible, that we may replenish our stock and have extra on hand in case of emergencies.","recipes":[37106],"objectives":[{"kind":"score","items":[],"bronzeScore":900,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":660,"name":"Glassworker's Too ard Glass Ingot","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":678,"name":"Station Parts","job":3,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Though we continue our efforts to maintain an ideal environment on this star via rainbow crystals, Phaenna's climate is unpredictable, and naturally prone to grow harsh. For the safety of all initiative members working outdoors, protective equipment resistant to the elements is desired. Contributors are hence requested to fabricate as many components of varying insulative properties as able.","recipes":[37128],"objectives":[{"kind":"craft","items":[{"name":"Standard Pile Driver Piece","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":679,"name":"Gathering Tools","job":3,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1300,"gold":3000,"text":"Although we brought a variety of instruments with us to Phaenna, the unique challenges posed by resource collection and refinement here on the star necessitate more appropriate tools. To meet demand, we are asking contributors to produce a range of specialist equipment. Although some might question the decision to focus on tools suited only to specific tasks, we deem the consequent boost to productivity more than worth the effort.","recipes":[37129],"objectives":[{"kind":"craft","items":[{"name":"Survey Four-paw Saw","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":680,"name":"Stormproof Components Resupply","job":3,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":700,"gold":1500,"text":"Though we persist in our efforts to maintain an ideal environment via rainbow crystals, the dense aether clouds permeating Phaenna's skies are nevertheless known to trigger various weather phenomena. Lightning strikes in particular can have catastrophic effec ced":true,"critical":false,"timeLimitSec":0,"silver":700,"gold":1500,"text":"When annealing winds arrive and the entire region grows frigid, it's cold enough to make even a Loporrit's fur stand on end. It is therefore all the more necessary for our fur-deprived─and even abundantly furred!─contributors to warm themselves adequately after tending to a red alert. One and all under our watch must be both warm and snug, and so we request the fabrication of heaters and bathing equipment. We desire a vast enough yield to ensure no soul is deprived of warmth when they most need it.","recipes":[37136,37137],"objectives":[{"kind":"craft","items":[{"name":"Survey Stove","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":684,"name":"Interim Part Processing","job":3,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1600,"gold":2400,"text":"Included among the supplies sent from Sinus Ardorum are unprocessed materials, which we hope to refine for various purposes. Contributors are requested to process these raw materials to produce components for the Cosmoliner, and ensure the initiative has a stockpile of necessary resources at all times.","recipes":[37138],"objectives":[{"kind":"craft","items":[{"name":"Cosmoliner Shaft","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":685,"name":"Phaenna Glass","job":3,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1600,"gold":2400,"text":"Phaenna is a treasure trove of glass resources. The initiative has established its own set of standards for the refinement of these valuable materials, with the intention of sending samples back to Sinus Ardorum for use in the construction of facilities and in the pursuit of interstellar research. Contributors are requested to produce quality glass ingots in bulk as we determine the potential applications of this star's abounding resource.","recipes":[37139],"objecti
