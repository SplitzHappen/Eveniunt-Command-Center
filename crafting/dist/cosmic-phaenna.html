lete battery packs, and we now find our reserves running low. Contributors are urged to produce as many battery packs as possible, that we may replenish our stock and have extra on hand in case of emergencies.","recipes":[37163],"objectives":[{"kind":"score","items":[],"bronzeScore":900,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":702,"name":"Glassworker's Tools I","job":3,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":2300,"gold":3000,"text":"Refinement of local resources is ongoing at the base, as our teams learn from distinguished glasswork experts from Etheirys. Unfortunately, we presently lack much of the requisite specialist equipment for this work, and request the procurement of a variety of tools for glassworking. Due to the complexity of this task, we ask that our artisans report to us for evaluation periodically during the course of their work.","recipes":[37164],"objectives":[{"kind":"craft","items":[{"name":"Neo-toolbox Components","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":703,"name":"Glassworker's Tools II","job":3,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":2300,"gold":3000,"text":"Refinement of local resources is ongoing at the base, as our teams learn from distinguished glasswork experts from Etheirys. Unfortunately, we presently lack much of the requisite specialist equipment for this work, and request the procurement of a variety of tools for glassworking. Due to the complexity of this task, we ask that our artisans report to us for evaluation periodically during the course of their work.","recipes":[37165],"objectives":[{"kind":"craft","items":[{"name":"Glassworker's Neo-toolbox","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":704,"name":"EX: Operation Chilling-a-Way Drone Parts I","job":3,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1700,"gold":2000,"text":"A foray across Fusingway Vent necessitates the enactment of Operation Chilling-a-Way, with the continued application of coolant from drones overhead to cool the path. The drones utilized in the operation are improved models of the Mare Lamentorum variant, now heat-resistant and outfitted with an emission port for the coolant. We require additional components to upgrade further drones to our current standard.","recipes":[37166],"objectives":[{"kind":"score","items":[],"bronzeScore":800,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":705,"name":"EX: Operation Chilling-a-Way Drone Parts II","job":3,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":600,"gold":800,"text":"A foray across Fusingway Vent necessitates the enactment of Operation Chilling-a-Way, with the continued application of coolant from drones overhead to cool the path. The drones utilized in the operation are improved models of the Mare Lamentorum variant, now heat-resistant and outfitted with an emission port for the coolant. We require additional components to upgrade further drones to our current standard.","recipes":[37167],"objectives":[{"kind":"craft","items":[{"name":"Coolant Drone Core","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":706,"name":"EX: Operation Chilling-a-Way Drone Parts III","job":3,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":850,"gold":1000,"text":"A foray across Fusingway Vent necessitates the enactment of Operation Chilling-a-Way, with the continued application of coolant from drones overhead to cool the path. The drones utilized in the operation are improved models of the Mare Lamentorum variant, now heat-resistant and outfitted with an emission port for the coolant. We require additional components to upgrade further drones to our current standard.","recipes":[37168],"objectives":[{"kind":"score","items":[],"bronzeScore":400,"specialAction":null,"specialActionCharges":0}]},{"id":707,"name":"Stellascope Parts I","job":3,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1400,"gold":2000,"text":"The Cosmic Exploration Initiative intends to launch its exploration into deeper, unknown regions of space from this star─but not without first getting a wider glimpse of what's out there through the Stellascope. It is therefore imperative that we secure sufficient supplies for its continued construction and future maintenance. The Stellascope is the product of our combined knowledge of the cosmos and study of aetherology, and could theoretically give us insight into the flow of aether in distant galaxies. To meet the scope's exacting needs, we request highly aetheroconductive parts of the finest quality from contributors.","recipes":[37169],"objectives":[{"kind":"craft","items":[{"name":"Intricate Stellascope Gear","quantity":2}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":708,"name":"EX: Stellascope Parts II","job":3,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":850,"gold":1000,"text":"The Cosmic Exploration Initiative intends to launch its exploration into deeper, unknown regions of space from this star─but not without first getting a wider glimpse of what's out there through the Stellascope. It is therefore imperative that we secure sufficient supplies for its continued construction and future maintenance. The Stellascope is the product of our combined knowledge of the cosmos and study of aetherology, and could theoretically give us insight into the flow of aether in distant galaxies. To meet the scope's exacting needs, we request highly aetheroconductive parts of the finest quality from contributors.","recipes":[37170],"objectives":[{"kind":"score","items":[],"bronzeScore":400,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":709,"name":"EX+: Stellascope Parts III","job":3,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":540,"silver":1000,"gold":1600,"text":"The Cosmic Exploration Initiative intends to launch its exploration into deeper, unknown regions of space from this star─but not without first getting a wider glimpse of what's out there through the Stellascope. It is therefore imperative that we secure sufficient supplies for its continued construction and future maintenance. The Stellascope is the product of our combined knowledge of the cosmos and study of aetherology, and could theoretically give us insight into the flow of aether in distant galaxies. To meet the scope's exacting needs, we request highly aetheroconductive parts of the finest quality from contributors.","recipes":[37171],"objectives":[{"kind":"score","items":[],"bronzeScore":800,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":710,"name":"EX+: Synthetic Crystal Glass I","job":3,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":980,"gold":1080,"text":"A highly precious material has been discovered after exhaustive exploration of the star. We challenge contributors to put their skills to the test by crafting an item that will advance our initiative with this rare resource. As the material is highly difficult to process, great preparation and care must be taken. We will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[37172,37173],"objectives":[{"kind":"craft","items":[{"name":"Aethercharged Glass","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":711,"name":"EX+: Synthetic Crystal Glass II","job":3,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":600,"silver":980,"gold":1080,"text":"A highly precious material has been discovered after exhaustive exploration of the star. We challenge contributors to put their skills to the test by crafting an item that will advance our initiative with this rare resource. As the material is highly difficult to process, great preparation and care must be taken. We will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[37174,37175],"objectives":[{"kind":"craft","items":[{"name":"Aethercharged Levinglass","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":712,"name":"EX+: Phaenna Craftwork","job":3,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":450,"silver":1000,"gold":1080,"text":"A highly precious material has been discovered after exhaustive exploration of the star. We challenge contributors to put their skills to the test by crafting an item that will advance our initiative with this rare resource. As the material is highly difficult to process, great preparation and care must be taken. We will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[37176,37177],"objectives":[{"kind":"craft","items":[{"name":"Oblong Xenostellar Stained Glass","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":713,"name":"Multi-purpose Glass","job":4,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Phaenna is home to a wealth of glass from which we have successfully refined a variety of construction materials and scientific samples, going as far as to establish our own standards to meet our exacting specifications. Speaking of exacting specifications, we are seeking contributors to supply sufficient quantities of high-purity glass fiber. The resulting materials will be used in the transmission cables that run between Glassblowers' Beacon and our other facilities.","recipes":[37178],"objectives":[{"kind":"craft","items":[{"name":"Standard Glass Fiber","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":714,"name":"Improved Tents","job":4,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Phaenna's extreme weather conditions and unique atmospheric composition represent serious challenges to material preservation. Our aim is to develop an innovative, highly functional tent to help better protect the stockpiles essential to our ongoing success. To this end, we request contributors to craft components for use in initial prototypes.","recipes":[37179],"objectives":[{"kind":"craft","items":[{"name":"Survey Tent Supplies","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":715,"name":"Resource Experimentation I","job":4,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"We are presently pondering how the inorganic flora and impesctors found across Phaenna might be utilized for the initiative. Given the practical limitations of sourcing supplies from the moon, finding a means of transforming these phenomena into viable materials is of utmost concern. As part of this experimentation drive, we ask that contributors help craft the materials we seek.","recipes":[37180],"objectives":[{"kind":"craft","items":[{"name":"Standard Wavekin Leather Straps","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":716,"name":"Recycled Resource Utilization I","job":4,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"It is crucial we avoid squandering even a speck of the precious resources ferried to Phaenna from the moon. This is precisely why we are hoping to improve our rates of recycling and utilization of reclaimed materials. Certain supplies, including fuel, clothing, and even stationery, are especially well suited to the task. We call upon contributors to show their commitment to sustainability and craft the required items with the resources provided.","recipes":[37181],"objectives":[{"kind":"craft","items":[{"name":"Survey Safety Boots","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":717,"name":"Camping Tents","job":4,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"As we range ever further across the star, many of our contributors are choosing to sleep on-site when working away from the base. Given Phaenna's harsh climatic conditions, this option requires a fair degree of preparation and commitment. We therefore request the manufacture of supplies to ensure our brave outdoor sleepers can do so in the comfort they deserve.","recipes":[37182],"objectives":[{"kind":"craft","items":[{"name":"Survey Pop-up Tent","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":718,"name":"Inorganic Research I","job":4,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Despite requiring water and sunlight to flourish─much like the plants of Etheirys─the inorganic flora that bloom hither and thither on Phaenna are largely composed of glass. Unsurprisingly, these specimens have garnered much interest among our research teams. While there are still mysteries aplenty to solve, we have been able to ascertain the plants' processing potential, and are experimenting with the manufacture of glass-coated timber and fibers derived from the inorganic flora.","recipes":[37183],"objectives":[{"kind":"craft","items":[{"name":"Standard Microfiber","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":719,"name":"Multi-purpose Glass Resupply","job":4,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Phaenna is home to a wealth of glass from which we have successfully refined a variety of construct uipment. Although some might question the decision to focus on tools suited only to specific tasks, we deem the consequent boost to productivity more than worth the effort.","recipes":[37201,37202],"objectives":[{"kind":"craft","items":[{"name":"Survey Safety Belt","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":733,"name":"Habitat Bedding","job":4,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1300,"text":"While Sinus Ardorum's close proximity to Etheirys instilled a sense of comfort and reassurance among many of our contributors, life on distant Phaenna is proving less amenable to some. Indeed, as we explore this vitreous, inhospitable planet, creature comforts will have an outsized impact on well-being and morale. We therefore request the provision of sumptuous bedding for use in our habitation modules. After all, what could provide greater comfort than knowing one's bedclothes were crafted with care by a fellow contributor?","recipes":[37203,37204],"objectives":[{"kind":"craft","items":[{"name":"Enriching Bunk Bed","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":734,"name":"Glass Fiber Resupply","job":4,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1800,"gold":2400,"text":"Phaenna is home to a wealth of glass from which we have successfully refined a variety of construction materials and scientific samples, going as far as to establish our own standards to meet our exacting specifications. Speaking of exacting specifications, we are seeking contributors to supply sufficient quantities of high-purity glass fiber. The resulting materials will be used in the transmission cables that run between Glassblowers' Beacon and our other facilities.","recipes":[37205],"objectives":[{"kind":"craft","items":[{"name":"Standard Glass Fiber","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":735,"name":"Advanced Resource Experimentation II","job":4,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":1800,"gold":2400,"text":"We are presently pondering how the inorganic flora and impesctors found across Phaenna might be utilized for the initiative. Given the practical limitations of sourcing supplies from the moon, finding a means of transforming these phenomena into viable materials is of utmost concern. As part of this experimentation drive, we ask that contributors help craft the materials we seek.","recipes":[37206],"objectives":[{"kind":"score","items":[],"bronzeScore":1200,"specialAction":null,"specialActionCharges":0}]},{"id":736,"name":"Improved Tent Components","job":4,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":700,"gold":1000,"text":"Phaenna's extreme weather conditions and unique atmospheric composition represent serious challenges to material preservation. Our aim is to develop an innovative, highly functional tent to help better protect the stockpiles essential to our ongoing success. To this end, we request contributors to craft components for use in initial prototypes.","recipes":[37207],"objectives":[{"kind":"craft","items":[{"name":"Enriching Leather Bench","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":737,"name":"Efficient Recycled Resource Utilization II","job":4,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":700,"gold":1000,"text":"It is crucial we avoid squandering even a speck of the precious resources ferried to Phaenna from the moon. This is precisely why we are hoping to improve our rates of recycling and utilization of reclaimed materials. Certain supplies, including fuel, clothing, and even stationery, are especially well suited to the task. We call upon contributors to show their commitment to sustainability and craft the required items with the resources provided.","recipes":[37208],"objectives":[{"kind":"score","items":[],"bronzeScore":300,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":738,"name":"Phaenna Resource Utilization Research","job":4,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":2600,"gold":3000,"text":"Our formidable contributors have, thus far, skillfully utilized Phaenna's natural resources, but there remains the potential for even more wondrous applications of the star's glassy abundance. On this occasion, we want crafters to take a novel approach to working with familiar materials and manufacture lightweight, flexible, and above all, durable supplies.","recipes":[37209,37210,37211],"objectives":[{"kind":"craft","items":[{"name":"Lightweight Specialist Leather","quantity":1},{"name":"Dense Specialist Leather","quantity":1},{"name":"High-grade Specialist Leather","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":739,"name":"EX: Outdoor Work Equipment","job":4,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":2500,"gold":3000,"text":"As we range ever further across the star, many of our contributors are choosing to sleep on-site when working away from the base. Given Phaenna's harsh climatic conditions, this option requires a fair degree of preparation and commitment. We therefore request the manufacture of supplies to ensure our brave outdoor sleepers can do so in the comfort they deserve.","recipes":[37212],"objectives":[{"kind":"score","items":[],"bronzeScore":1200,"specialAction":null,"specialActionCharges":0}]},{"id":740,"name":"EX: Reinforced Survey Equipment","job":4,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":2500,"gold":3000,"text":"Although we brought a variety of instruments with us to Phaenna, the unique challenges posed by resource collection and refinement here on the star necessitate more appropriate tools. To meet demand, we are asking contributors to produce a range of specialist equipment. Although some might question the decision to focus on tools suited only to specific tasks, we deem the consequent boost to productivity more than worth the effort.","recipes":[37213,37214,37215],"objectives":[{"kind":"craft","items":[{"name":"Survey Power Gloves","quantity":1},{"name":"Survey Power Suit","quantity":1},{"name":"Survey Power Boots","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":741,"name":"EX: Versatile Packaging Materials","job":4,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":800,"gold":1050,"text":"We wish to relay a portion of the resources discovered on Phaenna back to Sinus Ardorum, where they may be disseminated across Etheirys for preservation or, in the case of the Studium, further analysis. Given the delicate nature of these most valuable samples, we require packaging materials designed expressly for secure transportation aboard a starship─and all the better if they can accommodate variable sizes and quantities. As this project advances, so too will our scope!","recipes":[37216,37217],"objectives":[{"kind":"craft","items":[{"name":"Survey Packaging Materials","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":742,"name":"EX+: Temporary Collection Points","job":4,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":980,"gold":1080,"text":"Though the Cosmoliner's construction is sure to improve efficiency across the board, it cannot cover the entire breadth of the region, and so we seek components for portable storage facilities to use as strategic relay points. Please include with each submission a roof to shield against inclement weather and a sturdy floor to support the weight of the storage containers to be held therein.","recipes":[37218,37219],"objectives":[{"kind":"craft","items":[{"name":"Temporary Collection Point Materials","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":743,"name":"EX+: High-performance Bedding","job":4,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":540,"silver":1800,"gold":2000,"text":"While Sinus Ardorum's close proximity to Etheirys instilled a sense of comfort and reassurance among many of our contributors, life on distant Phaenna is proving less amenable to some. Indeed, as we explore this vitreous, inhospitable planet, creature comforts will have an outsized impact on well-being and morale. We therefore request the provision of sumptuous bedding for use in our habitation modules. After all, what could provide greater comfort than knowing one's bedclothes were crafted with care by a fellow contributor?","recipes":[37220],"objectives":[{"kind":"score","items":[],"bronzeScore":900,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":744,"name":"Phaenna Exploration Equipment I","job":4,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":2300,"gold":3000,"text":"The expedition team has reported a shortage of the supplies they need to safely traverse Phaenna's unforgiving terrain. This is no simple request, as the submissions must be durable enough to withstand even the most hostile of environs. For this reason, we ask that our artisans report to us for evaluation periodically during the course of their work.","recipes":[37221],"objectives":[{"kind":"craft","items":[{"name":"Heat-resistant Survey Bag Materials","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":745,"name":"Phaenna Exploration Equipment II","job":4,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":2300,"gold":3000,"text":"The expedition team has reported a shortage of the supplies they need to safely traverse Phaenna's unforgiving terrain. This is no simple request, as the submi ver":850,"gold":1000,"text":"Project manager Mumukko is presently compiling a progress report addressed to the Studium. It goes without saying, but if we fail to convey the value inherent in this initiative, we jeopardize our funding! Therefore, we call upon our most talented contributors to submit their finest Phaenna-made crafts. It is imperative that we demonstrate all the rich and resplendent resources to be found on this star!","recipes":[37225],"objectives":[{"kind":"score","items":[],"bronzeScore":400,"specialAction":null,"specialActionCharges":0}]},{"id":749,"name":"Habitation Improvement Plan I","job":4,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1400,"gold":2000,"text":"We've noticed a pattern among artisans who spend ample time in the Phaenna wilds: they often lament the drab décor upon their return to Glassblowers' Beacon. Doubtless their eyes have grown accustomed to more vibrant surrounds. So be it! We hereby welcome submissions of Phaenna-inspired furniture─not only to improve life at the base, but to offer as souvenirs, that we might spread these vivid colors to Sinus Ardorum and beyond!","recipes":[37226],"objectives":[{"kind":"craft","items":[{"name":"Enriching Lounge Bench","quantity":2}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":750,"name":"EX: Habitation Improvement Plan II","job":4,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":850,"gold":1000,"text":"We've noticed a pattern among artisans who spend ample time in the Phaenna wilds: they often lament the drab décor upon their return to Glassblowers' Beacon. Doubtless their eyes have grown accustomed to more vibrant surrounds. So be it! We hereby welcome submissions of Phaenna-inspired furniture─not only to improve life at the base, but to offer as souvenirs, that we might spread these vivid colors to Sinus Ardorum and beyond!","recipes":[37227],"objectives":[{"kind":"score","items":[],"bronzeScore":400,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":751,"name":"EX+: Habitation Improvement Plan III","job":4,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":540,"silver":1000,"gold":1600,"text":"We've noticed a pattern among artisans who spend ample time in the Phaenna wilds: they often lament the drab décor upon their return to Glassblowers' Beacon. Doubtless their eyes have grown accustomed to more vibrant surrounds. So be it! We hereby welcome submissions of Phaenna-inspired furniture─not only to improve life at the base, but to offer as souvenirs, that we might spread these vivid colors to Sinus Ardorum and beyond!","recipes":[37228],"objectives":[{"kind":"score","items":[],"bronzeScore":800,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":752,"name":"EX+: Pilot Suits I","job":4,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":980,"gold":1080,"text":"A highly precious material has been discovered after exhaustive exploration of the star. We challenge contributors to put their skills to the test by crafting an item that will advance our initiative with this rare resource. As the material is highly difficult to process, great preparation and care must be taken. We will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[37229,37230],"objectives":[{"kind":"craft","items":[{"name":"Planetary Quasileather","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":753,"name":"EX+: Pilot Suits II","job":4,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":600,"silver":980,"gold":1080,"text":"A highly precious material has been discovered after exhaustive exploration of the star. We challenge contributors to put their skills to the test by crafting an item that will advance our initiative with this rare resource. As the materi ":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Phaenna's extreme weather conditions and unique atmospheric composition represent serious challenges to material preservation. Our aim is to develop an innovative, highly functional tent to help better protect the stockpiles essential to our ongoing success. To this end, we request contributors to craft components for use in initial prototypes.","recipes":[37236],"objectives":[{"kind":"craft","items":[{"name":"Survey Tent Supplies","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":757,"name":"Resource Experimentation I","job":5,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"We are presently pondering how the inorganic flora and impesctors found across Phaenna might be utilized for the initiative. Given the practical limitations of sourcing supplies from the moon, finding a means of transforming these phenomena into viable materials is of utmost concern. As part of this experimentation drive, we ask that contributors help craft the materials we seek.","recipes":[37237],"objectives":[{"kind":"craft","items":[{"name":"Standard Coated Fiber","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":758,"name":"Recycled Resource Utilization I","job":5,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"It is crucial we avoid squandering even a speck of the precious resources ferried to Phaenna from the moon. This is precisely why we are hoping to improve our rates of recycling and utilization of reclaimed materials. Certain supplies, including fuel, clothing, and even stationery, are especially well suited to the task. We call upon contributors to show their commitment to sustainability and craft the required items with the resources provided.","recipes":[37238],"objectives":[{"kind":"craft","items":[{"name":"Survey Uniform","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":759,"name":"Camping Tents","job":5,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"As we range ever further across the star, many of our contributors are choosing to sleep on-site when working away from the base. Given Phaenna's harsh climatic conditions, this option requires a fair degree of preparation and commitment. We therefore request the manufacture of supplies to ensure our brave outdoor sleepers can do so in the comfort they deserve.","recipes":[37239],"objectives":[{"kind":"craft","items":[{"name":"Survey Pop-up Tent","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":760,"name":"Inorganic Research I","job":5,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Despite requiring water and sunlight to flourish─much like the plants of Etheirys─the inorganic flora that bloom hither and thither on Phaenna are largely composed of glass. Unsurprisingly, these specimens have garnered much interest among our research teams. While there are still mysteries aplenty to solve, we have been able to ascertain the plants' processing potential, and are experimenting with the manufacture of glass-coated timber and fibers derived from the inorganic flora.","recipes":[37240],"objectives":[{"kind":"craft","items":[{"name":"Habitat Knitting Kit","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":761,"name":"Multi-purpose Glass Resupply","job":5,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Phaenna is home to a wealth of glass from which we have successfully refined a variety of construction materials and scientific samples, going as far as to establish our own standards to meet our exacting specifications. Speaking of exac n worth the effort.","recipes":[37258,37259],"objectives":[{"kind":"craft","items":[{"name":"Survey Station Artisan's Attire","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":775,"name":"Habitat Bedding","job":5,"rank":"B","minLevel":90,"synced":true,"critical":false,"timeLimitSec":0,"silver":1000,"gold":1300,"text":"While Sinus Ardorum's close proximity to Etheirys instilled a sense of comfort and reassurance among many of our contributors, life on distant Phaenna is proving less amenable to some. Indeed, as we explore this vitreous, inhospitable planet, creature comforts will have an outsized impact on well-being and morale. We therefore request the provision of sumptuous bedding for use in our habitation modules. After all, what could provide greater comfort than knowing one's bedclothes were crafted with care by a fellow contributor?","recipes":[37260,37261],"objectives":[{"kind":"craft","items":[{"name":"Enriching Bunk Bed","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":776,"name":"Glass Fiber Resupply","job":5,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1800,"gold":2400,"text":"Phaenna is home to a wealth of glass from which we have successfully refined a variety of construction materials and scientific samples, going as far as to establish our own standards to meet our exacting specifications. Speaking of exacting specifications, we are seeking contributors to supply sufficient quantities of high-purity glass fiber. The resulting materials will be used in the transmission cables that run between Glassblowers' Beacon and our other facilities.","recipes":[37262],"objectives":[{"kind":"craft","items":[{"name":"Standard Glass Fiber","quantity":3}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":3}]},{"id":777,"name":"Advanced Resource Experimentation II","job":5,"rank":"A","minLevel":100,"synced":false, us on tools suited only to specific tasks, we deem the consequent boost to productivity more than worth the effort.","recipes":[37270,37271,37272],"objectives":[{"kind":"craft","items":[{"name":"Heat-resistant Survey Gloves","quantity":1},{"name":"Heat-resistant Survey Suit","quantity":1},{"name":"Heat-resistant Survey Kecks","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":783,"name":"EX: Versatile Packaging Materials","job":5,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":800,"gold":1050,"text":"We wish to relay a portion of the resources discovered on Phaenna back to Sinus Ardorum, where they may be disseminated across Etheirys for preservation or, in the case of the Studium, further analysis. Given the delicate nature of these most valuable samples, we require packaging materials designed expressly for secure transportation aboard a starship─and all the better if they can accommodate variable sizes and quantities. As this project advances, so too will our scope!","recipes":[37273,37274],"objectives":[{"kind":"craft","items":[{"name":"Survey Packaging Materials","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":784,"name":"EX+: Temporary Collection Points","job":5,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":980,"gold":1080,"text":"Though the Cosmoliner's construction is sure to improve efficiency across the board, it cannot cover the entire breadth of the region, and so we seek components for portable storage facilities to use as strategic relay points. Please include with each submission a roof to shield against inclement weather and a sturdy floor to support the weight of the storage containers to be held therein.","recipes":[37275,37276],"objectives":[{"kind":"craft","items":[{"name":"Temporary Collection Point Materials","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}  report to us for evaluation periodically during the course of their work.","recipes":[37279],"objectives":[{"kind":"craft","items":[{"name":"Dust-filtering Survey Mask","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":788,"name":"EX: Craftwork for the Forum I","job":5,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1700,"gold":2000,"text":"Project manager Mumukko is presently compiling a progress report addressed to the Studium. It goes without saying, but if we fail to convey the value inherent in this initiative, we jeopardize our funding! Therefore, we call upon our most talented contributors to submit their finest Phaenna-made crafts. It is imperative that we demonstrate all the rich and resplendent resources to be found on this star!","recipes":[37280],"objectives":[{"kind":"score","items":[],"bronzeScore":800,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":789,"name":"EX: Craftwork for the Forum II","job":5,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":600,"gold":800,"text":"Project manager Mumukko is presently compiling a progress report addressed to the Studium. It goes without saying, but if we fail to convey the value inherent in this initiative, we jeopardize our funding! Therefore, we call upon our most talented contributors to submit their finest Phaenna-made crafts. It is imperative that we demonstrate all the rich and resplendent resources to be found on this star!","recipes":[37281],"objectives":[{"kind":"craft","items":[{"name":"Planetary Handicraft Set","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":790,"name":"EX: Craftwork for the Forum III","job":5,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":850,"gold":1000,"text":"Project manager Mumukko is presently compiling a progress report addressed to the Studium. It goes without saying, but if we fail to convey the value inherent in this initiative, we jeopardize our funding! Therefore, we call upon our most talented contributors to submit their finest Phaenna-made crafts. It is imperative that we demonstrate all the rich and resplendent resources to be found on this star!","recipes":[37282],"objectives":[{"kind":"score","items":[],"bronzeScore":400,"specialAction":null,"specialActionCharges":0}]},{"id":791,"name":"Habitation Improvement Plan I","job":5,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1400,"gold":2000,"text":"We've noticed a pattern among artisans who spend ample time in the Phaenna wilds: they often lament the drab décor upon their return to Glassblowers' Beacon. Doubtless their eyes have grown accustomed to more vibrant surrounds. So be it! We hereby welcome submissions of Phaenna-inspired furniture─not only to improve life at the base, but to offer as souvenirs, that we might spread these vivid colors to Sinus Ardorum and beyond!","recipes":[37283],"objectives":[{"kind":"craft","items":[{"name":"Enriching Lounge Bench","quantity":2}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":792,"name":"EX: Habitation Improvement Plan II","job":5,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":850,"gold":1000,"text":"We've noticed a pattern among artisans who spend ample time in the Phaenna wilds: they often lament the drab décor upon their return to Glassblowers' Beacon. Doubtless their eyes have grown accustomed to more vibrant surrounds. So be it! We hereby welcome submissions of Phaenna-inspired furniture─not only to improve life at the base, but to offer as souvenirs, that we might spread these vivid colors to Sinus Ardorum and beyond!","recipes":[37284],"objectives":[{"kind":"score","items":[],"bronzeScore":400,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":793,"name":"EX+: Habitation Improvement Plan III","job":5,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":540,"silver":1000,"gold":1600,"text":"We've noticed a pattern among artisans who spend ample time in the Phaenna wilds: they often lament the drab décor upon their return to Glassblowers' Beacon. Doubtless their eyes have grown accustomed to more vibrant surrounds. So be it! We hereby welcome submissions of Phaenna-inspired furniture─not only to improve life at the base, but to offer as souvenirs, that we might spread these vivid colors to Sinus Ardorum and beyond!","recipes":[37285],"objectives":[{"kind":"score","items":[],"bronzeScore":800,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":794,"name":"EX+: Captain's Suit I","job":5,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":980,"gold":1080,"text":"A highly precious material has been discovered after exhaustive exploration of the star. We challenge contributors to put their skills to the test by crafting an item that will advance our initiative with this rare resource. As the material is highly difficult to process, great preparation and care must be taken. We will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[37286,37287],"objectives":[{"kind":"craft","items":[{"name":"Planetary Quasifiber","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":795,"name":"EX+: Captain's Suit II","job":5,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":600,"silver":980,"gold":1080,"text":"A highly precious material has been discovered after exhaustive exploration of the star. We challenge contributors to put their skills to the test by crafting an item that will advance our initiative with this rare resource. As the material is highly difficult to process, great preparation and care must be taken. We will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[37288,37289],"objectives":[{"kind":"craft","items":[{"name":"Planetary Quasisilk","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":796,"name":"EX+: Captain's Suit III","job":5,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":450,"silver":1000,"gold":1080,"text":"A highly precious material has been discovered after exhaustive exploration of the star. We challenge contributors to put their skills to the test by crafting an item that will advance our initiative with this rare resource. As the material is highly difficult to process, great preparation and care must be taken. We will issue a specialized device to assist artisans, but be warned that it has a limited charge.","recipes":[37290,37291],"objectives":[{"kind":"craft","items":[{"name":"Captain's Survey Suit","quantity":1}],"bronzeScore":null,"specialAction":"MaterialMiracle","specialActionCharges":1}]},{"id":797,"name":"Multi-purpose Materials","job":6,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"If there's one resource this star has in abundance, it's glass. Going forward, the initiative wishes to maintain its very own cosmic standard of quality, ensuring perfection throughout the refinement process, and continually deliver product samples back to Sinus Ardorum for use in construction and interstellar research. Presently we expect sheets of multi-purpose glass as well as any lubricant by-products created through the smelting process. Repeat deliveries are welcome─bring us your very best!","recipes":[37292],"objectives":[{"kind":"craft","items":[{"name":"Standard Glass","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":798,"name":"Seasoned Archon Loaf I","job":6,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Given that so little of Phaenna is edible, we took it upon ourselves to import a large quantity of Archon loaf for the Beacon. To our great distress, however, a majority of non-Sharlayan crew members have now submitted formal complaints about the taste! Thus, at great personal sacrifice do we Loporrits hereby offer unfettered access to our precious supply of carrots... Please, artisans, use them however you must to create a mouthwatering condiment for this bread.","recipes":[37293],"objectives":[{"kind":"craft","items":[{"name":"Carrotinized Spice","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":799,"name":"Emergency Rations","job":6,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"The food supply is an ongoing concern partially solved by our aggressive foray into aquaculture, but we are as of yet almost entirely reliant on shipments from Sinus Ardorum. Naturally, it would be foolish to presume the *Galactic Way* will always operate in perfect condition. Therefore, in the interest of crisis prevention, we seek to establish a stockpile of provisions as a countermeasure. For this request, artisans are asked to prioritize nutrition above all else, even flavor.","recipes":[37294],"objectives":[{"kind":"craft","items":[{"name":"Carrotinized Nutrient Jelly","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":800,"name":"Yeast Experimentation I","job":6,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Developing new strains of yeast may be crucial to expanding the limitation of our food supply. Furthermore, the inclusion of yeast in victuals is known to enhance flavor and increase satisfaction in the consumer. Specialists are asked to commence testing and analysis of our stores of lunar fungi to cultivate a product suitable for the initiative's use.","recipes":[37295],"objectives":[{"kind":"craft","items":[{"name":"Experimental Survey Yeast","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":801,"name":"Fundamental Fermentation","job":6,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"Experimental cultivation of vegetables and legumes brought from the moon is currently underway. The findings from our most recent tests have revealed a necessity to improve upon flavor, but otherwise fulfilled the nutritional standards required for supporting life. Experts in the culinary and medicinal fields are encouraged to join our research and discover new methods of implementing our ingredients.","recipes":[37296],"objectives":[{"kind":"craft","items":[{"name":"Experimental Cultivar Juice","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":802,"name":"Aquaculture I","job":6,"rank":"D","minLevel":10,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"We have introduced aquatic organisms from the moon to the bodies of water near Glassblowers' Beacon in order to cultivate a vital mineral source. Improvements to water quality have been ongoing, but overcoming the environmental discrepancy is still a challenge for some species. We hope nutrient-rich supplements will facilitate growth, thereby improving the health of our cultivars and, ultimately, our personnel.","recipes":[37297],"objectives":[{"kind":"craft","items":[{"name":"Aquaculture Medicine","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":803,"name":"Multi-purpose Materials Resupply","job":6,"rank":"C","minLevel":50,"synced":true,"critical":false,"timeLimitSec":0,"silver":1200,"gold":2400,"text":"If there's one resource this star has in abundance, it's glass. Going forward, the initiative wishes to maintain its very own cosmic standard of quality, ensuring perfection throughout the refinement process, and cont n by faeries. The worker in question has since been treated for extreme mental and physical exhaustion, but their hallucination does bring to light the delicious hues of Phaenna's landscape. Our resources of sugar are precious, but we would like to request the creation of dreamy sweets for special occasions.","recipes":[37327,37328,37329],"objectives":[{"kind":"craft","items":[{"name":"Planetary Bean","quantity":1},{"name":"South Sea Bean","quantity":1},{"name":"Stargaze Bean","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":825,"name":"EX: Inorganic Extract Research III","job":6,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":1200,"silver":800,"gold":1050,"text":"The unique flora carpeting Phaenna's surface is partially composed of glass that, when subjected to refined extraction, produces a high-quality oil. We hope to develop this oil for cooking, soaps, candles, and─most ambitiously─a coffee substitute made by roasting the post-extraction residue. Join us as we revolutionize the use of Phaenna's plants!","recipes":[37330,37331],"objectives":[{"kind":"craft","items":[{"name":"Habitat Candle","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":826,"name":"EX+: Stable Dairy Storage","job":6,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":980,"gold":1080,"text":"Demand has risen among Sharlayan contributors for a palatable taste of home, so we have imported a small supply of a particular dairy dish. Its fermentation ensures that it lasts at least a few days, but some have hypothesized that condensing it into a confection will not only prolong its freshness, but enhance its nutritional value. We request that artisans skilled in culinary and medicinal fields assist us by both creating and condensing this fermented dairy product. Should it prove to be a viable supplement, we will consider larger imports in the future.","recipes":[37332,37333],"objectives":[{"kind":"craft","items":[{"name":"Worker's Skyr","quantity":1}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":827,"name":"EX+: Fermentation Research Results","job":6,"rank":"EX+","minLevel":100,"synced":false,"critical":false,"timeLimitSec":540,"silver":1800,"gold":2000,"text":"The cultivation of crops imported from the moon and the selective breeding of Phaenna's unique flora continues apace at Glassblowers' Beacon. By gathering and processing these plants for food and decoration, we hope to improve the living environment for all our contributors. This task will require patience and an eye for detail, so we request the assistance of highly skilled artisans.","recipes":[37334],"objectives":[{"kind":"score","items":[],"bronzeScore":900,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":828,"name":"Morale Maintenance I","job":6,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":2300,"gold":3000,"text":"The only thing more puzzling than the workers' insistence on using pen and paper despite having the latest exotablets is their fondness for cooking with needlessly convoluted recipes rather than partaking in our nigh-limitless supply of Archon loaf. Customs that, perhaps, remind them of home. Or so we believe. As these practices seem to enhance rather than hinder their performance, we see no harm in accomodating them. To that end, we ask that our artisans fashion suitable writing and cooking utensils.","recipes":[37335],"objectives":[{"kind":"craft","items":[{"name":"Journal Stationery Components","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":829,"name":"Morale Maintenance II","job":6,"rank":"A","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":2300,"gold":3000,"text":"The only thing more puzzling than the workers' insistence on using pen and paper despite having the latest exotablets is their fondness for cooking with needlessly convoluted recipes rather than partaking in our nigh-limitless supply of Archon loaf. Customs that, perhaps, remind them of home. Or so we believe. As these practices seem to enhance rather than hinder their performance, we see no harm in accomodating them. To that end, we ask that our artisans fashion suitable writing and cooking utensils.","recipes":[37336],"objectives":[{"kind":"craft","items":[{"name":"Journal Stationery Set","quantity":3}],"bronzeScore":null,"specialAction":null,"specialActionCharges":0}]},{"id":830,"name":"EX: Launch Party Preparations I","job":6,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":1700,"gold":2000,"text":"Exploration on Phaenna is proceeding better than we could have hoped. And so, to show our appreciation for everyone's hard work, we've decided to host a celebration. Supplies of wheat and sugar are limited, but we're confident our artisans can produce enough sweets to leave everyone satisfied. For entertainment, we took inspiration from the vibrant landscape and settled on face painting! An unusual request, but we trust our artisans can provide suitable cosmetic supplies to add a splash of color to the festivities.","recipes":[37337],"objectives":[{"kind":"score","items":[],"bronzeScore":800,"specialAction":"MaterialMiracle","specialActionCharges":2}]},{"id":831,"name":"EX: Launch Party Preparations II","job":6,"rank":"EX","minLevel":100,"synced":false,"critical":false,"timeLimitSec":0,"silver":600,"gold":800,"text":"Exploration on Phaenna is proceeding better than we could have hoped. And so, to show our appreciation for everyone's hard work, we've decided to host a celebration. Supplies of wheat and sugar are limited, but we're confident our artisans can produce enough sweets to leave everyone satisfied. For entertainment, we took inspiration from the vibrant landscape and settled on face painting! An unusual request, but we trust our artisans can provide suitabl
