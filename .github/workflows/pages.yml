# Publishes the Eveniunt Command Center (the app at the root, the Tracker at /tracker/, the Atelier at /atelier/, the Cosmic
# guides at /cosmic/) to GitHub Pages on every push to main (free on public repositories), and every hour for fresh lists.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'  # every hour (owner choice 2026-11-09; was every 6 hours): republish so the Tracker's events list and Lodestone news are fresh
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p _site/atelier _site/cosmic _site/tracker
          # the Eveniunt Command Center app at the root (its own service worker, manifest and icons)
          cp -r tracker/command-center/site/. _site/
          # the modules at their own addresses, each a complete installable app under its own service worker
          cp -r crafting/atelier/site/. _site/atelier/
          cp -r tracker/site/. _site/tracker/
          # the Cosmic Exploration guides, one offline page per destination
          cp crafting/dist/cosmic-*.html _site/cosmic/
          touch _site/.nojekyll
          # the root must be the Command Center and every module must be in place, or the publish stops here
          grep -q 'Eveniunt Command Center' _site/index.html
          test -f _site/sw.js && test -f _site/manifest.webmanifest && test -f _site/icons/icon-512.png
          test -f _site/tracker/index.html && test -f _site/tracker/sw.js && test -f _site/atelier/index.html && test -f _site/atelier/sw.js
          test -f _site/cosmic/cosmic-sinus-ardorum.html
      - name: Fresh events list for the Tracker (Xenoveritas' FFXIV timers, which follow the Lodestone)
        run: curl -fsS --max-time 30 https://www.xenoveritas.org/static/ffxiv/timers.json -o _site/tracker/timers.json || echo "events list not refreshed; the Tracker uses its built-in copy"
      - name: Lodestone news and topics for the Tracker (official Atom feeds; the browser cannot read them from another site)
        run: |
          for f in news topics; do
            if curl -fsS --max-time 30 "https://na.finalfantasyxiv.com/lodestone/news/$f.xml" -o "/tmp/$f.xml" && grep -q "<feed" "/tmp/$f.xml"; then cp "/tmp/$f.xml" "_site/tracker/$f.xml"; else echo "$f feed not refreshed"; fi
          done
          du -sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
