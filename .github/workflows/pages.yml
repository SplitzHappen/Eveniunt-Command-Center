# Publishes the Command Center website to GitHub Pages on every push to main (free on public repositories).
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p _site/atelier _site/cosmic
          cp web/index.html _site/index.html
          cp -r web/assets _site/assets
          cp -r crafting/atelier/site/. _site/atelier/
          cp crafting/dist/cosmic-*.html _site/cosmic/
          touch _site/.nojekyll
          du -sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
