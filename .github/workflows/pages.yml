# Publishes the Command Center website to GitHub Pages on every push to main (free on public repositories).
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'  # every 6 hours (owner approved 2026-11-09): republish so the Tracker's events list is fresh
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p _site/atelier _site/cosmic _site/tracker
          cp web/index.html _site/index.html
          cp -r web/assets _site/assets
          cp -r crafting/atelier/site/. _site/atelier/
          cp -r tracker/site/. _site/tracker/
          cp crafting/dist/cosmic-*.html _site/cosmic/
          touch _site/.nojekyll
      - name: Fresh events list for the Tracker (Xenoveritas' FFXIV timers, which follow the Lodestone)
        run: curl -fsS --max-time 30 https://www.xenoveritas.org/static/ffxiv/timers.json -o _site/tracker/timers.json || echo "events list not refreshed; the Tracker uses its built-in copy"
          du -sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
